# 7th catalog model: qwen3.8-27b-ninfer — Qwen3.8-27B served by the NInfer C++/CUDA engine
# (ghcr.io/dbirks/ninfer), scale-to-zero, ALONGSIDE the vLLM-served default `qwen3.8-27b`
# (kserve/llmisvc-qwen38.yaml, unchanged). See #100.
#
# STAGING: added as a separate model (not the default) so it can be validated on this RTX PRO 6000
# (SM120) before we consider promoting it to the default `qwen3.8-27b`. The intended end state is
# NInfer as default + a `-vllm` alias for the old behavior; that flip is a follow-up once this is
# proven on the card. Scale-to-zero => 0 resident RAM/VRAM when idle (protects the ~46GB host-RAM
# 2-model wall).
#
# Weights: qwen38-ninfer-model PVC (the single-file .ninfer artifact), filled by
# kserve/qwen38-ninfer-weights.yaml. NInfer does NOT load the vLLM NVFP4 safetensors.
#
# ZDR (#98): the vLLM ZDR flags don't apply to NInfer (different CLI). NInfer request/output logging
# is not yet audited; treat ZDR as UNVERIFIED for this engine until confirmed.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen38-ninfer-llm            # -> InferencePool `qwen38-ninfer-llm-inference-pool`
  namespace: default                 #    metric segment `qwen38_ninfer_llm_inference_pool`
spec:
  model:
    uri: pvc://qwen38-ninfer-model    # PVC ROOT (KServe mounts it at /mnt/models)
    name: qwen3.8-27b-ninfer          # public OpenAI `model` name clients route by
  scaling:
    minReplicas: 1
    maxReplicas: 1
    keda:
      idleReplicaCount: 0
      cooldownPeriod: 120
      pollingInterval: 15
      triggers:
        - type: prometheus
          name: qwen38-ninfer-epp-request-rate
          metadata:
            serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
            query: 'sum(rate(envoy_cluster_clusters_endpointpicker_qwen38_ninfer_llm_inference_pool_default_ext_proc_upstream_rq_total{job="envoy-gw"}[1m]))'
            threshold: "5"
            activationThreshold: "0.001"
  template:                                      # PodSpec for the NInfer engine pod
    runtimeClassName: nvidia
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
    containers:
      - name: main
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: true
        image: ghcr.io/dbirks/ninfer:latest
        # NInfer serves OpenAI-compatible /v1 on --port. KServe's InferencePool/EPP + workload Service
        # target 8000 (NOT ninfer's 8080 Compose default).
        command: ["ninfer-serve"]
        args:
          - "/mnt/models/qwen3_8_27b_nvfp4.ninfer"   # KServe mounts the PVC root at /mnt/models
          - "--host=0.0.0.0"
          - "--port=8000"
          - "--model-id=qwen3.8-27b-ninfer"          # public alias == model.name above
          - "--device=0"
          - "--max-context=131072"
          - "--kv-capacity=auto"                     # sizes KV within the HAMi-capped VRAM
          - "--max-concurrency=4"
          - "--max-pending-requests=32"
          - "--pending-timeout-ms=600000"
          - "--prefill-chunk=1024"
          - "--kv-dtype=int8"                        # int8 group-64 KV (supported by this artifact)
          - "--spec=mtp"                             # MTP speculative decode
          - "--draft-tokens=3"
          - "--lm-head-draft"
          - "--default-max-tokens=8192"
          # NInfer's Qwen3.8-NVFP4 MTP acceptance is ~46-49% (its README) vs ~67-71% for other
          # profiles, so the spec speedup is weaker here. Benchmark MTP vs --spec off on this card.
        env:
          - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
          - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
        ports:
          - containerPort: 8000
        resources:
          # HAMi hard VRAM cap (MB) = NInfer's visible total. Artifact ~20.02GiB + int8 KV + CUDA
          # graphs + MTP head. 40000 leaves room for a second resident model. TUNE on first boot.
          limits: { nvidia.com/gpu: "1", nvidia.com/gpumem: "40000", cpu: "8", memory: 24Gi }
          requests: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: dshm, mountPath: /dev/shm }     # engine needs real /dev/shm (default 64Mi too small)
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
  router:
    gateway:
      refs:
        - name: kserve-llm-gw
          namespace: default
    route: {}
    scheduler: {}
    # VALIDATION RISK: the GIE EPP normally scrapes vLLM-format /metrics for load-aware scheduling;
    # NInfer may not expose that. With a single replica EPP still routes (basic pick). Confirm the
    # pool goes Ready and requests flow.
