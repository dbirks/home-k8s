# Step 2 of the llm-d layer: the KServe LLMInferenceService controller (v0.20.0).
# Watches LLMInferenceService CRs and generates the Deployment + InferencePool + EPP (endpoint
# picker) + HTTPRoutes. Same version as the base controller. Runtime-configs provides the
# vLLM LLMInferenceServiceConfig templates.
---
# ---- LLMISVC CRD ----
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kserve-llmisvc-crd
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://ghcr.io/kserve/charts/kserve-llmisvc-crd
  ref:
    tag: "v0.20.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-llmisvc-crd
  namespace: kserve
spec:
  interval: 30m0s
  dependsOn:
    - name: kserve-crd
  chartRef:
    kind: OCIRepository
    name: kserve-llmisvc-crd
    namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
---
# ---- LLMISVC controller ----
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kserve-llmisvc-resources
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://ghcr.io/kserve/charts/kserve-llmisvc-resources
  ref:
    tag: "v0.20.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-llmisvc-resources
  namespace: kserve
spec:
  interval: 30m0s
  dependsOn:
    - name: kserve-llmisvc-crd
    - name: kserve-resources
  chartRef:
    kind: OCIRepository
    name: kserve-llmisvc-resources
    namespace: flux-system
  # Swap the llmisvc controller for our main-built image that supports the DIRECT spec.scaling.keda
  # .triggers path (v0.20.0 chart only has spec.scaling.wva.keda). Only this one deployment changes;
  # classic kserve-controller stays v0.20.0. Paired with kserve/llmisvc-crds-main.yaml. See #27.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: llmisvc-controller-manager
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: llmisvc-controller-manager
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        image: ghcr.io/dbirks/llmisvc-controller:main-2f2afd58-scalingkeda
                        # v0.20.0 chart caps the manager at cpu 100m — too tight for the main build:
                        # under load its /readyz handler gets starved, readiness times out, the pod never
                        # joins the webhook Service, and reconciles hot-loop. Give it real headroom.
                        resources:
                          requests: { cpu: "250m", memory: "512Mi" }
                          limits: { cpu: "2", memory: "1Gi" }
---
# ---- LLMInferenceServiceConfig preset templates (scheduler/router/vLLM) ----
# The controller combines these "well-known" presets (kserve-config-llm-scheduler, -router, etc.)
# with each LLMInferenceService. Required even when the workload template is specified inline.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kserve-runtime-configs
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://ghcr.io/kserve/charts/kserve-runtime-configs
  ref:
    tag: "v0.20.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-runtime-configs
  namespace: kserve
spec:
  interval: 30m0s
  dependsOn:
    - name: kserve-llmisvc-crd
  chartRef:
    kind: OCIRepository
    name: kserve-runtime-configs
    namespace: flux-system
  values:
    kserve:
      llmisvcConfigs:
        enabled: true
