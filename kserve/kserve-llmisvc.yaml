# Step 2 of the llm-d layer: the KServe LLMInferenceService controller (v0.20.0).
# Watches LLMInferenceService CRs and generates the Deployment + InferencePool + EPP (endpoint
# picker) + HTTPRoutes. Same version as the base controller. Runtime-configs provides the
# vLLM LLMInferenceServiceConfig templates.
---
# ---- LLMISVC CRD ----
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kserve-llmisvc-crd
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://ghcr.io/kserve/charts/kserve-llmisvc-crd
  ref:
    tag: "v0.20.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-llmisvc-crd
  namespace: kserve
spec:
  interval: 30m0s
  dependsOn:
    - name: kserve-crd
  chartRef:
    kind: OCIRepository
    name: kserve-llmisvc-crd
    namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
---
# ---- LLMISVC controller ----
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kserve-llmisvc-resources
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://ghcr.io/kserve/charts/kserve-llmisvc-resources
  ref:
    tag: "v0.20.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-llmisvc-resources
  namespace: kserve
spec:
  interval: 30m0s
  dependsOn:
    - name: kserve-llmisvc-crd
    - name: kserve-resources
  chartRef:
    kind: OCIRepository
    name: kserve-llmisvc-resources
    namespace: flux-system
  # NOTE: rolled back the ghcr.io/dbirks main-built controller (direct spec.scaling.keda). Running it
  # exposed a chain of bleeding-edge instabilities (EPP-0.10 flowControl pod churn, aggressive reconcile
  # loop destabilizing the engine). Back on stable v0.20.0 controller. Scale-to-zero deferred until
  # llm-d/KServe ship a tagged release with direct scaling.keda + stable EPP Flow Control. See #27 / #31.
  #
  # BUT keep the manager CPU/mem bump (the OTHER half of the reverted postRenderer): the chart default
  # 100m CPU starves the reconcile loop -> passes hit their context deadline ("context canceled" on the
  # self-signed-cert reconcile) -> the controller re-renders + DELETES the engine pod every ~1 min, so
  # vLLM (~10 min cold load: torch.compile + FlashInfer fp4 autotune + graph capture) NEVER reaches
  # Ready. Livelock. 2 CPU / 1Gi lets a reconcile pass complete. Stable v0.20.0 IMAGE unchanged.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: llmisvc-controller-manager
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: llmisvc-controller-manager
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        # SCALE-TO-ZERO bundle (#27): our fork dbirks/kserve@scale-to-zero-epp010
                        # (master's direct spec.scaling.keda.triggers + idleReplicaCount:0 from
                        # #5839/#5996, PLUS #6026 bumping the scheduler preset to EPP v0.10.0). Paired
                        # with the vendored EPP-0.10 presets in llmisvc-runtime-configs-s2z.yaml so the
                        # controller reconciles TOWARD the EPP it expects — no version-skew SIGTERM churn
                        # (the root cause of the earlier rollback). Revert both = back to stable v0.20.0.
                        image: ghcr.io/dbirks/llmisvc-controller:s2z-epp010-1770f10
                        resources:
                          limits:
                            cpu: "2"
                            memory: 1Gi
                          requests:
                            cpu: 500m
                            memory: 512Mi
---
# ---- LLMInferenceServiceConfig preset templates (scheduler/router/vLLM) ----
# The controller combines these "well-known" presets (kserve-config-llm-scheduler, -router, etc.)
# with each LLMInferenceService. Required even when the workload template is specified inline.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kserve-runtime-configs
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://ghcr.io/kserve/charts/kserve-runtime-configs
  ref:
    tag: "v0.20.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-runtime-configs
  namespace: kserve
spec:
  interval: 30m0s
  dependsOn:
    - name: kserve-llmisvc-crd
  chartRef:
    kind: OCIRepository
    name: kserve-runtime-configs
    namespace: flux-system
  values:
    kserve:
      llmisvcConfigs:
        # DISABLED: the v0.20.0 chart presets pin EPP v0.9.0, which would fight the s2z master
        # controller (version skew = the SIGTERM churn we rolled back before). The EPP-0.10,
        # master-matched presets are vendored in llmisvc-runtime-configs-s2z.yaml instead.
        enabled: false
