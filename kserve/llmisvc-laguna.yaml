# Catalog model: poolside Laguna-S-2.1 NVFP4 (LagunaForCausalLM, custom arch, MoE 256 experts / 10 active)
# — scale-to-zero. W4A4 nvfp4-pack MoE (verified num_bits:4 weights+activations) -> FlashInfer W4A4 MoE on
# SM120, forced with VLLM_USE_FLASHINFER_MOE_FP4=1. Custom arch ships modeling_laguna.py +
# configuration_laguna.py -> --trust-remote-code REQUIRED. fp8_e4m3 KV.
# Parsers: poolside documents `--enable-auto-tool-choice --tool-call-parser poolside_v1
# --reasoning-parser poolside_v1` for Laguna-S-2.1 (vLLM recipes page + HF model card). Both `poolside_v1`
# parsers ship in this image, verified registered by name: vllm/reasoning/poolside_v1_reasoning_parser.py
# -> PoolsideV1ReasoningParser (docstring: "Laguna reasoning parser"); vllm/tool_parsers/
# poolside_v1_tool_parser.py -> PoolsideV1ToolParser. Model dir also has a bundled chat_template.jinja
# (auto-loaded). This PVC (vllm-models) root mounts at /mnt/models, and Laguna lives at
# models/Laguna-S-2.1-NVFP4 -> --model=/mnt/models/models/Laguna-S-2.1-NVFP4 (verified on disk).
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: laguna-llm
  namespace: default
spec:
  model:
    uri: pvc://vllm-models
    name: laguna-s-2.1
  scaling:
    minReplicas: 1
    maxReplicas: 1
    keda:
      idleReplicaCount: 0
      cooldownPeriod: 120
      pollingInterval: 15
      triggers:
        # <POOL> = sanitized LLMInferenceService name laguna-llm -> laguna_llm.
        - type: prometheus
          name: laguna-epp-request-rate
          metadata:
            serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
            # Wake scoped to the 15s envoy-gw scrape so [1m] holds ~4 samples (snappier wake). See llmisvc-qwen38.yaml.
            query: 'sum(rate(envoy_cluster_clusters_endpointpicker_laguna_llm_inference_pool_default_ext_proc_upstream_rq_total{job="envoy-gw"}[1m]))'
            threshold: "5"
            activationThreshold: "0.001"
  template:
    runtimeClassName: nvidia
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
    containers:
      - name: main
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: true
        image: vllm/vllm-openai:muse-glimmer-x86_64-cu130
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - "--model=/mnt/models/models/Laguna-S-2.1-NVFP4"
          - "--served-model-name=laguna-s-2.1"
          - "--port=8000"
          - "--trust-remote-code"
          - "--kv-cache-dtype=fp8_e4m3"
          - "--gpu-memory-utilization=0.9"
          - "--max-model-len=131072"   # raised 8192 -> 131072 (native is 1048576/1M but KV can't hold that; capped, #100)
          # poolside Laguna XML-style tool protocol + interleaved reasoning (poolside_v1 parsers).
          - "--enable-auto-tool-choice"
          - "--tool-call-parser=poolside_v1"
          - "--reasoning-parser=poolside_v1"
          # --- ZDR (zero-data-retention), issue #98 / ZDR.md. Verified supported by this image.
          # No request/output logging, no Uvicorn access log, and NO cross-request prefix/KV reuse.
          - "--no-enable-log-requests"
          - "--no-enable-log-outputs"
          - "--disable-uvicorn-access-log"
          # prefix caching ON (2026-08-29): user chose performance > full ZDR — cross-request KV reuse enabled; log-suppression privacy flags kept.
        env:
          - { name: VLLM_PORT, value: "8000" }
          - { name: VLLM_ATTENTION_BACKEND, value: FLASHINFER }
          - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.0f" }
          - { name: VLLM_NVFP4_GEMM_BACKEND, value: flashinfer-cutlass }
          # ZDR: pin log level to INFO — DEBUG/TRACE would log prompt text and token IDs (issue #98).
          - { name: VLLM_LOGGING_LEVEL, value: INFO }
          # Persistent torch.compile cache on NVMe (laguna-vllm-cache PVC) — skips recompile on cold start
          # (laguna's compiled cudagraph load is the slowest, so this matters most here).
          - { name: VLLM_CACHE_ROOT, value: /vllm-cache }
          - { name: VLLM_USE_FLASHINFER_MOE_FP4, value: "1" }   # force FlashInfer W4A4 MoE path on SM120
        ports:
          - containerPort: 8000
        resources:
          # EXCLUSIVE model: Laguna-S-2.1 is a large NVFP4 MoE that OOM'd at the shared 44000 cap
          # (needs most of the card). gpumem 94000 => it schedules only when the card is otherwise
          # empty (all other catalog models asleep) — acceptable under scale-to-zero. NOTE: loading a
          # ~50GB+ model on the 46GB-no-swap host may still need the bounded-buffer loader (InstantTensor/
          # runai_streamer, queued) — validate the full wake+load after that lands.
          limits: { nvidia.com/gpu: "1", nvidia.com/gpumem: "94000", cpu: "8", memory: 24Gi }
          requests: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: vllm-cache, mountPath: /vllm-cache }   # persist torch.compile cache across scale-to-zero
    volumes:
      - name: vllm-cache
        persistentVolumeClaim:
          claimName: laguna-vllm-cache
  router:
    gateway:
      refs:
        - name: kserve-llm-gw
          namespace: default
    route: {}
    scheduler: {}
