# Catalog model: Qwen3.6-27B NVFP4 (dense hybrid VL) — scale-to-zero LLMInferenceService.
# Same llm-d pattern as llmisvc-qwen38.yaml (reuses the kserve-llm-gw gateway). Qwen3.6-27B is the
# same qwen3_5 arch family as Qwen3.8 (dense hybrid attention), so it mirrors qwen38's serving recipe:
# W4A4 MLP / FP8 attention -> fp8_e4m3 KV cache (never e5m2), trust-remote-code, max-model-len 8192.
# model.uri = PVC ROOT (subPath is broken on local-path); vLLM --model points at the in-PVC path.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen36-llm
  namespace: default
spec:
  model:
    uri: pvc://catalog-models
    name: qwen3.6-27b
  scaling:
    minReplicas: 1
    maxReplicas: 1
    keda:
      idleReplicaCount: 0
      cooldownPeriod: 600          # 10-min warm stopgap (home-k8s #104)
      pollingInterval: 15
      triggers:
        # Wake signal = Envoy ext-proc request RATE to THIS model's InferencePool (see llmisvc-qwen38.yaml
        # for the rationale). <POOL> = sanitized LLMInferenceService name qwen36-llm -> qwen36_llm.
        - type: prometheus
          name: qwen36-epp-request-rate
          metadata:
            serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
            # Wake scoped to the 15s envoy-gw scrape so [1m] holds ~4 samples (snappier wake). See llmisvc-qwen38.yaml.
            query: 'sum(rate(envoy_cluster_clusters_endpointpicker_qwen36_llm_inference_pool_default_ext_proc_upstream_rq_total{job="envoy-gw"}[1m]))'
            threshold: "5"
            activationThreshold: "0.001"
  template:
    runtimeClassName: nvidia
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
    containers:
      - name: main
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: true
        image: vllm/vllm-openai:muse-glimmer-x86_64-cu130
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - "--model=/mnt/models/Qwen3.6-27B-NVFP4"
          - "--served-model-name=qwen3.6-27b"
          - "--port=8000"
          - "--trust-remote-code"
          - "--kv-cache-dtype=fp8_e4m3"
          - "--gpu-memory-utilization=0.85"
          - "--max-model-len=262144"   # raised 8192 -> native max 262144 (256K); same KV profile as qwen3.8 (#100)
          # Tool calling: Qwen3-Coder XML format (verified in chat_template.jinja), parser qwen3_coder
          # (NOT hermes). Without these, tool_choice:"auto" 400s. See #99.
          - "--enable-auto-tool-choice"
          - "--tool-call-parser=qwen3_coder"
          # --- ZDR (zero-data-retention), issue #98 / ZDR.md. Verified supported by this image.
          # No request/output logging, no Uvicorn access log, and NO cross-request prefix/KV reuse.
          - "--no-enable-log-requests"
          - "--no-enable-log-outputs"
          - "--disable-uvicorn-access-log"
          # prefix caching ON (2026-08-29): user chose performance > full ZDR — cross-request KV reuse enabled; log-suppression privacy flags kept.
        env:
          - { name: VLLM_PORT, value: "8000" }
          - { name: VLLM_ATTENTION_BACKEND, value: FLASHINFER }
          - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.0f" }
          - { name: VLLM_NVFP4_GEMM_BACKEND, value: flashinfer-cutlass }
          # ZDR: pin log level to INFO — DEBUG/TRACE would log prompt text and token IDs (issue #98).
          - { name: VLLM_LOGGING_LEVEL, value: INFO }
          # Persistent torch.compile cache on NVMe (qwen36-vllm-cache PVC) — skips ~85s recompile on cold start.
          - { name: VLLM_CACHE_ROOT, value: /vllm-cache }
        ports:
          - containerPort: 8000
        resources:
          limits: { nvidia.com/gpu: "1", nvidia.com/gpumem: "44000", cpu: "8", memory: 24Gi }
          requests: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: vllm-cache, mountPath: /vllm-cache }   # persist torch.compile cache across scale-to-zero
    volumes:
      - name: vllm-cache
        persistentVolumeClaim:
          claimName: qwen36-vllm-cache
  router:
    gateway:
      refs:
        - name: kserve-llm-gw
          namespace: default
    route: {}
    scheduler: {}
