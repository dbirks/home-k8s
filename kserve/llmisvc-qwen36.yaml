# Catalog model: Qwen3.6-27B NVFP4 (dense hybrid VL) — scale-to-zero LLMInferenceService.
# Same llm-d pattern as llmisvc-qwen38.yaml (reuses the kserve-llm-gw gateway). Qwen3.6-27B is the
# same qwen3_5 arch family as Qwen3.8 (dense hybrid attention), so it mirrors qwen38's serving recipe:
# W4A4 MLP / FP8 attention -> fp8_e4m3 KV cache (never e5m2), trust-remote-code, max-model-len 8192.
# model.uri = PVC ROOT (subPath is broken on local-path); vLLM --model points at the in-PVC path.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen36-llm
  namespace: default
spec:
  model:
    uri: pvc://catalog-models
    name: qwen3.6-27b
  scaling:
    minReplicas: 1
    maxReplicas: 1
    keda:
      idleReplicaCount: 0
      cooldownPeriod: 120
      pollingInterval: 15
      triggers:
        # Wake signal = Envoy ext-proc request RATE to THIS model's InferencePool (see llmisvc-qwen38.yaml
        # for the rationale). <POOL> = sanitized LLMInferenceService name qwen36-llm -> qwen36_llm.
        - type: prometheus
          name: qwen36-epp-request-rate
          metadata:
            serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
            query: 'sum(rate(envoy_cluster_clusters_endpointpicker_qwen36_llm_inference_pool_default_ext_proc_upstream_rq_total[2m]))'
            threshold: "5"
            activationThreshold: "0.001"
  template:
    runtimeClassName: nvidia
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
    containers:
      - name: main
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: true
        image: vllm/vllm-openai:muse-glimmer-x86_64-cu130
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - "--model=/mnt/models/Qwen3.6-27B-NVFP4"
          - "--served-model-name=qwen3.6-27b"
          - "--port=8000"
          - "--trust-remote-code"
          - "--kv-cache-dtype=fp8_e4m3"
          - "--gpu-memory-utilization=0.85"
          - "--max-model-len=8192"
        env:
          - { name: VLLM_PORT, value: "8000" }
          - { name: VLLM_ATTENTION_BACKEND, value: FLASHINFER }
          - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.0f" }
          - { name: VLLM_NVFP4_GEMM_BACKEND, value: flashinfer-cutlass }
        ports:
          - containerPort: 8000
        resources:
          limits: { nvidia.com/gpu: "1", nvidia.com/gpumem: "44000", cpu: "8", memory: 24Gi }
          requests: { cpu: "4", memory: 8Gi }
  router:
    gateway:
      refs:
        - name: kserve-llm-gw
          namespace: default
    route: {}
    scheduler: {}
