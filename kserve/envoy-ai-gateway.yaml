# Step 4b: Envoy AI Gateway v1.0.0 — the piece that makes InferencePool routing actually work.
# It registers as Envoy Gateway's extension server (wired via envoy-gateway.yaml's extensionManager)
# and implements the inference.networking.k8s.io/v1 InferencePool backend: it programs Envoy to send
# matching requests through the EPP (endpoint picker) to the selected model-server endpoint.
#
# Two charts (matching KServe's tested install): ai-gateway-crds-helm then ai-gateway-helm, both
# v1.0.0, in namespace envoy-ai-gateway-system. Default values (KServe passes none). The controller
# Deployment/Service is "ai-gateway-controller" on port 1063 — the fqdn Envoy Gateway points at.
---
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-ai-gateway-system
---
# ---- AI Gateway CRDs (aigateway.envoyproxy.io group — no overlap with Gateway API CRDs) ----
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ai-gateway-crds
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://docker.io/envoyproxy/ai-gateway-crds-helm
  ref:
    tag: "1.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aieg-crd
  namespace: envoy-ai-gateway-system
spec:
  interval: 30m0s
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chartRef:
    kind: OCIRepository
    name: ai-gateway-crds
    namespace: flux-system
---
# ---- AI Gateway controller ----
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ai-gateway
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://docker.io/envoyproxy/ai-gateway-helm
  ref:
    tag: "1.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aieg
  namespace: envoy-ai-gateway-system
spec:
  interval: 30m0s
  dependsOn:
    - name: aieg-crd
  chartRef:
    kind: OCIRepository
    name: ai-gateway
    namespace: flux-system
