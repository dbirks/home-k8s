# Step 4a: Envoy Gateway — the data plane KServe v0.20 tests LLMInferenceService against.
# Pinned to v1.8.1 to match KServe's dependency matrix (paired with Envoy AI Gateway v1.0.0).
#
# Envoy Gateway ALONE cannot route a GIE InferencePool backend (its native backend groups are only
# core / multicluster / gateway.envoyproxy.io). The InferencePool routing is provided by ENVOY AI
# GATEWAY (see envoy-ai-gateway.yaml), which plugs in here as Envoy Gateway's *extension manager*:
#   - extensionManager.service.fqdn -> the ai-gateway-controller service (:1063)
#   - extensionManager.backendResources -> registers inference.networking.k8s.io/InferencePool/v1
#     as a backend kind the extension server handles.
# These values are the AI Gateway v1.0.0 base + inference-pool addon overlays, inlined for GitOps.
#
# We create GatewayClass "envoy"; Gateways with that class get an Envoy proxy + AI Gateway routing.
---
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://docker.io/envoyproxy/gateway-helm
  ref:
    tag: "1.9.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m0s
  install:
    createNamespace: true
    # Skip the chart's crds/ dir: it bundles the EXPERIMENTAL-channel Gateway API CRDs, which the
    # safe-upgrades admission policy blocks from layering on our existing STANDARD v1.6.1 set. Envoy
    # Gateway's OWN CRDs (*.gateway.envoyproxy.io) come from a templated path gated by the values flag
    # below, so Skip (which only affects crds/) still installs them. EG reuses the v1.6.1 GW API CRDs.
    crds: Skip
  upgrade:
    crds: Skip
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
    namespace: flux-system
  values:
    crds:
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
    # --- AI Gateway integration (base envoy-gateway-values.yaml + inference-pool addon, v1.0.0) ---
    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        logging:
          level:
            default: info
        provider:
          type: Kubernetes
        extensionApis:
          enableEnvoyPatchPolicy: true
          enableBackend: true          # required: AI service backends
        # AI Gateway fine-tunes the xDS resources Envoy Gateway generates, via this extension manager.
        extensionManager:
          hooks:
            xdsTranslator:
              translation:
                listener: { includeAll: true }
                route: { includeAll: true }
                cluster: { includeAll: true }
                secret: { includeAll: true }
              post:
                - Translation
                - Cluster
                - Route
          service:
            fqdn:
              hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
              port: 1063
          # inference-pool addon: register InferencePool (GA group/v1) as an extension-handled backend.
          backendResources:
            - group: inference.networking.k8s.io
              kind: InferencePool
              version: v1
---
# The GatewayClass our LLM Gateways bind to. Points at Envoy Gateway's controller; Gateways with this
# className get an Envoy proxy, and (with AI Gateway wired in above) can route InferencePool backends.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
