# Step 4: Envoy Gateway — KServe's TESTED data plane for LLMInferenceService.
# WHY: kgateway v2.4.2 watches the InferencePool CRD but does NOT support it as an HTTPRoute
# backend ("InvalidKind: unknown backend kind"), so it can't route to the EPP/engine. Envoy Gateway
# (with the GIE CRDs present at startup, which they are) implements InferencePool routing.
# It creates a GatewayClass "eg"; we point the LLMInferenceService at a Gateway on that class.
---
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 30m0s
  url: oci://docker.io/envoyproxy/gateway-helm
  ref:
    tag: "v1.9.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m0s
  install:
    createNamespace: true
    # Skip the chart's crds/ dir: it bundles the EXPERIMENTAL-channel Gateway API CRDs, which the
    # safe-upgrades admission policy blocks from layering on our existing STANDARD v1.6.1 set. Envoy
    # Gateway's OWN CRDs (*.gateway.envoyproxy.io) come from a templated path gated by the values flag
    # below, so Skip (which only affects crds/) still installs them. EG reuses the v1.6.1 GW API CRDs.
    crds: Skip
  upgrade:
    crds: Skip
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
    namespace: flux-system
  values:
    # We already have Gateway API v1.6.1 CRDs (via kgateway); a safe-upgrades admission policy blocks
    # installing the chart's older (v1.2) Gateway API CRDs. Skip them; keep Envoy Gateway's own CRDs.
    crds:
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
---
# The GatewayClass our LLM Gateways bind to. The chart installs the controller but no class; we
# declare one pointing at Envoy Gateway's controller. Gateways with this className get an Envoy proxy.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
