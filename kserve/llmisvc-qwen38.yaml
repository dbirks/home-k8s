# DEFAULT qwen3.8-27b, served by the NInfer C++/CUDA engine (ghcr.io/dbirks/ninfer), #100.
#
# Validated on the RTX PRO 6000 (SM120) as qwen3.8-27b-ninfer before this flip: OpenAI /v1 +
# tool_calls + SSE, MTP speculative decode, scale-to-zero. The LLMISVC name `qwen38-llm` and model
# name `qwen3.8-27b` are UNCHANGED, so the InferencePool `qwen38-llm-inference-pool`, its
# AIGatewayRoute rule, and the KEDA wake metric carry over untouched — only the engine changed.
#
# The previous vLLM behavior is preserved verbatim as `qwen3.8-27b-vllm`
# (kserve/llmisvc-qwen38-vllm.yaml): A/B baseline + instant fallback. To revert the default to vLLM,
# swap this file's model.uri/name/template back (or just point clients at -vllm).
#
# NInfer uses its OWN single-file `.ninfer` artifact (qwen38-ninfer-model PVC, filled by
# kserve/qwen38-ninfer-weights.yaml), NOT the vLLM NVFP4 safetensors.
#
# ZDR (#98): the vLLM ZDR flags don't apply to NInfer's CLI. Mitigations here: no --request-log-jsonl
# (would write request records to disk), and --response-store-max-records 1 (engine floor; 0 is
# rejected). That store only populates for OpenAI Responses API store=true requests, which our
# chat-completions / Anthropic-translated clients never send, so it stays empty in practice and is
# process-local (cleared on restart, never on disk).
---
# Shared Gateway for LLM serving on the Envoy Gateway "envoy" class (used by every catalog LLMISVC).
# InferencePool (llm-d/GIE) routing comes from ENVOY AI GATEWAY (apps/llm-ai-gateway.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kserve-llm-gw
  namespace: default
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen38-llm
  namespace: default
spec:
  model:
    uri: pvc://qwen38-ninfer-model              # PVC ROOT holding qwen3_8_27b_nvfp4.ninfer
    name: qwen3.8-27b                            # the OpenAI `model` name clients route by (DEFAULT)
  scaling:
    minReplicas: 1
    maxReplicas: 1
    keda:
      idleReplicaCount: 0
      cooldownPeriod: 120
      pollingInterval: 15
      triggers:
        - type: prometheus
          name: qwen-epp-request-rate
          metadata:
            serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
            # Metric segment `qwen38_llm_inference_pool` unchanged (same LLMISVC name); engine-agnostic.
            query: 'sum(rate(envoy_cluster_clusters_endpointpicker_qwen38_llm_inference_pool_default_ext_proc_upstream_rq_total{job="envoy-gw"}[1m]))'
            threshold: "5"
            activationThreshold: "0.001"
  template:                                      # PodSpec for the NInfer engine pod
    runtimeClassName: nvidia
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
    containers:
      - name: main
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: true
        image: ghcr.io/dbirks/ninfer:latest
        # ninfer-serve uses SPACE-separated args (--flag value), NOT --flag=value (it rejects
        # `--host=0.0.0.0` as unknown). Serve OpenAI /v1 on 8000 (KServe pool/EPP/workload svc target).
        command: ["ninfer-serve"]
        args:
          - "/mnt/models/qwen3_8_27b_nvfp4.ninfer"   # positional: KServe mounts the PVC root at /mnt/models
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--model-id"
          - "qwen3.8-27b"                            # public alias == model.name above
          - "--device"
          - "0"
          - "--max-context"
          - "262144"                                 # model native max (plain RoPE, no scaling); KV auto ~481k tok fits it
          - "--kv-capacity"
          - "auto"
          - "--max-concurrency"
          - "8"                                      # 8-wide; KV pool ~481k tok fits 8 typical requests
          - "--max-pending-requests"
          - "32"
          - "--pending-timeout-ms"
          - "600000"
          - "--prefill-chunk"
          - "1024"
          - "--kv-dtype"
          - "int8"
          - "--spec"
          - "mtp"
          - "--draft-tokens"
          - "3"
          - "--lm-head-draft"
          - "--default-max-tokens"
          - "8192"
          # ZDR: minimize the Responses store (0 rejected; 1 is the engine floor). See header.
          - "--response-store-max-records"
          - "1"
        env:
          - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
          - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
        ports:
          - containerPort: 8000
        resources:
          limits: { nvidia.com/gpu: "1", nvidia.com/gpumem: "40000", cpu: "8", memory: 24Gi }
          requests: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: dshm, mountPath: /dev/shm }
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
  router:
    gateway:
      refs:
        - name: kserve-llm-gw
          namespace: default
    route: {}
    scheduler: {}
