# Second always-on catalog model: Muse-Glimmer-30B NVFP4 (AutoRound W4A4), co-resident with Qwen3.8.
# Same llm-d LLMInferenceService pattern as llmisvc-qwen38.yaml (reuses the kserve-llm-gw gateway).
# Co-residence: HAMi hard cap gpumem 44000 MB each -> Qwen 44000 + Muse 44000 = 88000 < 96GB card.
# Model re-downloaded from HF to the durable muse-models PVC by apps/muse-nvfp4-download.yaml.
#
# NOTE: model path + any arch-specific args are VERIFIED against the downloaded config.json before this
# is applied (muse_glimmer needs the custom vllm image + trust-remote-code; SM120 NVFP4 dense is the
# supported path). KV fp8_e4m3 (standard attention -> fine; never e5m2).
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: muse-glimmer-llm
  namespace: default
spec:
  model:
    uri: pvc://muse-models                         # PVC ROOT (subPath mount is broken on local-path)
    name: muse-glimmer-30b                          # the OpenAI `model` name clients route by
  # SCALE-TO-ZERO (Phase 2 — KEDA wake path validated on the qwen catalog). `replicas` and `scaling`
  # are mutually exclusive; min=max=1 with idleReplicaCount:0 drops the engine to 0 after cooldownPeriod
  # of no traffic and the prometheus trigger wakes it 0->1 on the first request. Cold-load ~3-4min, so
  # the first request after idle needs client retries (they keep the ext-proc rate up so KEDA holds it).
  scaling:
    minReplicas: 1
    maxReplicas: 1
    keda:
      idleReplicaCount: 0
      cooldownPeriod: 600          # 10-min warm stopgap (home-k8s #104)
      pollingInterval: 15
      triggers:
        # Wake signal = Envoy ext-proc request RATE to muse's InferencePool. <POOL> = sanitized
        # LLMInferenceService name muse-glimmer-llm -> muse_glimmer_llm.
        - type: prometheus
          name: muse-epp-request-rate
          metadata:
            serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
            # Wake scoped to the 15s envoy-gw scrape so [1m] holds ~4 samples (snappier wake). See llmisvc-qwen38.yaml.
            query: 'sum(rate(envoy_cluster_clusters_endpointpicker_muse_glimmer_llm_inference_pool_default_ext_proc_upstream_rq_total{job="envoy-gw"}[1m]))'
            threshold: "5"
            activationThreshold: "0.001"
  template:
    runtimeClassName: nvidia
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
    containers:
      - name: main
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: true
        image: vllm/vllm-openai:muse-glimmer-x86_64-cu130
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - "--model=/mnt/models/Muse-Glimmer-30B-NVFP4-AutoRound"
          - "--served-model-name=muse-glimmer-30b"
          - "--port=8000"
          - "--trust-remote-code"
          - "--kv-cache-dtype=fp8_e4m3"
          - "--gpu-memory-utilization=0.85"
          - "--max-model-len=131072"   # raised 8192 -> native max 131072 (#100)
          # Muse-Glimmer emits OpenAI-Harmony channel format (analysis + final + to=self tool routing).
          # Without these, raw channel tokens bleed into message.content (ugly for clients). The custom
          # muse-glimmer image ships matching `muse_glimmer` parsers; this splits reasoning_content from
          # the clean final answer and enables tool calls. (Recipe from the retired muse-serve manifests.)
          - "--enable-auto-tool-choice"
          - "--tool-call-parser=muse_glimmer"
          - "--reasoning-parser=muse_glimmer"
          # --- ZDR (zero-data-retention), issue #98 / ZDR.md. Verified supported by this image.
          # No request/output logging, no Uvicorn access log, and NO cross-request prefix/KV reuse.
          - "--no-enable-log-requests"
          - "--no-enable-log-outputs"
          - "--disable-uvicorn-access-log"
          # prefix caching ON (2026-08-29): user chose performance > full ZDR — cross-request KV reuse enabled; log-suppression privacy flags kept.
        env:
          - { name: VLLM_PORT, value: "8000" }
          - { name: VLLM_ATTENTION_BACKEND, value: FLASHINFER }
          - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.0f" }
          - { name: VLLM_NVFP4_GEMM_BACKEND, value: flashinfer-cutlass }
          # ZDR: pin log level to INFO — DEBUG/TRACE would log prompt text and token IDs (issue #98).
          - { name: VLLM_LOGGING_LEVEL, value: INFO }
          # Persistent torch.compile cache on NVMe (muse-glimmer-vllm-cache PVC) — skips ~85s recompile on cold start.
          - { name: VLLM_CACHE_ROOT, value: /vllm-cache }
        ports:
          - containerPort: 8000
        resources:
          limits: { nvidia.com/gpu: "1", nvidia.com/gpumem: "44000", cpu: "8", memory: 24Gi }
          requests: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: vllm-cache, mountPath: /vllm-cache }   # persist torch.compile cache across scale-to-zero
    volumes:
      - name: vllm-cache
        persistentVolumeClaim:
          claimName: muse-glimmer-vllm-cache
  router:
    gateway:
      refs:
        - name: kserve-llm-gw
          namespace: default
    route: {}
    scheduler: {}                                    # stable EPP 0.9.0 preset
