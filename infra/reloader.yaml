# Stakater Reloader — watches ConfigMaps/Secrets and rolls the workloads that consume
# them when their contents change.
#
# Why we need it: several apps here mount a SOPS-encrypted config file with `subPath`
# (see apps/affine.yaml -> /root/.affine/config/config.json). A subPath volume mount
# does NOT receive in-place updates, so after Flux applies a changed Secret the running
# pod keeps serving the OLD file indefinitely — silently, with the cluster and the pod
# disagreeing. Reloader closes that gap by triggering a rollout instead of relying on
# the kubelet to refresh the file.
#
# Opt-in per workload: annotate the Deployment with
#   reloader.stakater.com/auto: "true"
# and it reloads on a change to ANY ConfigMap/Secret that workload references. Use
# reloader.stakater.com/search + the match annotation if you ever want narrower scope.
#
# Chart values: https://github.com/stakater/Reloader/blob/master/deployments/kubernetes/chart/reloader/values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: reloader
      # chart 2.2.17 = appVersion v1.4.22 (published 2026-09-09)
      version: "2.2.17"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      reconcileStrategy: ChartVersion
  values:
    reloader:
      # Watch every namespace, act only on annotated workloads.
      watchGlobally: true
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
