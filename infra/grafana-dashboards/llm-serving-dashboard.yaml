# LLM Serving Overview — coworker-facing status page.
#
# Purpose: at-a-glance "is the service healthy, what models are up, how loaded
# is the box" for coworkers, with deeper throughput/latency/routing rows below.
#
# Backed ONLY by metrics that exist on this cluster (verified via Prometheus):
#   * llm-d EPP  (jobs epp-*)      inference_pool_ready_pods{model} -> Up/Asleep
#                                   (stays up when the vLLM engine is scaled to 0),
#                                   inference_pool_average_queue_size / _kv_cache_utilization,
#                                   llm_d_epp_flow_control_pool_saturation.
#   * vLLM engine (jobs vllm-*)     vllm:* series carry model_name + model + engine;
#                                   process_start_time_seconds -> engine-uptime wake proxy.
#   * HAMi vGPU  (job hami-gpu)     per-pod VRAM/SM util + host GPU mem/util (96GB).
#   * node-exporter / kube-state / cAdvisor (default helm scrapes, already on):
#                                   node_cpu/memory/filesystem for CPU/RAM(no swap)/disk.
# Panels are templated on the `model` label (multi + All) so new scale-to-zero
# catalog models appear automatically. Datasource uid: prometheus.
#
# Note: vLLM emits no model-load-duration metric; "Engine uptime (time since
# start)" + the availability state-timeline are the cold-start / wake proxies.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-serving-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  llm-serving.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Coworker-facing LLM serving status: what's up, load & wake, GPU/CPU/RAM/disk capacity, throughput and latency.",
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "templating": {
        "list": [
          {
            "name": "model",
            "label": "Model",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(inference_pool_ready_pods, model)",
            "query": {
              "query": "label_values(inference_pool_ready_pods, model)",
              "refId": "StandardVariableQuery"
            },
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": false,
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "id": 100,
          "title": "Service status \u2014 is it healthy, what's up",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 1,
          "type": "stat",
          "title": "Models online",
          "description": "Number of catalog models currently serving (EPP inference_pool_ready_pods > 0). The rest are scaled-to-zero (asleep) and wake on first request.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#8a8a8a",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "orientation": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(inference_pool_ready_pods{model=~\"$model\"} > bool 0)",
              "legendFormat": "online",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 2,
          "type": "stat",
          "title": "Live requests",
          "description": "In-flight generation requests across all selected models (vllm:num_requests_running).",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(vllm:num_requests_running{model=~\"$model\"})",
              "legendFormat": "running",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 3,
          "type": "stat",
          "title": "Waiting (queue)",
          "description": "Requests queued waiting for a scheduler slot. Sustained >0 means the box is saturated.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(vllm:num_requests_waiting{model=~\"$model\"})",
              "legendFormat": "waiting",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 4,
          "type": "stat",
          "title": "Throughput",
          "description": "Generated tokens/sec across selected models (1m rate).",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "tok/s",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(vllm:generation_tokens_total{model=~\"$model\"}[1m]))",
              "legendFormat": "tok/s",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 5,
          "type": "stat",
          "title": "Success rate (5m)",
          "description": "Share of completed requests that finished normally (not error) over the last 5 min. Shows 100% when idle.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 90
                  },
                  {
                    "color": "green",
                    "value": 99
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * sum(rate(vllm:request_success_total{finished_reason!=\"error\", model=~\"$model\"}[5m])) / clamp_min(sum(rate(vllm:request_success_total{model=~\"$model\"}[5m])), 0.0001)",
              "legendFormat": "success",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 6,
          "type": "stat",
          "title": "GPU VRAM used",
          "description": "Total device VRAM in use on the RTX PRO 6000 Blackwell (96 GB). Drives how many models fit co-resident.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "max": 103079215104,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 80530636800
                  },
                  {
                    "color": "red",
                    "value": 94489280512
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "hami_host_gpu_memory_used_bytes",
              "legendFormat": "vram",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 7,
          "type": "table",
          "title": "Model catalog & live status",
          "description": "Every catalog model. Status = EPP ready pods (Up / Asleep=scaled-to-zero). Uptime = time since the engine process started \u2014 small right after a wake (cold-start proxy; vLLM emits no model-load-duration).",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "sum by (model) (inference_pool_ready_pods{model=~\"$model\"})"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "format": "table",
              "instant": true,
              "expr": "sum by (model) (vllm:num_requests_running{model=~\"$model\"})"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "C",
              "format": "table",
              "instant": true,
              "expr": "sum by (model) (vllm:num_requests_waiting{model=~\"$model\"})"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "D",
              "format": "table",
              "instant": true,
              "expr": "sum by (model) (rate(vllm:generation_tokens_total{model=~\"$model\"}[1m]))"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "E",
              "format": "table",
              "instant": true,
              "expr": "avg by (model) (vllm:kv_cache_usage_perc{model=~\"$model\"})"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "F",
              "format": "table",
              "instant": true,
              "expr": "time() - min by (model) (process_start_time_seconds{job=~\"vllm-.*\", model=~\"$model\"})"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "model",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "Time 5": true,
                  "Time 6": true
                },
                "renameByName": {
                  "model": "Model",
                  "Value #A": "Status",
                  "Value #B": "Running",
                  "Value #C": "Waiting",
                  "Value #D": "Throughput",
                  "Value #E": "KV cache",
                  "Value #F": "Uptime"
                },
                "indexByName": {
                  "model": 0,
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4,
                  "Value #E": 5,
                  "Value #F": 6
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Status"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "gradient"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "Asleep",
                            "index": 0
                          }
                        }
                      },
                      {
                        "type": "range",
                        "options": {
                          "from": 1,
                          "to": 9999,
                          "result": {
                            "text": "Up",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#6b6b6b",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.align",
                    "value": "center"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Running"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Waiting"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        },
                        {
                          "color": "red",
                          "value": 10
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Throughput"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "tok/s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "KV cache"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "gradient"
                    }
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Uptime"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "Status",
                "desc": true
              }
            ]
          }
        },
        {
          "type": "row",
          "id": 101,
          "title": "Availability & wake",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "panels": []
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 10,
          "type": "state-timeline",
          "title": "Model availability (Up vs Asleep) over time",
          "description": "Green = serving, grey = scaled-to-zero. Transitions grey\u2192green are wake events; the width of a grey band is how long a model slept.",
          "gridPos": {
            "h": 7,
            "w": 16,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "inference_pool_ready_pods{model=~\"$model\"}",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 90,
                "lineWidth": 0
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Asleep",
                      "color": "#6b6b6b",
                      "index": 0
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 1,
                    "to": 9999,
                    "result": {
                      "text": "Up",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6b6b6b",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true,
            "showValue": "never",
            "alignValue": "left",
            "rowHeight": 0.9,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 11,
          "type": "stat",
          "title": "Engine uptime (time since start)",
          "description": "Time since each running engine's process started. A small value means the model recently cold-started/woke. Cold-start proxy \u2014 vLLM exposes no direct model-load-duration metric.",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - process_start_time_seconds{job=~\"vllm-.*\", model=~\"$model\"}",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "id": 102,
          "title": "Capacity \u2014 GPU / CPU / RAM / disk",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "panels": []
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 20,
          "type": "gauge",
          "title": "GPU VRAM (host, /96 GB)",
          "description": "Total device VRAM in use.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 22
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "max": 103079215104,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 80530636800
                  },
                  {
                    "color": "red",
                    "value": 94489280512
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
