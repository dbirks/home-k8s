# Prometheus - metrics collection and storage
# Dashboards: https://prometheus-community.github.io/helm-charts
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # Allow node-exporter's host access (hostNetwork, hostPID, hostPath)
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: prometheus
      version: "29.27.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 5m
  values:
    # Disable unused components for a lean homelab setup
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false

    # Node metrics
    prometheus-node-exporter:
      enabled: true

    # Kubernetes state metrics
    kube-state-metrics:
      enabled: true

    server:
      service:
        type: ClusterIP
        servicePort: 80

      persistentVolume:
        enabled: true
        size: 20Gi
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce

      retention: "15d"

      ingress:
        enabled: true
        ingressClassName: private
        hosts:
          - prometheus.hoam.lan

    # Scrape vLLM metrics
    extraScrapeConfigs: |
      - job_name: 'vllm'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - vllm.default.svc.cluster.local:80
            labels:
              instance: vllm
      # Laguna S-2.1 vLLM metrics (spec-decode acceptance, throughput, queue)
      - job_name: 'laguna'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - laguna.default.svc.cluster.local:80
            labels:
              instance: laguna
      # DeepSWE generation controller progress metrics (see apps/dspark-deepswe-*)
      - job_name: 'dspark-deepswe'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - dspark-deepswe-metrics.default.svc.cluster.local:9100
            labels:
              instance: dspark-deepswe
      # --- LLM serving observability: KServe/vLLM engine pods (/metrics :8000) ---
      # Each engine's vLLM Prometheus metrics carry a `model_name` label already;
      # the extra `model`/`engine` labels here tag the label-less process/up metrics.
      - job_name: 'vllm-qwen38'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - qwen38-llm-kserve-workload-svc.default.svc.cluster.local:8000
            labels:
              model: qwen3.8-nvfp4
              engine: qwen38-llm
      - job_name: 'vllm-muse-glimmer'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - muse-glimmer-llm-kserve-workload-svc.default.svc.cluster.local:8000
            labels:
              model: muse-glimmer-30b
              engine: muse-glimmer-llm
      # HAMi vGPU device-plugin monitor: per-pod VRAM + GPU SM utilization.
      # hami_vgpu_memory_used_bytes / hami_container_device_utilization_ratio{pod=...}
      # and host-level hami_host_gpu_memory_used_bytes / hami_host_gpu_utilization_ratio.
      - job_name: 'hami-gpu'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - hami-device-plugin-monitor.kube-system.svc.cluster.local:31992
            labels:
              instance: hami-gpu
      # --- llm-d EPP (endpoint picker / smart scheduler) :9090, per model ---
      # EPP 0.10's secure metrics endpoint requires a bearer token (controller-runtime
      # authn/authz); the prometheus-server SA token authorizes (verified 200). Gives us
      # inference_pool_ready_pods, inference_pool_average_queue_size / kv_cache_utilization,
      # llm_d_epp_flow_control_pool_saturation, per-endpoint queue — the scale-from-zero +
      # routing signals (also feeds the coworker dashboard).
      - job_name: 'epp-qwen38'
        scrape_interval: 15s
        metrics_path: /metrics
        scheme: http
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets:
              - qwen38-llm-epp-service.default.svc.cluster.local:9090
            labels:
              model: qwen3.8-nvfp4
              engine: qwen38-llm
              component: epp
      - job_name: 'epp-muse-glimmer'
        scrape_interval: 15s
        metrics_path: /metrics
        scheme: http
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets:
              - muse-glimmer-llm-epp-service.default.svc.cluster.local:9090
            labels:
              model: muse-glimmer-30b
              engine: muse-glimmer-llm
              component: epp
      # --- Envoy gateway proxy stats at 15s (for a SNAPPIER KEDA scale-from-zero wake) ---
      # The annotation-based kubernetes-pods job already scrapes these pods, but at the chart's
      # 60s global interval -- too slow to fill a short rate() window, so the wake trigger was stuck
      # on a [2m] window. This job scrapes the managed Envoy proxy pods' :19001/stats/prometheus every
      # 15s; KEDA triggers scope their query to {job="envoy-gw"} + [1m] (4 samples) for a faster wake.
      # Scoped to pods carrying gateway.envoyproxy.io/owning-gateway-name (the 3 gateway proxies; the
      # envoy-gateway controller pod has no such label and is excluded), metrics container port only.
      - job_name: 'envoy-gw'
        scrape_interval: 15s
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [envoy-gateway-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_gateway_envoyproxy_io_owning_gateway_name]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_label_gateway_envoyproxy_io_owning_gateway_name]
            target_label: gateway
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
