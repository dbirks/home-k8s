# Prometheus - metrics collection and storage
# Dashboards: https://prometheus-community.github.io/helm-charts
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # Allow node-exporter's host access (hostNetwork, hostPID, hostPath)
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: prometheus
      version: "29.2.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 5m
  values:
    # Disable unused components for a lean homelab setup
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false

    # Node metrics
    prometheus-node-exporter:
      enabled: true

    # Kubernetes state metrics
    kube-state-metrics:
      enabled: true

    server:
      service:
        type: ClusterIP
        servicePort: 80

      persistentVolume:
        enabled: true
        size: 20Gi
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce

      retention: "15d"

      ingress:
        enabled: true
        ingressClassName: private
        hosts:
          - prometheus.hoam.lan

    # Scrape vLLM metrics
    extraScrapeConfigs: |
      - job_name: 'vllm'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - vllm.default.svc.cluster.local:80
            labels:
              instance: vllm
      # Laguna S-2.1 vLLM metrics (spec-decode acceptance, throughput, queue)
      - job_name: 'laguna'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - laguna.default.svc.cluster.local:80
            labels:
              instance: laguna
      # DeepSWE generation controller progress metrics (see apps/dspark-deepswe-*)
      - job_name: 'dspark-deepswe'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - dspark-deepswe-metrics.default.svc.cluster.local:9100
            labels:
              instance: dspark-deepswe
      # --- LLM serving observability: KServe/vLLM engine pods (/metrics :8000) ---
      # Each engine's vLLM Prometheus metrics carry a `model_name` label already;
      # the extra `model`/`engine` labels here tag the label-less process/up metrics.
      - job_name: 'vllm-qwen38'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - qwen38-llm-kserve-workload-svc.default.svc.cluster.local:8000
            labels:
              model: qwen3.8-nvfp4
              engine: qwen38-llm
      - job_name: 'vllm-muse-glimmer'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - muse-glimmer-llm-kserve-workload-svc.default.svc.cluster.local:8000
            labels:
              model: muse-glimmer-30b
              engine: muse-glimmer-llm
      # HAMi vGPU device-plugin monitor: per-pod VRAM + GPU SM utilization.
      # hami_vgpu_memory_used_bytes / hami_container_device_utilization_ratio{pod=...}
      # and host-level hami_host_gpu_memory_used_bytes / hami_host_gpu_utilization_ratio.
      - job_name: 'hami-gpu'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - hami-device-plugin-monitor.kube-system.svc.cluster.local:31992
            labels:
              instance: hami-gpu
