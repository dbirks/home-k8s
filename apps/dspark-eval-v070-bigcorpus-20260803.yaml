# Real-vLLM eval of the trained DSpark drafter (from-scratch 3-layer big-corpus run).
# Serves target Qwen3.6-27B-NVFP4 + our checkpoint via spec-decode, runs held-out
# coding (heavy) + general prompts at temp 0, and reports BOTH:
#   (1) real acceptance length (vLLM spec_decode counters) vs the 1.66 baseline, and
#   (2) end-to-end single-stream tok/s speedup = drafter ON vs OFF (the real payoff).
# Sequential (max-num-seqs 1, enforce-eager) so tok/s reflects clean decode latency.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dspark-eval-v070-bigcorpus-script
  namespace: default
data:
  prompts.jsonl: |
    {"cat":"coding","p":"Write a Python function that merges two sorted linked lists into one sorted list. Include the ListNode class."}
    {"cat":"coding","p":"Fix this bug: `def avg(xs): return sum(xs)/len(xs)` crashes on empty input. Make it return 0.0 for empty."}
    {"cat":"coding","p":"Implement an LRU cache in Python with get and put in O(1) using OrderedDict."}
    {"cat":"coding","p":"Write a TypeScript function `debounce<T>(fn: T, ms: number)` that returns a debounced version preserving argument types."}
    {"cat":"coding","p":"Refactor this into async/await: fetch('/api').then(r => r.json()).then(d => console.log(d)).catch(e => console.error(e))"}
    {"cat":"coding","p":"Write a Python decorator `@retry(times=3, delay=1)` that retries a function on exception with a delay."}
    {"cat":"coding","p":"Given a binary tree, write a function to return its level-order traversal as a list of lists (Python)."}
    {"cat":"coding","p":"Write a SQL query to find the second-highest salary from an Employee(id, salary) table, handling ties."}
    {"cat":"coding","p":"Implement quicksort in Rust for a Vec<i32>, sorting in place."}
    {"cat":"coding","p":"Write a Python context manager `timer()` that prints elapsed wall-clock time on exit."}
    {"cat":"coding","p":"Convert this callback code to a Promise: function load(cb){ setTimeout(()=>cb(null,42),100) }"}
    {"cat":"coding","p":"Write a Go function that reads a file line by line and returns the count of non-empty lines."}
    {"cat":"coding","p":"Implement binary search on a sorted list in Python; return the index or -1. Include edge cases."}
    {"cat":"coding","p":"Write a React hook `useLocalStorage(key, initial)` that syncs state to localStorage (TypeScript)."}
    {"cat":"coding","p":"Fix the off-by-one: `for i in range(1, len(a)): a[i] = a[i-1]` should shift right by one, preserving a[0]."}
    {"cat":"coding","p":"Write a Python function to detect a cycle in a directed graph (adjacency list) using DFS."}
    {"cat":"coding","p":"Write a bash script that finds all .log files older than 7 days under /var/log and prints their total size."}
    {"cat":"coding","p":"Implement a rate limiter class in Python (token bucket) with an allow() method."}
    {"cat":"coding","p":"Write a TypeScript type `DeepReadonly<T>` that recursively makes all properties readonly."}
    {"cat":"coding","p":"Parse a CSV string into a list of dicts in Python without the csv module, handling quoted commas."}
    {"cat":"general","p":"Explain the difference between TCP and UDP in a few sentences."}
    {"cat":"general","p":"Summarize how HTTPS establishes a secure connection."}
    {"cat":"general","p":"What are the tradeoffs between SQL and NoSQL databases?"}
    {"cat":"general","p":"Explain what a race condition is and give a simple example."}
    {"cat":"general","p":"Describe how a hash map achieves average O(1) lookups."}
  eval.sh: |
    #!/bin/bash
    set -uo pipefail
    export HF_HOME=/data; export HF_HUB_ENABLE_HF_TRANSFER=1
    MODEL=unsloth/Qwen3.6-27B-NVFP4
    # Auto-select the newest real checkpoint from the from-scratch 3-layer run.
    CKPTDIR=/output/checkpoints-qwen-scratch5-20260806
    mkdir -p /output/logs
    CKPT=""
    for c in "$CKPTDIR/checkpoint_best" "$CKPTDIR/0" "$CKPTDIR"/epoch*_end "$CKPTDIR"/epoch*_step*; do
      [ -f "$c/config.json" ] && { CKPT=$(readlink -f "$c"); break; }
    done
    echo "auto-selected checkpoint: ${CKPT:-<none found>}"
    [ -n "$CKPT" ] && [ -f "$CKPT/config.json" ] || { echo "FATAL: no usable checkpoint under $CKPTDIR"; ls -la "$CKPTDIR" 2>/dev/null; exit 1; }

    COMMON="--host 127.0.0.1 --port 8001 --gpu-memory-utilization 0.90 --max-model-len 8192 \
      --dtype bfloat16 --trust-remote-code --kv-cache-dtype fp8_e4m3 \
      --mamba-cache-dtype float16 --mamba-ssm-cache-dtype float16 \
      --no-enable-prefix-caching --max-num-seqs 1 --enforce-eager"

    wait_health() { # $1=pid $2=log
      for i in $(seq 1 300); do
        curl -sf http://127.0.0.1:8001/health >/dev/null 2>&1 && { echo "  healthy after $((i*10))s"; return 0; }
        kill -0 "$1" 2>/dev/null || { echo "  vLLM died:"; tail -50 "$2"; return 1; }
        sleep 10
      done
      echo "  serve timeout"; tail -40 "$2"; return 1
    }

    # ---------- PASS 1: drafter ON (spec-decode) ----------
    echo "=== [$(date)] PASS 1 — serve WITH trained dspark drafter (k=15) ==="
    vllm serve "$MODEL" $COMMON \
      --speculative-config "{\"method\":\"dspark\",\"model\":\"$CKPT\",\"num_speculative_tokens\":15}" \
      > /output/logs/eval_v070_serve_on.log 2>&1 &
    VP=$!; wait_health $VP /output/logs/eval_v070_serve_on.log || { kill $VP 2>/dev/null; exit 1; }
    MODE=on python3 /scripts/bench.py 2>&1 | tee /output/logs/eval_v070_on.log
    kill $VP 2>/dev/null; wait $VP 2>/dev/null; sleep 5

    # ---------- PASS 2: drafter OFF (baseline decode) ----------
    echo "=== [$(date)] PASS 2 — serve WITHOUT drafter (baseline tok/s) ==="
    vllm serve "$MODEL" $COMMON \
      > /output/logs/eval_v070_serve_off.log 2>&1 &
    VP=$!; wait_health $VP /output/logs/eval_v070_serve_off.log || { kill $VP 2>/dev/null; exit 1; }
    MODE=off python3 /scripts/bench.py 2>&1 | tee /output/logs/eval_v070_off.log
    kill $VP 2>/dev/null; wait $VP 2>/dev/null

    # ---------- speedup summary ----------
    echo "=== [$(date)] SPEEDUP SUMMARY (drafter ON vs OFF) ==="
    python3 - <<'PY' 2>&1 | tee /output/logs/eval_v070_result.log
    import json
    def load(m):
        try: return json.load(open(f"/output/logs/toks_{m}.json"))
        except Exception: return None
    on, off = load("on"), load("off")
    print("=== FROM-SCRATCH 3-LAYER DSPARK — REAL vLLM RESULTS (temp 0, single-stream) ===")
    if on:
        print(f"accept_len  coding={on['al_code']:.3f}  general={on['al_gen']:.3f}   (baseline 1.66)")
        print(f"tok/s ON    coding={on['tps_code']:.1f}  general={on['tps_gen']:.1f}")
    if off:
        print(f"tok/s OFF   coding={off['tps_code']:.1f}  general={off['tps_gen']:.1f}")
    if on and off and off['tps_code'] and off['tps_gen']:
        print(f"SPEEDUP     coding={on['tps_code']/off['tps_code']:.2f}x  general={on['tps_gen']/off['tps_gen']:.2f}x")
    PY
    echo "=== [$(date)] eval done ==="
  bench.py: |
    import json, os, time, urllib.request
    URL="http://127.0.0.1:8001/v1/chat/completions"; MODEL="unsloth/Qwen3.6-27B-NVFP4"
    MODE=os.environ.get("MODE","on")
    def metrics():
        try: m=urllib.request.urlopen("http://127.0.0.1:8001/metrics",timeout=10).read().decode()
        except Exception: return (0,0)
        d=a=0
        for line in m.splitlines():
            if line.startswith("vllm:spec_decode_num_draft_tokens_total"): d=float(line.split()[-1])
            elif line.startswith("vllm:spec_decode_num_accepted_tokens_total"): a=float(line.split()[-1])
        return (d,a)
    def run(cat, prompts):
        d0,a0=metrics(); toks=0; t0=time.time()
        for p in prompts:
            body=json.dumps({"model":MODEL,"messages":[{"role":"user","content":p}],
                             "max_tokens":400,"temperature":0}).encode()
            req=urllib.request.Request(URL,data=body,headers={"Content-Type":"application/json"})
            try:
                r=json.loads(urllib.request.urlopen(req,timeout=300).read())
                toks += r.get("usage",{}).get("completion_tokens",0)
            except Exception as ex: print("  req err:",str(ex)[:160])
        dt=time.time()-t0; d1,a1=metrics()
        dd,da=d1-d0,a1-a0
        al = 1 + (da/(dd/15)) if dd else float('nan')   # k=15 draft tokens per round
        tps = toks/dt if dt else 0.0
        print(f"  [{cat}] mode={MODE} tokens={toks} time={dt:.1f}s tok/s={tps:.1f} accept_len={al:.3f}")
        return tps, al
    prompts=[json.loads(l) for l in open("/scripts/prompts.jsonl") if l.strip()]
    coding=[x["p"] for x in prompts if x["cat"]=="coding"]
    general=[x["p"] for x in prompts if x["cat"]=="general"]
    tps_code,al_code=run("coding",coding)
    tps_gen,al_gen=run("general",general)
    json.dump({"tps_code":tps_code,"tps_gen":tps_gen,"al_code":al_code,"al_gen":al_gen},
              open(f"/output/logs/toks_{MODE}.json","w"))
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dspark-eval-v070-bigcorpus-20260803
  namespace: default
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      enableServiceLinks: false
      priorityClassName: system-node-critical
      containers:
        - name: eval
          image: vllm/vllm-openai:v0.25.1
          command: ["/bin/bash", "/scripts/eval.sh"]
          env:
            - name: HF_HOME
              value: /data
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 32Gi
            requests:
              cpu: "4"
              memory: 32Gi
          volumeMounts:
            - name: models
              mountPath: /data
            - name: output
              mountPath: /output
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: output
          persistentVolumeClaim:
            claimName: dspark-output-hdd-v2
        - name: scripts
          configMap:
            name: dspark-eval-v070-bigcorpus-script
            defaultMode: 0755
