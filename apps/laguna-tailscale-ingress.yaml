# Laguna — Tailscale Ingress
#
# Same pattern as apps/vllm-tailscale-ingress.yaml: an Ingress on the laguna
# Service using the installed `tailscale` IngressClass (tailscale.com/ts-ingress).
# Tailscale provisions a dedicated tailnet node with an auto-renewing Let's
# Encrypt cert for its MagicDNS name `laguna.beluga-wyvern.ts.net` -- reachable
# only over the tailnet, never the public internet. Independent of the
# laguna.hoam.lan LAN path (in apps/laguna-vllm.yaml).
#
# Requires "HTTPS Certificates" enabled in the Tailscale admin console
# (Settings -> DNS) -- already on for the other *-ts Ingresses.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: laguna-ts
  namespace: default
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - laguna
  rules:
    - host: laguna
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: laguna
                port:
                  number: 80
