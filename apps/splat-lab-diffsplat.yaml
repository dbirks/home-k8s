# splat-lab g2 · DiffSplat (SD1.5, 0.86 B params) text -> 3D Gaussian splats on dave-droid's
# GTX 1070 (Pascal sm_61, HAMi slice 5000 MiB). Generated 2026-11-16 — DO NOT EDIT BY HAND:
# the ConfigMap is rendered from tools/splats/g2/job/ in https://github.com/dbirks/aise-nov-2026-local-llms
# by tools/splats/g2/render_job_yaml.py (see that file for the re-run recipe).
#
# What the Job does (log: /data/out/<dir>/setup.log + run.log, both also echoed to pod logs):
#   1. cached venv on the PVC (diffusers 0.32.2 etc. — torch stays the image's 2.7.1+cu126),
#   2. pinned sources fetched over HTTPS with urllib+tarfile (this image has no git):
#      DiffSplat a99d75707541009283bc5c073f1a07b5add41d00 (MIT),
#      RaDe-GS d72f20792005ae1d6555a82aa2d15345f247604e (its 3DGS rasterizer fork) + that fork's
#      pinned glm 5c46b9c07008ae65cb81ab79cd677ecc1934b903,
#   3. three import-graph patches so the SD1.5 text->splat path loads without the
#      training/metrics/video stack (job/apply_patches.py; originals kept as *.upstream),
#   4. builds the rasterizer for sm_61 (TORCH_CUDA_ARCH_LIST=6.1) and caches the wheel; if that
#      fails a pure-python stub is used — the .ply export never calls the rasterizer, only the
#      optional verification contact sheets do, so a stub just costs us the previews,
#   5. cached HF weights: DiffSplat SD1.5 text-cond UNet-EMA (3.28 GB fp32) + GSVAE (SD).
#      GSRecon (160 MB) is not fetched: upstream states only its rendering function is used at
#      inference, and run.py redoes that math itself,
#   6. generates three splats from text prompts in **fp16** (upstream's `--half_precision` is
#      bf16, which PyTorch refuses on Pascal; upstream's default fp32 UNet alone is 3.3 GB and
#      does not fit next to the rest in a 4.9 GiB slice), writes
#      /data/out/<dir>/raw/<slug>.ply + raw/<slug>.json + metrics.json with measured wall time,
#      peak torch allocation and a device-wide nvidia-smi peak.
#
# Copy results out with:
#   kubectl cp default/<splat-lab-files pod>:/data/out/<dir> ./out
# This Job is never deleted by TTL (Flux would re-create and re-run it); to re-run, bump the
# name and the OUT path together.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: splat-lab-diffsplat-scripts
  namespace: default
  labels:
    app: splat-lab-diffsplat
    app.kubernetes.io/part-of: splat-lab
  annotations:
    splat-lab.aise/deck-source: tools/splats/g2/job
    splat-lab.aise/regenerate: uv run tools/splats/g2/render_job_yaml.py
data:
  requirements.txt: |
    # splat-lab g2 (DiffSplat, SD1.5 variant) — Python deps for the k8s Job.
    # Installed into a --system-site-packages venv on the PVC, so torch / torchvision / numpy /
    # scikit-image-runtime deps come from pytorch/pytorch:2.7.1-cuda12.6-cudnn9-devel and are NOT
    # re-resolved here (that is what keeps the 5000 MiB Pascal container from getting a second
    # torch). Pinned to the set diffusers==0.32.2 (DiffSplat's own pin) was released against.
    #
    # Deliberately absent, with the reason:
    #   xformers                     SM70+; not imported by the SD1.5 UNet/pipeline (diffusers falls
    #                                back to SDPA / the fork's own MVAttnProcessor2_0)
    #   deepspeed, accelerate-cli    training only
    #   rembg[gpu], onnxruntime-gpu  single-view image conditioning only
    #   image-reward, lpips-weights, CLIP (openai), matplotlib, imageio-ffmpeg, wandb
    #                                metrics/video/logging; kept out of the import graph by
    #                                job/apply_patches.py (lpips *itself* is imported by gsvae.py)
    #   kiui[full]                   mesh/vis/extras; plain kiui (lazy_loader only) is enough for the
    #                                one helper `import kiui` needs at module scope
    #   numpy                        left at whatever the image ships (recorded in pip-freeze.txt)
    diffusers==0.32.2
    transformers==4.46.3
    accelerate==1.1.1
    huggingface-hub==0.25.2
    safetensors==0.4.5
    tokenizers==0.20.3
    einops==0.8.0
    omegaconf==2.3.0
    lpips==0.1.4
    scikit-image==0.24.0
    plyfile==1.1.2
    kiui==0.3.5
  prompts.tsv: "# splat-lab g2 · text prompts for DiffSplat (SD1.5). One per line: <slug><TAB><prompt>.\n# Chosen to match the deck's other splat-lab subjects (GPU, home server) plus one plain object,\n# and to stay in the noun-phrase style of the Cap3D captions DiffSplat was trained on.\ngpu-cooler\ta graphics card with a large cooler\nserver-tower\ta small home server tower\nbooks\ta stack of books\n"
  fetch_sources.py: |
    #!/usr/bin/env python3
    """splat-lab g2 · fetch the pinned third-party sources without git.

    `pytorch/pytorch:2.7.1-cuda12.6-cudnn9-devel` has no `git` binary, so the three pinned trees are
    taken from GitHub's codeload archives over HTTPS with urllib + tarfile (extracted with
    `filter="data"`, no member may escape the target directory). Each destination remembers the SHA
    it was filled from in `.source-sha`, so a re-run of the Job skips the download.

        RaDe-GS is extracted with only `submodules/diff-gaussian-rasterization/**` (the rest of that
        repo is demo media we never read), and `third_party/glm` — a submodule of RaDe-GS, whose
        pinned commit we read from GitHub's contents API on 2026-11-16 — is unpacked into it.

    Prints bytes downloaded and wall time per source; nothing here touches the GPU.
    """
    from __future__ import annotations

    import hashlib
    import os
    import pathlib
    import shutil
    import sys
    import tarfile
    import tempfile
    import time
    import urllib.request

    CACHE = os.environ.get("G2_DL_DIR", "/data/cache/g2/dl")
    REPO_ROOT = os.environ.get("G2_REPO_ROOT", "/data/cache/repo")
    RADEGS_SHA = "d72f20792005ae1d6555a82aa2d15345f247604e"
    SOURCES = [
        # repo, commit, destination, optional path prefix to keep
        ("chenguolin/DiffSplat", "a99d75707541009283bc5c073f1a07b5add41d00",
         f"{REPO_ROOT}/DiffSplat", None),
        ("BaowenZ/RaDe-GS", RADEGS_SHA,
         f"{REPO_ROOT}/RaDe-GS", "submodules/diff-gaussian-rasterization"),
        # RaDe-GS's pinned glm (header-only; auxiliary.h includes <glm/glm.hpp>)
        ("g-truc/glm", "5c46b9c07008ae65cb81ab79cd677ecc1934b903",
         f"{REPO_ROOT}/RaDe-GS/submodules/diff-gaussian-rasterization/third_party/glm", None),
    ]


    def log(msg: str) -> None:
        print(f"[fetch] {msg}", flush=True)


    def fetch(repo: str, sha: str, dest: str, only: str | None) -> None:
        d = pathlib.Path(dest)
        marker = d / ".source-sha"
        tag = f"{sha} only={only or '-'}"
        if marker.is_file() and marker.read_text().strip() == tag:
            log(f"cached  {repo} @ {sha[:12]} -> {dest}")
            return

        t0 = time.time()
        os.makedirs(CACHE, exist_ok=True)
        tar = os.path.join(CACHE, f"{repo.replace('/', '-')}-{sha}.tar.gz")
        url = f"https://codeload.github.com/{repo}/tar.gz/{sha}"
        if not os.path.exists(tar):
            tmp = tar + ".part"
            req = urllib.request.Request(url, headers={"User-Agent": "splat-lab-g2 (deck experiments)"})
            with urllib.request.urlopen(req, timeout=600) as r, open(tmp, "wb") as fh:
                shutil.copyfileobj(r, fh, length=1 << 20)
            os.replace(tmp, tar)
        digest = hashlib.sha256(open(tar, "rb").read()).hexdigest()[:16]
        size = os.path.getsize(tar) / 2**20

        work = pathlib.Path(tempfile.mkdtemp(prefix="g2-src-"))
        try:
            with tarfile.open(tar) as tf:
                members = tf.getmembers()
                top = members[0].name.split("/")[0]
                if only:
                    keep = f"{top}/{only}"
                    members = [m for m in members if m.name == top or m.name == keep or m.name.startswith(keep + "/")]
                tf.extractall(work, members=members, filter="data")
            src = work / top
            if d.exists():
                shutil.rmtree(d)
            d.parent.mkdir(parents=True, exist_ok=True)
            shutil.move(str(src), str(d))
        finally:
            shutil.rmtree(work, ignore_errors=True)
        marker.write_text(tag + "\n")
        log(f"ok      {repo} @ {sha[:12]}  {size:.1f} MiB tar.gz sha256:{digest}  "
            f"extracted -> {dest}  ({time.time() - t0:.1f}s)")


    def main() -> int:
        failed = 0
        for repo, sha, dest, only in SOURCES:
            try:
                fetch(repo, sha, dest, only)
            except Exception as exc:
                failed += 1
                print(f"[fetch] FAILED {repo} @ {sha[:12]} -> {dest}: {type(exc).__name__}: {exc}", flush=True)
        raster = f"{REPO_ROOT}/RaDe-GS/submodules/diff-gaussian-rasterization/setup.py"
        glm = f"{REPO_ROOT}/RaDe-GS/submodules/diff-gaussian-rasterization/third_party/glm/glm/glm.hpp"
        print(f"[fetch] rasterizer source present: {os.path.exists(raster)}; glm present: {os.path.exists(glm)}",
              flush=True)
        return 1 if failed else 0


    if __name__ == "__main__":
        sys.exit(main())
  apply_patches.py: |
    #!/usr/bin/env python3
    """splat-lab g2 · compatibility patches for the DiffSplat checkout (idempotent).

    Only three edits, all import-graph surgery so the SD1.5 text-to-splat path can be imported
    without the training/evaluation stack. Nothing here changes numerics.

    1. `src/utils/__init__.py`  - upstream re-exports `metrics` (needs the `image-reward` +
       `kiui.lpips` packages) and `vis_util` (needs `wandb`). The modules we import need exactly
       `plucker_ray`/`unproject_depth` (geo_util), `patchify`/`unpatchify` (op_util) and
       `IMAGENET_MEAN`/`IMAGENET_STD` (defined in vis_util; copied verbatim here instead).
    2. `extensions/diffusers_diffsplat/{__init__,models/__init__,pipelines/__init__}.py` - keep the
       SD1.5 UNet + pipeline only, so the SDXL / PixArt / SD3 / ControlNet variants (and their
       T5/GPT/extra-diffusers imports) are never touched.
    3. `diff_gaussian_rasterization` stub - the CUDA rasterizer is only used for preview renders;
       the .ply export does not need it. A stub module keeps `src/models/gs_render/gs_util.py`'s
       top-level import satisfiable when the sm_61 build is not available. If the real extension is
       importable, nothing is written.

    Every replaced file is kept once as `<file>.upstream` for diffing.
    """
    from __future__ import annotations

    import os
    import sys

    UTILS_INIT = '''# patched by tools/splats/g2/job/apply_patches.py (splat-lab g2): inference-only subset.
    # Upstream also re-exports metrics (image-reward), vis_util (wandb) and util (omegaconf);
    # none of them are on the text->splat path, see the module docstring of the patch script.
    from src.utils.geo_util import *  # noqa: F401,F403  (orbit_camera, plucker_ray, unproject_depth, ...)
    from src.utils.op_util import patchify, unpatchify

    # copied verbatim from src/utils/vis_util.py
    IMAGENET_MEAN = [0.485, 0.456, 0.406]
    IMAGENET_STD = [0.229, 0.224, 0.225]
    '''

    EXT_INIT = '''# patched by tools/splats/g2/job/apply_patches.py (splat-lab g2): SD1.5 subset only.
    from .models.unets import UNetMV2DConditionModel  # noqa: F401
    from .pipelines.pipeline_mv_stable_diffusion import StableMVDiffusionPipeline  # noqa: F401
    '''

    MODELS_INIT = '''# patched by tools/splats/g2/job/apply_patches.py (splat-lab g2): SD1.5 subset only.
    from .unets import UNetMV2DConditionModel  # noqa: F401
    '''

    PIPELINES_INIT = '''# patched by tools/splats/g2/job/apply_patches.py (splat-lab g2): SD1.5 subset only.
    from .pipeline_mv_stable_diffusion import StableMVDiffusionPipeline  # noqa: F401
    '''

    STUB = '''"""splat-lab g2 stub of the 3DGS CUDA rasterizer (RaDe-GS fork).

    Written by tools/splats/g2/job/apply_patches.py when the sm_61 build of
    diff-gaussian-rasterization is unavailable. It satisfies the import in
    src/models/gs_render/gs_util.py so that Gaussian *export* works; calling it raises, so the
    optional verification contact sheet is skipped and recorded as such in metrics.json.
    """
    from typing import NamedTuple


    class GaussianRasterizationSettings(NamedTuple):
        image_height: int = 0
        image_width: int = 0
        tanfovx: float = 0.0
        tanfovy: float = 0.0
        kernel_size: float = 0.0
        bg: object = None
        scale_modifier: float = 1.0
        viewmatrix: object = None
        projmatrix: object = None
        sh_degree: int = 0
        campos: object = None
        prefiltered: bool = False
        debug: bool = False
        require_depth: bool = False
        require_coord: bool = False


    class GaussianRasterizer:
        def __init__(self, raster_settings=None):
            self.raster_settings = raster_settings

        def __call__(self, *args, **kwargs):
            raise NotImplementedError(
                "diff_gaussian_rasterization is a stub in this Job: the sm_61 build of the RaDe-GS "
                "fork was not available. Splat export does not need it; only preview renders do."
            )

        def sample(self, *args, **kwargs):
            raise NotImplementedError("stub rasterizer: sample() is training-only")
    '''


    def write(path: str, content: str, root: str) -> bool:
        """Write `content` to `path` unless it already matches; keep the original once."""
        full = os.path.join(root, path)
        if not os.path.isdir(os.path.dirname(full)):
            print(f"  ! missing directory for {path}")
            return False
        original = os.path.join(root, path + ".upstream")
        if os.path.exists(full) and not os.path.exists(original):
            with open(full, "rb") as fh:
                data = fh.read()
            with open(original, "wb") as fh:
                fh.write(data)
        if os.path.exists(full):
            with open(full, "r", encoding="utf-8") as fh:
                if fh.read() == content:
                    print(f"  = {path} (already patched)")
                    return False
        with open(full, "w", encoding="utf-8") as fh:
            fh.write(content)
        print(f"  + {path}")
        return True


    def main() -> int:
        repo = sys.argv[1] if len(sys.argv) > 1 else "/data/cache/repo/DiffSplat"
        print(f"patching {repo}")
        changed = 0
        for path, content in {
            "src/utils/__init__.py": UTILS_INIT,
            "extensions/diffusers_diffsplat/__init__.py": EXT_INIT,
            "extensions/diffusers_diffsplat/models/__init__.py": MODELS_INIT,
            "extensions/diffusers_diffsplat/pipelines/__init__.py": PIPELINES_INIT,
        }.items():
            changed += int(write(path, content, repo))

        # stub rasterizer, only if the real extension is not importable and not already installed
        try:
            import diff_gaussian_rasterization  # noqa: F401
            print("  - diff_gaussian_rasterization importable: no stub")
        except Exception:
            stub_dir = os.environ.get("G2_STUB_DIR", "/data/cache/g2/stub")
            pkg = os.path.join(stub_dir, "diff_gaussian_rasterization")
            os.makedirs(pkg, exist_ok=True)
            with open(os.path.join(pkg, "__init__.py"), "w", encoding="utf-8") as fh:
                fh.write(STUB)
            print(f"  + stub diff_gaussian_rasterization -> {pkg}")
        print(f"patches applied: {changed}")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
  setup.sh: |
    #!/usr/bin/env bash
    # splat-lab g2 · Job environment preparation (DiffSplat / SD1.5 variant on a Pascal GTX 1070).
    #
    # Everything expensive is cached on the splat-lab-data PVC under /data/cache/g2 so a re-run of
    # the Job costs model-load + inference, not download + compile:
    #   /data/cache/venv-g2            venv (--system-site-packages: torch/torchvision/cuDNN from
    #                                  the pytorch image; our pins layered on top)
    #   /data/cache/repo/DiffSplat     pinned checkout, patched
    #   /data/cache/repo/RaDe-GS       source of the 3DGS rasterizer fork DiffSplat uses
    #   /data/cache/g2/wheels          the diff_gaussian_rasterization wheel built for sm_61
    #   /data/cache/ckpt/DiffSplat     HF weights (DiffSplat SD1.5 UNet-EMA + GSVAE)
    #   /data/cache/hf                 HF hub cache (SD1.5 text encoder/VAE/tokenizer/scheduler, taesd)
    #   /data/cache/pip                pip wheel cache
    #
    # Not run locally on purpose: this box has no GPU. See tools/splats/g2/README.md.
    set -uo pipefail

    : "${OUT:=/data/out/diffsplat-1}"
    CACHE=/data/cache
    VENV=$CACHE/venv-g2
    REPO=$CACHE/repo/DiffSplat
    RADEGS=$CACHE/repo/RaDe-GS
    G2=$CACHE/g2
    WHEELS=$G2/wheels
    CKPT=$CACHE/ckpt/DiffSplat
    STUB=$G2/stub

    DIFFSPLAT_COMMIT=a99d75707541009283bc5c073f1a07b5add41d00   # main, 2026-03-19 ("minor")
    RADEGS_COMMIT=d72f20792005ae1d6555a82aa2d15345f247604e      # main, RaDe-GS (rasterizer fork)
    # (the same pins live in job/fetch_sources.py, which does the fetching)

    mkdir -p "$OUT" "$G2" "$WHEELS" "$STUB" "$CACHE/repo" "$CKPT" "$CACHE/hf" "$CACHE/pip"
    exec > >(tee -a "$OUT/setup.log") 2>&1
    say() { echo "[setup $(date +%H:%M:%S)] $*"; }

    say "=== 0. node / image ==============================================="
    date -u
    python -V
    nvcc --version | tail -2 || echo "no nvcc (runtime image?)"
    nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv || say "nvidia-smi failed"
    python - <<'PY'
    import torch
    print("torch", torch.__version__, "cuda", torch.version.cuda, "avail", torch.cuda.is_available())
    print("arch list", torch.cuda.get_arch_list())
    print("capability", torch.cuda.get_device_capability(0), "name", torch.cuda.get_device_name(0))
    print("bf16 supported", torch.cuda.is_bf16_supported())
    PY

    say "=== 1. venv (cached) ==============================================="
    REQ_HASH=$(sha256sum /scripts/requirements.txt | cut -c1-12)
    PYV=$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
    MARK=$G2/venv-$REQ_HASH-py$PYV.ok
    if [[ ! -f $MARK ]]; then
      say "creating venv (requirements hash $REQ_HASH, python $PYV)"
      rm -rf "$VENV"
      python -m venv --system-site-packages "$VENV"
      "$VENV/bin/python" -m pip install -q --upgrade pip
      PIP_CACHE_DIR=$CACHE/pip "$VENV/bin/python" -m pip install -q -r /scripts/requirements.txt
      touch "$MARK"
    else
      say "venv cache hit ($MARK)"
      PIP_CACHE_DIR=$CACHE/pip "$VENV/bin/python" -m pip install -q -r /scripts/requirements.txt
    fi
    "$VENV/bin/python" -m pip freeze | sort > "$OUT/pip-freeze.txt"
    say "venv python: $VENV/bin/python ($($VENV/bin/python -V 2>&1))"
    head -1 "$OUT/pip-freeze.txt" >/dev/null && say "pip freeze -> $OUT/pip-freeze.txt"

    say "=== 2. sources (pinned, no git in this image) ===================="
    # The pytorch devel image ships no `git`, so the pinned trees come from GitHub's codeload
    # archives via job/fetch_sources.py (urllib + tarfile, cached under /data/cache/g2/dl).
    "$VENV/bin/python" /scripts/fetch_sources.py || say "source fetch reported failures (continuing; the run step will fail loudly if DiffSplat is missing)"
    RASTER_SRC=$RADEGS/submodules/diff-gaussian-rasterization
    say "DiffSplat commit: $(cat "$REPO/.source-sha" 2>/dev/null || echo MISSING)"
    say "rasterizer source: $(ls "$RASTER_SRC" 2>/dev/null | tr '\n' ' ' || echo MISSING)"
    if [[ -d "$RASTER_SRC/third_party/glm/glm" ]]; then
      say "glm headers: $(find "$RASTER_SRC/third_party/glm" -name '*.hpp' | wc -l) .hpp + $(find "$RASTER_SRC/third_party/glm" -name '*.inl' | wc -l) .inl files"
    else
      say "glm headers MISSING (rasterizer build will fail)"
    fi

    say "=== 3. patches ====================================================="
    G2_STUB_DIR=$STUB "$VENV/bin/python" /scripts/apply_patches.py "$REPO"

    say "=== 4. rasterizer for sm_61 ========================================="
    export TORCH_CUDA_ARCH_LIST="6.1"
    RASTER_STATUS=$G2/rasterizer.txt
    existing=$(ls "$WHEELS"/diff_gaussian_rasterization-*.whl 2>/dev/null | head -1)
    if [[ -z $existing ]]; then
      say "building diff_gaussian_rasterization for TORCH_CUDA_ARCH_LIST=$TORCH_CUDA_ARCH_LIST (slow step, capped at 30 min)"
      build_log=$G2/rasterizer-build.log
      if TMPDIR=$G2 PIP_CACHE_DIR=$CACHE/pip MAX_JOBS=4 timeout 1800 \
           "$VENV/bin/python" -m pip wheel --no-deps -w "$WHEELS" "$RASTER_SRC" > "$build_log" 2>&1; then
        say "build ok"
      else
        say "build FAILED/TIMED OUT - last 40 lines of $build_log:"
        tail -40 "$build_log"
        rm -f "$WHEELS"/diff_gaussian_rasterization-*.whl
      fi
      existing=$(ls "$WHEELS"/diff_gaussian_rasterization-*.whl 2>/dev/null | head -1)
    fi
    if [[ -n $existing ]]; then
      say "installing $existing"
      "$VENV/bin/python" -m pip install -q --no-deps --force-reinstall "$existing" || true
    fi
    # Does the *compiled* extension import (it must also load on sm_61, not just exist)?
    # The stub lives outside site-packages, so it is only ever visible through PYTHONPATH -
    # never add it unconditionally, it would shadow the real build.
    if "$VENV/bin/python" -c 'import sys, diff_gaussian_rasterization as d; sys.exit(0 if hasattr(d, "_C") else 1)' 2>/dev/null; then
      echo real > "$RASTER_STATUS"
      "$VENV/bin/python" -c 'import torch, diff_gaussian_rasterization as d; print("rasterizer loaded from", d.__file__)' || true
    else
      echo stub > "$RASTER_STATUS"
    fi
    say "rasterizer status: $(cat "$RASTER_STATUS" 2>/dev/null || echo unknown)"
    cat > $G2/run.env <<EOF
    export G2_VENV=$VENV
    export G2_PYTHON=$VENV/bin/python
    export DIFFSPLAT_REPO=$REPO
    export DIFFSPLAT_CKPT=$CKPT
    EOF
    if [[ $(cat "$RASTER_STATUS") == stub ]]; then
      echo "export PYTHONPATH=$STUB" >> $G2/run.env
      say "stub rasterizer will be on PYTHONPATH (no preview sheets)"
    fi

    say "=== 5. weights (cached) ============================================"
    # DiffSplat SD1.5 text-conditioned UNet-EMA (3.28 GB fp32) + GSVAE (SD) (324 MB).
    # GSRecon (160 MB) is deliberately NOT downloaded: the upstream README says only its rendering
    # function is used at inference, and run.py calls that math itself.
    HF_HOME=$CACHE/hf "$VENV/bin/python" - <<'PY'
    import os, time
    from huggingface_hub import snapshot_download
    t = time.time()
    for pat in ["gsdiff_gobj83k_sd15__render/*", "gsvae_gobj265k_sd/*"]:
        p = snapshot_download(repo_id="chenguolin/DiffSplat", local_dir="/data/cache/ckpt/DiffSplat",
                             allow_patterns=[pat])
        print("cached", pat, "->", p)
    print(f"weights ready in {time.time()-t:.1f}s")
    PY
    du -sh "$CKPT" "$CACHE/hf" 2>/dev/null

    say "=== 6. import check ================================================"
    . $G2/run.env
