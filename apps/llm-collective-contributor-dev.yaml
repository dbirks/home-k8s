# LLM Collective contributor — DEV gateway.
#
# Same machine and same models as apps/llm-collective-contributor.yaml (which
# serves the prod collective), but pointed at the dev gateway
# https://llm-collective.dev.e-gineering.com so main-branch builds can be
# exercised end to end (tiles, stats, graphs, leaderboard) against real home
# hardware before a release is tagged.
#
# Identity: reuses the prod contributor's key pair
# (secret llm-collective-contributor-identity), so the gateway sees the same
# machine. The public key must be registered once in the DEV gateway's UI
# (Contribute page) under your dev login — auto-enroll is not a thing. Read
# the key value from the contributor pod's startup log (it prints it) or the
# prod gateway's Nodes page. Until it's registered the pod starts and retries
# with "waiting for key registration".
#
# Image channel differs from the prod contributor: dev tracks the newest
# <short-sha>-<epoch> tag that CI publishes on every push to llm-collective
# main ("merging is deploying"), ordered by the numeric epoch — the same
# convention the shepherd policies above use. The repo-wide
# ImageUpdateAutomation (apps/shepherd-image-automation.yaml) bumps the
# marker-tagged image line below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-collective-contributor-dev-config
  namespace: default
data:
  contributor.yaml: |
    version: 1
    machine:
      name: home-k8s
    collective:
      gateway: https://llm-collective.dev.e-gineering.com
    metrics:
      listen: 127.0.0.1:9091
    backends:
      # Qwen3.8-27B on NInfer, Sept build (ghcr.io/dbirks/ninfer:20260908, v2 artifact), NVFP4 weights + NVFP4 KV, #156.
      # 1.25M-token shared KV pool (with --vision), 262,144 ctx per request, 8 engine lanes (excess queues; 32 pending).
      # Dev shares the same 8 lanes as prod; kept small so it can't starve prod.
      # /v1/chat/completions and /v1/messages both verified 2026-10-16 (thinking blocks on /v1/messages).
      - name: ninfer
        url: http://ninfer.default.svc.cluster.local:8000
        protocols: [openai, anthropic]
        concurrency: 2
        models:
          - alias: qwen3-8-27b
            model: qwen3.8-27b-ninfer
            limits:
              context: 262144
            # Probed live 2026-10-17: the artifact template accepts xhigh (its default), medium and low;
            # `none` is the engine's thinking-off switch. minimal/high/max are rejected with a 400.
            reasoning:
              levels:
                - none
                - low
                - medium
                - xhigh
            # --vision on since 2026-10-17 (data-URI image verified). Video parts also work engine-side;
            # the Collective has no video input type, so they ride under image.
            inputs: [text, image]
      # PARKED 2026-10-16 (#156): Pennyroyal at replicas 0. Rollback = uncomment, drop ninfer above.
      # - name: pennyroyal
      #   url: http://pennyroyal-flashnext.default.svc.cluster.local:8001
      #   protocols: [openai, anthropic]
      #   concurrency: 4
      #   models:
      #     - alias: qwen3-8-flash-next
      #       model: pennyroyal
      #       # Same declarations as the prod contributor (see its header notes).
      #       limits:
      #         context: 524288
      #       reasoning:
      #         levels:
      #           - none
      #           - minimal
      #           - low
      #           - medium
      #           - high
      #           - xhigh
      #           - max
      #       # Pennyroyal runs the multimodal Flash-Next build: sglang encodes
      #       # image parts (verified against the dev gateway on 2026-10-03).
      #       # Declaring it earns the VISION chip and lets the gateway route
      #       # image traffic here instead of rejecting it with a 400.
      #       inputs: [text, image]
      # The typed doors: the same backends and concurrency values as the prod
      # contributor (they are engine-side limits — single-flight ASR, TTS talker
      # KV, one decision at a time — not traffic budgets), so the transcription,
      # speech and decision doors can be exercised on dev against real hardware.
      # CLEF-Omni AutoRound INT4, Cloudflare's System One decision model, POST /v1/systemone only.
      # Warm ~0.21 s, deterministic; the first call after a restart is a ~13 s warm-up.
      - name: clef
        url: http://clef-omni-systemone.default.svc.cluster.local:8000
        protocols: [openai]
        concurrency: 1
        models:
          - alias: clef-omni
            model: clef-omni
            types: [decision]
      # Qwen3-TTS 1.7B on vLLM-Omni v0.30.0, POST /v1/audio/speech only.
      # Talker KV holds ~1.7 full 4,096-token requests; TTS requests are short, so 4 each.
      - name: qwen3-tts-voicedesign
        url: http://qwen3-tts-voicedesign.default.svc.cluster.local:8000
        protocols: [openai]
        concurrency: 4
        models:
          - alias: qwen3-tts-voicedesign
            model: qwen3-tts-voicedesign
            types: [speech]
      - name: qwen3-tts-base
        url: http://qwen3-tts-base.default.svc.cluster.local:8000
        protocols: [openai]
        concurrency: 4
        models:
          - alias: qwen3-tts-base
            model: qwen3-tts-base
            types: [speech]
      # Qwen3-ASR 1.7B Q6_K, speech.cpp on dave-droid's GTX 1070 (apps/qwen3-asr.yaml).
      # speech serve is single-flight; the backend id is `Qwen3-ASR-1.7B` (its own /v1/models).
      - name: qwen3-asr
        url: http://qwen3-asr.default.svc.cluster.local:8001
        protocols: [openai]
        concurrency: 1
        models:
          - alias: qwen3-asr-1-7b
            model: Qwen3-ASR-1.7B
            types: [transcription]
            inputs: [audio]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-collective-contributor-dev
  namespace: default
  labels:
    app.kubernetes.io/name: llm-collective-contributor-dev
    llm-collective.e-gineering.com/env: dev
  annotations:
    reloader.stakater.com/auto: "true" # roll when the dev contributor ConfigMap changes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-collective-contributor-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-collective-contributor-dev
    spec:
      containers:
        - name: contributor
          image: ghcr.io/e-gineering/llm-collective/contributor:de2f2c4-1792517320 # {"$imagepolicy": "flux-system:llm-collective-contributor-dev"}
          env:
            - {name: KEY_FILE, value: /etc/collective-key/identity.key}
            - {name: PUBKEY_OUT, value: ""}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/collective}
            - {name: identity, mountPath: /etc/collective-key, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: llm-collective-contributor-dev-config
        - name: identity
          secret:
            secretName: llm-collective-contributor-identity
---
# Dev channel: newest <short-sha>-<epoch> contributor image wins (numeric
# epoch order), mirroring the company dev gateway's ImagePolicy.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: llm-collective-contributor-dev
  namespace: flux-system
spec:
  image: ghcr.io/e-gineering/llm-collective/contributor
  interval: 2m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: llm-collective-contributor-dev
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: llm-collective-contributor-dev
  filterTags:
    pattern: '^[a-f0-9]+-(?P<ts>[0-9]+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
