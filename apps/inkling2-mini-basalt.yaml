# inkling-2-mini on Basalt (github.com/jesdga95/basalt, MIT): a C++ engine for Blackwell sm_120 with its own Inkling 2
# Mini path (DSpark drafting, FP8 KV, image input). Laptop RTX 5090 over Thunderbolt (talos-8me-tcy). LIVE since
# 2026-11-22, replacing apps/inkling2-mini-vllm.yaml (parked at 0, the rollback). Both carry
# app.kubernetes.io/name: inkling-2-mini so the shared Service there routes to whichever runs. Run ONE at a time.
# ============================================================================================
# Image: ghcr.io/dbirks/basalt:main-8667cc8a = Basalt built FROM SOURCE at upstream commit
#   8667cc8abd68c2e9a7053bea2984b54e67799bca (build/basalt-src/, .github/workflows/build-basalt-src.yaml), on
#   nvidia/cuda:13.0.2-runtime to match the laptop's R580 (580.178) driver — not upstream's CUDA 13.4.3 default, whose
#   runtime that driver branch will not load. inkling2-only build (BASALT_MODELS=inkling2): this image serves nothing
#   else and the all-models build is most of the compile time. We take main for fixes no tag has yet: the Inkling
#   tool-call parser (#540, 433ce65: calls written as XML / with no header come back as tool_calls, not raw text),
#   --vision dynamic holding no VRAM at rest (#541, the 1.37 GiB that the docs already promised back), prompt prefill
#   (#555 +20-22%, #575 native MXFP8 layers 20-23), and Inkling prompt-lookup suffix drafts (--suffix-draft, default
#   on). Upstream bills the decode movement as +2-3%.
#   build/basalt + .github/workflows/build-basalt.yaml (release archive, ghcr tag <release>) REMAIN the release path:
#   when upstream tags these fixes, move back to the archive tag and rebuild this one off a tag, not off main.
#   `--gpu 0` below is accepted at this commit (serve/config.py declares --gpu; check_gpu/parse_gpu_spec read "0" as a
#   one-card list) and is a no-op here: with unset or one number the engine narrows CUDA_VISIBLE_DEVICES to that one
#   card either way. Upstream #567's "CUDA sees 0 of the 1 GPUs chosen" is an environment-specific runtime failure on
#   that path, still open and unfixed at 8667cc8a — if the pod dies at GPU selection, dropping the --gpu 0 pair is the
#   first thing to try, and it costs nothing on a single-card node.
# Pack: apps/inkling2-mini-basalt-weights.yaml (Inkling-2-Mini-NVFP4-q8.basalt, 19.7 GB): the release's NVFP4 experts
#   bit for bit, layers 20-23 + projections Q8_0, vision + DSpark drafter. Upstream: KLD 0.00305 vs the release.
#
# Measured on the LIVE config (main-8667cc8a + the V3 conversation cache below), harness
#   .agents/skills/inkling2-mini/scripts/inkling_eval.py, temp 1.0, ranges = repeated runs (run-to-run variance at
#   temp 1.0 is ~+-20%; compare medians of 2-3 runs): prose 173-190 tok/s 1 stream (agg 2 streams 337-350), code
#   210-275 (agg 400-452); temp 0 code ~400 / prose ~312; 20/20 arithmetic. 23K prompt 1.57 s cold, 0.17 s on a
#   same-session prefix hit, 0.07 s resending the same conversation in a BRAND-NEW session (cross-session prefix
#   reuse works here; on v0.5.5 that resend was a 2.07 s re-read). Send x-session-id for slot affinity.
#   Tool calls 70-90% valid at temp 1.0, 85% at temp 0 (the temp-0 misses are the open upstream reasoning-loop issue
#   #577 — empty or truncated replies — not the parser). Effort sweep, N=30 at temp 1.0: low 63% / medium 80% /
#   high 73% -> keep --reasoning-effort medium. Remaining misses are model-side, not parser-side: bare JSON (a
#   name/args object, or just the args) with no content_invoke_tool_json marker — a parser could recover these — a
#   lone thinking or tool-call marker with no call, or prose like "I'll make the edit" with no call.
#   V3 conversation cache (the --conversation-cache-* flags below; off by default at this commit): park test = 3
#   conversations through 2 slots, then return to the first two. 20K tokens: cold 1.5-2.2 s -> return 0.65-0.95 s
#   (2.3-3.4x), engine restores 24K tokens in ~250 ms. 100K tokens: cold 11.5-15.1 s -> return 2.1-2.2 s (6.9-7.3x),
#   restore 119K tokens in ~980 ms. Cost: a cold prompt that forces an eviction is ~0.5 s slower at 20K (parking
#   writes); node still 15.9 GiB available with the pod at ~7.9 GiB; disk tier 2.9 GB after the tests. Speed, tools
#   and quality unchanged vs V1. KEPT.
#   V2 (--spec 4): a wash vs the default 8 (prose 177-190, code agg 419-452, temp-0 code 385 vs 404 = slightly worse);
#   Basalt's draft policy already sizes windows by expected tokens/ms. REVERTED. Live /slots accept_pos on agent
#   traffic ~[0.67, 0.65, 0.69, 0.75, 0.83, 1.0, 1.0].
# History. v0.5.5 (previous image, same harness): prose 137-144 (agg 256-269), code 176-213 (agg 345-391), temp 0 code
#   459 / prose 296, tool calls 57-67% at temp 1.0 and 95% at temp 0, 23K cold 2.05 s, prefix hit 0.17 s same-session
#   only, no cross-session reuse. Lab bench 2026-11-21/22 (short prompts, not comparable to the above): code ~310-330,
#   prose ~255 per session, 23.5K cold 2.7 s / hit 0.4 s, needle 250K PASS 46 s (5,510 tok/s prefill), both slots at
#   250K PASS 235 s at 75/136 tok/s. vLLM (NVFP4 KV) for comparison: prose ~151, code ~206-246, 570K needle ~300 s.
# Why 2 x 256K and not more: Basalt plans for the full --max-context and spills the least-routed experts to pinned RAM
#   when caches grow; over the eGPU's PCIe Gen3 x4 that collapses (2 x 512K: a 500K prompt took 24 min, 2.4 tok/s).
#   Alternatives measured (v0.5.5 image): 1 slot x 512K (--parallel 1): 500K needle 147 s, 104 tok/s, no spill; 1 x 576K
#   with vision off (that build pinned 1.37 GiB for the encoder): 570K needle 187 s, 89 tok/s. Full table: the
#   inkling2-mini skill. NOTE: on main that 1.37 GiB is gone anyway — --vision dynamic holds no VRAM at rest (#541) —
#   so switching vision off no longer buys context; extra room has to come from --max-context.
#
# Flags and why:
#   --max-context 524288 --parallel 2   two slots of 262,144 each (Basalt splits max-context between slots).
#   --kv fp8                       E4M3 full-attention caches, 16 KiB/token (fp16 is 32). Window layers are fixed rings.
#   Conversation cache (V3, off by default at this commit): with 2 slots, a third conversation evicts a slot's K/V; these
#   flags park the evicted conversation in RAM, then on disk, and restore it instead of re-reading the prompt.
#     --conversation-cache-mib 4096        RAM budget for parked conversations (default 0 = off). The node has ~14 GiB
#                                          free and the pod sits at ~9.4 GiB of its 24Gi limit, so 4 GiB of parking room.
#     --conversation-cache-slots 8         most parked conversations (default 4); 3 live users + the eval's A/B/C fit.
#     --conversation-cache-min-free-mib 4096  keep 4 GiB of physical RAM free while parking (default 2560) — the laptop
#                                          has no swap and a 6144 guard already once starved requests (see --ram-reserve).
#     --conversation-cache-disk-mib 65536  disk tier 64 GiB in ~/.cache/basalt/conversations = /data/... (default 0 =
#                                          off). Only the system prompt + last three turns are stored, files are
#                                          hash-checked, LRU-capped by the budget, and every write leaves 4 GiB of the
#                                          volume free, so the tier tops out near 60 GiB inside the 80 GiB mount.
#     --conversation-cache-min-tokens 4096 park only conversations >= 4K tokens (default 0): a short chat's K/V is cheaper
#                                          to re-read than to copy out and back over the eGPU link.
#   The disk tier lives in the /data emptyDir (80 GiB = 64 GiB tier + engine log + the 4 GiB a write keeps free), so it is
#   LOST on pod restart — fine for now; a PVC on the laptop's NVMe is the follow-up if V3 earns its keep.
#   --vision dynamic               the engine's own image encoder.
#   --reasoning-effort medium      default when a request names none (the template's own default is high).
#   --ram-reserve-mib 2048         host RAM the engine keeps free (its default). It holds a full RAM copy of the experts
#                                  (~14.4 GiB pinned) even when they sit on the card, leaving ~5.6 GiB free on the
#                                  laptop; a 6144 guard made EVERY request wait 30 s ("RAM low ... waits up to 30 s").
#   --allowed-host                 Basalt checks the Host header; the Collective calls the Service DNS name.
#   CUDA_DISABLE_CONTROL=true      HAMi's in-container allocator cap passthrough (only GPU tenant on the laptop).
# ============================================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inkling-2-mini-basalt
  namespace: default
  labels:
    app.kubernetes.io/name: inkling-2-mini
spec:
  replicas: 1                     # LIVE 2026-11-22 (Strata lab 2026-11-22 lost on every axis: apps/inkling2-mini-strata.yaml.hold)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inkling-2-mini
      app.kubernetes.io/component: basalt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inkling-2-mini
        app.kubernetes.io/component: basalt
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false
      nodeSelector: { home-k8s/egpu: rtx5090 }
      terminationGracePeriodSeconds: 60
      containers:
        - name: main
          # 2026-11-24: Basalt 0.5.7 built from the v0.5.7 tag (build-basalt-src.yaml, tag v0.5.7-src). Rollback image:
          #   main-8667cc8a@sha256:de0bba48caaa600d8044eb8e9b88ecc260a049f11d9b9387af365c0c70d8ee52 (needs the q8 pack).
          # A/B on the q8 pack at 575 W: 0.5.7 = old main within noise (code t0 430, prose t0 328, 247K decode 159 tok/s).
          # REJECTED main-3ce7d52e (0.5.7 + #626 Inkling MMA decode kernel): no gain at 172K/247K (186/157 vs 190/159),
          #   short-context t0 code/prose 8-10% slower (388/300), drafts accepted 39-41% vs 56-60% (FP16 MMA rounding).
          image: ghcr.io/dbirks/basalt:v0.5.7-src@sha256:bddee8e6cec806109046cfcfee33a256b4beb10b5502e9b066d985abf3c2b1a2
          args:
            - "/models/Inkling-2-Mini-NVFP4-MX8.basalt"
            - "--alias"
            - "inkling-2-mini"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--allowed-host"
            - "inkling-2-mini.default.svc.cluster.local"
            - "--allowed-host"
            - "inkling-2-mini"
            - "--gpu"
            - "0"
            - "--max-context"
            - "524288"
            - "--parallel"
            - "2"
            - "--kv"
            - "fp8"
            - "--conversation-cache-mib"
            - "4096"
            - "--conversation-cache-slots"
            - "8"
            - "--conversation-cache-min-free-mib"
            - "4096"
            - "--conversation-cache-disk-mib"
            - "65536"
            - "--conversation-cache-min-tokens"
            - "4096"
            - "--vision"
            - "dynamic"
            - "--reasoning-effort"
            - "medium"
            - "--ram-reserve-mib"
            - "2048"
          env:
            - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
            - { name: CUDA_DISABLE_CONTROL, value: "true" }
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits: { nvidia.com/gpu: "1", nvidia.com/gpumem-percentage: "100", cpu: "6", memory: 24Gi }
            requests: { cpu: "2", memory: 6Gi }
          volumeMounts:
            - { name: pack, mountPath: /models, readOnly: true }
            - { name: home, mountPath: /data }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: pack
          persistentVolumeClaim:
            claimName: inkling2-mini-basalt-pack-mx8   # apps/inkling2-mini-basalt-mx8-pack.yaml; old q8 = inkling2-mini-basalt-pack
            readOnly: true
        - name: home
          emptyDir: { sizeLimit: 80Gi }   # V3: /data holds the conversation-cache disk tier (64 GiB budget + log + the 4 GiB a write keeps free); emptyDir = gone on pod restart
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
