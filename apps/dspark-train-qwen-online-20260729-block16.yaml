# DSpark Qwen3.6-27B — ONLINE training, BLOCK-16 fresh-init "beat 4.29" run
# STAGED as .yaml.hold (Flux ignores). Un-hold + reconcile ONLY after the regen
# job finishes (dspark-dataset-hdd:/dataset/onpolicy-broad-v2/regen.done present)
# AND the GPU is free (regen pod gone). See #60 (recipe) / #66-adjacent data-scale.
#
# Basis: the validated gate run (dspark-train-qwen-online-20260726.yaml) that
# trained cleanly to real accept_len 1.45 (data-limited). This run changes the
# TWO levers we diagnosed as the gap to z-lab's 4.29, and NOTHING else:
#   1. --block-size 7 -> 16   (z-lab DFlash trains block-16)
#   2. data ~6k -> ~32k       (onpolicy-broad-v2: opc(kept)+ts+gsm8k+magpie+ultrachat @ 8192)
# KEPT PROVEN (isolate the levers): num-layers 3, verifier gpu-mem 0.30
# coexistence, target-layer-ids 1/16/31/46/61, markov(rank256)+confidence heads,
# loss {ce0.1,tv0.9}, adamw lr6e-4 cosine+warmup, dflash-decay-gamma 4.0,
# --draft-attn-impl eager (SM120, no source patches), total-seq-len 4096.
# NEXT-STEP KNOBS if this improves but stalls short of 4.29 (documented, not now):
#   - num-layers 3 -> 5 (z-lab-parity backbone for block-16; more trainer VRAM)
#   - total-seq-len 4096 -> 8192 (use the full 8192 regen; more VRAM, tighter coexist)
# Epochs 4 -> 3 (dataset is ~5x bigger, so fewer passes for similar total signal).
# Phase-0 regen REMOVED (data is pre-generated by the regen job); asserts it exists.
# gpu-clock-lock initContainer REMOVED (apps/gpu-power-limit.yaml DaemonSet now
# holds 600W persistently; the old initContainer forced 400W and would fight it).
# Runtime is long: ~32k samples x 3 epochs ONLINE (verifier re-streams hidden
# states every epoch) — plan ~12-24h. Resumable via checkpoint-freq.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dspark-qwen-online-block16-script
  namespace: default
data:
  train.sh: |
    #!/bin/bash
    set -euo pipefail
    export HF_HOME=/data
    export CUDA_VISIBLE_DEVICES=0
    export HF_HUB_ENABLE_HF_TRANSFER=1
    export TOKENIZERS_PARALLELISM=false

    echo "=== [$(date)] Qwen3.6-27B DSpark ONLINE block-16 run ==="

    apt-get update -qq 2>&1 | tail -2
    apt-get install -y git --no-install-recommends -qq
    pip install uv --quiet --root-user-action ignore
    export PATH="/root/.local/bin:$PATH"; hash -r

    git clone https://github.com/dbirks/speculators /tmp/spec
    git -C /tmp/spec checkout 188a7b37919211749404d420271f3fdbc14924a6
    echo "speculators @ $(git -C /tmp/spec rev-parse --short HEAD)"
    SCRIPTS=/tmp/spec/scripts
    uv pip install /tmp/spec hf_transfer aiohttp datasets tqdm --system --quiet

    MODEL=unsloth/Qwen3.6-27B-NVFP4
    DS=/dataset/onpolicy-broad-v2         # the LARGE regen dataset (~32k)
    PREP=/output/data-qwen-online-block16
    CKPT=/output/checkpoints-qwen-online-block16
    mkdir -p "$PREP" "$CKPT" /output/logs /dev/shm/hs

    # ---- assert the regen dataset is present (this job does NOT regenerate) ----
    if [ ! -f "$DS/regen.done" ] || [ ! -f "$DS/all.jsonl" ]; then
      echo "FATAL: $DS/{regen.done,all.jsonl} missing — regen not complete. Aborting."
      ls -la "$DS" 2>/dev/null || true; exit 1
    fi
    echo "[$(date)] dataset ready: $(wc -l < "$DS/all.jsonl") rows in all.jsonl"

    # ---------------- Prep (CPU; passthrough pre-tokenized on-policy rows) ----------------
    if [ ! -f "$PREP/token_freq.pt" ]; then
      # regen rows carry a heterogeneous `metadata` struct that breaks HF json
      # schema inference; passthrough only needs {input_ids, loss_mask}, so project down.
      echo "=== [$(date)] clean all.jsonl -> {input_ids, loss_mask} only ==="
      python3 -c "import json; src,dst='$DS/all.jsonl','$DS/all_clean.jsonl'; rows=(json.loads(l) for l in open(src) if l.strip()); good=[{'input_ids':d['input_ids'],'loss_mask':d['loss_mask']} for d in rows if 'input_ids' in d and 'loss_mask' in d]; f=open(dst,'w'); [f.write(json.dumps(r)+'\n') for r in good]; f.close(); print('cleaned rows:',len(good))"
      CLEAN=$(wc -l < "$DS/all_clean.jsonl")
      [ "$CLEAN" -lt 1000 ] && { echo "FATAL: only $CLEAN rows have input_ids/loss_mask — bad schema"; head -c 400 "$DS/all.jsonl"; exit 1; }
      echo "=== [$(date)] prepare_data (passthrough, seq-len 4096) ==="
      python3 "$SCRIPTS/prepare_data.py" --model "$MODEL" \
        --data "$DS/all_clean.jsonl" --output "$PREP" --seq-length 4096 \
        2>&1 | tee /output/logs/prepare_block16.log
      n=$(ls "$PREP"/*.arrow 2>/dev/null | wc -l)
      [ "$n" -eq 0 ] && { echo "FATAL: prep produced no arrow files"; tail -40 /output/logs/prepare_block16.log; exit 1; }
      echo "[$(date)] prep done: $n arrow files"
    else
      echo "[$(date)] prep skipped (token_freq.pt exists)"
    fi

    # ---------------- Online DSpark train (verifier served + HS streamed) ----------------
    # KV-connector is incompatible with expandable_segments (CUDA VMM remaps KV
    # pages) -> unset for the verifier serve; re-enable for the trainer.
    unset PYTORCH_CUDA_ALLOC_CONF
    echo "=== [$(date)] launch verifier for ONLINE extraction (coexist, gpu-mem 0.30) ==="
    python3 "$SCRIPTS/launch_vllm.py" "$MODEL" \
      --target-layer-ids 1 16 31 46 61 \
      --hidden-states-path /dev/shm/hs \
      -- \
      --host 127.0.0.1 --port 8001 --gpu-memory-utilization 0.22 \
      --max-model-len 4608 --dtype bfloat16 --trust-remote-code \
      --kv-cache-dtype fp8_e4m3 --mamba-cache-dtype float16 --mamba-ssm-cache-dtype float16 \
      --enforce-eager --max-num-seqs 4 \
      > /output/logs/online_vllm_block16.log 2>&1 &
    VP=$!; trap 'kill $VP 2>/dev/null; wait $VP 2>/dev/null' EXIT
    for i in $(seq 1 540); do
      curl -sf http://127.0.0.1:8001/health >/dev/null 2>&1 && break
      kill -0 $VP 2>/dev/null || { echo "verifier vLLM died:"; cat /output/logs/online_vllm_block16.log; exit 1; }
      sleep 10
    done
    echo "[$(date)] verifier healthy; starting online DSpark BLOCK-16 training"

    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    python3 "$SCRIPTS/train.py" \
      --verifier-name-or-path "$MODEL" \
      --speculator-type dspark \
      --data-path "$PREP" \
      --vllm-endpoint http://127.0.0.1:8001/v1 \
      --save-path "$CKPT" \
      --target-layer-ids 1 16 31 46 61 \
      --num-layers 3 --block-size 16 --max-anchors 320 --total-seq-len 4096 \
      --draft-attn-impl eager \
      --markov-rank 256 --markov-head-type vanilla \
      --enable-confidence-head --confidence-head-with-markov \
      --loss-fn '{"ce": 0.1, "tv": 0.9}' --confidence-head-alpha 1.0 \
      --optimizer adamw --weight-decay 0 --lr 6e-4 \
      --scheduler-type cosine --scheduler-warmup-ratio 0.04 --scheduler-num-cosine-cycles 0.5 \
      --dflash-decay-gamma 4.0 --per-position-loss-weight fixed-exp-decay \
      --epochs 3 --checkpoint-freq 0.5 \
      --on-missing generate --on-generate delete \
      --num-workers 2 --prefetch-factor 1 \
      2>&1 | tee /output/logs/train_block16.log

    kill $VP 2>/dev/null; wait $VP 2>/dev/null || true; trap - EXIT
    echo "=== [$(date)] BLOCK-16 training complete ==="
    ls -lh "$CKPT"/ || true
    echo "[$(date)] Next: real-vLLM eval (temp 1.0, k=15) of $CKPT/checkpoint_best vs the 4.29 reference."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dspark-train-qwen-online-20260729-block16
  namespace: default
spec:
  backoffLimit: 100
  activeDeadlineSeconds: 172800   # 48h (block-16 online on ~32k is long)
  template:
    spec:
      restartPolicy: OnFailure
      runtimeClassName: nvidia
      enableServiceLinks: false
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: trainer
          image: vllm/vllm-openai:v0.25.1   # proven for the gate train pipeline
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/train.sh"]
          env:
            - name: HF_HOME
              value: /data
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 32Gi
            requests:
              cpu: "4"
              memory: 32Gi
          volumeMounts:
            - name: models
              mountPath: /data
            - name: output
              mountPath: /output
            - name: dataset
              mountPath: /dataset
            - name: scripts
              mountPath: /scripts
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: output
          persistentVolumeClaim:
            claimName: dspark-output-hdd-v2
        - name: dataset
          persistentVolumeClaim:
            claimName: dspark-dataset-hdd
        - name: scripts
          configMap:
            name: dspark-qwen-online-block16-script
            defaultMode: 0755
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 24Gi
