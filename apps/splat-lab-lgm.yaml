    #!/usr/bin/env python3
    """splat-lab g1 self-test: does the vendored shim layer + LGM's code actually run?

    Runs with **random weights** on whichever device is available (the CPU on the workstation, the
    1070 inside the Job — `run.sh setup` calls it after installing the venv) and checks the plumbing
    around LGM, not model quality:

     1. the fake ``xformers`` agrees with an explicit softmax(QKᵀ/√d)V, in fp32 and fp16;
     2. ``kiui`` (vendored) reproduces LGM's camera/normalisation helpers;
     3. ``core.models.LGM`` imports with ``diff_gaussian_rasterization`` stubbed, builds, and
        ``prepare_default_rays`` + ``forward_gaussians`` + ``gs.save_ply`` produce a readable 3DGS
        .ply with the expected attribute list and 4·splat_size² Gaussians;
     4. the ``big`` U-Net channel plan agrees with the splat_size it claims (LGM reshapes the U-Net
        output with that number, so a wrong config fails here rather than in a 20-minute GPU run).

    A tiny config at a low resolution keeps this under a few seconds and ~400 MB; the real run uses
    `big` with the downloaded checkpoint (tools/splats/g1/lgm2ply.py).

        python3 tools/splats/g1/selftest.py            # CPU
        G1_VENDOR=... LGM_DIR=... python3 tools/splats/g1/selftest.py --device cuda
    """

    import argparse
    import os
    import sys
    import time

    VENDOR = os.environ.get("G1_VENDOR", os.path.join(os.path.dirname(os.path.abspath(__file__)), "vendor"))
    LGM_DIR = os.environ.get("LGM_DIR", "/tmp/LGM")
    for p in (VENDOR, LGM_DIR):
        if p not in sys.path:
            sys.path.insert(0, p)

    import numpy as np  # noqa: E402
    import torch  # noqa: E402
    import torch.nn.functional as F  # noqa: E402


    def check(label: str, ok: bool, detail: str = "") -> bool:
        print(f"[selftest] {'ok  ' if ok else 'FAIL'} {label} {detail}")
        return ok


    def test_xformers_shim() -> bool:
        import xformers  # vendored
        import xformers.ops as xops

        print(f"[selftest] xformers resolved to {os.path.dirname(xformers.__file__)} "
              f"({xformers.__version__})")
        ok = True
        torch.manual_seed(0)
        for dtype in (torch.float32, torch.float16):
            for shape in ((2, 6, 5, 8), (2, 3, 4, 5, 8)):  # 4-D [B,H,M,K] and 3-D [B,M,K]
                q, k, v = (torch.randn(*shape, dtype=dtype) * s for s in (1, 1, 1))
                out = xops.memory_efficient_attention(q, k, v, attn_bias=None)
                if q.dim() == 3:
                    q4, k4, v4 = (t.unsqueeze(1) for t in (q, k, v))
                else:
                    q4, k4, v4 = q, k, v
                ref = F.scaled_dot_product_attention(q4.float(), k4.float(), v4.float()).squeeze(1) \
                    if q.dim() == 3 else F.scaled_dot_product_attention(q4.float(), k4.float(), v4.float())
                err = (out.float() - ref.float()).abs().max().item()
                ok &= check(f"memory_efficient_attention {dtype} {tuple(shape)}",
                            bool(torch.isfinite(out.float()).all()) and err < 3e-2, f"max|Δ|={err:.2e}")
        # explicit reference, independent of SDPA
        B, H, M, K = 2, 3, 7, 8
        q, k, v = (torch.randn(B, H, M, K, dtype=torch.float32) for _ in range(3))
        ref = torch.softmax(q @ k.transpose(-1, -2) / K ** 0.5, dim=-1) @ v
        out = xops.memory_efficient_attention(q, k, v)
        ok &= check("matches softmax(QKᵀ/√d)V", (out - ref).abs().max().item() < 1e-4,
                    f"max|Δ|={(out - ref).abs().max().item():.2e}")
        # LGM's MemEffAttention reshapes to [B, N, 3, H, Dh] and unbinds dim 2 (no permute), so the
        # xformers call sees [B, N, H, Dh]. torch.unbind (and xformers.ops.unbind) give exactly that;
        # SDPA/xformers then interpret the dims positionally — matched by this shim, deliberately.
        qkv = torch.randn(B, M, 3, H, K)
        ok &= check("unbind(qkv, 2) -> 3 x [B, N, H, Dh]",
                    all(t.shape == (B, M, H, K) for t in xops.unbind(qkv, 2)))
        return bool(ok)


    def test_kiui() -> bool:
        import kiui
        from kiui.cam import orbit_camera
        from kiui.op import inverse_sigmoid, recenter, safe_normalize

        print(f"[selftest] kiui resolved to {os.path.dirname(kiui.__file__)} ({kiui.__version__})")
        ok = check("kiui importable as a package", hasattr(kiui, "op") and hasattr(kiui, "cam"))
        T = orbit_camera(0, 90, radius=1.5)
        ok &= check("orbit_camera(0,90).translation ≈ (+1.5, 0, 0)",
                    bool(np.allclose(T[:3, 3], [1.5, 0.0, 0.0], atol=1e-5)), f"{T[:3, 3]}")
        ok &= check("orbit_camera rotation is orthonormal",
                    bool(np.allclose(T[:3, :3].T @ T[:3, :3], np.eye(3), atol=1e-5)))
        T270 = orbit_camera(0, 270, radius=1.5)
        ok &= check("orbit_camera(0,270).translation ≈ (-1.5, 0, 0)",
                    bool(np.allclose(T270[:3, 3], [-1.5, 0.0, 0.0], atol=1e-5)), f"{T270[:3, 3]}")
        a = np.array([[3.0, 4.0]], dtype=np.float32)
        ok &= check("safe_normalize (numpy)", bool(np.allclose(safe_normalize(a), [[0.6, 0.8]], atol=1e-6)))
        x = torch.tensor([[0.25, 0.5, 0.9]])
        ok &= check("inverse_sigmoid round-trips sigmoid",
                    bool(torch.allclose(torch.sigmoid(inverse_sigmoid(x)), x, atol=1e-5)))
        img = np.zeros((64, 64, 4), np.float32)
        img[20:30, 40:50] = 1.0
        mask = img[..., 3] > 0
        out = recenter(img, mask, border_ratio=0.2)
        coords = np.nonzero(out[..., 3] > 0)
        h = coords[0].max() - coords[0].min()
        ok &= check("recenter keeps aspect and adds border", out.shape == (64, 64, 4) and h < 64 * 0.85,
                    f"shape={out.shape} bbox_h={h}")
        return bool(ok)


    def expected_splat_size(opt) -> int:
        """LGM reshapes the U-Net output to opt.splat_size; the ratio comes from the level counts."""
        downs = len(opt.down_channels) - 1
        ups = len(opt.up_channels) - 1
        return opt.input_size // 2 ** (downs - ups)


    def _cpu_renderer_init_fallback():
        """`core.gs.GaussianRenderer.__init__` hard-codes device='cuda' for a 3-element constant.

        Only for the CPU self-test (this workstation has no GPU); inside the Job the upstream
        version runs untouched. The body below is the same 8 lines with the device taken from torch's
        default — nothing that affects save_ply is changed.
        """
        import core.gs as gs

        original = gs.GaussianRenderer.__init__

        def init(self, opt):
            try:
                original(self, opt)
                return
            except RuntimeError as e:  # no driver on this box
                print(f"[selftest] GaussianRenderer.__init__ needs CUDA ({e}); CPU stand-in only")
            self.opt = opt
            self.bg_color = torch.tensor([1, 1, 1], dtype=torch.float32)
            self.tan_half_fov = np.tan(0.5 * np.deg2rad(opt.fovy))
            self.proj_matrix = torch.zeros(4, 4, dtype=torch.float32)
            self.proj_matrix[0, 0] = 1 / self.tan_half_fov
            self.proj_matrix[1, 1] = 1 / self.tan_half_fov
            self.proj_matrix[2, 2] = (opt.zfar + opt.znear) / (opt.zfar - opt.znear)
            self.proj_matrix[3, 2] = -(opt.zfar * opt.znear) / (opt.zfar - opt.znear)
            self.proj_matrix[2, 3] = 1

        gs.GaussianRenderer.__init__ = init


    def test_lgm_forward(device: torch.device, input_size: int) -> bool:
        from core.models import LGM
        from core.options import config_defaults

        if device.type == "cpu":
            _cpu_renderer_init_fallback()

        ok = True
        opt = config_defaults["tiny"]  # smallest channel plan: same code path, ~1 s on CPU
        opt.lambda_lpips = 0.0         # must be 0: kiui.lpips is a stub in this environment
        opt.input_size = input_size
        opt.splat_size = expected_splat_size(opt)
        print(f"[selftest] tiny config: input_size={opt.input_size} splat_size={opt.splat_size} "
              f"(down {opt.down_channels} / up {opt.up_channels})")

        t0 = time.perf_counter()
        model = LGM(opt).to(device).eval()
        n_params = sum(p.numel() for p in model.parameters())
        print(f"[selftest] LGM built in {time.perf_counter() - t0:.1f}s, {n_params / 1e6:.1f}M params "
              f"(random weights)")

        # LGM's checkpoint shape must match: check the big config's declared splat_size too.
        big = config_defaults["big"]
        ok &= check("big config splat_size agrees with its level counts",
                    big.splat_size == big.input_size // 2 ** (len(big.down_channels) - 1
                                                              - (len(big.up_channels) - 1)),
                    f"splat_size={big.splat_size} input={big.input_size}")

        rays = model.prepare_default_rays(device, elevation=0)
        ok &= check("prepare_default_rays shape [4, 6, H, W]",
                    tuple(rays.shape) == (4, 6, opt.input_size, opt.input_size), f"{tuple(rays.shape)}")
        rays_hw = rays[:, 3:6].permute(0, 2, 3, 1).reshape(-1, 3)
        ok &= check("ray directions are unit length",
                    bool((rays_hw.norm(dim=-1) - 1).abs().max() < 1e-3),
                    f"max|‖d‖-1|={float((rays_hw.norm(dim=-1) - 1).abs().max()):.2e}")
        ok &= check("rays are finite", bool(torch.isfinite(rays).all()))

        x = torch.rand(4, 3, opt.input_size, opt.input_size, device=device)
        x = torch.cat([x, rays.to(device).to(x.dtype)], dim=1).unsqueeze(0)  # [1, 4, 9, H, W]
        t0 = time.perf_counter()
        with torch.no_grad():
            g = model.forward_gaussians(x)
        n_expected = 4 * opt.splat_size * opt.splat_size
        ok &= check("forward_gaussians -> [1, 4·splat_size², 14]",
                    tuple(g.shape) == (1, n_expected, 14),
                    f"{tuple(g.shape)} in {time.perf_counter() - t0:.1f}s")
        rgb_ok = bool((g[..., 11:14] >= 0).all() and (g[..., 11:14] <= 1).all())
        ok &= check("activations in range (pos ±1, opacity/scale/rgb > 0)",
                    bool(g[..., 0:3].abs().max() <= 1.0 and g[..., 3:4].min() > 0
                         and g[..., 4:7].min() > 0 and rgb_ok),
                    f"pos_max={float(g[..., 0:3].abs().max()):.3f} scale_min={float(g[..., 4:7].min()):.2e}")
        qn = g[..., 7:11].norm(dim=-1)
        ok &= check("quaternions normalised (the bug fixed in fe8d12c)",
                    bool((qn - 1).abs().max() < 1e-4), f"max|‖q‖-1|={float((qn - 1).abs().max()):.2e}")

        out = "/tmp/g1-selftest.ply"
        model.gs.save_ply(g, out)  # exercises the kiui.op.inverse_sigmoid path + plyfile writer
        from plyfile import PlyData

        el = PlyData.read(out)["vertex"]
        need = ["x", "y", "z", "f_dc_0", "f_dc_1", "f_dc_2", "opacity",
                "scale_0", "scale_1", "scale_2", "rot_0", "rot_1", "rot_2", "rot_3"]
        have = [p.name for p in el.properties]
        ok &= check("ply has the 3DGS attribute set", all(n in have for n in need), f"{have}")
        ok &= check("ply count ≤ forward count (opacity ≥ 0.005 prune)",
                    0 < el.count <= n_expected, f"{el.count} of {n_expected} kept, {os.path.getsize(out)} bytes")
        os.remove(out)
        return bool(ok)


    def main() -> int:
        ap = argparse.ArgumentParser()
        ap.add_argument("--device", default="auto", choices=["auto", "cpu", "cuda"])
        ap.add_argument("--input-size", type=int, default=64)
        args = ap.parse_args()
        device = torch.device("cuda" if (args.device in ("auto", "cuda") and torch.cuda.is_available()) else "cpu")
        print(f"[selftest] torch {torch.__version__} device {device}")

        results = [("xformers shim", test_xformers_shim()),
                   ("kiui helpers", test_kiui()),
                   (f"LGM forward on {device.type}", test_lgm_forward(device, args.input_size))]
        bad = [name for name, ok in results if not ok]
        for name, ok in results:
            print(f"[selftest] {'PASS' if ok else 'FAIL'} {name}")
        if bad:
            print(f"[selftest] FAILED: {bad}")
            return 1
        print("[selftest] all checks passed")
        return 0


    if __name__ == "__main__":
        sys.exit(main())

  report.py: |-
    #!/usr/bin/env python3
    """splat-lab g1 — collect the per-stage metrics into $OUT/RESULTS.json (+ a log summary).

    Nothing here measures anything itself: it merges the JSON files written by mvgen.py and
    lgm2ply.py, adds the input manifest, the Job identity (pod, node, image, LGM commit) and the
    peak of the `nvidia-smi` sampler rows that run.sh logged, so the deck's provenance README can
    quote one number per claim.
    """

    import argparse
    import datetime
    import glob
    import json
    import os
    import re
    import socket
    import subprocess
    import sys


    def log(msg):
        print(f"[report {datetime.datetime.utcnow():%H:%M:%S}] {msg}", flush=True)


    def smi_peak(out_dir: str):
        """Highest memory.used seen in the nvidia-smi sampler lines of this run's logs (MiB)."""
        best = None
        pat = re.compile(r"nvidia-smi (\d+) MiB, (\d+) MiB")
        for path in glob.glob(os.path.join(out_dir, "run-*.log")):
            with open(path, errors="replace") as f:
                for line in f:
                    m = pat.search(line)
                    if m:
                        used = int(m.group(1))
                        best = used if best is None else max(best, used)
        return best


    def main() -> int:
        ap = argparse.ArgumentParser()
        ap.add_argument("--out", required=True)
        ap.add_argument("--scripts", default="/scripts")
        ap.add_argument("--start-ts", type=int, default=0)
        ap.add_argument("--stage", default="report")
        args = ap.parse_args()

        result = {
            "job": {
                "slug": "g1-lgm",
                "pod": os.environ.get("HOSTNAME", socket.gethostname()),
                "node": os.environ.get("NODE_NAME", ""),
                "image": os.environ.get("IMAGE", ""),
                "lgm_commit": os.environ.get("LGM_REV", ""),
                "out": args.out,
                "stage": args.stage,
                "utc": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z",
            },
            "env": {k: v for k, v in sorted(os.environ.items())
                    if k in ("SUBJECTS", "STEPS", "GUIDANCE", "ELEVATION", "SEED", "MATTE", "CONFIG",
                             "CKPT", "INPUT_SIZE", "LGM_EXTRA", "VIEWS_BASE", "HF_HOME", "U2NET_HOME")},
            "subjects": {},
        }

        try:
            with open(os.path.join(args.out, "inputs-manifest.json")) as f:
                result["inputs"] = json.load(f)
        except OSError as e:
            result["inputs"] = f"missing: {e}"

        for name in [os.path.splitext(os.path.basename(p))[0] for p in glob.glob(os.path.join(args.out, "*.ply"))]:
            per = {}
            for stage, fname in (("mvgen", "metrics_mvgen.json"), ("lgm2ply", "metrics_lgm2ply.json")):
                for cand in (os.path.join(args.out, name, fname), os.path.join(args.out, fname)):
                    if os.path.exists(cand):
                        with open(cand) as f:
                            per[stage] = json.load(f)
                        break
            per["ply_path"] = os.path.join(args.out, name + ".ply")
            per["ply_bytes"] = os.path.getsize(per["ply_path"])
            lgm = per.get("lgm2ply", {})
            if lgm.get("ply"):
                per["ply_count"] = lgm["ply"]["count"]
            peak = [p["peak_cuda_alloc_mib"] for p in per.values() if isinstance(p, dict) and "peak_cuda_alloc_mib" in p]
            per["peak_cuda_alloc_mib"] = max(peak) if peak else None
            wall = [p["wall_s"] for p in per.values() if isinstance(p, dict) and "wall_s" in p]
            per["sum_stage_wall_s"] = round(sum(wall), 1) if wall else None
            result["subjects"][name] = per

        peak = smi_peak(args.out)
        if peak is not None:
            result["nvidia_smi_peak_used_mib"] = peak
        if args.start_ts:
            result["job"]["script_wall_s"] = int(datetime.datetime.now().timestamp() - args.start_ts)

        try:
            result["gpu"] = subprocess.run(
                ["nvidia-smi", "--query-gpu=name,memory.total,driver_version", "--format=csv,noheader"],
                capture_output=True, text=True, timeout=30).stdout.strip()
        except Exception as e:  # pragma: no cover
            result["gpu"] = f"nvidia-smi failed: {e}"

        dest = os.path.join(args.out, "RESULTS.json")
        with open(dest, "w") as f:
            json.dump(result, f, indent=2, sort_keys=True)

        log(f"===== {os.path.basename(args.out)} =====")
        for name, per in result["subjects"].items():
            mv, lgm = per.get("mvgen", {}), per.get("lgm2ply", {})
            log(f"{name}: views={mv.get('diffusion_s')}s cutout={mv.get('cutout_s')}s "
                f"| forward={lgm.get('forward_s')}s weights={lgm.get('weights_mib')}MiB "
                f"| splats={per.get('ply_count')} | peak={per.get('peak_cuda_alloc_mib')}MiB "
                f"| ply={per.get('ply_bytes')}")
            if lgm.get("ply"):
                log(f"    bounds {lgm['ply']['bounds_min']} .. {lgm['ply']['bounds_max']} "
                    f"extent={lgm['ply']['extent']} centre={lgm['ply']['centre']}")
            if lgm.get("state_dict") and (lgm["state_dict"]["missing_keys"] or lgm["state_dict"]["unexpected_keys"]):
                log(f"    WARN state_dict mismatch: {lgm['state_dict']}")
        log(f"nvidia-smi peak used: {result.get('nvidia_smi_peak_used_mib')} MiB; "
            f"script wall {result['job'].get('script_wall_s')}s -> {dest}")
        return 0


    if __name__ == "__main__":
        sys.exit(main())

  vendor-kiui-__init__.py: |-
    """Small stand-in for the parts of ``kiui`` that LGM's inference path touches.

    LGM (MIT, https://github.com/3DTopia/LGM) imports ``kiui`` (Apache-2.0,
    https://github.com/3DTopia/kiui) from four places:

    * ``mvdream/mv_unet.py``  -> ``from kiui.cam import orbit_camera`` (camera conditioning of the
      multi-view diffusion),
    * ``core/models.py``      -> ``import kiui`` + ``from kiui.lpips import LPIPS`` (the LPIPS loss is
      imported unconditionally but only *built* when ``Options.lambda_lpips > 0``; inference sets it
      to 0, so ``LPIPS`` stays a stub and no VGG weights are downloaded),
    * ``core/gs.py``          -> ``kiui.op.inverse_sigmoid`` inside ``save_ply``,
    * ``core/utils.py``       -> ``from kiui.op import safe_normalize`` inside ``get_rays``.

    The real distribution needs lazy_loader + trimesh + pymeshlab + opencv + imageio + viser + ...
    (most of it for mesh/vis work we never call), so this package vendors exactly those helpers.
    ``length``/``safe_normalize``/``inverse_sigmoid``/``recenter``/``look_at``/``orbit_camera`` are
    copied from kiui 0.3.5 (Apache License 2.0, Copyright (c) 2023 Kiui-Jiaxiang Tang) with the
    docstrings trimmed and the type aliases inlined; the maths is unchanged.
    """

    from . import cam, lpips, op  # noqa: F401  (keeps `kiui.op...` attribute access working)
    from .cam import look_at, orbit_camera  # noqa: F401
    from .op import inverse_sigmoid, length, recenter, safe_normalize  # noqa: F401

    import os
    import random

    import numpy as np


    def seed_everything(seed: int = 42, verbose: bool = False, strict: bool = False) -> None:
        """Set random/numpy/torch seeds (same effect as kiui.utils.seed_everything)."""
        import torch

        os.environ["PYTHONHASHSEED"] = str(seed)
        random.seed(seed)
        np.random.seed(seed)
        torch.manual_seed(seed)
        torch.cuda.manual_seed_all(seed)
        if strict:
            torch.use_deterministic_algorithms(True)
            torch.backends.cudnn.deterministic = True
        if verbose:
            print(f"[INFO] seed_everything({seed}, strict={strict})")


    __version__ = "0.3.5+splatlab-vendored"

  vendor-kiui-cam.py: |-
    """Vendored from kiui 0.3.5 `kiui/cam.py` (Apache License 2.0, Copyright (c) 2023
    Kiui-Jiaxiang Tang, https://github.com/3DTopia/kiui). Docstrings trimmed, behaviour unchanged.

    `look_at`/`orbit_camera` are load-bearing here: LGM feeds `orbit_camera` poses into the
    Plücker-ray embedding that conditions its U-Net, and into the multi-view camera embedding of
    the diffusion UNet, so the camera convention has to match the checkpoint. kiui 0.2.3 and 0.3.5
    agree on both functions (`opengl=True` is the default in both), which is what LGM relies on.
    """

    import numpy as np

    from .op import safe_normalize


    def look_at(campos, target, opengl=True):
        """construct pose rotation matrix by look-at (opengl: forward is target --> camera)."""
        if not opengl:
            # forward is camera --> target
            forward_vector = safe_normalize(target - campos)
            up_vector = np.array([0, 1, 0], dtype=np.float32)
            right_vector = safe_normalize(np.cross(forward_vector, up_vector))
            up_vector = safe_normalize(np.cross(right_vector, forward_vector))
        else:
            # forward is target --> camera
            forward_vector = safe_normalize(campos - target)
            up_vector = np.array([0, 1, 0], dtype=np.float32)
            right_vector = safe_normalize(np.cross(up_vector, forward_vector))
            up_vector = safe_normalize(np.cross(forward_vector, right_vector))
        R = np.stack([right_vector, up_vector, forward_vector], axis=1)
        return R


    def orbit_camera(elevation, azimuth, radius=1, is_degree=True, target=None, opengl=True):
        """construct a camera pose matrix orbiting a target; returns float [4, 4]."""
        if is_degree:
            elevation = np.deg2rad(elevation)
            azimuth = np.deg2rad(azimuth)
        x = radius * np.cos(elevation) * np.sin(azimuth)
        y = - radius * np.sin(elevation)
        z = radius * np.cos(elevation) * np.cos(azimuth)
        if target is None:
            target = np.zeros([3], dtype=np.float32)
        campos = np.array([x, y, z]) + target  # [3]
        T = np.eye(4, dtype=np.float32)
        T[:3, :3] = look_at(campos, target, opengl)
        T[:3, 3] = campos
        return T

  vendor-kiui-op.py: |-
    """Vendored from kiui 0.3.5 `kiui/op.py` (Apache License 2.0, Copyright (c) 2023
    Kiui-Jiaxiang Tang, https://github.com/3DTopia/kiui). Docstrings trimmed, behaviour unchanged.
    Only the four helpers LGM's inference path needs are kept.
    """

    from typing import Union

    import cv2
    import numpy as np
    import torch
    from numpy import ndarray
    from torch import Tensor


    def dot(x: Union[Tensor, ndarray], y: Union[Tensor, ndarray]) -> Union[Tensor, ndarray]:
        """dot product (along the last dim)."""
        return (x * y).sum(-1, keepdims=True)


    def length(x: Union[Tensor, ndarray], eps: float = 1e-20) -> Union[Tensor, ndarray]:
        """length of an array (along the last dim)."""
        if isinstance(x, np.ndarray):
            return np.sqrt(np.maximum(np.sum(x * x, axis=-1, keepdims=True), eps))
        else:
            return torch.sqrt(torch.clamp(dot(x, x), min=eps))


    def safe_normalize(x: Union[Tensor, ndarray], eps: float = 1e-20) -> Union[Tensor, ndarray]:
        """normalize an array (along the last dim)."""
        return x / length(x, eps)


    def inverse_sigmoid(x: Tensor, eps: float = 1e-6) -> Tensor:
        """inversion of sigmoid function: log(x / (1 - x))."""
        x = x.clamp(eps, 1 - eps)
        return torch.log(x / (1 - x))


    def recenter(image: ndarray, mask: ndarray, border_ratio: float = 0.2) -> ndarray:
        """recenter an image to leave some empty space at the image border."""
        return_int = False
        if image.dtype == np.uint8:
            image = image.astype(np.float32) / 255
            return_int = True

        H, W, C = image.shape
        size = max(H, W)

        # default to white bg if rgb, but use 0 if rgba
        if C == 3:
            result = np.ones((size, size, C), dtype=np.float32)
        else:
            result = np.zeros((size, size, C), dtype=np.float32)

        coords = np.nonzero(mask)
        x_min, x_max = coords[0].min(), coords[0].max()
        y_min, y_max = coords[1].min(), coords[1].max()
        h = x_max - x_min
        w = y_max - y_min
        desired_size = int(size * (1 - border_ratio))
        scale = desired_size / max(h, w)
        h2 = int(h * scale)
        w2 = int(w * scale)
        x2_min = (size - h2) // 2
        x2_max = x2_min + h2
        y2_min = (size - w2) // 2
        y2_max = y2_min + w2
        result[x2_min:x2_max, y2_min:y2_max] = cv2.resize(
            image[x_min:x_max, y_min:y_max], (w2, h2), interpolation=cv2.INTER_AREA
        )

        if return_int:
            result = (result * 255).astype(np.uint8)

        return result

  vendor-kiui-lpips.py: |-
    """``kiui.lpips`` stand-in.

    ``core/models.py`` does ``from kiui.lpips import LPIPS`` at import time but only *builds* the
    loss module when ``Options.lambda_lpips > 0``. Inference never trains, so ``run.sh`` sets
    ``lambda_lpips=0`` and this class is never instantiated — it exists so the import succeeds
    without dragging in the real LPIPS module (which needs torchvision VGG weights at build time).
    """

    import torch.nn as nn


    class LPIPS(nn.Module):
        def __init__(self, *args, **kwargs):
            raise NotImplementedError(
                "kiui.lpips.LPIPS is vendored as a stub: inference must run with "
                "Options(lambda_lpips=0) so the loss module is never built."
            )

  vendor-xformers-__init__.py: |-
    """Fake ``xformers`` package: a thin adapter onto ``torch.nn.functional.scaled_dot_product_attention``.

    Why: LGM and the ImageDream/MVDream UNet call ``xformers.ops.memory_efficient_attention``, but
    the real wheel ships FA2/Cutlass-FMHA kernels that need SM70+. Our GPU is a GTX 1070 (Pascal,
    sm_61), where xformers raises "no kernel found". PyTorch's own SDPA *does* have a path for
    Pascal (math / mem-efficient backend), so this shim keeps the numerics at fp16 while dropping the
    SM70 requirement. Only the pieces LGM imports are provided.
    """

    __version__ = "0.0.0+splatlab-sdpa"
    __author__ = "splat-lab g1"

  vendor-xformers-ops-__init__.py: |-
    """``xformers.ops`` shim — see the package docstring in ``..__init__``.

    Provides ``memory_efficient_attention`` (SDPA-backed) and ``unbind``. Accepts xformers' 3-D
    ``[B, M, K]`` (single head) and 4-D ``[B, H, M, K]`` layouts, fp16/bf16/fp32, and applies the
    same default softmax scale as xformers (1/sqrt(K)) — that matters, because LGM's fallback
    ``Attention`` pre-scales q itself while ``MemEffAttention`` relies on the kernel to do it.
    """

    from typing import Optional

    import torch
    import torch.nn.functional as F


    def unbind(tensor: torch.Tensor, dim: int = 0):
        """xformers.ops.unbind: split a tensor along `dim` into a tuple."""
        return torch.unbind(tensor, dim=dim)


    def _sdpa(q, k, v, dropout_p: float, scale: Optional[float]):
        squeeze_head = q.dim() == 3
        if squeeze_head:
            q, k, v = (t.unsqueeze(1) for t in (q, k, v))  # [B, M, K] -> [B, 1, M, K]
        out = F.scaled_dot_product_attention(
            q, k, v, dropout_p=dropout_p, scale=scale
        )  # scale=None -> 1/sqrt(K), same default as xformers
        if squeeze_head:
            out = out.squeeze(1)
        return out


    def memory_efficient_attention(
        query: torch.Tensor,
        key: torch.Tensor,
        value: torch.Tensor,
        attn_bias: Optional[object] = None,
        compute_log_sumexp: bool = False,
        dropout_p: float = 0.0,
        bias: Optional[torch.Tensor] = None,
        scale: Optional[float] = None,
        op=None,
    ):
        """Drop-in for xformers' cutlass FMHA, computed with torch SDPA (works on Pascal sm_61)."""
        if attn_bias is not None:
            raise NotImplementedError(
                "the xformers SDPA shim only supports attn_bias=None (LGM passes None; "
                "nested-tensor/BlockDiagonal biases are not used by the inference path)"
            )
        if bias is not None:
            # additive float bias -> SDPA's attn_mask
            squeeze_head = query.dim() == 3
            q = query.unsqueeze(1) if squeeze_head else query
            k = key.unsqueeze(1) if squeeze_head else key
            v = value.unsqueeze(1) if squeeze_head else value
            out = F.scaled_dot_product_attention(
                q, k, v, attn_mask=bias.to(q.dtype), dropout_p=dropout_p, scale=scale
            )
            return out.squeeze(1) if squeeze_head else out
        return _sdpa(query, key, value, dropout_p, scale)


    # a couple of names exist only so that `hasattr`/import probes behave
    def set_library_options(*args, **kwargs):  # pragma: no cover - no-op
        return None


    class _Noop:
        """Placeholder for xformers.ops.fmha options objects."""

        def __init__(self, *args, **kwargs):
            pass

        def __call__(self, *args, **kwargs):
            return memory_efficient_attention(*args, **kwargs)


    class fmha:
        LowerTriangularMask = _Noop
        AttentionBias = _Noop

  vendor-diff_gaussian_rasterization-__init__.py: |-
    """``diff_gaussian_rasterization`` stub.

    LGM's ``core/gs.py`` imports the CUDA rasteriser at module scope, and ``core/models.py`` imports
    ``gs`` for ``GaussianRenderer``. We only ever call ``model.gs.save_ply`` (which needs no
    rendering), so instead of compiling ``ashawkey/diff-gaussian-rasterization`` for sm_61 — which
    needs a -devel CUDA image, nvcc and a compiler toolchain — this stub satisfies the import and
    raises if anything tries to render.

    That keeps the whole Job inside the ``-runtime`` PyTorch image and off the Pascal compile path.
    """


    class GaussianRasterizationSettings:  # pragma: no cover - API shape only
        def __init__(self, *args, **kwargs):
            raise NotImplementedError(
                "diff_gaussian_rasterization is stubbed in splat-lab g1: the pipeline saves the "
                ".ply directly and never renders a preview (see tools/splats/g1/README.md)"
            )


    class GaussianRasterizer:  # pragma: no cover - API shape only
        def __init__(self, *args, **kwargs):
            raise NotImplementedError(
                "diff_gaussian_rasterization is stubbed in splat-lab g1: the pipeline saves the "
                ".ply directly and never renders a preview (see tools/splats/g1/README.md)"
            )


    def __getattr__(name):  # pragma: no cover - any other symbol fails loudly
        raise AttributeError(f"stub module diff_gaussian_rasterization has no attribute {name!r}")

