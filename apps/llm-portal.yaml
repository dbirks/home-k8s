# llm.birks.dev — API-key portal: namespace + RBAC (foundational)
#
# The portal (Go app, repo dbirks/kubernetes-llm-api-key-portal) signs users in via
# Entra OIDC and issues/revokes API keys by upserting entries into ONE aggregate
# Secret in THIS namespace. Envoy Gateway's SecurityPolicy.apiKeyAuth then enforces
# those keys on /v1/* by reading that single Secret by name (see apps/llm-routes.yaml).
#
# Secret shape Envoy Gateway apiKeyAuth expects: ONE aggregate Opaque Secret
# (`llm-apikeys`, bootstrapped SOPS-encrypted in apps/llm-apikeys.enc.yaml), with
# one `data` entry per issued key — key `client-<opaqueid>`, value `llm_<raw>` (the
# bare token, no "Bearer " prefix). The portal ADDS/REMOVES entries at runtime via
# patch; it never recreates the Secret. Per-key ownership lives in a
# `llm-portal/key-<opaqueid>` annotation on the same Secret (a per-key label is no
# longer possible with one object), so the account page can list/revoke a user's keys.
#
# OIDC secret (ENTRA_CLIENT_SECRET + SESSION_KEY) lives in apps/llm-portal-oidc.enc.yaml
# (SOPS). Public config (tenant/client id, PUBLIC_BASE_URL) goes inline on the portal
# Deployment (added once the ghcr image is published).
---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-portal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-portal
  namespace: llm-portal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-portal-secrets
  namespace: llm-portal
rules:
  # Least-privilege: the portal upserts entries into the single aggregate API-key
  # Secret (`llm-apikeys`) in its own namespace only. It needs `patch` (and
  # `create`, to bootstrap the Secret if it is ever absent) to add/remove entries;
  # `get`/`list`/`watch` to read them back. `list`/`watch`/`create` cannot be
  # scoped by resourceName in RBAC, so the namespace is the blast-radius boundary.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-portal-secrets
  namespace: llm-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-portal-secrets
subjects:
  - kind: ServiceAccount
    name: llm-portal
    namespace: llm-portal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-portal-config
  namespace: llm-portal
data:
  PUBLIC_BASE_URL: "https://llm.birks.dev"
  ENTRA_TENANT_ID: "c396bef6-8e08-40ab-b4f7-02d01fb0b6ce"   # public id
  ENTRA_CLIENT_ID: "1787dab3-157b-4872-a88a-bffe4ba75094"   # public id
  KEYSTORE_MODE: "kubernetes"        # persist keys as k8s Secrets (default is memory!)
  KUBERNETES_NAMESPACE: "llm-portal" # namespace of the aggregate API-key Secret
  KUBERNETES_SECRET_NAME: "llm-apikeys" # the ONE aggregate Secret Envoy Gateway apiKeyAuth reads (portal upserts client-<id> entries)
  MODELS_NAMESPACE: "default"        # enables /models page: lists LLMInferenceServices in this ns (read-only RBAC in apps/llm-portal-models-rbac.yaml)
  GRAFANA_URL: "https://llm.birks.dev/grafana"   # Metrics link in header + account page
  # Setup-picker catalog: each model + its base path (qwen on /v1, muse on /muse/v1).
  # A reasoning model's snippets carry a max_tokens reminder. id = vLLM served-model-name.
  ONBOARDING_MODELS: |
    [
      {"id":"qwen3.8-nvfp4","label":"Qwen3.8-27B","kind":"coding","path":""},
      {"id":"muse-glimmer-30b","label":"Muse-Glimmer 30B","kind":"reasoning","path":"/muse"}
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-portal
  namespace: llm-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-portal
  template:
    metadata:
      labels:
        app: llm-portal
    spec:
      serviceAccountName: llm-portal   # least-privilege Secret CRUD in this ns
      containers:
        - name: portal
          # pinned image tag (public ghcr, multi-arch). # {"$imagepolicy": "flux-system:llm-portal"}
          image: ghcr.io/dbirks/kubernetes-llm-api-key-portal:sha-e96a70618a9a2ed1944d1debbfdd68b708a38bd6
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: llm-portal-config    # non-secret config (base URL, Entra IDs, keystore)
            - secretRef:
                name: llm-portal-oidc      # ENTRA_CLIENT_SECRET + SESSION_KEY (SOPS-decrypted)
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: llm-portal
  namespace: llm-portal
spec:
  selector:
    app: llm-portal
  ports:
    - port: 80
      targetPort: 8080
