# llm.birks.dev — API-key portal: namespace + RBAC (foundational)
#
# The portal (Go app, repo dbirks/kubernetes-llm-api-key-portal) signs users in via
# Entra OIDC and creates/revokes API keys as Kubernetes Secrets in THIS namespace.
# kgateway then enforces those keys on /v1/* (its controller already has cluster-wide
# Secret read via its own ClusterRole). Keeping the portal's key-Secrets, the
# HTTPRoute, and the TrafficPolicy all in `llm-portal` avoids cross-namespace
# ReferenceGrant (kgateway PERMISSIVE mode would otherwise fail closed).
#
# Secret shape kgateway expects (OSS apiKeyAuth, v2.2+): ONE Secret per key,
# type extauth.solo.io/apikey, data key literally `api-key`, client identity =
# Secret name. (NB: this differs from the brief's multi-entry client-<id> shape —
# the portal code must write one-Secret-per-key. Flagged to the portal repo.)
#
# OIDC secret (ENTRA_CLIENT_SECRET + SESSION_KEY) lives in apps/llm-portal-oidc.enc.yaml
# (SOPS). Public config (tenant/client id, PUBLIC_BASE_URL) goes inline on the portal
# Deployment (added once the ghcr image is published).
---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-portal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-portal
  namespace: llm-portal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-portal-secrets
  namespace: llm-portal
rules:
  # Least-privilege: the portal manages API-key Secrets in its own namespace only.
  # No "update" — keys are immutable (create -> use -> revoke/delete).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-portal-secrets
  namespace: llm-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-portal-secrets
subjects:
  - kind: ServiceAccount
    name: llm-portal
    namespace: llm-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-portal
  namespace: llm-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-portal
  template:
    metadata:
      labels:
        app: llm-portal
    spec:
      serviceAccountName: llm-portal   # least-privilege Secret CRUD in this ns
      containers:
        - name: portal
          # pinned image tag (public ghcr, multi-arch). # {"$imagepolicy": "flux-system:llm-portal"}
          image: ghcr.io/dbirks/kubernetes-llm-api-key-portal:sha-f0d81798f48436312c06627a30bd2b2fdad83b92
          ports:
            - containerPort: 8080
          env:
            - { name: PUBLIC_BASE_URL, value: "https://llm.birks.dev" }
            - { name: ENTRA_TENANT_ID, value: "c396bef6-8e08-40ab-b4f7-02d01fb0b6ce" }   # public id
            - { name: ENTRA_CLIENT_ID, value: "1787dab3-157b-4872-a88a-bffe4ba75094" }   # public id
            - name: ENTRA_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: llm-portal-oidc, key: ENTRA_CLIENT_SECRET } }
            - name: SESSION_KEY
              valueFrom: { secretKeyRef: { name: llm-portal-oidc, key: SESSION_KEY } }
            - { name: KEYSTORE_MODE, value: "kubernetes" }        # persist keys as k8s Secrets (default is memory!)
            - { name: KUBERNETES_NAMESPACE, value: "llm-portal" } # where key Secrets are written
            - { name: DEFAULT_MODEL, value: "main" }              # prefilled in the setup snippets; matches vLLM served-model-name
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: llm-portal
  namespace: llm-portal
spec:
  selector:
    app: llm-portal
  ports:
    - port: 80
      targetPort: 8080
