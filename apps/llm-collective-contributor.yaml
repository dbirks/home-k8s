# LLM Collective contributor. Contributes the local NInfer Qwen3.8-27B model (#156;
# Pennyroyal qwen3-8-flash-next is parked) to the company LLM Collective at
# https://llm-collective.e-gineering.com over one outbound WebSocket tunnel.
#
# Backend target is the ninfer Service directly. NOTE: ninfer scales to zero via
# KEDA and only wakes on traffic through the llm-ai-gw ext_proc — a Collective
# request that arrives while ninfer is at 0 replicas will fail until it is woken.
# For wake-on-demand, repoint the backend at the internal AI gateway (with an
# llm_ API key) instead of ninfer:8000. Fine for now under active use.
#
# The contributor's public key must be registered under your login in the prod
# gateway UI (Become a Contributor) before it can connect — auto-enroll was
# removed. Until then it will start and retry with "waiting for key
# registration". Public key: llmc_pk_v1_TWLRH0jpq4jcySuWE9n0HHFWnoaZi7875JWiq1m5vJo
#
# Image: ghcr.io/e-gineering/llm-collective/contributor is public, so no pull
# secret is needed. Tracks the prod semver release channel (vX.Y.Z).
#
# Model capabilities (contributor >= v0.6.0, llm-collective #15) are owner-
# declared and only displayed by the gateway, never enforced. The context is
# the #135 recipe's per-request window; output stays undeclared because the
# recipe enforces no per-request output cap. Reasoning tiers were probed live
# through this gateway: all seven accepted, `none` switches thinking off,
# unset follows the launcher default (PENNY_REASONING_EFFORT=medium).
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-collective-contributor-config
  namespace: default
data:
  contributor.yaml: |
    version: 1
    machine:
      name: home-k8s
    collective:
      gateway: https://llm-collective.e-gineering.com
    metrics:
      listen: 127.0.0.1:9091
    backends:
      # PARKED 2026-10-21 (#158): ninfer at replicas 0 for the Flint canary. Rollback = uncomment, drop flint.
      # Qwen3.8-27B on NInfer, dbirks fork 2026-10-19 (ninfer:20261019, v3 artifact), NVFP4 weights + NVFP4 KV, #156.
      # 1.49M-token shared KV pool (MTP3 + --vision), 262,144 ctx per request, 8 engine lanes (excess queues; 32 pending).
      # concurrency 16 (2026-10-19): the dbirks fork admits 16 resident lanes (upstream caps at 8; see
      # ninfer-serving-memory). Up to 8 decode per round and the rest take turns, so nothing queues
      # inside NInfer until 17+; --max-pending-requests 32 still backs it.
      # /v1/chat/completions and /v1/messages both verified 2026-10-16 (thinking blocks on /v1/messages).
      # - name: ninfer
      #   url: http://ninfer.default.svc.cluster.local:8000
      #   protocols: [openai, anthropic]
      #   concurrency: 16         # 2026-10-19: matches NInfer --max-concurrency 16 (fork: 16 resident lanes)
      #   models:
      #     - alias: qwen3-8-27b
      #       model: qwen3.8-27b-ninfer
      #       limits:
      #         context: 262144
      #       # Probed live 2026-10-17: the artifact template accepts xhigh (its default), medium and low;
      #       # `none` is the engine's thinking-off switch. minimal/high/max are rejected with a 400.
      #       reasoning:
      #         levels:
      #           - none
      #           - low
      #           - medium
      #           - xhigh
      #       # --vision on since 2026-10-17 (data-URI image verified). Video parts also work engine-side;
      #       # the Collective has no video input type, so they ride under image.
      #       inputs: [text, image]
      # CLEF-Omni AutoRound INT4 (#156): Cloudflare's System One decision model, POST /v1/systemone only.
      # serve_clef.py runs one decision at a time, so concurrency 1 (excess 429s, no queue). Warm ~0.21 s,
      # deterministic; the first call after a restart is a ~13 s warm-up.
      - name: clef
        url: http://clef-omni-systemone.default.svc.cluster.local:8000
        protocols: [openai]
        concurrency: 1
        models:
          - alias: clef-omni
            model: clef-omni
            types: [decision]
      # Qwen3-TTS 1.7B on vLLM-Omni v0.30.0 (#156), POST /v1/audio/speech only. The gateway rewrites just
      # `model`, so Qwen fields (task_type, instructions, voice, language, ref_audio/ref_text) pass through.
      # Voice MANAGEMENT (/v1/audio/voices) is deliberately not reachable through the Collective: the
      # registry has no per-user ownership yet. Registered voice names on Base ARE usable by any caller.
      # Talker KV holds ~1.7 full 4,096-token requests; TTS requests are short, so 4 each.
      - name: qwen3-tts-voicedesign
        url: http://qwen3-tts-voicedesign.default.svc.cluster.local:8000
        protocols: [openai]
        concurrency: 4
        models:
          - alias: qwen3-tts-voicedesign
            model: qwen3-tts-voicedesign
            types: [speech]
      - name: qwen3-tts-base
        url: http://qwen3-tts-base.default.svc.cluster.local:8000
        protocols: [openai]
        concurrency: 4
        models:
          - alias: qwen3-tts-base
            model: qwen3-tts-base
            types: [speech]
      # Qwen3-ASR 1.7B Q6_K, speech.cpp on dave-droid's GTX 1070 (apps/qwen3-asr.yaml). Took over from the
      # woodduck contributor when that Arch box became a Talos worker (2026-10-17). speech serve is
      # single-flight, and the backend id is `Qwen3-ASR-1.7B` (its own /v1/models), not the CLI catalog name.
      # concurrency 8 (2026-10-22): the contributor never queues (try-acquire, else 429), but speech serve
      # queues internally and runs one at a time (6 concurrent 114 s clips: all 200, ~6.8 s each, /health
      # stayed <6 ms). So 8 here = up to 8 waiting in speech serve instead of 429s; the 9th still gets a 429.
      - name: qwen3-asr
        url: http://qwen3-asr.default.svc.cluster.local:8001
        protocols: [openai]
        concurrency: 8
        models:
          - alias: qwen3-asr-1-7b
            model: Qwen3-ASR-1.7B
            types: [transcription]
            inputs: [audio]
      # Recursive Flint NVFP4 GGUF on vLLM (apps/flint-vllm.yaml, SM120 stock layers), 2026-10-22 (#158), in place
      # of ninfer. Text only; tools + reasoning (glm47 parsers). llama.cpp (apps/flint-llamacpp.yaml.hold) gave
      # ~30 tok/s per request at ~5 busy slots under real agent load; vLLM batches continuously (max-num-seqs 32).
      - name: flint
        url: http://flint.default.svc.cluster.local:8080
        protocols: [openai, anthropic]   # llama-server /v1/messages verified 2026-10-21 (thinking + text blocks)
        concurrency: 16         # vLLM --max-num-seqs 32 behind it
        models:
          - alias: flint
            model: flint
            limits:
              context: 262144
            inputs: [text]
      # PARKED 2026-10-16 (#156): Pennyroyal at replicas 0. Rollback = uncomment, drop ninfer above.
      # - name: pennyroyal
      #   url: http://pennyroyal-flashnext.default.svc.cluster.local:8001
      #   protocols: [openai, anthropic]   # SGLang serves /v1/chat/completions and /v1/messages natively
      #   concurrency: 6
      #   models:
      #     - alias: qwen3-8-flash-next
      #       model: pennyroyal
      #       limits:
      #         context: 524288
      #       reasoning:
      #         levels:
      #           - none
      #           - minimal
      #           - low
      #           - medium
      #           - high
      #           - xhigh
      #           - max
      #       # Pennyroyal runs the multimodal Flash-Next build: sglang encodes
      #       # image parts (verified against the dev gateway on 2026-10-03).
      #       # Declaring it earns the VISION chip and lets the gateway route
      #       # image traffic here instead of rejecting it with a 400.
      #       inputs: [text, image]
      # REMOVED 2026-10-13: iPhone backend (gemma-3n-e4b). The tailscale egress
      # Service `iphone-llm` (apps/iphone-tailnet-egress.yaml) is still in place —
      # re-add a backend block pointing at http://iphone-llm.default.svc.cluster.local:8889
      # to contribute the phone again.
      # PARKED 2026-09-28: ninfer is scaled to 0 while Pennyroyal owns the card.
      # - name: ninfer
      #   url: http://ninfer.default.svc.cluster.local:8000
      #   protocols: [openai, anthropic]   # ninfer serves /v1/messages natively (verified)
      #   concurrency: 8
      #   models:
      #     - alias: qwen3-8-27b
      #       model: qwen3.8-27b-ninfer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-collective-contributor
  namespace: default
  labels:
    app.kubernetes.io/name: llm-collective-contributor
  annotations:
    reloader.stakater.com/auto: "true" # roll when the contributor ConfigMap changes (backends/models)
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-collective-contributor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-collective-contributor
    spec:
      containers:
        - name: contributor
          image: ghcr.io/e-gineering/llm-collective/contributor:v0.14.0 # {"$imagepolicy": "flux-system:llm-collective-contributor"}
          env:
            - {name: KEY_FILE, value: /etc/collective-key/identity.key}
            - {name: PUBKEY_OUT, value: ""}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/collective}
            - {name: identity, mountPath: /etc/collective-key, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: llm-collective-contributor-config
        - name: identity
          secret:
            secretName: llm-collective-contributor-identity
---
# Flux image automation: track the prod semver release channel (vX.Y.Z). The
# existing shepherd ImageUpdateAutomation scans ./apps with Setters and bumps the
# marker above (see apps/llm-portal-image-automation.yaml for the same setup).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: llm-collective-contributor
  namespace: flux-system
spec:
  image: ghcr.io/e-gineering/llm-collective/contributor
  interval: 2m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: llm-collective-contributor
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: llm-collective-contributor
  filterTags:
    pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+'
  policy:
    semver:
      range: '>0.0.1'
