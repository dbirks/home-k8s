# One-shot pre-pull of the Flint llama.cpp image (#158) so the NInfer -> Flint switch is not waiting on a
# registry pull. CPU-only, no GPU, exits immediately. Delete this file once flint has started once.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flint-image-prepull
  namespace: default
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      nodeSelector: { kubernetes.io/hostname: talos-210-73x }
      containers:
        - name: pull
          image: ghcr.io/dbirks/llama-cpp-flint:b11799-pr30928-1b44e307@sha256:ffcb4edcb923b45a055a374b0090df040033611b987175b49ef8b2364a6598b2
          command: ["/bin/sh", "-c", "ls -la /app/llama-server"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
