# Qwen3-TTS 1.7B Base + VoiceDesign weights for the two vLLM-Omni servers (issue #156).
#
# Both checkpoints are online together: VoiceDesign designs a voice from a text description, Base
# clones/serves registered voices. Pinned HF snapshots land as plain directories (--local-dir) so
# the servers can load them by path with HF_HUB_OFFLINE=1.
#
# On the HDD on purpose: NVMe /var was 80% used (2026-10-16) and kubelet image GC starts at 85%;
# ~4.5GB per model loads in well under a minute from the HDD. Standalone PVC (incident lesson):
# retiring this Job must never prune the weights. CPU-only, holds no GPU.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-tts-models-hdd
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path-hdd
  resources:
    requests:
      storage: 30Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-tts-models-download
  namespace: default
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: dl
          image: python:3.12-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              TOK_SHA=836b7b357f5ea43e889936a3709af68dfe3751881acefe4ecf0dbd30ba571258   # speech_tokenizer, same in both
              fetch() {  # repo  revision  model.safetensors-sha256
                local repo=$1 rev=$2 sha=$3 dir=/models/${1#*/}
                if [ -f "$dir/.verified-$rev" ]; then echo "already verified $repo@$rev"; return; fi
                rm -rf "$dir.dl" && mkdir -p "$dir.dl"
                hf download "$repo" --revision "$rev" --local-dir "$dir.dl"
                (cd "$dir.dl" && printf '%s  %s\n%s  %s\n' "$sha" model.safetensors "$TOK_SHA" speech_tokenizer/model.safetensors | sha256sum --check)
                rm -rf "$dir.dl/.cache" "$dir" && mv "$dir.dl" "$dir"
                touch "$dir/.verified-$rev"
              }
              pip install -q -U "huggingface_hub[cli]"
              fetch Qwen/Qwen3-TTS-12Hz-1.7B-Base        fd4b254389122332181a7c3db7f27e918eec64e3 38fc7fc51c5e776e840414b6fd443962e9411b9654888fd7913e4da643cb857c
              fetch Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign 5ecdb67327fd37bb2e042aab12ff7391903235d3 391e8db219f292c515297cdceeb43e4eae67cdde35fa57e79a6a8a532fca0522
              ls -l /models/*
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "4", memory: 4Gi }
          volumeMounts:
            - { name: models, mountPath: /models }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: qwen3-tts-models-hdd
