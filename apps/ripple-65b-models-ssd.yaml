# Ripple-65B NVFP4 weights on the NVMe (issue #168) — a copy of the HDD stage in apps/ripple-65b-models.yaml.
#
# WHY: a cold boot read 57 GB off the HDD at ~80 MB/s (~12 min). The boot NVMe reads several GB/s, so the
# weight load should drop to a minute or two. The HDD copy stays as the pinned, verified source of truth.
#
# HOW: the Job copies the verified HDD tree into a staging dir on this NVMe PVC, re-checks every file against
# the same pinned sha256 list (reads the NVMe only), then renames it into place and writes the .verified marker.
# Re-running is a no-op once the marker exists. To use it, point apps/ripple-65b-sglang.yaml's `models`
# volume at claimName ripple-65b-models-ssd (same /models/ripple-65b-nvfp4 path, so no flag changes).
#
# SPACE: /var (NVMe) had ~239 GB free on 2026-11-05; this needs ~58 GB. local-path does not enforce the size.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ripple-65b-models-ssd
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 70Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ripple-65b-models-ssd-copy
  namespace: default
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      nodeSelector: { kubernetes.io/hostname: talos-210-73x }   # both PVCs are local to this node
      containers:
        - name: copy
          image: python:3.12-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              REV=99eea4477a001a41b86914e41feb4b2ed86105e5
              SRC=/hdd/ripple-65b-nvfp4
              DST=/ssd/ripple-65b-nvfp4
              MARK=/ssd/.verified-$REV
              if [ -f "$MARK" ]; then echo "already copied and verified"; ls -l "$DST"; exit 0; fi
              [ -f /hdd/.verified-$REV ] || { echo "HDD stage not verified yet"; exit 1; }
              rm -rf "$DST.tmp" && mkdir -p "$DST.tmp"
              time cp -a "$SRC/." "$DST.tmp/"
              (cd "$DST.tmp" && sha256sum --check <<'SUMS'
              eaa330c20b3774b201349acbbdc72d2c37fc08cdda5b57a241ef3df0580cb497  model-00001-of-00006.safetensors
              f460bca35a7b99faaee131f898a54c9d54b808d05fd1ad59493c2403538f8c96  model-00002-of-00006.safetensors
              4c570c1435b733c51183221cf5473918c6f9cbb658c97eb322879e5995d96416  model-00003-of-00006.safetensors
              372a737fb2e758e3911dfb49f1b6be2a26f2c99533337dc7e4390cc082b747ad  model-00004-of-00006.safetensors
              d2448f900b27958228fa703903fa9b4ff0bd14590a31fe0c7627bf88715e98ce  model-00005-of-00006.safetensors
              d7cf2508852befa8303153f441a588745270ef3ce163188072d35963d7413578  model-00006-of-00006.safetensors
              4dc55a07fad0710c1a9686f5bfa0a24ff67bafcf21141c853a66243d090cd0d4  model.safetensors.index.json
              46e68394f1ceda2385c2458b883957510c07cc60cfb8ffc6a898be70507a126f  config.json
              29ffb44a6b91f1ef703c25767da9d1bfa7f05b18b26c0d8ba50ac8ab0d1f3e85  generation_config.json
              877c2dbf365243dda14738ca250b31398059b35ffd91d4ed0ec68be45ca6ebd3  chat_template.jinja
              002cb3915be9685eb962d617623bec14d45b5d6b5d46e689fac98a3b38cb6cf6  configuration_ricursive.py
              f83865ef643e273a6c9aecf1575e85c95ad01fd995b1e43c3c7a892765006bb3  modeling_ricursive.py
              3f7cd7d0cfb20f9faa47c75fd4df91b1c9a78aef0be27ded12cb705b23951341  special_tokens_map.json
              18e309ad7f9c60037eaf26aca401a96128187cad2bdfa01a508dca7526bf6300  tokenizer.json
              eef580161a5d941607f7ec7ca95c50bfcd24812d2921c110ac049c620345ed85  tokenizer_config.json
              007ec77d0d64d3007d68a256f726ff69318abf1a45ab5de08828979425e5b986  inference/local/model.py
              19e432554ad48c57a1b67b989695ff4e35a44ac769821ad92ba229ecf5266ace  inference/local/ripple_format.py
              17cbc3414673d9e0e98de82360e485e9b73c9a2bbc9c93f39c09e2ea2548a8e6  inference/local/spark.py
              SUMS
              )
              rm -rf "$DST" && mv "$DST.tmp" "$DST" && touch "$MARK"
              ls -l "$DST" && df -h /ssd
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { name: hdd, mountPath: /hdd, readOnly: true }
            - { name: ssd, mountPath: /ssd }
      volumes:
        - name: hdd
          persistentVolumeClaim: { claimName: ripple-65b-models-hdd }
        - name: ssd
          persistentVolumeClaim: { claimName: ripple-65b-models-ssd }
