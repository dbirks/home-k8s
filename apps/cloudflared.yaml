# Cloudflare Tunnel connector for llm.birks.dev.
#
# Remote-managed tunnel: the TUNNEL_TOKEN (SOPS: apps/cloudflared-token.enc.yaml)
# identifies the tunnel; the public-hostname routing (llm.birks.dev ->
# http://llm-gw.llm-portal.svc.cluster.local:80) is configured in the Cloudflare
# dashboard. That `llm-gw` Service is now an ExternalName CNAME (apps/llm-public-gateway.yaml)
# to the Envoy Gateway `llm-public-gw`, so the dashboard target is unchanged. Outbound-only
# (no inbound ports — good for Talos behind NAT); TLS terminates at Cloudflare's edge,
# origin hop to the Envoy gateway is plain HTTP.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: llm-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3
          # ZDR (issue #98 / ZDR.md): keep --loglevel at info or below-verbosity (NEVER debug/trace).
          # cloudflared's connector logs carry no request/response bodies at info; debug can log request
          # detail. info is kept (not error) for tunnel-health visibility; it emits no customer content.
          # NOTE: the Cloudflare account-side posture (no body buffering, no Logpush of bodies/headers,
          # no WAF matched-data payload logging, no DLP payload logs) is NOT expressible in git — audit it
          # with scripts/zdr-audit.sh (Cloudflare section) after any tunnel/zone change.
          args: ["tunnel", "--no-autoupdate", "--loglevel", "info", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
