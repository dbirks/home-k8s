# Cloudflare Tunnel connector for llm.birks.dev.
#
# Remote-managed tunnel: the TUNNEL_TOKEN (SOPS: apps/cloudflared-token.enc.yaml)
# identifies the tunnel; the public-hostname routing (llm.birks.dev ->
# http://llm-gw.llm-portal.svc.cluster.local:80) is configured in the Cloudflare
# dashboard. Outbound-only (no inbound ports — good for Talos behind NAT); TLS
# terminates at Cloudflare's edge, origin hop to kgateway is plain HTTP.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: llm-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3
          args: ["tunnel", "--no-autoupdate", "--loglevel", "info", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
