# Hermes Agent (NousResearch, official image, raw manifests) — always-on personal agent. Issue #162.
# Operate it via the hermes-agent skill (.agents/skills/hermes-agent).
#
# PROCESS MODEL: the image's ENTRYPOINT is s6-overlay's /init (PID 1 in this container). It starts as root
# ONLY to chown /opt/data and seed config, then drops every supervised service (gateway, dashboard) to the
# `hermes` user (uid 10000) via s6-setuidgid. So: runAsUser 0 at start, ALL caps dropped except the handful
# that init/chown/setuid need, no privilege escalation, no SA token, no host mounts, no GPU.
# `gateway run` is the CMD: the CMD itself is a heartbeat, s6 supervises the real gateway and restarts it.
#
# STATE: /opt/data (PVC on dave-droid, local-path): config.yaml, .env, state.db (SQLite WAL), memories,
# skills, cron, logs. Hermes owns config.yaml (dashboard + `hermes config set` edit it), so it is NOT a
# ConfigMap; what we set by hand is recorded in the skill. One replica + Recreate: never two gateways on
# one data dir. Local-path is not a backup.
#
# DASHBOARD AUTH: Hermes' bundled self-hosted OIDC provider against tsidp (idp.beluga-wyvern.ts.net).
# Hermes' docs say confidential clients are unsupported, but v0.22.5's code layers client_secret on top of
# PKCE (HERMES_DASHBOARD_OIDC_CLIENT_SECRET), and tsidp only issues confidential clients — so it is direct,
# no proxy. Any tsidp identity (= tailnet user) can log in; Hermes has no allowlist, so the tailnet ACL is
# the user boundary. The dashboard binds 0.0.0.0 (in-pod), which force-engages the auth gate (fail closed).
# The OpenAI-compatible API server (8642) stays off; only 9119 is exposed, via hermes-dashboard-tailscale-ingress.
#
# Server-side OIDC calls go to the tailnet-only issuer, which pods can't resolve: hostAliases maps it to the
# idp egress ClusterIP (infra/tailscale-egress-idp.yaml; re-check if that egress is ever recreated).
# flannel does not enforce NetworkPolicy, so none is declared.
#
# SIGNAL: official signal-cli sidecar (asamk/signal-cli, JVM build), HTTP daemon on 127.0.0.1:8080 inside the
# pod only (never a Service). Hermes' own number is registered as a PRIMARY device (landline, voice code),
# not linked to a phone. The number lives only in apps/hermes-signal.enc.yaml (public repo: never in
# plaintext, issues, or skills). Until the account is registered the sidecar idles; registration is a
# one-time `kubectl exec` (hermes-agent skill) that ends by touching /var/lib/signal-cli/hermes-registered.
# signal-cli's dir holds the account's identity keys (and downloaded attachments): treat that PVC as a secret.
# Access: SIGNAL_ALLOWED_USERS (people) + SIGNAL_GROUP_ALLOWED_USERS (groups) from the secret; no pairing.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path        # binds on dave-droid (WaitForFirstConsumer)
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-signal-data
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path        # same node as hermes-data (one pod mounts both)
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: default
  labels: { app: hermes }
spec:
  replicas: 1
  strategy: { type: Recreate }          # one writer for state.db
  selector:
    matchLabels: { app: hermes }
  template:
    metadata:
      labels: { app: hermes }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: { kubernetes.io/hostname: dave-droid }
      tolerations:
        - { key: dedicated, operator: Equal, value: pascal, effect: NoSchedule }
      hostAliases:
        - ip: "10.109.232.240"           # ts-idp-egress ClusterIP
          hostnames: [idp.beluga-wyvern.ts.net]
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # local-path is hostPath-backed (dirs created 0777, fsGroup NOT applied): own the signal-cli dir, and
        # strip group/other write from /opt/data — Hermes refuses its gateway control socket otherwise
        # ("unsafe_control_permissions"). s6 /init chowns /opt/data to hermes itself.
        - name: perms
          image: busybox:1.37
          command: ["sh", "-c", "chown 999:999 /var/lib/signal-cli && chmod 700 /var/lib/signal-cli && chmod go-w /opt/data && ls -ld /opt/data /var/lib/signal-cli"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - { name: signal, mountPath: /var/lib/signal-cli }
            - { name: data, mountPath: /opt/data }
      containers:
        - name: hermes
          image: docker.io/nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
          args: ["gateway", "run"]
          env:
            - { name: HERMES_DASHBOARD, value: "1" }
            - { name: HERMES_DASHBOARD_HOST, value: "0.0.0.0" }
            - { name: HERMES_DASHBOARD_PORT, value: "9119" }
            - { name: HERMES_DASHBOARD_PUBLIC_URL, value: "https://hermes.beluga-wyvern.ts.net" }
            - { name: HERMES_DASHBOARD_OIDC_ISSUER, value: "https://idp.beluga-wyvern.ts.net" }
            - { name: HERMES_DASHBOARD_OIDC_CLIENT_ID, value: "49e3c44121567a4fab67116283f88af4" }   # tsidp client "hermes"
            - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: hermes-secrets, key: HERMES_DASHBOARD_OIDC_CLIENT_SECRET } }
            # Dedicated LLM Collective key, read by config.yaml providers.collective.key_env. Optional so the pod
            # still boots before the key exists (the agent just can't answer until then).
            - name: COLLECTIVE_API_KEY
              valueFrom: { secretKeyRef: { name: hermes-secrets, key: COLLECTIVE_API_KEY, optional: true } }
            - { name: SIGNAL_HTTP_URL, value: "http://127.0.0.1:8080" }
            - name: SIGNAL_ACCOUNT
              valueFrom: { secretKeyRef: { name: hermes-signal, key: SIGNAL_ACCOUNT } }
            # Allowlists (Signal UUIDs; group ID) live in the same SOPS secret. Setting SIGNAL_ALLOWED_USERS turns
            # DM pairing OFF, so every person who may talk to Hermes (DM or group) must be listed there.
            - name: SIGNAL_ALLOWED_USERS
              valueFrom: { secretKeyRef: { name: hermes-signal, key: SIGNAL_ALLOWED_USERS } }
            - name: SIGNAL_GROUP_ALLOWED_USERS
              valueFrom: { secretKeyRef: { name: hermes-signal, key: SIGNAL_GROUP_ALLOWED_USERS } }
            # Bearer for the Gmail read+draft broker (apps/gmail-broker). It reaches ONLY the broker's tools;
            # Hermes never holds a Google token. Used by config.yaml mcp_servers.gmail.headers.
            - name: GMAIL_BROKER_TOKEN
              valueFrom: { secretKeyRef: { name: gmail-broker-token, key: BROKER_TOKEN } }
            # Bearer for the Gnotes MCP adapter (apps/gnotes-mcp, #163). config.yaml mcp_servers.gnotes.headers.
            - name: GNOTES_MCP_TOKEN
              valueFrom: { secretKeyRef: { name: gnotes-mcp-token, key: MCP_TOKEN } }
          ports:
            - { name: dashboard, containerPort: 9119 }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }      # Chromium is the memory hog
          securityContext:
            runAsUser: 0                         # s6 /init: chown + setuid drop to uid 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
          # /api/status is unauthenticated by design (it reports auth_required). No liveness probe: s6 already
          # restarts a crashed gateway/dashboard, and a liveness loop would kill the pod during OAuth setup or
          # an LLM outage.
          startupProbe:
            httpGet: { path: /api/status, port: 9119 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/status, port: 9119 }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: dshm, mountPath: /dev/shm }
        - name: signal-cli
          image: ghcr.io/asamk/signal-cli:0.14.9@sha256:a6b1fc309cd8e6bab1c239bd5afaffa978ae252921e6b529643e84e180e0c4aa
          # Idle until registered (exec'ing register/verify needs the account unlocked), then the daemon.
          command: ["/bin/bash", "-c"]
          args:
            - |
              C=/var/lib/signal-cli
              until [ -f "$C/hermes-registered" ]; do
                echo "[signal] account not registered yet; see the hermes-agent skill"; sleep 60
              done
              exec /opt/signal-cli/bin/signal-cli --config="$C" -a "$SIGNAL_ACCOUNT" daemon --http 127.0.0.1:8080
          env:
            - name: SIGNAL_ACCOUNT
              valueFrom: { secretKeyRef: { name: hermes-signal, key: SIGNAL_ACCOUNT } }
            - { name: JAVA_OPTS, value: "-Xmx384m" }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            runAsUser: 999                       # image USER signal-cli (useradd --system)
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: signal, mountPath: /var/lib/signal-cli }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: hermes-data } }
        - { name: signal, persistentVolumeClaim: { claimName: hermes-signal-data } }
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }
