# Frigate NVR — two Tapo C200 cameras: 24/7 recording, CPU object detection,
# manual ONVIF PTZ.
#
# Design notes (2026-09-06):
#   * NO GPU. Recording is a pure H.264 stream-copy; object detection runs on the
#     CPU via OpenVINO. Attaching the RTX PRO 6000 would add contention + risk (it
#     is the LLM-serving critical resource and periodically GSP-crashes, see
#     CLAUDE.md) for no real benefit at this scale, and a GPU wedge would take
#     detection down too. Frigate stays CPU.
#   * LATEST FRIGATE. The blakeshome chart is stale (chart 7.8.0 still ships
#     appVersion 0.14.1), so we pin the newest chart but OVERRIDE image.tag to the
#     latest STABLE Frigate (0.17.2; 0.18 is beta/RC only as of 2026-09).
#   * STORAGE SPLIT (mirrors apps/jellyfin.yaml): recordings -> HDD
#     (local-path-hdd, /var/mnt/hdd-storage); the SQLite DB + config -> NVMe.
#   * PRIVATE, UI-DRIVEN CONFIG. This repo is PUBLIC, so no camera details live in
#     git. The LIVE config is the writable file on the config PVC
#     (/config/active-config.yml, CONFIG_FILE points there) and is edited via the
#     Frigate UI (Settings -> Config editor) -- those edits STICK across restarts.
#     The SOPS-encrypted apps/frigate-config.enc.yaml Secret (key config.yml) is
#     only a first-boot / disaster-recovery BASELINE: the init container seeds it
#     ONLY IF the PVC file is absent, so it never clobbers UI edits. The config PVC
#     is reclaimPolicy RETAIN (see persistence note) so a prune can't delete the
#     config + DB. The stub `config:` below is unused and holds nothing sensitive.
#     NOTE: git DRIFTS from the live UI-edited config by design. To refresh the
#     baseline from live: kubectl exec <pod> -- cat /config/active-config.yml, put
#     it in the Secret (sops), re-encrypt, commit.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: frigate
      # Latest chart: https://github.com/blakeblackshear/blakeshome-charts/blob/master/charts/frigate/Chart.yaml
      version: 7.8.0
      sourceRef:
        kind: HelmRepository
        name: blakeblackshear
        namespace: flux-system
      interval: 5m
  # Default values:
  # https://github.com/blakeblackshear/blakeshome-charts/blob/master/charts/frigate/values.yaml
  values:
    image:
      repository: ghcr.io/blakeblackshear/frigate
      # Latest STABLE Frigate (overrides the chart's 0.14.1 appVersion). Non-GPU
      # standard image (CPU/OpenVINO); no -tensorrt variant needed.
      tag: "0.17.2"
      pullPolicy: IfNotPresent

    strategyType: Recreate

    # No GPU (see header). Frigate does not need it here.
    gpu:
      nvidia:
        enabled: false

    env:
      TZ: America/New_York
      # Load the real config from the secret-seeded, writable file (see
      # extraInitContainers). This overrides the chart's public configmap.
      CONFIG_FILE: /config/active-config.yml

    # Mount the SOPS-encrypted full config (read-only) so the init container can
    # seed it. Nothing here or in the public config below reveals the cameras.
    extraVolumes:
      - name: secret-config
        secret:
          secretName: frigate-config

    # Seed the writable config from the encrypted Secret ONLY IF ABSENT, so the
    # PVC copy (edited live via the Frigate UI) stays the source of truth and UI
    # edits persist. The Secret is only the first-boot / disaster-recovery baseline.
    # Uses the already-pulled Frigate image. Runs before the chart's own copyconfig;
    # both touch the /config PVC but write different files, no clash.
    extraInitContainers:
      - name: seed-config
        image: ghcr.io/blakeblackshear/frigate:0.17.2
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - |
            if [ -f /config/active-config.yml ]; then
              echo "active-config.yml present on PVC -> keeping the live (UI-managed) config"
            else
              cp /secret-config/config.yml /config/active-config.yml
              echo "seeded active-config.yml from the encrypted baseline (first boot / recovery)"
            fi
        volumeMounts:
          - name: secret-config
            mountPath: /secret-config
            readOnly: true
          - name: config
            mountPath: /config

    # Shared memory + tmpfs are RAM (node is 46GB, no swap). Two cameras with
    # detection on their 720p sub streams still need little; keep these modest.
    shmSize: 512Mi
    tmpfs:
      enabled: true
      sizeLimit: 512Mi

    persistence:
      config:
        # SQLite DB (frigate.db) + the LIVE active-config.yml (source of truth now)
        # -> NVMe. This volume's PV is patched to reclaimPolicy RETAIN (imperative,
        # out-of-band) so a prune/delete can't wipe the config + DB. A full cluster
        # rebuild would provision a fresh Delete PV -> re-patch to Retain then.
        enabled: true
        storageClass: local-path
        size: 2Gi
        accessMode: ReadWriteOnce
      media:
        # Recordings (/media/frigate) -> HDD. ~2 cameras x 1080p15 for 3 days is
        # well under 300Gi (retain days is what actually bounds usage).
        enabled: true
        storageClass: local-path-hdd
        size: 300Gi
        accessMode: ReadWriteOnce
      data:
        # Not needed (emptyDir default). Frigate keeps its DB under /config.
        enabled: false

    ingress:
      enabled: true
      ingressClassName: private
      hosts:
        - host: frigate.hoam.lan
          paths:
            - path: /
              portName: http

    # Two cameras + CPU detection. No CPU limit (let it burst on startup / DB
    # maintenance without throttling); memory bounded to protect the node.
    resources:
      requests:
        cpu: 1000m
        memory: 768Mi
      limits:
        memory: 3Gi

    # STUB ONLY — the real config is in the SOPS Secret (loaded via CONFIG_FILE).
    # This is what the chart puts in its PUBLIC configmap, so it must stay free of
    # any camera details. Frigate does not read it (CONFIG_FILE points elsewhere).
    config: |
      # Intentionally empty stub. Real config lives in the SOPS-encrypted
      # `frigate-config` Secret and is loaded via CONFIG_FILE. See this app's
      # header comment in apps/frigate.yaml.
      mqtt:
        enabled: false
