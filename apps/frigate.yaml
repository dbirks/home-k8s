# Frigate NVR — single kids-room camera: 24/7 recording + CPU object detection.
#
# Design notes (2026-09-06):
#   * NO GPU. Recording is a pure H.264 stream-copy; object detection runs on the
#     CPU via OpenVINO (one camera at 5fps is trivial on 32 threads). Attaching
#     the RTX PRO 6000 would add contention + risk (it is the LLM-serving critical
#     resource and periodically GSP-crashes, see CLAUDE.md) for no real benefit at
#     this scale, and a GPU wedge would take detection down too. Frigate stays CPU.
#   * LATEST FRIGATE. The blakeshome chart is stale (chart 7.8.0 still ships
#     appVersion 0.14.1), so we pin the newest chart but OVERRIDE image.tag to the
#     latest STABLE Frigate (0.17.2; 0.18 is beta/RC only as of 2026-09).
#   * STORAGE SPLIT (mirrors apps/jellyfin.yaml): recordings -> HDD
#     (local-path-hdd, /var/mnt/hdd-storage, ~2.3TB free); the SQLite DB + config
#     -> NVMe (local-path) for fsync safety.
#   * SECRET OUT OF GIT. The repo is PUBLIC, so the RTSP password lives only in
#     the SOPS-encrypted apps/frigate-rtsp-credentials.enc.yaml, injected as env
#     FRIGATE_RTSP_PASSWORD and referenced as {FRIGATE_RTSP_PASSWORD} in config.
#
# Camera: TP-Link Tapo C200 (kids' room) @ 10.0.0.142 — stream1 = H.264
#         1920x1080@15fps (main), stream2 = H.264 1280x720 (sub), G.711 audio.
#         Pan/tilt via ONVIF on :2020 (manual PTZ, see camera onvif block).
# NOTE: the actual FRONT-DOOR camera is an Aqara G2H Pro on Apple HomeKit
#       Secure Video (10.0.0.170) — no RTSP, deliberately NOT in Frigate.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: frigate
      # Latest chart: https://github.com/blakeblackshear/blakeshome-charts/blob/master/charts/frigate/Chart.yaml
      version: 7.8.0
      sourceRef:
        kind: HelmRepository
        name: blakeblackshear
        namespace: flux-system
      interval: 5m
  # Default values:
  # https://github.com/blakeblackshear/blakeshome-charts/blob/master/charts/frigate/values.yaml
  values:
    image:
      repository: ghcr.io/blakeblackshear/frigate
      # Latest STABLE Frigate (overrides the chart's 0.14.1 appVersion). Non-GPU
      # standard image (CPU/OpenVINO); no -tensorrt variant needed.
      tag: "0.17.2"
      pullPolicy: IfNotPresent

    strategyType: Recreate

    # No GPU (see header). Frigate does not need it for record-only.
    gpu:
      nvidia:
        enabled: false

    env:
      TZ: America/New_York

    # RTSP password from the SOPS-encrypted Secret (key FRIGATE_RTSP_PASSWORD).
    envFromSecrets:
      - frigate-rtsp-credentials

    # Shared memory + tmpfs are RAM (node is 46GB, no swap). One camera with
    # detection on the 720p sub stream still needs little; keep these modest.
    shmSize: 512Mi
    tmpfs:
      enabled: true
      sizeLimit: 512Mi

    persistence:
      config:
        # SQLite DB (frigate.db) + writable config -> NVMe.
        enabled: true
        storageClass: local-path
        size: 2Gi
        accessMode: ReadWriteOnce
      media:
        # Recordings (/media/frigate) -> HDD. 3 days of 1080p15 H.264 is ~100GB;
        # 300Gi is generous headroom (retain.days is what actually bounds usage).
        enabled: true
        storageClass: local-path-hdd
        size: 300Gi
        accessMode: ReadWriteOnce
      data:
        # Not needed (emptyDir default). Frigate keeps its DB under /config.
        enabled: false

    ingress:
      enabled: true
      ingressClassName: private
      hosts:
        - host: frigate.hoam.lan
          paths:
            - path: /
              portName: http

    # Modest, bounded footprint. No CPU limit (stream-copy is cheap but let it
    # burst on startup / DB maintenance without throttling).
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 2Gi

    config: |
      # MQTT is optional; we run standalone (no Home Assistant wiring yet).
      mqtt:
        enabled: false

      # OpenVINO object detector on the CPU (SSDLite MobileNet v2, bundled in the
      # image at /openvino-model). One camera at 5 fps is trivial for the 32-thread
      # CPU. Deliberately NOT on the GPU: the card is unstable (FULLCHIP resets)
      # and LLM-critical, and a GPU wedge would take detection down with it -- not
      # worth it for a single camera. Revisit GPU/TensorRT only at many-camera scale.
      detectors:
        ov:
          type: openvino
          device: CPU
      model:
        width: 300
        height: 300
        input_tensor: nhwc
        input_pixel_format: bgr
        path: /openvino-model/ssdlite_mobilenet_v2.xml
        labelmap_path: /openvino-model/coco_91cl_bkgr.txt

      # go2rtc restream: ONE connection to the camera, reused for both live view
      # and recording. Password injected from the env var (kept out of git).
      go2rtc:
        streams:
          kids_room:
            - rtsp://admin1:{FRIGATE_RTSP_PASSWORD}@10.0.0.142:554/stream1
          kids_room_sub:
            - rtsp://admin1:{FRIGATE_RTSP_PASSWORD}@10.0.0.142:554/stream2

      # 24/7 continuous recording, retained 3 days. In Frigate 0.16+ continuous
      # retention is `record.continuous.days` (the old `retain.mode: all` now
      # governs event recordings only, of which we have none since detection is
      # off). Audio is recorded (AAC) via the camera output_args below.
      record:
        enabled: true
        continuous:
          days: 3

      # Object detection ON -> builds a searchable timeline of movement (who/what
      # moved and when). Detection runs on the camera's sub stream (see below).
      detect:
        enabled: true
        fps: 5
      # Snapshots give each tracked event a thumbnail in the UI timeline.
      snapshots:
        enabled: true
        retain:
          default: 3
      # Track people plus common critters/vehicles (default would be person only).
      # These are COCO classes the bundled model knows.
      objects:
        track:
          - person
          - cat
          - dog
          - car

      # Birdseye mosaic off (saves CPU; single camera).
      birdseye:
        enabled: false

      cameras:
        kids_room:
          enabled: true
          ffmpeg:
            inputs:
              # Main stream -> recording (pull from the go2rtc restream).
              - path: rtsp://127.0.0.1:8554/kids_room
                input_args: preset-rtsp-restream
                roles:
                  - record
              # Sub stream (720p) -> object detection. Detecting on the lighter
              # sub stream keeps CPU low; recording still uses the full 1080p.
              - path: rtsp://127.0.0.1:8554/kids_room_sub
                input_args: preset-rtsp-restream
                roles:
                  - detect
            # Record audio: the camera streams G.711 (pcm_alaw), which is not
            # mp4-compatible for stream-copy, so transcode audio to AAC (cheap,
            # CPU-only). This records sound; it is NOT audio-event detection.
            output_args:
              record: preset-record-generic-audio-aac
          # Live view stream picker (Frigate 0.16+ schema: friendly name -> go2rtc
          # stream). First entry is the dashboard default.
          live:
            streams:
              Main: kids_room
              Sub: kids_room_sub
          # Detect on the sub stream's native resolution (1280x720).
          detect:
            enabled: true
            width: 1280
            height: 720
            fps: 5
          audio:
            enabled: false
          # Manual PTZ: the camera is a TP-Link Tapo C200 (pan/tilt, 8 presets)
          # that speaks ONVIF on :2020. This enables the pan/tilt + preset
          # controls in the Frigate UI. Autotracking is NOT enabled (it requires
          # object detection, which is off here) -- these are manual controls.
          onvif:
            host: 10.0.0.142
            port: 2020
            user: admin1
            password: "{FRIGATE_RTSP_PASSWORD}"
