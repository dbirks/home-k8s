# Phase Q v2 — AutoRound k-quant GGUF for Qwen3.8-27B (#89). Base on HDD; outputs on HDD.
# Fix vs v1: AutoRound's GGUF converter can't map the MTP head ('model.layers.64.eh_proj') for
# the qwen3_5 arch -> ValueError at export. We monkeypatch modify_tensors to SKIP unmappable MTP
# tensors (the k-quants of the LM are fine; GGUF simply won't carry MTP, which is standard — most
# llama.cpp/Ollama/LM Studio users don't use MTP). Also fixed the non-recursive *.gguf glob.
# Order: smoke -> RTN ladder (usable q4/q5/q6/q8 first) -> RTN q3 baseline -> TUNED q2/q3.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen38-gguf-quant-script
  namespace: default
data:
  gexport.py: |
    #!/usr/bin/env python3
    import sys, glob, inspect
    iters = int(sys.argv[1]); outdir = sys.argv[2]; fmt = sys.argv[3]; nsamples = int(sys.argv[4])
    # --- skip unmappable MTP tensors during GGUF export (qwen3_5 'model.layers.64.eh_proj') ---
    # modify_tensors is a GENERATOR (yield from super()); the ValueError raises during ITERATION
    # (convert.py) and in base.map_tensor_name — so the wrapper MUST be generator-safe.
    from auto_round.export.export_to_gguf.conversion import qwen as QM
    from auto_round.export.export_to_gguf.conversion import base as BM
    def make_patch(orig):
        def patched(self, *a, **k):
            gen = orig(self, *a, **k)
            while True:
                try:
                    item = next(gen)
                except StopIteration:
                    return
                except ValueError as e:
                    if "Can not map tensor" in str(e):
                        print("SKIP-MTP-TENSOR:", a[1] if len(a) > 1 else "?", flush=True); return
                    raise
                yield item
        return patched
    npatch = 0
    for _mod in (QM, BM):
        for _n, cls in inspect.getmembers(_mod, inspect.isclass):
            if "modify_tensors" in getattr(cls, "__dict__", {}):
                cls.modify_tensors = make_patch(cls.__dict__["modify_tensors"]); npatch += 1
    print(f"patched modify_tensors on {npatch} converter class(es)", flush=True)
    from auto_round import AutoRound
    kw = dict(model="/dataset/base/Qwen3.8-27B", scheme="W4A16", device_map=0,
              trust_remote_code=True, iters=iters)
    if iters > 0:
        kw.update(dataset="NeelNanda/pile-10k", nsamples=nsamples, seqlen=2048)
    ar = AutoRound(**kw)
    ar.quantize_and_save(output_dir=outdir, format=fmt)
    g = glob.glob(outdir + "/**/*.gguf", recursive=True)
    print("EXPORT DONE", outdir, fmt, "->", g, flush=True)
    if not g:
        print("NO GGUF PRODUCED"); sys.exit(3)
  run.sh: |
    #!/bin/bash
    set -uo pipefail
    export HF_HOME=/data TOKENIZERS_PARALLELISM=false PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    OUT=/dataset/qwen38-gguf
    RES=$OUT/RESULTS.md
    MODELNAME=Qwen3.8-27B
    mkdir -p "$OUT"
    echo "=== [$(date)] deps ==="
    pip install -q --root-user-action ignore auto-round gguf 2>&1 | tail -2
    python3 -c "import auto_round,torch;print('auto_round',getattr(auto_round,'__version__','?'),'torch',torch.__version__,'cuda',torch.cuda.is_available())"
    [ -f /dataset/base/Qwen3.8-27B/config.json ] || { echo "NO BASE"; exit 2; }

    run_export () { # iters outdir formatlist nsamples ; tee to persistent log
      echo "=== [$(date)] export iters=$1 -> $3 ==="
      python3 /scripts/gexport.py "$1" "$2" "$3" "$4" 2>&1 | tee -a "$OUT/phaseQ.log" | tail -25
    }

    # 1) SMOKE — validates the MTP-skip fix end to end (fast RTN)
    rm -rf "$OUT/_smoke"
    run_export 0 "$OUT/_smoke" "gguf:q4_k_m" 2
    test -n "$(find "$OUT/_smoke" -name '*.gguf' 2>/dev/null)" || { echo "!!! SMOKE FAILED"; exit 3; }
    echo "SMOKE OK"

    # 2) RTN ladder (usable quants first): q4_k_m,q5_k_m,q6_k,q8_0
    run_export 0 "$OUT/ladder" "gguf:q4_k_m,gguf:q5_k_m,gguf:q6_k,gguf:q8_0" 2
    # 3) RTN q3_k_m baseline (for the perplexity gate)
    run_export 0 "$OUT/rtn" "gguf:q3_k_m" 2
    # 4) TUNED low-bit (AutoRound's edge): q2_k_s,q3_k_m
    run_export 200 "$OUT/tuned" "gguf:q2_k_s,gguf:q3_k_m" 128

    # flatten -> bartowski-style names + record sizes
    echo "=== [$(date)] collecting -> flat names ==="
    declare -A SEEN
    for src in $(find "$OUT/tuned" "$OUT/ladder" -name '*.gguf' 2>/dev/null); do
      q=$(echo "$src" | grep -oiE "q[0-9]_k_[sml]|q[0-9]_k|q[0-9]_[01]|q8_0" | head -1 | tr 'a-z' 'A-Z')
      [ -z "$q" ] && continue
      [ -n "${SEEN[$q]:-}" ] && continue; SEEN[$q]=1
      cp -f "$src" "$OUT/${MODELNAME}-${q}.gguf" && echo "  $q"
    done
    rtnq3=$(find "$OUT/rtn" -name '*.gguf' 2>/dev/null | head -1)
    [ -n "$rtnq3" ] && cp -f "$rtnq3" "$OUT/_baseline-Q3_K_M-rtn.gguf"
    {
      echo ""; echo "## GGUF sizes ($(date -u +%FT%TZ))"
      echo "| file | size |"; echo "|---|---|"
      for f in "$OUT"/${MODELNAME}-*.gguf; do printf "| %s | %s |\n" "$(basename "$f")" "$(du -h "$f"|cut -f1)"; done
    } >> "$RES"
    echo "=== RESULTS ==="; cat "$RES"
    touch "$OUT/quant.done"
    echo "=== [$(date)] Phase Q complete ==="
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen38-gguf-quant-v3-20260816
  namespace: default
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels: { app: qwen38-gguf-quant }
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      enableServiceLinks: false
      containers:
        - name: quant
          image: vllm/vllm-openai:muse-glimmer-x86_64-cu130
          command: ["/bin/bash", "/scripts/run.sh"]
          env:
            - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } } }
            - { name: HF_HUB_DISABLE_XET, value: "1" }
          resources:
            limits: { nvidia.com/gpu: 1, memory: 40Gi }
            requests: { cpu: "6", memory: 24Gi }
          volumeMounts:
            - { name: dataset, mountPath: /dataset }
            - { name: models, mountPath: /data }
            - { name: scripts, mountPath: /scripts }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: dataset, persistentVolumeClaim: { claimName: dspark-dataset-hdd } }
        - { name: models, persistentVolumeClaim: { claimName: vllm-models } }
        - { name: scripts, configMap: { name: qwen38-gguf-quant-script, defaultMode: 0755 } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
