# Phase Q v4 — AutoRound k-quant GGUF for Qwen3.8-27B (#89). Base + outputs on HDD.
# Deterministic MTP fix: AutoRound's GGUF converter can't map the qwen3_5 MTP head. Monkeypatching
# the generator chain didn't catch it, so instead we build an MTP-STRIPPED copy of the base
# (the 15 `mtp.*` tensors live only in shard 18) and set mtp_num_hidden_layers:0, then export from
# that — the converter never sees MTP. GGUF ships without MTP (standard for llama.cpp/Ollama).
# Order: build-nomtp -> smoke -> RTN ladder (q4/q5/q6/q8) -> RTN q3 baseline -> TUNED q2/q3.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen38-gguf-quant-script
  namespace: default
data:
  build_nomtp.py: |
    #!/usr/bin/env python3
    import os, json, struct, re
    src = "/dataset/base/Qwen3.8-27B"; dst = "/dataset/base/Qwen3.8-27B-nomtp"
    if os.path.isfile(dst + "/config.json"):
        print("nomtp already built", flush=True); raise SystemExit(0)
    os.makedirs(dst, exist_ok=True)
    wm = json.load(open(f"{src}/model.safetensors.index.json"))["weight_map"]
    def is_mtp(k):
        if k.startswith("mtp.") or ".mtp." in k or "eh_proj" in k: return True
        m = re.search(r"\.layers\.(\d+)\.", k)
        return bool(m and int(m.group(1)) >= 64)
    mtp = [k for k in wm if is_mtp(k)]
    affected = sorted(set(wm[k] for k in mtp))
    print("mtp keys:", len(mtp), "affected shards:", affected, flush=True)
    assert mtp and affected, "no mtp keys detected"
    from safetensors import safe_open
    from safetensors.torch import save_file
    for f in os.listdir(src):
        if f in affected or f in ("model.safetensors.index.json", "config.json"): continue
        os.symlink(os.path.join(src, f), os.path.join(dst, f))
    for shard in affected:
        keep = {}
        with safe_open(f"{src}/{shard}", framework="pt") as fp:
            for k in fp.keys():
                if k in mtp: continue
                keep[k] = fp.get_tensor(k)
        save_file(keep, f"{dst}/{shard}", metadata={"format": "pt"})
        print("rewrote", shard, "kept", len(keep), flush=True)
    new_wm = {k: v for k, v in wm.items() if k not in mtp}
    def hdr(p):
        with open(p, "rb") as f:
            n = struct.unpack("<Q", f.read(8))[0]; return json.loads(f.read(n))
    total = 0
    for shard in sorted(set(new_wm.values())):
        for k, v in hdr(f"{dst}/{shard}").items():
            if k == "__metadata__": continue
            if k in new_wm: s, e = v["data_offsets"]; total += e - s
    json.dump({"metadata": {"total_size": total}, "weight_map": new_wm},
              open(f"{dst}/model.safetensors.index.json", "w"))
    cfg = json.load(open(f"{src}/config.json"))
    def zero_mtp(d):
        if isinstance(d, dict):
            for k in list(d):
                if k == "mtp_num_hidden_layers": d[k] = 0
                else: zero_mtp(d[k])
        elif isinstance(d, list):
            for x in d: zero_mtp(x)
    zero_mtp(cfg)
    json.dump(cfg, open(f"{dst}/config.json", "w"), indent=2)
    print("nomtp built: kept", len(new_wm), "tensors, total_size", total, flush=True)
  gexport.py: |
    #!/usr/bin/env python3
    import sys, glob
    iters = int(sys.argv[1]); outdir = sys.argv[2]; fmt = sys.argv[3]; nsamples = int(sys.argv[4])
    base = sys.argv[5]
    from auto_round import AutoRound
    kw = dict(model=base, scheme="W4A16", device_map=0, trust_remote_code=True, iters=iters)
    if iters > 0:
        kw.update(dataset="NeelNanda/pile-10k", nsamples=nsamples, seqlen=2048)
    ar = AutoRound(**kw)
    ar.quantize_and_save(output_dir=outdir, format=fmt)
    g = glob.glob(outdir + "/**/*.gguf", recursive=True)
    print("EXPORT DONE", outdir, fmt, "->", g, flush=True)
    if not g:
        print("NO GGUF PRODUCED"); sys.exit(3)
  run.sh: |
    #!/bin/bash
    set -uo pipefail
    # Keep ALL temp/cache off the NVMe (ephemeral) — the gguf export stages a ~q8-sized temp file
    # that previously evicted the pod. Point everything at the 2TB HDD.
    export TMPDIR=/dataset/tmp TMP=/dataset/tmp TEMP=/dataset/tmp XDG_CACHE_HOME=/dataset/tmp
    mkdir -p /dataset/tmp
    export HF_HOME=/data TOKENIZERS_PARALLELISM=false PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    OUT=/dataset/qwen38-gguf
    RES=$OUT/RESULTS.md
    MODELNAME=Qwen3.8-27B
    NOMTP=/dataset/base/Qwen3.8-27B-nomtp
    mkdir -p "$OUT"
    echo "=== [$(date)] deps ==="
    pip install -q --root-user-action ignore auto-round gguf 2>&1 | tail -2
    python3 -c "import auto_round,torch;print('auto_round',getattr(auto_round,'__version__','?'),'torch',torch.__version__)"

    echo "=== [$(date)] build MTP-stripped base ==="
    python3 /scripts/build_nomtp.py 2>&1 | tee -a "$OUT/phaseQ.log"
    [ -f "$NOMTP/config.json" ] || { echo "nomtp build failed"; exit 2; }

    run_one () { # iters format nsamples outdir  (ONE format per call — multi-format packs identical/wrong)
      echo "=== [$(date)] export iters=$1 gguf:$2 -> $4 ==="
      python3 /scripts/gexport.py "$1" "$4" "gguf:$2" "$3" "$NOMTP" 2>&1 | tee -a "$OUT/phaseQ.log" | tail -15
    }

    # RTN ladder — q4_k_m first (headline + validates the pipeline). Each is a separate call.
    for f in q4_k_m q5_k_m q6_k q8_0 q3_k_m; do run_one 0 "$f" 2 "$OUT/rtn_$f"; done
    test -n "$(find "$OUT/rtn_q4_k_m" -name '*Q4_K_M*.gguf' 2>/dev/null)" || { echo "!!! Q4_K_M FAILED"; exit 3; }
    echo "RTN LADDER OK"
    # TUNED low-bit — AutoRound's edge at 2-3 bit (iters=200)
    for f in q3_k_m q2_k_s; do run_one 200 "$f" 128 "$OUT/tuned_$f"; done

    echo "=== [$(date)] collecting -> flat bartowski-style names ==="
    declare -A PICK
    PICK[Q4_K_M]="$OUT/rtn_q4_k_m"; PICK[Q5_K_M]="$OUT/rtn_q5_k_m"; PICK[Q6_K]="$OUT/rtn_q6_k"
    PICK[Q8_0]="$OUT/rtn_q8_0"; PICK[Q3_K_M]="$OUT/tuned_q3_k_m"; PICK[Q2_K_S]="$OUT/tuned_q2_k_s"
    for q in "${!PICK[@]}"; do
      src=$(find "${PICK[$q]}" -name "*${q}*.gguf" 2>/dev/null | head -1)
      [ -n "$src" ] && cp -f "$src" "$OUT/${MODELNAME}-${q}.gguf" && echo "  $q <- $(basename "$src")"
    done
    # perplexity-gate baseline (RTN q3) + one vision projector
    b=$(find "$OUT/rtn_q3_k_m" -name '*Q3_K_M*.gguf' 2>/dev/null | head -1)
    [ -n "$b" ] && cp -f "$b" "$OUT/_baseline-Q3_K_M-rtn.gguf"
    mm=$(find "$OUT"/rtn_q4_k_m "$OUT"/rtn_q8_0 -name 'mmproj*.gguf' 2>/dev/null | head -1)
    [ -n "$mm" ] && cp -f "$mm" "$OUT/mmproj-${MODELNAME}-f16.gguf" && echo "  mmproj <- $(basename "$mm")"
    {
      echo ""; echo "## GGUF sizes ($(date -u +%FT%TZ))"
      echo "| file | size |"; echo "|---|---|"
      for f in "$OUT"/${MODELNAME}-*.gguf; do printf "| %s | %s |\n" "$(basename "$f")" "$(du -h "$f"|cut -f1)"; done
    } >> "$RES"
    echo "=== RESULTS ==="; cat "$RES"
    touch "$OUT/quant.done"
    echo "=== [$(date)] Phase Q complete ==="
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen38-gguf-quant-v6-20260816
  namespace: default
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels: { app: qwen38-gguf-quant }
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      enableServiceLinks: false
      containers:
        - name: quant
          image: vllm/vllm-openai:muse-glimmer-x86_64-cu130
          command: ["/bin/bash", "/scripts/run.sh"]
          env:
            - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } } }
            - { name: HF_HUB_DISABLE_XET, value: "1" }
          resources:
            limits: { nvidia.com/gpu: 1, memory: 40Gi }
            requests: { cpu: "6", memory: 24Gi }
          volumeMounts:
            - { name: dataset, mountPath: /dataset }
            - { name: models, mountPath: /data }
            - { name: scripts, mountPath: /scripts }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: dataset, persistentVolumeClaim: { claimName: dspark-dataset-hdd } }
        - { name: models, persistentVolumeClaim: { claimName: vllm-models } }
        - { name: scripts, configMap: { name: qwen38-gguf-quant-script, defaultMode: 0755 } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
