    #!/usr/bin/env python3
    """Common evaluator (ADR-0007): render the held-out COLMAP cameras from any 3DGS PLY with gsplat and score them.

    usage: eval_splat.py <model.ply> <test_view_dir (images/ + sparse/0)> <run_dir> [--max-side 1600]
    Writes <run_dir>/renders/heldout/<stem>.png, <run_dir>/metrics/quality.json (recon QualityReport),
    <run_dir>/contact_sheet.jpg. Policy: black background, GT resized to the render size (LANCZOS) only if they differ,
    no exposure alignment, LPIPS = VGG (INRIA 3DGS convention), SSIM = 11x11 gaussian (torchmetrics).
    """

    import argparse
    import json
    import os
    import struct
    import sys

    import numpy as np
    import torch
    from PIL import Image, ImageDraw

    CAM_PARAMS = {0: 3, 1: 4, 2: 4, 3: 5, 4: 8, 5: 12, 6: 8}  # SIMPLE_PINHOLE PINHOLE SIMPLE_RADIAL RADIAL OPENCV ...


    def read_cameras(path):
        cams = {}
        with open(path, "rb") as f:
            (n,) = struct.unpack("<Q", f.read(8))
            for _ in range(n):
                cid, model, w, h = struct.unpack("<iiQQ", f.read(24))
                params = struct.unpack(f"<{CAM_PARAMS[model]}d", f.read(8 * CAM_PARAMS[model]))
                fx, fy, cx, cy = (params[0], params[0], params[1], params[2]) if model in (0, 2, 3) else params[:4]
                cams[cid] = (w, h, fx, fy, cx, cy, model)
        return cams


    def read_images(path):
        out = []
        with open(path, "rb") as f:
            (n,) = struct.unpack("<Q", f.read(8))
            for _ in range(n):
                _iid, qw, qx, qy, qz, tx, ty, tz, cid = struct.unpack("<i7di", f.read(64))
                name = b""
                while (c := f.read(1)) != b"\x00":
                    name += c
                (npts,) = struct.unpack("<Q", f.read(8))
                f.seek(24 * npts, 1)
                R = np.array([[1 - 2 * (qy * qy + qz * qz), 2 * (qx * qy - qw * qz), 2 * (qx * qz + qw * qy)],
                              [2 * (qx * qy + qw * qz), 1 - 2 * (qx * qx + qz * qz), 2 * (qy * qz - qw * qx)],
                              [2 * (qx * qz - qw * qy), 2 * (qy * qz + qw * qx), 1 - 2 * (qx * qx + qy * qy)]])
                out.append((name.decode(), R, np.array([tx, ty, tz]), cid))
        return sorted(out, key=lambda x: x[0])


    def read_ply(path):
        with open(path, "rb") as f:
            header, n, props = [], 0, []
            while (line := f.readline().decode("ascii", "replace").strip()) != "end_header":
                header.append(line)
                if line.startswith("element vertex"):
                    n = int(line.split()[-1])
                elif line.startswith("property") and n and not line.startswith("property list"):
                    _, typ, name = line.split()
                    props.append((name, {"float": "<f4", "double": "<f8", "uchar": "u1", "int": "<i4"}[typ]))
            if "format binary_little_endian 1.0" not in header:
                raise SystemExit(f"unsupported PLY format: {header[:2]}")
            data = np.fromfile(f, dtype=np.dtype(props), count=n)
        if len(data) != n or n == 0:
            raise SystemExit(f"truncated/empty PLY: {len(data)}/{n} vertices")
        names = data.dtype.names
        col = lambda p: np.stack([data[k] for k in sorted((k for k in names if k.startswith(p)),  # noqa: E731
                                                         key=lambda s: int(s.rsplit("_", 1)[1]))], 1).astype(np.float32)
        means = np.stack([data["x"], data["y"], data["z"]], 1).astype(np.float32)
        dc = col("f_dc_")
        rest = col("f_rest_") if any(k.startswith("f_rest_") for k in names) else np.zeros((n, 0), np.float32)
        k = rest.shape[1] // 3
        sh = np.concatenate([dc[:, None, :], rest.reshape(n, 3, k).transpose(0, 2, 1)], 1)
        deg = int(round((sh.shape[1]) ** 0.5)) - 1
        scales = col("scale_")
        surfel = scales.shape[1] == 2
        if surfel:  # 2DGS surfels: give the normal axis a tiny extent (documented in notes)
            scales = np.concatenate([scales, np.full((n, 1), -10.0, np.float32)], 1)
        return dict(means=means, quats=col("rot_"), scales=scales, opac=data["opacity"].astype(np.float32), sh=sh, deg=deg, n=n, surfel=surfel)


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("ply"); ap.add_argument("test_dir"); ap.add_argument("run_dir")
        ap.add_argument("--max-side", type=int, default=1600)
        a = ap.parse_args()
        from gsplat import rasterization
        from torchmetrics.image import LearnedPerceptualImagePatchSimilarity, StructuralSimilarityIndexMeasure
        import gsplat

        dev = "cuda"
        g = read_ply(a.ply)
        t = {k: torch.from_numpy(v).to(dev) for k, v in g.items() if isinstance(v, np.ndarray)}
        quats = torch.nn.functional.normalize(t["quats"], dim=-1)
        ssim_m = StructuralSimilarityIndexMeasure(data_range=1.0).to(dev)
        lpips_m = LearnedPerceptualImagePatchSimilarity(net_type="vgg", normalize=True).to(dev)
        sp = os.path.join(a.test_dir, "sparse", "0")
        cams, views = read_cameras(os.path.join(sp, "cameras.bin")), read_images(os.path.join(sp, "images.bin"))
        out_r = os.path.join(a.run_dir, "renders", "heldout"); os.makedirs(out_r, exist_ok=True)
        os.makedirs(os.path.join(a.run_dir, "metrics"), exist_ok=True)
        per, pairs = [], []
        for name, R, tv, cid in views:
            w0, h0, fx, fy, cx, cy, _ = cams[cid]
            gt_img = Image.open(os.path.join(a.test_dir, "images", name)).convert("RGB")
            s = min(1.0, a.max_side / max(gt_img.size)) * gt_img.size[0] / w0
            W, H = round(w0 * s), round(h0 * s)
            if gt_img.size != (W, H):
                gt_img = gt_img.resize((W, H), Image.LANCZOS)
            K = torch.tensor([[fx * s, 0, cx * s], [0, fy * s, cy * s], [0, 0, 1]], dtype=torch.float32, device=dev)
            vm = torch.eye(4, device=dev); vm[:3, :3] = torch.from_numpy(R).float(); vm[:3, 3] = torch.from_numpy(tv).float()
            with torch.no_grad():
                img, _, _ = rasterization(t["means"], quats, torch.exp(t["scales"]), torch.sigmoid(t["opac"]), t["sh"],
                                          vm[None], K[None], W, H, sh_degree=g["deg"])  # default background is black
                pred = img[0].clamp(0, 1)
                gt = torch.from_numpy(np.asarray(gt_img, np.float32) / 255.0).to(dev)
                mse = torch.mean((pred - gt) ** 2).item()
                p, q = pred.permute(2, 0, 1)[None], gt.permute(2, 0, 1)[None]
                row = {"frame_id": os.path.splitext(name)[0], "psnr": min(100.0, -10 * np.log10(max(mse, 1e-10))),
                       "ssim": float(ssim_m(p, q)), "lpips": float(lpips_m(p, q))}
            per.append(row)
            rnd = Image.fromarray((pred.cpu().numpy() * 255 + 0.5).astype(np.uint8))
            rnd.save(os.path.join(out_r, row["frame_id"] + ".png"))
            pairs.append((row, gt_img, rnd))
            print(f"{name}: psnr {row['psnr']:.2f} ssim {row['ssim']:.4f} lpips {row['lpips']:.4f}", flush=True)
        mean = lambda k: float(np.mean([r[k] for r in per]))  # noqa: E731
        notes = "black bg; no exposure alignment; LPIPS vgg; SSIM torchmetrics gaussian 11x11"
        if g["surfel"]:
            notes += "; 2DGS surfels rendered as flat 3DGS (approximation)"
        report = {"split": "test", "n_views": len(per), "psnr": mean("psnr"), "ssim": mean("ssim"), "lpips": mean("lpips"),
                  "per_view": per, "renderer": f"gsplat-{gsplat.__version__} (common evaluator)", "notes": notes}
        json.dump(report, open(os.path.join(a.run_dir, "metrics", "quality.json"), "w"), indent=2)
        # contact sheet: 6 views, GT | render
        th = 240
        rows = pairs[:: max(1, len(pairs) // 6)][:6]
        sheet = Image.new("RGB", (2 * th * 16 // 9 + 4, len(rows) * (th + 4)), (20, 20, 20))
        for i, (row, gi, ri) in enumerate(rows):
            for j, im in enumerate((gi, ri)):
                im = im.copy(); im.thumbnail((th * 16 // 9, th))
                sheet.paste(im, (j * (th * 16 // 9 + 4), i * (th + 4)))
            ImageDraw.Draw(sheet).text((th * 16 // 9 + 10, i * (th + 4) + 4), f"{row['frame_id']} {row['psnr']:.1f}dB", fill=(255, 255, 0))
        sheet.save(os.path.join(a.run_dir, "contact_sheet.jpg"), quality=90)
        print("RECON_EVAL " + json.dumps({k: report[k] for k in ("n_views", "psnr", "ssim", "lpips", "renderer")}), flush=True)


    if __name__ == "__main__":
        sys.exit(main())
