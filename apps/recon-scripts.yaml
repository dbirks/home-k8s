    #!/bin/bash
    # recon in-cluster engine run (ADR-0007). One Job = one run: train ENGINE on the capture's canonical TRAIN view,
    # export model.ply, then score it with the common evaluator on the TEST view.
    #   env: RUN_ID ENGINE(t2|t3|t3-mcmc|t5) CAPTURE STEPS [MAX_RES=1600] [SEED=7]
    # Writes /data/runs/$RUN_ID/{logs/job.log,logs/train.log,artifacts/model.ply,renders/,metrics/quality.json,job.json}
    set -euo pipefail
    shopt -s inherit_errexit   # errors inside $(...) must fail the job (a broken venv was once marked ok)
    : "${RUN_ID:?}" "${ENGINE:?}" "${CAPTURE:?}" "${STEPS:?}"
    : "${MAX_RES:=1600}" "${SEED:=7}" "${MODE:=train}"   # MODE=eval: score an existing artifacts/model.ply
    CACHE=/data/cache/recon
    RUN=/data/runs/$RUN_ID
    VIEW=/data/captures/$CAPTURE/view
    mkdir -p "$RUN/logs" "$RUN/artifacts" "$CACHE"
    exec > >(tee -a "$RUN/logs/job.log") 2>&1
    T0=$(date +%s)
    echo "== recon run $RUN_ID engine=$ENGINE capture=$CAPTURE steps=$STEPS host=$(hostname) $(date -u +%FT%TZ)"
    GPU_LINE=$(nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader || echo "unknown,unknown,0")
    echo "gpu: $GPU_LINE"
    [ -s "$VIEW/sparse/0/images.bin" ] || { echo "FATAL: no train view at $VIEW (run the prep job)"; exit 2; }
    export PIP_CACHE_DIR=$CACHE/pip XDG_CACHE_HOME=$CACHE/xdg PIP_RETRIES=10 PIP_DEFAULT_TIMEOUT=120
    export TORCH_CUDA_ARCH_LIST="${TORCH_CUDA_ARCH_LIST:-12.0}" MAX_JOBS="${MAX_JOBS:-8}"

    : > "$RUN/nvsmi.csv"
    ( while true; do nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits >> "$RUN/nvsmi.csv" 2>/dev/null || true; sleep 5; done ) &
    SAMPLER=$!
    trap 'kill $SAMPLER 2>/dev/null || true' EXIT

    apt_deps() {
      if ! command -v git >/dev/null || ! command -v curl >/dev/null || ! ldconfig -p | grep -q libGL.so.1 || ! ldconfig -p | grep -q libvulkan.so.1; then
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git curl ca-certificates xz-utils libgl1 libglib2.0-0 \
          libvulkan1 libxcb1 libx11-6 libxkbcommon0 libegl1 ffmpeg >/dev/null
      fi
    }

    venv_gsplat() {  # gsplat 1.5.3 + examples deps; also used by the common evaluator
      local V=$CACHE/venv-gsplat-1.5.3
      export TORCH_EXTENSIONS_DIR=$CACHE/torch_ext/gsplat-1.5.3
      exec 9>"$CACHE/venv-gsplat.lock"; flock 9   # concurrent Jobs share this venv: build it once
      if [ ! -f "$V/.ok" ]; then {
        echo "-- setup gsplat venv (first run compiles CUDA for sm_${TORCH_CUDA_ARCH_LIST/./})"
        rm -rf "$V"; python -m venv --system-site-packages "$V"
        "$V/bin/pip" install -q ninja "gsplat==1.5.3" "torchmetrics[image]==1.9.0" "numpy<2" "tyro>=0.8.8" viser imageio[ffmpeg] \
          scikit-learn tqdm opencv-python-headless Pillow tensorboard tensorly pyyaml matplotlib splines
        "$V/bin/pip" install -q --no-build-isolation \
          "git+https://github.com/rmbrualla/pycolmap@cc7ea4b7301720ac29287dbe450952511b32125e" \
          "git+https://github.com/nerfstudio-project/nerfview@4538024fe0d15fd1a0e4d760f3695fc44ca72787" \
          "git+https://github.com/rahul-goel/fused-ssim@328dc9836f513d00c4b5bc38fe30478b4435cbb5" \
          "git+https://github.com/harry7557558/fused-bilagrid@90f9788e57d3545e3a033c1038bb9986549632fe"
        "$V/bin/python" -c "import torch, gsplat, torchmetrics; from gsplat.cuda._backend import _C; assert _C is not None; print('gsplat', gsplat.__version__, 'cuda ok', torch.cuda.get_device_name(0))"
        touch "$V/.ok"   # only reached when every step above succeeded (inherit_errexit)
      } >&2; fi
      flock -u 9
      echo "$V"
    }

    flag() {  # tyro boolean spelling differs across versions: flag <help-text> <field> <true|false>
      local help=$1 name=$2 val=$3 dash=${2//_/-}
      if [ "$val" = true ]; then
        for f in "--$name" "--$dash"; do grep -q -- "$f\b" <<<"$help" && { echo "$f"; return; }; done
      else
        for f in "--no-$dash" "--no_$name"; do grep -q -- "$f\b" <<<"$help" && { echo "$f"; return; }; done
      fi
      echo "--$name $([ "$val" = true ] && echo True || echo False)"
    }

    train_gsplat() {  # T3: gsplat examples/simple_trainer.py at v1.5.3; STRATEGY default|mcmc
      local strategy=$1 V; V=$(venv_gsplat | tail -1)
      export TORCH_EXTENSIONS_DIR=$CACHE/torch_ext/gsplat-1.5.3
      local SRC=$CACHE/src/gsplat-1.5.3
      if [ ! -f "$SRC/examples/simple_trainer.py" ]; then
        mkdir -p "$SRC"; curl -sL https://codeload.github.com/nerfstudio-project/gsplat/tar.gz/refs/tags/v1.5.3 | tar xz --strip-components=1 -C "$SRC"
      fi
      cd "$SRC/examples"
      local HELP; HELP=$("$V/bin/python" simple_trainer.py "$strategy" --help 2>&1 || true)
      # Canonical train view already excludes the test views; test_every huge = train on (almost) all of it.
      # normalize_world_space off so the exported PLY stays in COLMAP world coordinates for the common evaluator.
      "$V/bin/python" simple_trainer.py "$strategy" --data_dir "$VIEW" --data_factor 1 --result_dir "$RUN/work" \
        --max_steps "$STEPS" --eval_steps "$STEPS" --save_steps "$STEPS" --ply_steps "$STEPS" --test_every 1000000 \
        $(flag "$HELP" disable_viewer true) $(flag "$HELP" disable_video true) $(flag "$HELP" save_ply true) \
        $(flag "$HELP" normalize_world_space false) 2>&1 | tee "$RUN/logs/train.log"
      cp "$(ls -t "$RUN"/work/ply/*.ply | head -1)" "$RUN/artifacts/model.ply"
      ENGINE_VERSION="gsplat 1.5.3 simple_trainer $strategy"
    }

    train_nerfstudio() {  # T2: nerfstudio 1.1.5 splatfacto (or splatfacto-big)
      local method=$1 V=$CACHE/venv-nerfstudio-1.1.5
      export TORCH_EXTENSIONS_DIR=$CACHE/torch_ext/nerfstudio-1.1.5
      exec 8>"$CACHE/venv-nerfstudio.lock"; flock 8
      if [ ! -f "$V/.ok" ]; then
        rm -rf "$V"; python -m venv --system-site-packages "$V"
        "$V/bin/pip" install -q ninja "nerfstudio==1.1.5"
        "$V/bin/ns-train" --help >/dev/null
        touch "$V/.ok"
      fi
      flock -u 8
      # Resume: a finished checkpoint from an earlier attempt of this run skips straight to export.
      local DONE_CKPT; DONE_CKPT=$(ls "$RUN"/work/*/"$method"/*/nerfstudio_models/step-$(printf %09d $((STEPS - 1))).ckpt 2>/dev/null | head -1 || true)
      if [ -n "$DONE_CKPT" ]; then echo "-- found finished checkpoint $DONE_CKPT: skip training"; else
      # Identity dataparser transform: exported splat stays in COLMAP world coordinates.
      "$V/bin/ns-train" "$method" --output-dir "$RUN/work" --max-num-iterations "$STEPS" --vis tensorboard \
        --viewer.quit-on-train-completion True --machine.seed "$SEED" --data "$VIEW" \
        --pipeline.datamanager.cache-images-type uint8 \
        colmap --colmap-path sparse/0 --images-path images --downscale-factor 1 --eval-mode all \
        --orientation-method none --center-method none --auto-scale-poses False \
        --assume-colmap-world-coordinate-convention False --load-3D-points True 2>&1 | tee "$RUN/logs/train.log"
      fi
      local CFG; CFG=$(ls -t "$RUN"/work/*/"$method"/*/config.yml | head -1)
      # torch>=2.6 defaults torch.load(weights_only=True); nerfstudio 1.1.5 checkpoints hold numpy scalars. The
      # checkpoint was written by this same run, so loading it unrestricted is safe.
      TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1 "$V/bin/ns-export" gaussian-splat --load-config "$CFG" --output-dir "$RUN/work/export"
      cp "$RUN/work/export/splat.ply" "$RUN/artifacts/model.ply"
      ENGINE_VERSION="nerfstudio 1.1.5 $method"
    }

    train_brush() {  # T5: Brush v0.3.0 (wgpu/Vulkan), checksum-pinned release binary
      local B=$CACHE/brush/v0.3.0/brush
      if [ ! -x "$B" ]; then
        mkdir -p "$(dirname "$B")" "$RUN/dl"
        curl -sL -o "$RUN/dl/brush.tar.xz" https://github.com/ArthurBrussee/brush/releases/download/v0.3.0/brush-app-x86_64-unknown-linux-gnu.tar.xz
        echo "4f0f9a8785d1951c62df26aae247c02c5bba32b00f40b06df4e1c9b867399e20  $RUN/dl/brush.tar.xz" | sha256sum -c -
        tar xJf "$RUN/dl/brush.tar.xz" -C "$RUN/dl"
        cp "$(find "$RUN/dl" -type f \( -name brush_app -o -name brush-app \) | head -1)" "$B"; chmod 755 "$B"; rm -rf "$RUN/dl"
      fi
      mkdir -p "$RUN/work" "$CACHE/brush-home"; cd "$CACHE/brush-home"
      RUST_LOG=warn "$B" "$VIEW" --total-steps "$STEPS" --max-resolution "$MAX_RES" --seed "$SEED" \
        --export-every "$STEPS" --export-path "$RUN/work" --export-name "model_{iter}.ply" 2>&1 | tee "$RUN/logs/train.log"
      cp "$(ls -t "$RUN"/work/model_*.ply | head -1)" "$RUN/artifacts/model.ply"
      ENGINE_VERSION="brush v0.3.0"
    }

    apt_deps
    TT=$(date +%s)
    if [ "$MODE" = eval ]; then
      [ -s "$RUN/artifacts/model.ply" ] || { echo "FATAL: MODE=eval but no $RUN/artifacts/model.ply"; exit 2; }
      ENGINE_VERSION=$(cat "$RUN/engine_version" 2>/dev/null || echo "$ENGINE (re-evaluated)")
    else case "$ENGINE" in
      t2) train_nerfstudio splatfacto ;;
      t2-big) train_nerfstudio splatfacto-big ;;
      t3) train_gsplat default ;;
      t3-mcmc) train_gsplat mcmc ;;
      t5) train_brush ;;
      *) echo "FATAL: engine $ENGINE has no in-cluster recipe yet"; exit 2 ;;
    esac; echo "$ENGINE_VERSION" > "$RUN/engine_version"; fi
    TRAIN_S=$(( $(date +%s) - TT ))
    echo "-- trained in ${TRAIN_S}s: $(ls -la "$RUN/artifacts/model.ply")"
    kill $SAMPLER 2>/dev/null || true
    PEAK=$(sort -n "$RUN/nvsmi.csv" | tail -1)

    echo "-- evaluate on the held-out test view"
    EV=$(venv_gsplat | tail -1)
    export TORCH_EXTENSIONS_DIR=$CACHE/torch_ext/gsplat-1.5.3
    "$EV/bin/python" /scripts/eval_splat.py "$RUN/artifacts/model.ply" "$VIEW/test" "$RUN" 2>&1 | tee "$RUN/logs/eval.log"
    python3 /scripts/web_preview.py "$RUN/artifacts/model.ply" "$RUN/artifacts/preview.ply" 1000000

    python3 - "$RUN" <<PY
    import hashlib, json, sys, os
    run = sys.argv[1]; ply = os.path.join(run, "artifacts", "model.ply")
    h = hashlib.sha256(open(ply, "rb").read()).hexdigest()
    n = next(int(l.split()[-1]) for l in open(ply, "rb").read(2048).decode("ascii", "replace").splitlines() if l.startswith("element vertex"))
    gpu = "$GPU_LINE".split(",")
    json.dump({"run_id": "$RUN_ID", "engine": "$ENGINE", "engine_version": "$ENGINE_VERSION", "capture_id": "$CAPTURE",
      "steps": int("$STEPS"), "max_res": int("$MAX_RES"), "seed": int("$SEED"), "train_seconds": $TRAIN_S,
      "total_seconds": $(( $(date +%s) - T0 )), "peak_vram_mib_container_view": int("${PEAK:-0}" or 0),
      "gpu": {"name": gpu[0].strip(), "driver": gpu[1].strip() if len(gpu) > 1 else None, "node": "$NODE_NAME"},
      "image": "$IMAGE_REF", "artifact": {"path": "artifacts/model.ply", "sha256": h, "bytes": os.path.getsize(ply), "gaussians": n}},
      open(os.path.join(run, "job.json"), "w"), indent=2)
    PY
    echo "RECON_RESULT {\"ok\":true,\"run\":\"$RUN_ID\",\"train_seconds\":$TRAIN_S}"
  web_preview.py: |
    #!/usr/bin/env python3
    """Make a browser-sized preview of a 3DGS PLY: keep the N most opaque Gaussians, drop higher-order SH (degree 0).
    usage: web_preview.py <model.ply> <preview.ply> [max_gaussians=1000000]   (numpy only)"""

    import sys

    import numpy as np

    src, dst = sys.argv[1], sys.argv[2]
    cap = int(sys.argv[3]) if len(sys.argv) > 3 else 1_000_000
    TYPES = {"float": "<f4", "double": "<f8", "uchar": "u1", "int": "<i4"}
    with open(src, "rb") as f:
        props, n = [], 0
        while (line := f.readline().decode("ascii").strip()) != "end_header":
            if line.startswith("element vertex"):
                n = int(line.split()[-1])
            elif line.startswith("property") and n:
                _, typ, name = line.split()
                props.append((name, TYPES[typ]))
        data = np.fromfile(f, dtype=np.dtype(props), count=n)
    keep_names = [p for p, _ in props if not p.startswith("f_rest_")]
    order = np.argsort(-data["opacity"])[: min(cap, n)]
    out = np.empty(len(order), dtype=np.dtype([(k, "<f4") for k in keep_names]))
    for k in keep_names:
        out[k] = data[k][order]
    with open(dst, "wb") as f:
        f.write(("ply\nformat binary_little_endian 1.0\n" f"element vertex {len(out)}\n"
                 + "".join(f"property float {k}\n" for k in keep_names) + "end_header\n").encode())
        out.tofile(f)
    print(f"{src}: {n} -> {len(out)} gaussians, SH0, {len(keep_names)} props -> {dst}", flush=True)
kind: ConfigMap
metadata:
  name: recon-scripts
  namespace: default
