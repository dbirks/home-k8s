    #!/usr/bin/env python3
    """Build a recon capture + canonical train/test dataset views from a pre-posed COLMAP dataset (stdlib only).

    usage: prep_capture.py <dataset_dir with images/ + sparse/0> <capture_dir> <capture_id> [test_every=8]

    Split = LLFF convention: image names sorted, index % test_every == 0 -> test. The train view's images.bin keeps
    only train images; points3D tracks are filtered to train images and points with < 2 train observations are
    dropped (no test-view geometry leaks into initialisation). The test view keeps only test cameras.
    """

    import json
    import os
    import shutil
    import struct
    import sys
    from datetime import UTC, datetime


    def read_images(path):
        out = {}
        with open(path, "rb") as f:
            (n,) = struct.unpack("<Q", f.read(8))
            for _ in range(n):
                image_id, *pose, camera_id = struct.unpack("<i7di", f.read(64))
                name = b""
                while (c := f.read(1)) != b"\x00":
                    name += c
                (npts,) = struct.unpack("<Q", f.read(8))
                pts = [struct.unpack("<ddq", f.read(24)) for _ in range(npts)]
                out[image_id] = {"pose": pose, "camera_id": camera_id, "name": name.decode(), "pts": pts}
        return out


    def write_images(path, images, keep_points):
        with open(path, "wb") as f:
            f.write(struct.pack("<Q", len(images)))
            for image_id, im in sorted(images.items()):
                f.write(struct.pack("<i7di", image_id, *im["pose"], im["camera_id"]))
                f.write(im["name"].encode() + b"\x00")
                f.write(struct.pack("<Q", len(im["pts"])))
                for x, y, pid in im["pts"]:
                    f.write(struct.pack("<ddq", x, y, pid if pid in keep_points else -1))


    # focal/principal params that scale with resolution, per COLMAP camera model id (distortion terms do not scale)
    CAM_NPARAMS = {0: 3, 1: 4, 2: 4, 3: 5, 4: 8, 5: 12, 6: 8}
    CAM_NSCALED = {0: 3, 1: 4, 2: 3, 3: 3, 4: 4, 5: 4, 6: 4}


    def jpeg_size(path):
        """(width, height) from a JPEG's SOF marker, stdlib only."""
        with open(path, "rb") as f:
            if f.read(2) != b"\xff\xd8":
                raise ValueError(f"not a JPEG: {path}")
            while True:
                marker, size = struct.unpack(">2sH", f.read(4))
                if marker[1] in (0xC0, 0xC1, 0xC2):
                    h, w = struct.unpack(">xHH", f.read(5))
                    return w, h
                f.seek(size - 2, 1)


    def write_scaled_cameras(src, dst, actual):
        """Copy cameras.bin, rescaling each camera to its real image size (pre-downscaled datasets ship full-res
        cameras). Returns {camera_id: scale}."""
        scales, out = {}, []
        with open(src, "rb") as f:
            (n,) = struct.unpack("<Q", f.read(8))
            for _ in range(n):
                cid, model, w, h = struct.unpack("<iiQQ", f.read(24))
                params = list(struct.unpack(f"<{CAM_NPARAMS[model]}d", f.read(8 * CAM_NPARAMS[model])))
                aw, ah = actual.get(cid, (w, h))
                s = aw / w
                if abs(ah / h - s) > 0.01:
                    raise SystemExit(f"camera {cid}: non-uniform scale {aw}x{ah} vs {w}x{h}")
                params[: CAM_NSCALED[model]] = [p * s for p in params[: CAM_NSCALED[model]]]
                scales[cid] = s
                out.append(struct.pack("<iiQQ", cid, model, aw, ah) + struct.pack(f"<{len(params)}d", *params))
        with open(dst, "wb") as f:
            f.write(struct.pack("<Q", len(out)) + b"".join(out))
        return scales


    def read_points(path):
        out = {}
        with open(path, "rb") as f:
            (n,) = struct.unpack("<Q", f.read(8))
            for _ in range(n):
                pid, x, y, z, r, g, b, err, tl = struct.unpack("<Q3d3BdQ", f.read(51))
                track = [struct.unpack("<ii", f.read(8)) for _ in range(tl)]
                out[pid] = ((x, y, z), (r, g, b), err, track)
        return out


    def write_points(path, points):
        with open(path, "wb") as f:
            f.write(struct.pack("<Q", len(points)))
            for pid, (xyz, rgb, err, track) in sorted(points.items()):
                f.write(struct.pack("<Q3d3BdQ", pid, *xyz, *rgb, err, len(track)))
                for t in track:
                    f.write(struct.pack("<ii", *t))


    def make_view(dst, src_sparse, src_images, images, points, ids, min_obs):
        sp = os.path.join(dst, "sparse", "0")
        os.makedirs(sp, exist_ok=True)
        os.makedirs(os.path.join(dst, "images"), exist_ok=True)
        actual = {}
        for i in ids:  # one real image per camera tells its true size
            actual.setdefault(images[i]["camera_id"], jpeg_size(os.path.join(src_images, images[i]["name"])))
        scales = write_scaled_cameras(os.path.join(src_sparse, "cameras.bin"), os.path.join(sp, "cameras.bin"), actual)
        images = {i: dict(images[i], pts=[(x * scales[images[i]["camera_id"]], y * scales[images[i]["camera_id"]], p)
                                          for x, y, p in images[i]["pts"]]) for i in ids}
        keep = {}
        for pid, (xyz, rgb, err, track) in points.items():
            t = [e for e in track if e[0] in ids]
            if len(t) >= min_obs:
                keep[pid] = (xyz, rgb, err, t)
        write_images(os.path.join(sp, "images.bin"), {i: images[i] for i in ids}, keep)
        write_points(os.path.join(sp, "points3D.bin"), keep)
        for i in ids:
            link = os.path.join(dst, "images", images[i]["name"])
            if not os.path.lexists(link):
                os.symlink(os.path.join(src_images, images[i]["name"]), link)
        print(f"view {dst}: camera scale {sorted(set(scales.values()))}", flush=True)
        return len(keep)


    def main():
        ds, cap, cap_id = sys.argv[1], sys.argv[2], sys.argv[3]
        every = int(sys.argv[4]) if len(sys.argv) > 4 else 8
        src_sparse, src_images = os.path.join(ds, "sparse", "0"), os.path.join(ds, "images")
        images, points = read_images(os.path.join(src_sparse, "images.bin")), read_points(os.path.join(src_sparse, "points3D.bin"))
        order = sorted(images, key=lambda i: images[i]["name"])
        test = {i for k, i in enumerate(order) if k % every == 0}
        train = set(order) - test
        os.makedirs(os.path.join(cap, "poses"), exist_ok=True)
        if not os.path.exists(os.path.join(cap, "poses", "sparse")):
            shutil.copytree(os.path.join(ds, "sparse"), os.path.join(cap, "poses", "sparse"))
        n_pts = make_view(os.path.join(cap, "view"), src_sparse, src_images, images, points, train, 2)
        make_view(os.path.join(cap, "view", "test"), src_sparse, src_images, images, points, test, 10**9)
        stem = lambda i: os.path.splitext(images[i]["name"])[0]  # noqa: E731
        now = datetime.now(UTC).isoformat()
        dump = lambda name, obj: json.dump(obj, open(os.path.join(cap, name), "w"), indent=2)  # noqa: E731
        dump("capture.json", {"id": cap_id, "title": "Tanks and Temples — Truck (public sample)", "created_at": now,
                              "created_by": "recon-prep", "source": "public-sample", "license": "CC BY 4.0 (Tanks and Temples)",
                              "provenance": f"huggingface nvs-bench/tanksandtemples {os.path.basename(ds)} (pre-posed COLMAP)",
                              "state": "POSED", "privacy_ack": True})
        dump("poses/poses.json", {"capture_id": cap_id, "engine": "precomputed", "ok": True, "registered": len(images),
                                  "total": len(images), "points3d": len(points), "advice": []})
        dump("splits.json", {"capture_id": cap_id, "policy": f"every-{every}th sorted name (LLFF convention)",
                             "test_every": every, "train_ids": sorted(stem(i) for i in train),
                             "test_ids": sorted(stem(i) for i in test)})
        open(os.path.join(cap, "view", ".prep_version"), "w").write("2\n")  # engine Jobs wait for this marker
        print(f"capture {cap_id}: {len(images)} images -> train {len(train)} / test {len(test)}; "
              f"points {len(points)} -> train-view {n_pts}", flush=True)


    if __name__ == "__main__":
        main()
