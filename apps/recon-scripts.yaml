    #!/usr/bin/env python3
    """Download one folder (prefix) of a public Hugging Face dataset. Stdlib only.
    Resumable: a file already on disk with the expected size is skipped."""
    import concurrent.futures as cf
    import json
    import os
    import sys
    import urllib.parse
    import urllib.request

    repo, prefix, dest = sys.argv[1], sys.argv[2].rstrip("/"), sys.argv[3]
    threads = int(sys.argv[4]) if len(sys.argv) > 4 else 8

    def get(url, out=None):
        req = urllib.request.Request(url, headers={"User-Agent": "splat-lab/1.0"})
        with urllib.request.urlopen(req, timeout=180) as r:
            body = r.read()
            link = r.headers.get("Link", "")
        nxt = None
        for part in link.split(","):
            if 'rel="next"' in part:
                nxt = part[part.index("<") + 1: part.index(">")]
        if out:
            with open(out, "wb") as f:
                f.write(body)
        return body, nxt

    files, url = [], f"https://huggingface.co/api/datasets/{repo}/tree/main?recursive=true"
    while url:
        body, url = get(url)
        for f in json.loads(body):
            if f.get("type") == "file" and f["path"].startswith(prefix + "/"):
                files.append(f)
    if not files:
        raise SystemExit(f"no files under {repo}/{prefix}")

    def dl(f):
        path, size = f["path"], f.get("size") or 0
        target = os.path.join(dest, os.path.relpath(path, prefix))
        os.makedirs(os.path.dirname(target) or ".", exist_ok=True)
        if os.path.isfile(target) and os.path.getsize(target) == size:
            return ("cached", target, size)
        durl = f"https://huggingface.co/datasets/{repo}/resolve/main/{urllib.parse.quote(path)}"
        tmp = target + ".part"
        err = None
        for _ in range(4):
            try:
                get(durl, out=tmp)
                os.replace(tmp, target)
                return ("new", target, os.path.getsize(target))
            except Exception as exc:  # noqa: BLE001 - retry any transient failure
                err = exc
        raise SystemExit(f"FAILED {path}: {err}")

    with cf.ThreadPoolExecutor(threads) as ex:
        res = list(ex.map(dl, files))
    new = sum(1 for r in res if r[0] == "new")
    print(f"{len(res)} files under {prefix}/ ({new} fetched, {len(res) - new} cached), "
          f"{sum(r[2] for r in res) / 1e6:.1f} MB", flush=True)
