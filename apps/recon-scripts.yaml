    clone_at() { # <url> <sha> <dest>
      rm -rf "$3"
      git -c advice.detachedHead=false init -q "$3"
      git -C "$3" remote add origin "$1"
      git -C "$3" fetch -q --depth 1 origin "$2"
      git -C "$3" checkout -q FETCH_HEAD
    }

    TMP="$(mktemp -d "${TMPDIR:-/tmp}/recon-t8-XXXXXX")"
    trap 'rm -rf "$TMP"' EXIT
    rm -rf "$DEST/src"  # leftovers from an interrupted attempt make the cross-device mv below fail
    mkdir -p "$DEST"

    python3 - "https://codeload.github.com/hbb1/2d-gaussian-splatting/tar.gz/$PIN" "$TMP/src.tar.gz" <<'PY'
    import sys, urllib.request
    url, out = sys.argv[1], sys.argv[2]
    with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "recon/1.0"}), timeout=300) as r, open(out, "wb") as f:
        while chunk := r.read(1 << 20):
            f.write(chunk)
