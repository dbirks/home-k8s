    #!/bin/bash
    # recon in-cluster engine run (ADR-0007). One Job = one run: train ENGINE on the capture's canonical TRAIN view,
    # export model.ply, then score it with the common evaluator on the TEST view.
    #   env: RUN_ID ENGINE(t2|t3|t3-mcmc|t5) CAPTURE STEPS [MAX_RES=1600] [SEED=7]
    # Writes /data/runs/$RUN_ID/{logs/job.log,logs/train.log,artifacts/model.ply,renders/,metrics/quality.json,job.json}
    set -euo pipefail
    shopt -s inherit_errexit   # errors inside $(...) must fail the job (a broken venv was once marked ok)
    : "${RUN_ID:?}" "${ENGINE:?}" "${CAPTURE:?}" "${STEPS:?}"
    : "${MAX_RES:=1600}" "${SEED:=7}" "${MODE:=train}"   # MODE=eval: score an existing artifacts/model.ply
    CACHE=/data/cache/recon
    RUN=/data/runs/$RUN_ID
    VIEW=/data/captures/$CAPTURE/view
    mkdir -p "$RUN/logs" "$RUN/artifacts" "$CACHE"
    exec > >(tee -a "$RUN/logs/job.log") 2>&1
    T0=$(date +%s)
    echo "== recon run $RUN_ID engine=$ENGINE capture=$CAPTURE steps=$STEPS host=$(hostname) $(date -u +%FT%TZ)"
    GPU_LINE=$(nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader || echo "unknown,unknown,0")
    echo "gpu: $GPU_LINE"
    [ -s "$VIEW/sparse/0/images.bin" ] || { echo "FATAL: no train view at $VIEW (run the prep job)"; exit 2; }
    export PIP_CACHE_DIR=$CACHE/pip XDG_CACHE_HOME=$CACHE/xdg PIP_RETRIES=10 PIP_DEFAULT_TIMEOUT=120
    export TORCH_CUDA_ARCH_LIST="${TORCH_CUDA_ARCH_LIST:-12.0}" MAX_JOBS="${MAX_JOBS:-8}"

    : > "$RUN/nvsmi.csv"
    ( while true; do nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits >> "$RUN/nvsmi.csv" 2>/dev/null || true; sleep 5; done ) &
    SAMPLER=$!
    trap 'kill $SAMPLER 2>/dev/null || true' EXIT

    apt_deps() {
      if ! command -v git >/dev/null || ! command -v curl >/dev/null || ! ldconfig -p | grep -q libGL.so.1 || ! ldconfig -p | grep -q libvulkan.so.1; then
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git curl ca-certificates xz-utils libgl1 libglib2.0-0 \
          libvulkan1 libxcb1 libx11-6 libxkbcommon0 libegl1 ffmpeg >/dev/null
      fi
    }

    venv_gsplat() {  # gsplat 1.5.3 + examples deps; also used by the common evaluator
      local V=$CACHE/venv-gsplat-1.5.3
      export TORCH_EXTENSIONS_DIR=$CACHE/torch_ext/gsplat-1.5.3
      exec 9>"$CACHE/venv-gsplat.lock"; flock 9   # concurrent Jobs share this venv: build it once
      if [ ! -f "$V/.ok" ]; then {
        echo "-- setup gsplat venv (first run compiles CUDA for sm_${TORCH_CUDA_ARCH_LIST/./})"
        rm -rf "$V"; python -m venv --system-site-packages "$V"
        "$V/bin/pip" install -q ninja "gsplat==1.5.3" "torchmetrics[image]==1.9.0" "numpy<2" "tyro>=0.8.8" viser imageio[ffmpeg] \
          scikit-learn tqdm opencv-python-headless Pillow tensorboard tensorly pyyaml matplotlib splines
        "$V/bin/pip" install -q --no-build-isolation \
          "git+https://github.com/rmbrualla/pycolmap@cc7ea4b7301720ac29287dbe450952511b32125e" \
          "git+https://github.com/nerfstudio-project/nerfview@4538024fe0d15fd1a0e4d760f3695fc44ca72787" \
          "git+https://github.com/rahul-goel/fused-ssim@328dc9836f513d00c4b5bc38fe30478b4435cbb5" \
          "git+https://github.com/harry7557558/fused-bilagrid@90f9788e57d3545e3a033c1038bb9986549632fe"
        "$V/bin/python" -c "import torch, gsplat, torchmetrics; from gsplat.cuda._backend import _C; assert _C is not None; print('gsplat', gsplat.__version__, 'cuda ok', torch.cuda.get_device_name(0))"
        touch "$V/.ok"   # only reached when every step above succeeded (inherit_errexit)
      } >&2; fi
      flock -u 9
      echo "$V"
    }

    flag() {  # tyro boolean spelling differs across versions: flag <help-text> <field> <true|false>
      local help=$1 name=$2 val=$3 dash=${2//_/-}
      if [ "$val" = true ]; then
        for f in "--$name" "--$dash"; do grep -q -- "$f\b" <<<"$help" && { echo "$f"; return; }; done
      else
        for f in "--no-$dash" "--no_$name"; do grep -q -- "$f\b" <<<"$help" && { echo "$f"; return; }; done
      fi
      echo "--$name $([ "$val" = true ] && echo True || echo False)"
    }

    train_gsplat() {  # T3: gsplat examples/simple_trainer.py at v1.5.3; STRATEGY default|mcmc
      local strategy=$1 V; V=$(venv_gsplat | tail -1)
      export TORCH_EXTENSIONS_DIR=$CACHE/torch_ext/gsplat-1.5.3
      local SRC=$CACHE/src/gsplat-1.5.3
      if [ ! -f "$SRC/examples/simple_trainer.py" ]; then
        mkdir -p "$SRC"; curl -sL https://codeload.github.com/nerfstudio-project/gsplat/tar.gz/refs/tags/v1.5.3 | tar xz --strip-components=1 -C "$SRC"
      fi
      cd "$SRC/examples"
      local HELP; HELP=$("$V/bin/python" simple_trainer.py "$strategy" --help 2>&1 || true)
      # Canonical train view already excludes the test views; test_every huge = train on (almost) all of it.
      # normalize_world_space off so the exported PLY stays in COLMAP world coordinates for the common evaluator.
      "$V/bin/python" simple_trainer.py "$strategy" --data_dir "$VIEW" --data_factor 1 --result_dir "$RUN/work" \
        --max_steps "$STEPS" --eval_steps "$STEPS" --save_steps "$STEPS" --ply_steps "$STEPS" --test_every 1000000 \
        $(flag "$HELP" disable_viewer true) $(flag "$HELP" disable_video true) $(flag "$HELP" save_ply true) \
        $(flag "$HELP" normalize_world_space false) 2>&1 | tee "$RUN/logs/train.log"
      cp "$(ls -t "$RUN"/work/ply/*.ply | head -1)" "$RUN/artifacts/model.ply"
      ENGINE_VERSION="gsplat 1.5.3 simple_trainer $strategy"
    }

    train_nerfstudio() {  # T2: nerfstudio 1.1.5 splatfacto (or splatfacto-big)
      local method=$1 V=$CACHE/venv-nerfstudio-1.1.5
      export TORCH_EXTENSIONS_DIR=$CACHE/torch_ext/nerfstudio-1.1.5
      exec 8>"$CACHE/venv-nerfstudio.lock"; flock 8
      if [ ! -f "$V/.ok" ]; then
        rm -rf "$V"; python -m venv --system-site-packages "$V"
        "$V/bin/pip" install -q ninja "nerfstudio==1.1.5"
        "$V/bin/ns-train" --help >/dev/null
        touch "$V/.ok"
      fi
      flock -u 8
      # Resume: a finished checkpoint from an earlier attempt of this run skips straight to export.
      local DONE_CKPT; DONE_CKPT=$(ls "$RUN"/work/*/"$method"/*/nerfstudio_models/step-$(printf %09d $((STEPS - 1))).ckpt 2>/dev/null | head -1 || true)
      if [ -n "$DONE_CKPT" ]; then echo "-- found finished checkpoint $DONE_CKPT: skip training"; else
      # Identity dataparser transform: exported splat stays in COLMAP world coordinates.
      "$V/bin/ns-train" "$method" --output-dir "$RUN/work" --max-num-iterations "$STEPS" --vis tensorboard \
        --viewer.quit-on-train-completion True --machine.seed "$SEED" --data "$VIEW" \
        --pipeline.datamanager.cache-images-type uint8 \
        colmap --colmap-path sparse/0 --images-path images --downscale-factor 1 --eval-mode all \
        --orientation-method none --center-method none --auto-scale-poses False \
        --assume-colmap-world-coordinate-convention False --load-3D-points True 2>&1 | tee "$RUN/logs/train.log"
      fi
      local CFG; CFG=$(ls -t "$RUN"/work/*/"$method"/*/config.yml | head -1)
      # torch>=2.6 defaults torch.load(weights_only=True); nerfstudio 1.1.5 checkpoints hold numpy scalars. The
      # checkpoint was written by this same run, so loading it unrestricted is safe.
      TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1 "$V/bin/ns-export" gaussian-splat --load-config "$CFG" --output-dir "$RUN/work/export"
      cp "$RUN/work/export/splat.ply" "$RUN/artifacts/model.ply"
      ENGINE_VERSION="nerfstudio 1.1.5 $method"
    }

    train_brush() {  # T5: Brush v0.3.0 (wgpu/Vulkan), checksum-pinned release binary
      local B=$CACHE/brush/v0.3.0/brush
      if [ ! -x "$B" ]; then
        mkdir -p "$(dirname "$B")" "$RUN/dl"
        curl -sL -o "$RUN/dl/brush.tar.xz" https://github.com/ArthurBrussee/brush/releases/download/v0.3.0/brush-app-x86_64-unknown-linux-gnu.tar.xz
        echo "4f0f9a8785d1951c62df26aae247c02c5bba32b00f40b06df4e1c9b867399e20  $RUN/dl/brush.tar.xz" | sha256sum -c -
        tar xJf "$RUN/dl/brush.tar.xz" -C "$RUN/dl"
        cp "$(find "$RUN/dl" -type f \( -name brush_app -o -name brush-app \) | head -1)" "$B"; chmod 755 "$B"; rm -rf "$RUN/dl"
      fi
      mkdir -p "$RUN/work" "$CACHE/brush-home"; cd "$CACHE/brush-home"
      RUST_LOG=warn "$B" "$VIEW" --total-steps "$STEPS" --max-resolution "$MAX_RES" --seed "$SEED" \
        --export-every "$STEPS" --export-path "$RUN/work" --export-name "model_{iter}.ply" 2>&1 | tee "$RUN/logs/train.log"
      cp "$(ls -t "$RUN"/work/model_*.ply | head -1)" "$RUN/artifacts/model.ply"
      ENGINE_VERSION="brush v0.3.0"
    }

    train_generic() {  # T1/T4/T6/T7/T8: the adapter's own recon/engines/<id>/{setup,train}.sh (shipped in the ConfigMap)
      local id=$1 D=/tmp/recon-engine/$1
      mkdir -p "$D" "$RUN/work"
      case "$id" in  # per-engine build dependencies (measured failures: T4 "Could NOT find Vulkan", T1 "needs vcpkg")
        t1|t4|t6)
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential ninja-build \
            pkg-config zip unzip autoconf automake libtool libvulkan-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl-dev libopencv-dev >/dev/null ;;
        t7|t8)  # INRIA rasterizers include <glm/glm.hpp> from a git submodule the source tarballs do not contain
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libglm-dev >/dev/null ;;
      esac
      if [ "$id" = t1 ]; then
        export RECON_VCPKG_ROOT=$CACHE/vcpkg-${VCPKG_TAG:-2026.10.16} VCPKG_DEFAULT_BINARY_CACHE=$CACHE/vcpkg-bincache
        mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
        if [ ! -x "$RECON_VCPKG_ROOT/vcpkg" ]; then
          rm -rf "$RECON_VCPKG_ROOT"
          # Full history: manifest mode resolves the project's builtin-baseline through git objects (a --depth 1
          # clone failed with "failed to unpack tree object", measured 2026-11-28).
          git clone -q --branch "${VCPKG_TAG:-2026.10.16}" https://github.com/microsoft/vcpkg "$RECON_VCPKG_ROOT"
          "$RECON_VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
        fi
        if [ -f "$RECON_VCPKG_ROOT/.git/shallow" ]; then git -C "$RECON_VCPKG_ROOT" fetch -q --unshallow; fi
      fi
      cp "/scripts/$id-setup.sh" "$D/setup.sh"; cp "/scripts/$id-train.sh" "$D/train.sh"; chmod +x "$D"/*.sh
      RECON_DIR=$D RECON_VIEW_DIR=$VIEW RECON_OUT_DIR=$RUN/work RECON_STEPS=$STEPS RECON_MAX_RES=0 RECON_CACHE=$CACHE \
        bash "$D/train.sh" 2>&1 | tee "$RUN/logs/train.log"
      grep -q '^RECON_RESULT {"ok":true' "$RUN/logs/train.log" || { echo "FATAL: $id train.sh did not report ok"; exit 7; }
      cp "$RUN/work/model.ply" "$RUN/artifacts/model.ply"
      ENGINE_VERSION="$id $(grep -m1 -oE 'pin[= ][^ ]+' "$RUN/logs/train.log" || echo '(see README pin)')"
    }

    apt_deps
    TT=$(date +%s)
    if [ "$MODE" = eval ]; then
      [ -s "$RUN/artifacts/model.ply" ] || { echo "FATAL: MODE=eval but no $RUN/artifacts/model.ply"; exit 2; }
      ENGINE_VERSION=$(cat "$RUN/engine_version" 2>/dev/null || echo "$ENGINE (re-evaluated)")
    else case "$ENGINE" in
      t2) train_nerfstudio splatfacto ;;
      t2-big) train_nerfstudio splatfacto-big ;;
      t3) train_gsplat default ;;
      t3-mcmc) train_gsplat mcmc ;;
      t5) train_brush ;;
      t1|t4|t6|t7|t8) train_generic "$ENGINE" ;;
      *) echo "FATAL: engine $ENGINE has no in-cluster recipe yet"; exit 2 ;;
    esac; echo "$ENGINE_VERSION" > "$RUN/engine_version"; fi
    TRAIN_S=$(( $(date +%s) - TT ))
    echo "-- trained in ${TRAIN_S}s: $(ls -la "$RUN/artifacts/model.ply")"
    kill $SAMPLER 2>/dev/null || true
    PEAK=$(sort -n "$RUN/nvsmi.csv" | tail -1)

    echo "-- evaluate on the held-out test view"
    EV=$(venv_gsplat | tail -1)
    export TORCH_EXTENSIONS_DIR=$CACHE/torch_ext/gsplat-1.5.3
    "$EV/bin/python" /scripts/eval_splat.py "$RUN/artifacts/model.ply" "$VIEW/test" "$RUN" 2>&1 | tee "$RUN/logs/eval.log"
    python3 /scripts/web_preview.py "$RUN/artifacts/model.ply" "$RUN/artifacts/preview.ply" 1000000

    python3 - "$RUN" <<PY
    import hashlib, json, sys, os
    run = sys.argv[1]; ply = os.path.join(run, "artifacts", "model.ply")
    h = hashlib.sha256(open(ply, "rb").read()).hexdigest()
    n = next(int(l.split()[-1]) for l in open(ply, "rb").read(2048).decode("ascii", "replace").splitlines() if l.startswith("element vertex"))
    gpu = "$GPU_LINE".split(",")
    json.dump({"run_id": "$RUN_ID", "engine": "$ENGINE", "engine_version": "$ENGINE_VERSION", "capture_id": "$CAPTURE",
      "steps": int("$STEPS"), "max_res": int("$MAX_RES"), "seed": int("$SEED"), "train_seconds": $TRAIN_S,
      "total_seconds": $(( $(date +%s) - T0 )), "peak_vram_mib_container_view": int("${PEAK:-0}" or 0),
      "gpu": {"name": gpu[0].strip(), "driver": gpu[1].strip() if len(gpu) > 1 else None, "node": "$NODE_NAME"},
      "image": "$IMAGE_REF", "artifact": {"path": "artifacts/model.ply", "sha256": h, "bytes": os.path.getsize(ply), "gaussians": n}},
      open(os.path.join(run, "job.json"), "w"), indent=2)
    PY
    echo "RECON_RESULT {\"ok\":true,\"run\":\"$RUN_ID\",\"train_seconds\":$TRAIN_S}"
  t1-setup.sh: |
    #!/usr/bin/env bash
    # Install LichtFeld Studio <PIN> into a pinned prefix: reuse an owner-supplied binary, else build from
    # the pinned source tarball. Neither path has been exercised in CI yet (see README "Known issues").
    set -euo pipefail

    PIN="${RECON_T1_PIN:-v0.5.4.3}"
    PREFIX="${RECON_CACHE:-/data/cache/recon}/t1/${PIN}"
    BIN="${PREFIX}/bin/LichtFeld-Studio"
    export TORCH_CUDA_ARCH_LIST="${TORCH_CUDA_ARCH_LIST:-12.0}"   # CUDA arch for the training kernels

    if [[ -f "${PREFIX}/.ok" ]]; then
      echo "t1: ${PREFIX} already installed, skipping"
      exit 0
    fi
    mkdir -p "${PREFIX}/bin"

    # Preferred route: a built Linux binary placed here out-of-band (the GitHub release ships none).
    if [[ -n "${RECON_T1_BINARY:-}" && -f "${RECON_T1_BINARY}" ]]; then
      cp "${RECON_T1_BINARY}" "${BIN}"
      chmod +x "${BIN}"
    elif [[ ! -x "${BIN}" ]]; then
      command -v cmake >/dev/null || { echo "t1 setup: no binary and no cmake; build the engine out-of-band" >&2; exit 1; }
      if ! command -v vcpkg >/dev/null && [[ ! -x "${RECON_VCPKG_ROOT:-/opt/vcpkg}/vcpkg" ]]; then
        echo "t1 setup needs vcpkg on PATH or RECON_VCPKG_ROOT set (deps come from vcpkg.json)" >&2
        exit 1
      fi
      SRC="${PREFIX}/src"
      mkdir -p "${SRC}"
      curl -fsSL "https://codeload.github.com/MrNeRF/LichtFeld-Studio/tar.gz/${PIN}" -o "${PREFIX}/lfs.tar.gz"
      tar -xzf "${PREFIX}/lfs.tar.gz" -C "${SRC}" --strip-components=1
      rm -f "${PREFIX}/lfs.tar.gz"
      : "${CUDA_PATH:=/usr/local/cuda}"
      # Measured 2026-11-28: without an explicit toolchain the build looked for vcpkg under the script dir, and
      # "12.0" must become CMake's "120" (not "12").
      export VCPKG_ROOT="${RECON_VCPKG_ROOT:-$(dirname "$(command -v vcpkg)")}"
      cmake -S "${SRC}" -B "${PREFIX}/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
        -DCMAKE_CUDA_COMPILER="${CUDA_PATH}/bin/nvcc" \
        -DCMAKE_CUDA_ARCHITECTURES="${TORCH_CUDA_ARCH_LIST//./}" \
        -DVCPKG_MANIFEST_MODE=ON
      cmake --build "${PREFIX}/build" --target LichtFeld-Studio -j "${MAX_JOBS:-4}"
      find "${PREFIX}/build" -name LichtFeld-Studio -type f -exec cp -f {} "${BIN}" \;
      [[ -x "${BIN}" ]] || { echo "t1 build produced no LichtFeld-Studio binary" >&2; exit 1; }
    fi

    "${BIN}" --version || echo "t1: ${BIN} --version failed; the pin may need runtime deps (Vulkan ICD, CUDA)"
    date -u +%FT%TZ > "${PREFIX}/.ok"
    echo "t1: installed ${PREFIX}"
  t1-train.sh: |
    #!/usr/bin/env bash
    # Headless LichtFeld Studio training on a canonical train view -> $RECON_OUT_DIR/model.ply.
    #   in : RECON_VIEW_DIR, RECON_OUT_DIR, RECON_STEPS, RECON_MAX_RES, RECON_STRATEGY, RECON_CACHE
    set -euo pipefail

    : "${RECON_VIEW_DIR:?RECON_VIEW_DIR is required}"
    : "${RECON_OUT_DIR:?RECON_OUT_DIR is required}"
    STEPS="${RECON_STEPS:-30000}"
    PIN="${RECON_T1_PIN:-v0.5.4.3}"
    PREFIX="${RECON_CACHE:-/data/cache/recon}/t1/${PIN}"
    BIN="${PREFIX}/bin/LichtFeld-Studio"
    WORK="$(mktemp -d "${TMPDIR:-/tmp}/recon-t1-XXXXXX")"
    START=$(date +%s)

    log_gpu() { nvidia-smi --query-gpu=name,driver_version,memory.used --format=csv 2>&1 || echo "nvidia-smi unavailable"; }
    fail() { echo "RECON_RESULT {\"ok\":false,\"reason\":\"$1\"}"; exit 1; }
    trap 'rm -rf "${WORK}"' EXIT

    log_gpu
    "${RECON_DIR:-$(dirname "$0")}/setup.sh"

    mkdir -p "${WORK}/dataset" "${WORK}/out"
    ln -s "$(readlink -f "${RECON_VIEW_DIR}/images")" "${WORK}/dataset/images"
    ln -s "$(readlink -f "${RECON_VIEW_DIR}/sparse")" "${WORK}/dataset/sparse"
    [[ -d "${WORK}/dataset/sparse/0" ]] || fail "view has no sparse/0 COLMAP model"
    [[ "${RECON_MAX_RES:-0}" == "0" ]] || echo "t1: RECON_MAX_RES has no documented CLI flag at this pin; pre-downscale the view"

    set +e
    "${BIN}" --headless --train \
      -d "${WORK}/dataset" -o "${WORK}/out" \
      --iter "${STEPS}" --test-every 8 --eval --export ply \
      ${RECON_STRATEGY:+--strategy "${RECON_STRATEGY}"} 2>&1 | tee "${RECON_OUT_DIR:-${WORK}}/train.log"
    status=${PIPESTATUS[0]}
    set -e
    log_gpu
    [[ ${status} -eq 0 ]] || fail "LichtFeld-Studio exit ${status}"

    PLY="$(find "${WORK}/out" -name '*.ply' -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)"
    [[ -n "${PLY}" ]] || fail "no PLY exported under ${WORK}/out (needs --export ply)"
    mkdir -p "${RECON_OUT_DIR}"
    cp "${PLY}" "${RECON_OUT_DIR}/model.ply"
    echo "RECON_RESULT {\"ok\":true,\"steps\":${STEPS},\"seconds\":$(( $(date +%s) - START ))}"
  t4-setup.sh: |
    #!/usr/bin/env bash
    # Build Spirula Studio <PIN> (Vulkan trainer) into a pinned prefix; idempotent via .ok.
    # Needs: cmake >= 3.2x, ninja, a Vulkan SDK (Vulkan-ValidationLayers not required), git-free curl,
    # optional Slang/glslang via the repo's own CMake fetches.
    set -euo pipefail

    PIN="${RECON_T4_PIN:-v2026.11.27}"
    PREFIX="${RECON_CACHE:-/data/cache/recon}/t4/${PIN}"
    BIN="${PREFIX}/bin/spirula"
    export TORCH_CUDA_ARCH_LIST="${TORCH_CUDA_ARCH_LIST:-12.0}"   # only used if the CUDA backend is chosen

    if [[ -f "${PREFIX}/.ok" ]]; then
      echo "t4: ${PREFIX} already installed, skipping"
      exit 0
    fi
    command -v cmake >/dev/null || { echo "t4 setup needs cmake" >&2; exit 1; }
    [[ -n "${VULKAN_SDK:-}" || -f /usr/share/vulkan/icd.d/nvidia_icd.json || -d /etc/vulkan/icd.d ]] ||
      echo "t4 warning: no Vulkan SDK/ICD found; the build or the first frame will fail" >&2

    mkdir -p "${PREFIX}/bin"
    if [[ ! -x "${BIN}" ]]; then
      SRC="${PREFIX}/src"
      mkdir -p "${SRC}"
      curl -fsSL "https://codeload.github.com/harry7557558/spirula-studio/tar.gz/${PIN}" -o "${PREFIX}/spirula.tar.gz"
      tar -xzf "${PREFIX}/spirula.tar.gz" -C "${SRC}" --strip-components=1
      rm -f "${PREFIX}/spirula.tar.gz"
      cmake -S "${SRC}" -B "${PREFIX}/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
        -DSS_BUILD_GUI=OFF -DSS_BUILD_SFM=ON -DSS_BUILD_SAM=OFF
      cmake --build "${PREFIX}/build" --target spirula -j "${MAX_JOBS:-4}"
      cmake --install "${PREFIX}/build" 2>/dev/null || cmake --install "${PREFIX}/build" || true
      find "${PREFIX}/build" -type f -name 'spirula' -exec cp -f {} "${BIN}" \;
      [[ -x "${BIN}" ]] || { echo "t4 build produced no spirula binary" >&2; exit 1; }
    fi

    # Headless training needs a Vulkan-capable GPU; --help works on CPU and proves the binary loads.
    "${BIN}" --help >/dev/null || echo "t4: ${BIN} --help failed (missing loader/ICD?)" >&2
    date -u +%FT%TZ > "${PREFIX}/.ok"
    echo "t4: installed ${PREFIX}"
  t4-train.sh: |
    #!/usr/bin/env bash
    # Headless Spirula Studio training on a canonical train view -> $RECON_OUT_DIR/model.ply.
    #   in : RECON_VIEW_DIR, RECON_OUT_DIR, RECON_STEPS, RECON_MAX_RES, RECON_PRIMITIVE, RECON_CACHE
    set -euo pipefail

    : "${RECON_VIEW_DIR:?RECON_VIEW_DIR is required}"
    : "${RECON_OUT_DIR:?RECON_OUT_DIR is required}"
    STEPS="${RECON_STEPS:-30000}"
    MAX_RES="${RECON_MAX_RES:-0}"
    PRIMITIVE="${RECON_PRIMITIVE:-3dgs}"
    PIN="${RECON_T4_PIN:-v2026.11.27}"
    PREFIX="${RECON_CACHE:-/data/cache/recon}/t4/${PIN}"
    BIN="${PREFIX}/bin/spirula"
    WORK="$(mktemp -d "${TMPDIR:-/tmp}/recon-t4-XXXXXX")"
    START=$(date +%s)

    log_gpu() { nvidia-smi --query-gpu=name,driver_version,memory.used --format=csv 2>&1 || echo "nvidia-smi unavailable"; }
    fail() { echo "RECON_RESULT {\"ok\":false,\"reason\":\"$1\"}"; exit 1; }
    trap 'rm -rf "${WORK}"' EXIT

    log_gpu
    "${RECON_DIR:-$(dirname "$0")}/setup.sh"

    mkdir -p "${WORK}/dataset" "${WORK}/out" "${RECON_OUT_DIR}"
    ln -s "$(readlink -f "${RECON_VIEW_DIR}/images")" "${WORK}/dataset/images"
    ln -s "$(readlink -f "${RECON_VIEW_DIR}/sparse")" "${WORK}/dataset/sparse"
    [[ -d "${WORK}/dataset/sparse/0" ]] || fail "view has no sparse/0 COLMAP model"

    args=(--lang en train --data "${WORK}/dataset" --data-format colmap
          --num-iterations "${STEPS}" --output-dir-prefix "${WORK}/out" --output-dir-name recon
          --eval-mode interval --eval-interval 8 --primitive "${PRIMITIVE}"
          --disable-viewer true --save-only-latest-checkpoint true --export-y-up false)
    [[ "${MAX_RES}" == "0" ]] || args+=(--max-resolution "${MAX_RES}")

    set +e
    "${BIN}" "${args[@]}" 2>&1 | tee "${RECON_OUT_DIR}/train.log"
    status=${PIPESTATUS[0]}
    set -e
    log_gpu

    # run.json is the authoritative record (docs/run-records.md): status/final_step/num_splats.
    RUN_JSON="$(find "${WORK}/out" -name run.json | head -1)"
    DONE_STEPS="${STEPS}"
    if [[ -n "${RUN_JSON}" ]]; then
      sed -n 's/.*"status": *"\([a-z]*\)".*/t4 run.json status=\1/p' "${RUN_JSON}" || true
      DONE_STEPS="$(sed -n 's/.*"final_step": *\([0-9]*\).*/\1/p' "${RUN_JSON}" | head -1)"
      [[ -n "${DONE_STEPS}" ]] || DONE_STEPS="${STEPS}"
    fi
    [[ ${status} -eq 0 ]] || fail "spirula train exit ${status}"

    PLY="$(find "${WORK}/out" -name '*.ply' -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)"
    [[ -n "${PLY}" ]] || fail "no checkpoint PLY under ${WORK}/out"
    cp "${PLY}" "${RECON_OUT_DIR}/model.ply"
    echo "RECON_RESULT {\"ok\":true,\"steps\":${DONE_STEPS},\"seconds\":$(( $(date +%s) - START ))}"
  t6-setup.sh: |
    #!/usr/bin/env bash
    # T6 OpenSplat v1.2.2: build the C++ trainer from the pinned source tarball (idempotent).
    #
    # Not a Python package: CMake + libtorch (from the base image) + OpenCV + nvcc (FACT README "Build" +
    # CMakeLists.txt @ v1.2.2). GPU arch comes from TORCH_CUDA_ARCH_LIST so one recipe serves both profiles:
    #   sm_120 (RTX 5090)  base pytorch/pytorch:2.7.1-cuda12.8-cudnn9-devel,  TORCH_CUDA_ARCH_LIST="12.0"
    #   sm_61  (GTX 1070)  base pytorch/pytorch:2.7.1-cuda12.6-cudnn9-devel,  TORCH_CUDA_ARCH_LIST="6.1"
    # Upstream defaults to 75;80 (CMakeLists.txt), so BOTH profiles here are explicit and unverified.
    set -euo pipefail

    PIN="${RECON_T6_PIN:-v1.2.2}"
    ORG="${RECON_T6_ORG:-WebODM}"                      # github.com/pierotofy/OpenSplat redirects here
    CACHE="${RECON_CACHE:-/data/cache/recon}"
    DEST="$CACHE/t6/$PIN"
    MARKER="$DEST/.ok"
    ARCH="${TORCH_CUDA_ARCH_LIST:-12.0}"

    if [ -f "$MARKER" ] && [ -x "$DEST/build/opensplat" ]; then
      echo "[setup:t6] cached opensplat $PIN (arch $ARCH), skipping"
      exit 0
    fi

    need() { command -v "$1" >/dev/null 2>&1 || { echo "[setup:t6] FATAL: missing $1 (build deps belong in the Dockerfile)" >&2; exit 2; }; }
    need cmake; need python3; need tar

    # CMake wants bare arch numbers ("120"), torch wants dotted ("12.0").
    CUDA_ARCH="$(echo "$ARCH" | tr -d '.' | cut -c1-3)"
    PREFIX="$(python3 -c 'import torch,os;print(os.path.join(os.path.dirname(torch.__file__),"share","cmake"))')"

    mkdir -p "$DEST"
    TMP="$(mktemp -d "${TMPDIR:-/tmp}/recon-t6-XXXXXX")"
    trap 'rm -rf "$TMP"' EXIT

    python3 - "https://codeload.github.com/$ORG/OpenSplat/tar.gz/refs/tags/$PIN" "$TMP/src.tar.gz" <<'PY'
    import sys, urllib.request
    url, out = sys.argv[1], sys.argv[2]
    with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "recon/1.0"}), timeout=300) as r, open(out, "wb") as f:
        while chunk := r.read(1 << 20):
            f.write(chunk)
    print(f"[setup:t6] fetched {url}")
    PY

    tar -xzf "$TMP/src.tar.gz" -C "$TMP"
    SRC="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -1)"
    mv "$SRC" "$DEST/src"

    apt_install() { # <package...> (only when something is genuinely missing; CI runs as root)
      apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "$@"
      apt-get clean && rm -rf /var/lib/apt/lists/*
    }
    if ! find /usr/include/opencv4 /usr/include/opencv -maxdepth 1 -name 'cv.h' -o -name 'opencv2' 2>/dev/null | grep -q .; then
      apt_install libopencv-dev
    fi
    if ! command -v nvcc >/dev/null 2>&1; then
      echo "[setup:t6] FATAL: nvcc not found (use a pytorch *-devel base image)" >&2
      exit 2
    fi

    export TORCH_CUDA_ARCH_LIST="$ARCH"
    cmake -S "$DEST/src" -B "$DEST/build" \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_PREFIX_PATH="$PREFIX" \
      -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCH" \
      -DGPU_RUNTIME=CUDA
    cmake --build "$DEST/build" --config Release -j"$(nproc)"

    [ -x "$DEST/build/opensplat" ] || { echo "[setup:t6] FATAL: build produced no opensplat binary" >&2; exit 3; }
    "$DEST/build/opensplat" --version > "$DEST/version.txt" || echo "$PIN (version flag unsupported)" > "$DEST/version.txt"
    echo "$PIN" > "$DEST/pin"
    date -u +%FT%TZ > "$MARKER"
    echo "[setup:t6] ok: $DEST/build/opensplat (CUDA arch $CUDA_ARCH)"
  t6-train.sh: |
    #!/usr/bin/env bash
    # T6 OpenSplat train: canonical COLMAP view in, 3DGS PLY out, RECON_RESULT last.
    #
    # env in : RECON_VIEW_DIR, RECON_OUT_DIR, RECON_STEPS, RECON_MAX_RES, RECON_CACHE, RECON_SH_DEGREE,
    #          RECON_SPLAT_LIMIT, RECON_DOWNSCALE
    # env out: $RECON_OUT_DIR/model.ply (+ train.log)
    #
    # OpenSplat needs SPARSE POINTS in the view (random initialisation is unsupported, upstream issue #7 — FACT
    # README), which recon's pycolmap SfM always produces. `-d` is a downscale *factor*, so RECON_MAX_RES is
    # converted from the camera size in the COLMAP model below.
    set -uo pipefail

    VIEW="${RECON_VIEW_DIR:?RECON_VIEW_DIR is required}"
    OUT="${RECON_OUT_DIR:?RECON_OUT_DIR is required}"
    STEPS="${RECON_STEPS:-30000}"
    MAX_RES="${RECON_MAX_RES:-0}"          # 0 = native resolution
    SH_DEG="${RECON_SH_DEGREE:-3}"
    MAXG="${RECON_SPLAT_LIMIT:-3000000}"
    HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    CACHE="${RECON_CACHE:-/data/cache/recon}"
    PIN="${RECON_T6_PIN:-v1.2.2}"
    # WORK == RECON_OUT_DIR so adapter collect(work_dir) sees exactly the tree this job wrote.
    WORK="$OUT"
    rm -rf "$WORK/data" "$WORK/out"
    T0=$(date +%s)

    gpu() { nvidia-smi --query-gpu=name,driver_version,memory.used --format=csv 2>&1 || echo "[t6] nvidia-smi unavailable"; }
    fail() { echo "[t6] FAILED: $1" >&2; gpu; echo "RECON_RESULT {\"ok\":false,\"engine\":\"t6\",\"reason\":\"$1\",\"steps\":${2:-0},\"seconds\":$(( $(date +%s) - T0 ))}"; exit 1; }

    mkdir -p "$OUT" "$WORK/data/sparse" "$WORK/out/val"
    VIEW_ABS="$(cd "$VIEW" && pwd)"
    [ -e "$WORK/data/images" ] || ln -s "$VIEW_ABS/images" "$WORK/data/images"
    [ -e "$WORK/data/sparse/0" ] || ln -s "$VIEW_ABS/sparse/0" "$WORK/data/sparse/0"
    [ -d "$WORK/data/images" ] || fail "view has no images/ dir" 0
    [ -d "$WORK/data/sparse/0" ] || fail "view has no sparse/0 COLMAP model" 0

    DOWNSCALE="${RECON_DOWNSCALE:-1}"
    if [ "$MAX_RES" != "0" ] && [ "$DOWNSCALE" = "1" ]; then
      DOWNSCALE="$(python3 - "$WORK/data/sparse/0" "$MAX_RES" <<'PY'
    # Longest camera edge straight out of cameras.bin (COLMAP layout: u32 id, i32 model, u64 w, u64 h, params).
    import struct
    import sys
    from pathlib import Path

    PARAMS = {0: 3, 1: 4, 2: 4, 3: 5, 4: 8, 5: 8, 6: 12, 7: 5, 8: 4, 9: 5, 10: 12, 11: 16, 12: 4, 13: 5, 14: 3, 15: 4}
    path = Path(sys.argv[1]) / "cameras.bin"
    max_res = int(sys.argv[2])
    try:
        long_edge = 0
        with path.open("rb") as f:
            for _ in range(struct.unpack("<Q", f.read(8))[0]):
                _, model = struct.unpack("<ii", f.read(8))
                w, h = struct.unpack("<QQ", f.read(16))
                f.read(8 * PARAMS.get(model, 0))
                long_edge = max(long_edge, int(w), int(h))
    except OSError as exc:
        print(f"[t6] warn: cannot read {path} ({exc}); using downscale 1", file=sys.stderr)
        long_edge = 0
    print(max(1, long_edge // max_res) if long_edge > max_res > 0 else 1)
    PY
    )"
    fi

    echo "== t6 opensplat $PIN $(date -u +%FT%TZ) host=$(hostname) steps=$STEPS max_res=$MAX_RES downscale=$DOWNSCALE sh=$SH_DEG max_gaussians=$MAXG"
    gpu
    bash "$HERE/setup.sh" || fail "setup.sh failed" 0
    BIN="$CACHE/t6/$PIN/build/opensplat"
    [ -x "$BIN" ] || fail "opensplat binary missing at $BIN" 0

    echo "-- train $STEPS steps"
    if "$BIN" "$WORK/data" \
      -o "$WORK/out/model.ply" \
      -n "$STEPS" \
      -d "$DOWNSCALE" \
      --sh-degree "$SH_DEG" \
      --max-gaussians "$MAXG" \
      --refine-every "${RECON_REFINE_EVERY:-500}" \
      --densify-until "${RECON_DENSIFY_UNTIL:-$((STEPS * 3 / 4))}" \
      --val --val-render "$WORK/out/val" \
      > >(tee "$OUT/train.log") 2>&1; then
      :
    else
      tail -25 "$OUT/train.log" >&2 || true
      fail "opensplat exited nonzero (see train.log)" "$STEPS"
    fi

    PLY="$WORK/out/model.ply"
    [ -s "$PLY" ] || PLY="$(find "$WORK/out" -name "*.ply" -printf '%s %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)"
    [ -n "${PLY:-}" ] && [ -s "$PLY" ] || { tail -25 "$OUT/train.log" >&2 || true; fail "opensplat wrote no .ply" "$STEPS"; }
    cp "$PLY" "$OUT/model.ply"

    SEC=$(( $(date +%s) - T0 ))
    gpu
    echo "RECON_RESULT {\"ok\":true,\"engine\":\"t6\",\"engine_version\":\"$PIN\",\"steps\":$STEPS,\"seconds\":$SEC,\"gaussians\":$(python3 -c 'import re,sys;h=open(sys.argv[1],"rb").read(4096).split(b"end_header",1)[0];print(re.search(rb"element vertex (\d+)",h).group(1).decode())' "$OUT/model.ply" 2>/dev/null || echo 0)}"

    # Keep $WORK/data, $WORK/out: the runner's collect() reads the engine tree from there.
  t7-setup.sh: |
    #!/usr/bin/env bash
    # T7 Mip-Splatting dda02ab: pinned source + venv (idempotent). CUDA submodules are compiled here, so the
    # base image must match the target GPU arch via TORCH_CUDA_ARCH_LIST ("12.0" sm_120 / "6.1" sm_61).
    #
    # Upstream README pins python 3.8 + torch 1.12.1+cu113 (FACT README.md @ the pin); we deliberately build
    # against the base image's torch 2.7.1 instead — UNVERIFIED for both arch profiles, see README "Known issues".
    set -euo pipefail

    PIN="${RECON_T7_PIN:-dda02ab5ecf45d6edb8c540d9bb65c7e451345a9}"
    CACHE="${RECON_CACHE:-/data/cache/recon}"
    DEST="$CACHE/t7/$PIN"
    MARKER="$DEST/.ok-v2"  # bump when the dependency set changes
    ARCH="${TORCH_CUDA_ARCH_LIST:-12.0}"

    if [ -f "$MARKER" ] && [ -x "$DEST/venv/bin/python" ]; then
      echo "[setup:t7] cached mip-splatting $PIN (arch $ARCH), skipping"
      exit 0
    fi

    command -v uv >/dev/null 2>&1 || python3 -m pip install --no-cache-dir --quiet uv

    TMP="$(mktemp -d "${TMPDIR:-/tmp}/recon-t7-XXXXXX")"
    trap 'rm -rf "$TMP"' EXIT
    mkdir -p "$DEST"

    # Source tarball pinned by commit (codeload), unpacked straight into the cache dir.
    python3 - "https://codeload.github.com/autonomousvision/mip-splatting/tar.gz/$PIN" "$TMP/src.tar.gz" <<'PY'
    import sys, urllib.request
    url, out = sys.argv[1], sys.argv[2]
    with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "recon/1.0"}), timeout=300) as r, open(out, "wb") as f:
        while chunk := r.read(1 << 20):
            f.write(chunk)
    print(f"[setup:t7] fetched {url}")
    PY
    tar -xzf "$TMP/src.tar.gz" -C "$TMP"
    rm -rf "$DEST/src"  # never nest a fresh tree inside leftovers from an interrupted attempt
    mv "$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -1)" "$DEST/src"

    # Venv on top of the base image's torch: --system-site-packages keeps torch 2.7.1+cu12x and only adds the
    # small pure-python deps + the two CUDA extensions.
    rm -rf "$DEST/venv"  # a previous failed attempt leaves a half-built venv that uv refuses to reuse
    uv venv --system-site-packages "$DEST/venv"
    export VIRTUAL_ENV="$DEST/venv"
    uv pip install --no-cache-dir plyfile tqdm open3d "numpy<2" "opencv-python-headless==4.10.0.84" matplotlib  # train.py imports cv2 (measured ModuleNotFoundError)

    export TORCH_CUDA_ARCH_LIST="$ARCH"
    export MAX_JOBS="${MAX_JOBS:-$(nproc)}"
    # The rasterizer is vendored in the tarball (mip-splatting has no .gitmodules).
    KNN_CU="$DEST/src/submodules/simple-knn/simple_knn.cu"
    # CUDA >= 12.x headers no longer pull in <cfloat> transitively: simple_knn.cu uses FLT_MAX (measured build failure
    # on the RTX 5090 image, 2026-11-28). Idempotent.
    grep -q '#include <cfloat>' "$KNN_CU" || sed -i '1i #include <cfloat>' "$KNN_CU"
    for ext in submodules/diff-gaussian-rasterization submodules/simple-knn; do
      uv pip install --no-cache-dir --no-build-isolation "$DEST/src/$ext" || {
        echo "[setup:t7] FATAL: failed to build $ext against torch $(python3 -c 'import torch;print(torch.__version__)') / CUDA arch $ARCH" >&2
        exit 3
      }
    done

    echo "$PIN" > "$DEST/pin"
    date -u +%FT%TZ > "$MARKER"
    echo "[setup:t7] ok: $DEST/venv (torch $(python3 -c 'import sys;sys.path[0]="";import torch;print(torch.__version__)'), arch $ARCH)"
  t7-train.sh: |
    #!/usr/bin/env bash
    # T7 Mip-Splatting train: canonical COLMAP view in, 3DGS PLY out, RECON_RESULT last.
    #
    # env in : RECON_VIEW_DIR, RECON_OUT_DIR, RECON_STEPS, RECON_MAX_RES, RECON_CACHE, RECON_SH_DEGREE,
    #          RECON_DENSITY_STOP, RECON_CUDA_VISIBLE_DEVICES (exported through)
    # env out: $RECON_OUT_DIR/model.ply (+ model_fused.ply, point_cloud/…, train.log)
    #
    # mip-splatting writes point_cloud/iteration_N/point_cloud.ply with an EXTRA per-vertex `filter_3D` float
    # (FACT scene/gaussian_model.py @ the pin). The engine's own viewer path is the *fused* PLY, where the 3D
    # filter is folded into opacity+scale and the header is the plain INRIA layout (FACT create_fused_ply.py +
    # save_fused_ply). create_fused_ply.py hard-codes iteration_30000, so for shorter runs we link that name to
    # the real iteration directory first — a workaround, not a fake model.
    set -uo pipefail

    VIEW="${RECON_VIEW_DIR:?RECON_VIEW_DIR is required}"
    OUT="${RECON_OUT_DIR:?RECON_OUT_DIR is required}"
    STEPS="${RECON_STEPS:-30000}"
    MAX_RES="${RECON_MAX_RES:-0}"
    SH_DEG="${RECON_SH_DEGREE:-3}"
    HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    CACHE="${RECON_CACHE:-/data/cache/recon}"
    PIN="${RECON_T7_PIN:-dda02ab5ecf45d6edb8c540d9bb65c7e451345a9}"
    WORK="$OUT"                     # == RECON_OUT_DIR, so adapter collect(work_dir) sees this tree
    rm -rf "$WORK/data" "$WORK/out"
    T0=$(date +%s)

    gpu() { nvidia-smi --query-gpu=name,driver_version,memory.used --format=csv 2>&1 || echo "[t7] nvidia-smi unavailable"; }
    fail() { echo "[t7] FAILED: $1" >&2; gpu; echo "RECON_RESULT {\"ok\":false,\"engine\":\"t7\",\"reason\":\"$1\",\"steps\":${2:-0},\"seconds\":$(( $(date +%s) - T0 ))}"; exit 1; }

    mkdir -p "$WORK/data/sparse/0" "$WORK/out"
    VIEW_ABS="$(cd "$VIEW" && pwd)"
    ln -sfn "$VIEW_ABS/images" "$WORK/data/images"
    ln -sfn "$VIEW_ABS/sparse/0" "$WORK/data/sparse/0"
    [ -d "$VIEW_ABS/images" ] || fail "view has no images/ dir" 0
    [ -d "$VIEW_ABS/sparse/0" ] || fail "view has no sparse/0 COLMAP model" 0

    # 3DGS-style `-r` is an integer DIVISOR of the training resolution, so translate the RECON_MAX_RES cap.
    RES=1
    if [ "$MAX_RES" != "0" ]; then
      RES="$(python3 - "$WORK/data/sparse/0" "$MAX_RES" <<'PY'
    import struct
    import sys
    from pathlib import Path

    PARAMS = {0: 3, 1: 4, 2: 4, 3: 5, 4: 8, 5: 8, 6: 12, 7: 5, 8: 4, 9: 5, 10: 12, 11: 16, 12: 4, 13: 5, 14: 3, 15: 4}
    path, max_res = Path(sys.argv[1]), int(sys.argv[2])
    try:
        long_edge = 0
        with path.open("rb") as f:
            for _ in range(struct.unpack("<Q", f.read(8))[0]):
                _, model = struct.unpack("<ii", f.read(8))
                w, h = struct.unpack("<QQ", f.read(16))
                f.read(8 * PARAMS.get(model, 0))
                long_edge = max(long_edge, int(w), int(h))
    except OSError as exc:
        print(f"[t7] warn: cannot read {path} ({exc}); using -r 1", file=sys.stderr)
        long_edge = 0
    print(max(1, long_edge // max_res) if long_edge > max_res > 0 else 1)
    PY
    )"
    fi

    echo "== t7 mip-splatting $PIN $(date -u +%FT%TZ) host=$(hostname) steps=$STEPS max_res=$MAX_RES (-r $RES) sh=$SH_DEG"
    gpu
    bash "$HERE/setup.sh" || fail "setup.sh failed" 0
    PY_BIN="$CACHE/t7/$PIN/venv/bin/python"
    SRC="$CACHE/t7/$PIN/src"
    [ -x "$PY_BIN" ] || fail "engine venv missing at $PY_BIN" 0

    echo "-- train $STEPS steps"
    if (cd "$SRC" && "$PY_BIN" train.py \
        -s "$WORK/data" -m "$WORK/out" --images images \
        --iterations "$STEPS" -r "$RES" --sh_degree "$SH_DEG" --eval \
        --test_iterations "$STEPS" --save_iterations "$STEPS" \
        --densify_until_iter "${RECON_DENSITY_STOP:-$((STEPS / 2))}" \
        --port "${RECON_T7_PORT:-6009}" ${RECON_RAY_JITTER:+--ray_jitter}) \
        > >(tee "$OUT/train.log") 2>&1; then
      :
    else
      tail -30 "$OUT/train.log" >&2 || true
      fail "train.py exited nonzero (see train.log)" "$STEPS"
    fi

    RAW="$WORK/out/point_cloud/iteration_$STEPS/point_cloud.ply"
    [ -s "$RAW" ] || RAW="$(find "$WORK/out/point_cloud" -name point_cloud.ply 2>/dev/null | sort -t_ -k2 -n | tail -1 || true)"
    [ -n "${RAW:-}" ] && [ -s "$RAW" ] || { tail -30 "$OUT/train.log" >&2 || true; fail "no point_cloud/iteration_*/point_cloud.ply" "$STEPS"; }
    cp "$RAW" "$WORK/model.ply"          # engine-native layout, includes the extra filter_3D property
    echo "[t7] native ply $RAW -> $WORK/model.ply ($(stat -c%s "$WORK/model.ply") bytes)"

    # Fused, plain-INRIA-layout export (what mip-splatting's own viewer expects). Best effort.
    ITER_DIR="$(dirname "$(dirname "$RAW")")"
    [ "$ITER_DIR" = "$WORK/out/point_cloud/iteration_30000" ] || ln -sfn "$(basename "$ITER_DIR")" "$WORK/out/point_cloud/iteration_30000"
    if (cd "$SRC" && "$PY_BIN" create_fused_ply.py -m "$WORK/out" --output_ply "$WORK/out/model_fused.ply") >> "$OUT/train.log" 2>&1 \
       && [ -s "$WORK/out/model_fused.ply" ]; then
      cp "$WORK/out/model_fused.ply" "$WORK/model.ply"
      echo "[t7] fused ply -> $WORK/model.ply (3D filter folded into opacity+scale)"
    else
      echo "[t7] warn: create_fused_ply.py failed; keeping the native ply with the extra filter_3D property" >&2
    fi

    SEC=$(( $(date +%s) - T0 ))
    gpu
    echo "RECON_RESULT {\"ok\":true,\"engine\":\"t7\",\"engine_version\":\"$PIN\",\"steps\":$STEPS,\"seconds\":$SEC,\"gaussians\":$(python3 -c 'import re,sys;h=open(sys.argv[1],"rb").read(4096).split(b"end_header",1)[0];m=re.search(rb"element vertex (\d+)",h);print(m.group(1).decode() if m else 0)' "$WORK/model.ply" 2>/dev/null || echo 0)}"
  t8-setup.sh: |
    #!/usr/bin/env bash
    # T8 2DGS f3e3b9f: pinned source + its two CUDA submodules + venv (idempotent).
    #
    # The GitHub source tarball does NOT contain git submodules, so diff-surfel-rasterization and simple-knn are
    # cloned at the exact gitlink SHAs recorded in the parent commit (FACT
    # gh api repos/hbb1/2d-gaussian-splatting/contents/submodules?ref=<pin>).
    # Arch comes from TORCH_CUDA_ARCH_LIST: "12.0" (sm_120, CUDA>=12.8) or "6.1" (sm_61, CUDA 12.6).
