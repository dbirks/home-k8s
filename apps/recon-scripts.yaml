    tar -xzf "$TMP/src.tar.gz" -C "$TMP"
    mv "$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -1)" "$DEST/src"
    mkdir -p "$DEST/src/submodules"

    clone_at https://github.com/hbb1/diff-surfel-rasterization.git "$SURFEL_SHA" "$DEST/src/submodules/diff-surfel-rasterization"
    clone_at https://gitlab.inria.fr/bkerbl/simple-knn.git "$KNN_SHA" "$DEST/src/submodules/simple-knn"

    rm -rf "$DEST/venv"  # a previous failed attempt leaves a half-built venv that uv refuses to reuse
    uv venv --system-site-packages "$DEST/venv"
    export VIRTUAL_ENV="$DEST/venv"
    uv pip install --no-cache-dir plyfile tqdm open3d "numpy<2" "opencv-python-headless==4.10.0.84" matplotlib  # train.py imports cv2 (measured ModuleNotFoundError)

    export TORCH_CUDA_ARCH_LIST="$ARCH"
    export MAX_JOBS="${MAX_JOBS:-$(nproc)}"
    KNN_CU="$DEST/src/submodules/simple-knn/simple_knn.cu"
    # CUDA >= 12.x headers no longer pull in <cfloat> transitively: simple_knn.cu uses FLT_MAX (measured build failure
    # on the RTX 5090 image, 2026-11-28). Idempotent.
    grep -q '#include <cfloat>' "$KNN_CU" || sed -i '1i #include <cfloat>' "$KNN_CU"
    for ext in diff-surfel-rasterization simple-knn; do
      uv pip install --no-cache-dir --no-build-isolation "$DEST/src/submodules/$ext" || {
        echo "[setup:t8] FATAL: failed to build $ext against torch $(python3 -c 'import torch;print(torch.__version__)') / CUDA arch $ARCH" >&2
        exit 3
      }
    done

    echo "$PIN" > "$DEST/pin"
    date -u +%FT%TZ > "$MARKER"
    echo "[setup:t8] ok: $DEST/venv (arch $ARCH)"
  t8-train.sh: |
    #!/usr/bin/env bash
    # T8 2DGS train: canonical COLMAP view in, SURFEL ply out, RECON_RESULT last.
    #
    # env in : RECON_VIEW_DIR, RECON_OUT_DIR, RECON_STEPS, RECON_MAX_RES, RECON_CACHE, RECON_SH_DEGREE,
    #          RECON_DEPTH_RATIO, RECON_LAMBDA_NORMAL, RECON_LAMBDA_DIST, RECON_EMIT_3DGS
    # env out: $RECON_OUT_DIR/model.ply (2DGS surfel layout: scale_0 + scale_1 only), train.log,
    #          optionally model.3dgs.ply when RECON_EMIT_3DGS=1
    #
    # IMPORTANT: the artifact is NOT a 3DGS PLY — 2DGS stores two scales (FACT scene/gaussian_model.py
    # construct_list_of_attributes + create_from_pcd "repeat(1, 2)"). It is published as model.ply with
    # format="2dgs-ply" so downstream code cannot mistake it for a Spark-ready splat.
    set -uo pipefail

    VIEW="${RECON_VIEW_DIR:?RECON_VIEW_DIR is required}"
    OUT="${RECON_OUT_DIR:?RECON_OUT_DIR is required}"
    STEPS="${RECON_STEPS:-30000}"
    MAX_RES="${RECON_MAX_RES:-0}"
    SH_DEG="${RECON_SH_DEGREE:-3}"
    HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    CACHE="${RECON_CACHE:-/data/cache/recon}"
    PIN="${RECON_T8_PIN:-f3e3b9fa67bbd1c75e05167ff37391d8dab2a678}"
    WORK="$OUT"                     # == RECON_OUT_DIR, so adapter collect(work_dir) sees this tree
    rm -rf "$WORK/data" "$WORK/out"
    T0=$(date +%s)

    gpu() { nvidia-smi --query-gpu=name,driver_version,memory.used --format=csv 2>&1 || echo "[t8] nvidia-smi unavailable"; }
    fail() { echo "[t8] FAILED: $1" >&2; gpu; echo "RECON_RESULT {\"ok\":false,\"engine\":\"t8\",\"reason\":\"$1\",\"steps\":${2:-0},\"seconds\":$(( $(date +%s) - T0 ))}"; exit 1; }

    mkdir -p "$WORK/data/sparse/0" "$WORK/out"
    VIEW_ABS="$(cd "$VIEW" && pwd)"
    ln -sfn "$VIEW_ABS/images" "$WORK/data/images"
    ln -sfn "$VIEW_ABS/sparse/0" "$WORK/data/sparse/0"
    [ -d "$VIEW_ABS/images" ] || fail "view has no images/ dir" 0
    [ -d "$VIEW_ABS/sparse/0" ] || fail "view has no sparse/0 COLMAP model" 0

    RES=1
    if [ "$MAX_RES" != "0" ]; then
      RES="$(python3 - "$WORK/data/sparse/0" "$MAX_RES" <<'PY'
    import struct
    import sys
    from pathlib import Path

    PARAMS = {0: 3, 1: 4, 2: 4, 3: 5, 4: 8, 5: 8, 6: 12, 7: 5, 8: 4, 9: 5, 10: 12, 11: 16, 12: 4, 13: 5, 14: 3, 15: 4}
    path, max_res = Path(sys.argv[1]), int(sys.argv[2])
    try:
        long_edge = 0
        with path.open("rb") as f:
            for _ in range(struct.unpack("<Q", f.read(8))[0]):
                _, model = struct.unpack("<ii", f.read(8))
                w, h = struct.unpack("<QQ", f.read(16))
                f.read(8 * PARAMS.get(model, 0))
                long_edge = max(long_edge, int(w), int(h))
    except OSError as exc:
        print(f"[t8] warn: cannot read {path} ({exc}); using -r 1", file=sys.stderr)
        long_edge = 0
    print(max(1, long_edge // max_res) if long_edge > max_res > 0 else 1)
    PY
    )"
    fi

    echo "== t8 2dgs $PIN $(date -u +%FT%TZ) host=$(hostname) steps=$STEPS max_res=$MAX_RES (-r $RES) depth_ratio=${RECON_DEPTH_RATIO:-0}"
    gpu
    bash "$HERE/setup.sh" || fail "setup.sh failed" 0
    PY_BIN="$CACHE/t8/$PIN/venv/bin/python"
    SRC="$CACHE/t8/$PIN/src"
    [ -x "$PY_BIN" ] || fail "engine venv missing at $PY_BIN" 0

    echo "-- train $STEPS steps"
    if (cd "$SRC" && "$PY_BIN" train.py \
        -s "$WORK/data" -m "$WORK/out" --images images \
        --iterations "$STEPS" -r "$RES" --sh_degree "$SH_DEG" --eval \
        --test_iterations "$STEPS" --save_iterations "$STEPS" \
        --depth_ratio "${RECON_DEPTH_RATIO:-0}" \
        --lambda_normal "${RECON_LAMBDA_NORMAL:-0.05}" \
        --lambda_dist "${RECON_LAMBDA_DIST:-0.0}" \
        --densify_until_iter "${RECON_DENSITY_STOP:-$((STEPS / 2))}" \
        --port "${RECON_T8_PORT:-6009}") > >(tee "$OUT/train.log") 2>&1; then
      :
    else
      tail -30 "$OUT/train.log" >&2 || true
      fail "train.py exited nonzero (see train.log)" "$STEPS"
    fi

    RAW="$(find "$WORK/out/point_cloud" -name point_cloud.ply 2>/dev/null | sort -t_ -k2 -n | tail -1 || true)"
    [ -n "${RAW:-}" ] && [ -s "$RAW" ] || { tail -30 "$OUT/train.log" >&2 || true; fail "no point_cloud/iteration_*/point_cloud.ply" "$STEPS"; }
    cp "$RAW" "$WORK/model.ply"
    echo "[t8] surfel ply $RAW -> $WORK/model.ply ($(stat -c%s "$WORK/model.ply") bytes, 2 scales only)"

    if [ "${RECON_EMIT_3DGS:-0}" = "1" ]; then
      # Lossy, opt-in only: pad scale_2 with log(1e-6) so a 3DGS viewer can load the file. Flat ellipses are a
      # rough stand-in for surfels; grazing-angle edges and depth sorting differ from 2DGS rendering.
      python3 - "$WORK/model.ply" "$WORK/model.3dgs.ply" <<'PY' || echo "[t8] warn: 3DGS padding failed; surfel ply only" >&2
    import math
    import struct
    import sys

    src, dst = sys.argv[1], sys.argv[2]
    with open(src, "rb") as f:
        head = b""
        while not head.endswith(b"end_header\n"):
            head += f.readline()
        body = f.read()
    props = [line.split()[-1].decode() for line in head.split(b"\n") if line.startswith(b"property ")]
    count = int(next(int(line.split()[-1]) for line in head.split(b"\n") if line.startswith(b"element vertex")))
    if "scale_2" in props:
        sys.exit(1)
    n_prop, n_byte = len(props), 4
    row = n_prop * n_byte
    tiny = struct.pack("<f", math.log(1e-6))
    out_props = props + ["scale_2"]
    new_head = head.replace(b"end_header\n", b"property float scale_2\nend_header\n")
    with open(dst, "wb") as f:
        f.write(new_head)
        for i in range(count):
            row_bytes = body[i * row : (i + 1) * row]
            # insert scale_2 right after scale_1 to keep x y z ... scale_* rot_* grouped
            at = out_props.index("rot_0") * n_byte
            f.write(row_bytes[:at] + tiny + row_bytes[at:])
    print(f"[t8] wrote {dst}: {count} surfels padded with scale_2=log(1e-6)")
    PY
    fi

    SEC=$(( $(date +%s) - T0 ))
    gpu
    echo "RECON_RESULT {\"ok\":true,\"engine\":\"t8\",\"engine_version\":\"$PIN\",\"steps\":$STEPS,\"seconds\":$SEC,\"format\":\"2dgs-ply\",\"gaussians\":$(python3 -c 'import re,sys;h=open(sys.argv[1],"rb").read(4096).split(b"end_header",1)[0];m=re.search(rb"element vertex (\d+)",h);print(m.group(1).decode() if m else 0)' "$WORK/model.ply" 2>/dev/null || echo 0)}"
  web_preview.py: |
    #!/usr/bin/env python3
    """Make a browser-sized preview of a 3DGS PLY: keep the N most opaque Gaussians, drop higher-order SH (degree 0).
    usage: web_preview.py <model.ply> <preview.ply> [max_gaussians=1000000]   (numpy only)"""

    import sys

    import numpy as np

    src, dst = sys.argv[1], sys.argv[2]
    cap = int(sys.argv[3]) if len(sys.argv) > 3 else 1_000_000
    TYPES = {"float": "<f4", "double": "<f8", "uchar": "u1", "int": "<i4"}
    with open(src, "rb") as f:
        props, n = [], 0
        while (line := f.readline().decode("ascii").strip()) != "end_header":
            if line.startswith("element vertex"):
                n = int(line.split()[-1])
            elif line.startswith("property") and n:
                _, typ, name = line.split()
                props.append((name, TYPES[typ]))
        data = np.fromfile(f, dtype=np.dtype(props), count=n)
    keep_names = [p for p, _ in props if not p.startswith("f_rest_")]
    order = np.argsort(-data["opacity"])[: min(cap, n)]
    out = np.empty(len(order), dtype=np.dtype([(k, "<f4") for k in keep_names]))
    for k in keep_names:
        out[k] = data[k][order]
    with open(dst, "wb") as f:
        f.write(("ply\nformat binary_little_endian 1.0\n" f"element vertex {len(out)}\n"
                 + "".join(f"property float {k}\n" for k in keep_names) + "end_header\n").encode())
        out.tofile(f)
    print(f"{src}: {n} -> {len(out)} gaussians, SH0, {len(keep_names)} props -> {dst}", flush=True)
kind: ConfigMap
metadata:
  name: recon-scripts
  namespace: default
