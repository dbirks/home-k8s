# One-off: download RadixArk/Qwen3.8-Flash-Next-NVFP4 (~126GiB, public/ungated) to the durable
# flashnext-models PVC as the source for single-GPU serving (PLE mmap'd off-GPU, blazux patch).
# Pure network/disk, NO GPU -> does not disturb the serving qwen3.8-27b engine. Resumable.
# HF_HUB_DISABLE_XET=1: Xet transfer stalls on this repo (per blazux download-weights.sh); plain HTTPS
# is reliable. Retire to .hold once complete (the flashnext-models PVC persists). Node had ~316GB free.
apiVersion: batch/v1
kind: Job
metadata:
  name: flashnext-download-20260828
  namespace: default
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 172800
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels: { app: flashnext-download }
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: dl
          image: python:3.12-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              pip install -q --no-cache-dir "huggingface_hub[cli]"
              export HF_HUB_DISABLE_XET=1
              DST=/data/qwen38-flash-next
              echo "[$(date)] downloading RadixArk/Qwen3.8-Flash-Next-NVFP4 -> $DST"
              hf download RadixArk/Qwen3.8-Flash-Next-NVFP4 --local-dir "$DST" --max-workers 8
              echo "[$(date)] done: $(du -sh $DST | cut -f1)"
              echo "=== PLE shards (should be 10 x model-plefp8-*.safetensors) ==="
              ls -la "$DST"/model-plefp8-*.safetensors 2>/dev/null | wc -l
              ls "$DST"/model.safetensors.index.json >/dev/null && echo "index.json present"
          env:
            - { name: HF_HOME, value: /data/.hfhome }
            - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } } }
          volumeMounts:
            - { name: models, mountPath: /data }
          resources:
            requests: { cpu: "2", memory: 3Gi }
            limits: { cpu: "4", memory: 8Gi }
      volumes:
        - { name: models, persistentVolumeClaim: { claimName: flashnext-models } }
