# AutoScheme mixed-NVFP4 sweep for Muse-Glimmer-30B (NO PUBLISH — iteration/benchmark only).
# v0.27-dev serves mixed config_groups (gate passed), so we can now produce mixed variants at several
# avg_bits, keeping fused q/k/v + gate/up uniform via shared_layers (required for vLLM fused-layer load).
#
# Parametrized: AVG_BITS, ITERS (0=fast RTN smoke, 200=real), NSAMPLES. Options NVFP4 (4-bit base) +
# MXFP8 (8-bit promotion for AutoScheme-selected sensitive layers). Output -> /workspace/runs/muse-autoscheme-avg<AVG>.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: muse-autoscheme-quant-scripts
  namespace: default
data:
  run.sh: |
    #!/bin/bash
    set -uo pipefail
    PY="$(command -v python3 || command -v python)"
    export HF_HOME=/workspace/hf PYTHONUNBUFFERED=1 TOKENIZERS_PARALLELISM=false
    export AR_ENABLE_AUTO_SCHEME_PARALLEL=0   # serial scoring (parallel forks fail in-container)
    export AR_AUTO_SCHEME_BATCH_SIZE=1        # keep scoring activation memory low on the 30B
    mkdir -p /workspace/artifacts /workspace/runs "$HF_HOME"
    command -v git >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq git) >/dev/null 2>&1 || true
    echo "=== [$(date)] installing auto-round fork + transformers-from-source ==="
    "$PY" -m pip install --no-cache-dir "auto-round @ git+https://github.com/dbirks/auto-round.git@main" datasets accelerate 2>&1 | tail -6
    "$PY" -m pip install --no-cache-dir --upgrade "git+https://github.com/huggingface/transformers.git" 2>&1 | tail -4
    "$PY" -c "import auto_round,transformers; print('auto_round',auto_round.__version__,'transformers',transformers.__version__)"
    "$PY" /scripts/quant.py
  quant.py: |
    #!/usr/bin/env python3
    import importlib, json, os
    from pathlib import Path
    MODEL = os.environ.get("MUSE_MODEL", "meta-models/Muse-Glimmer-30B")
    AVG   = float(os.environ.get("AVG_BITS", "4.75"))
    ITERS = int(os.environ.get("ITERS", "0"))
    NSAMP = int(os.environ.get("NSAMPLES", "8"))
    CALIB = "NeelNanda/pile-10k"
    OUT = Path(os.environ.get("QUANT_OUT", f"/workspace/runs/muse-autoscheme-avg{AVG}"))
    ART = Path("/workspace/artifacts"); OUT.mkdir(parents=True, exist_ok=True)
    print(f"=== AutoScheme avg_bits={AVG} iters={ITERS} nsamples={NSAMP} -> {OUT} ===", flush=True)

    import torch  # noqa
    # AutoScheme RELOADS weights per candidate scheme and can't resolve a bare HF repo id at
    # that point (FileNotFoundError on 'meta-models/...'). Resolve to the cached local snapshot
    # dir up front (snapshot_download returns the cache path with no re-download when present).
    if not os.path.isdir(MODEL):
        from huggingface_hub import snapshot_download
        MODEL = snapshot_download(MODEL)
        print("resolved local model path:", MODEL, flush=True)
    from auto_round import AutoRound, AutoScheme
    from transformers import AutoConfig
    cfg = AutoConfig.from_pretrained(MODEL, trust_remote_code=True)
    print("model_type:", getattr(cfg, "model_type", None), flush=True)

    # Keep fused modules uniform (vLLM fuses q/k/v -> QKVParallelLinear, gate/up -> MergedColumnParallel).
    SHARED = [["q_proj", "k_proj", "v_proj"], ["gate_proj", "up_proj"]]

    def make():
        # low_gpu_mem_usage=False: keep the model on GPU during scoring (the low-GPU path offloads the
        # embedding to CPU but feeds it cuda input_ids -> device mismatch). 30B fits 96GB forward-only.
        scheme = AutoScheme(avg_bits=AVG, options=("NVFP4", "MXFP8"), shared_layers=SHARED,
                            nsamples=NSAMP, low_gpu_mem_usage=False)
        return AutoRound(MODEL, scheme=scheme, dataset=CALIB, nsamples=NSAMP, seqlen=2048,
                         iters=ITERS, batch_size=4, device_map=0, trust_remote_code=True,
                         quant_nontext_module=False, seed=42)
    try:
        ar = make()
    except Exception as e:
        print("AutoRound init failed; registering MLLM template:", repr(e)[:300], flush=True)
        reg = procs = None
        for tmod, pmod in [("auto_round.mllm.template", "auto_round.mllm.processor"),
                           ("auto_round.compressors.mllm.template", "auto_round.compressors.mllm.processor")]:
            try:
                reg = importlib.import_module(tmod)._register_template
                procs = importlib.import_module(pmod).PROCESSORS; break
            except Exception: continue
        if reg is None: raise
        reg(model_type=cfg.model_type, default_dataset=CALIB, processor=procs["hf"])
        ar = make()

    _, saved = ar.quantize_and_save(output_dir=str(OUT), format="llm_compressor")
    def find_cfg(base):
        base = Path(base)
        if (base / "config.json").is_file(): return base
        for p in sorted(base.rglob("config.json")): return p.parent
        return None
    cand = saved[0] if isinstance(saved, (list, tuple)) else saved
    d = find_cfg(cand) or find_cfg(OUT)
    c = json.loads((d / "config.json").read_text())
    qc = c.get("quantization_config") or {}
    groups = qc.get("config_groups") or {}
    # summarize: how many layers landed in each precision group
    sizes = {}
    for gname, g in groups.items():
        w = g.get("weights") or {}
        sizes[f"{gname}(w{w.get('num_bits')})"] = len(g.get("targets") or [])
    total = sum(f.stat().st_size for f in Path(d).rglob("*") if f.is_file())
    summ = {"avg_bits": AVG, "iters": ITERS, "out": str(d), "format": qc.get("format"),
            "n_groups": len(groups), "group_sizes": sizes, "size_gb": round(total/1024**3, 2)}
    (ART / f"autoscheme-avg{AVG}-summary.json").write_text(json.dumps(summ, indent=2))
    print("SUMMARY", json.dumps(summ, indent=2), flush=True)
    print("=== quant complete ===", flush=True)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: muse-autoscheme-avg475-smoke3-20260812
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: muse-autoscheme-quant }
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      enableServiceLinks: false
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: quant
          image: vllm/vllm-openai:v0.26.0
          command: ["/bin/bash", "/scripts/run.sh"]
          env:
            - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-write-token, key: HF_TOKEN } } }
            - { name: AVG_BITS, value: "4.75" }
            - { name: ITERS, value: "0" }
            - { name: NSAMPLES, value: "8" }
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: scripts, mountPath: /scripts }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: muse-quant-workspace } }
        - { name: scripts, configMap: { name: muse-autoscheme-quant-scripts } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 8Gi } }
