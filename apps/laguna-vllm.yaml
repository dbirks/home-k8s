# poolside Laguna — big agentic-coding LLM (standalone vLLM), PARKED at replicas: 0.
#
# Serves poolside/Laguna-S-2.1-NVFP4 (118B total / 8B active MoE, NVFP4) on the
# OpenAI-compatible chat API, port 8000, model name "laguna". Downloaded to a
# NEW HDD-backed PVC (local-path-hdd, on the 3.7TB sdb) so it does NOT compete
# with the SSD (sda4) that holds the Qwen model + the containerd image cache.
#
# WHY S-2.1 (118B-A8B), NOT the 225B M.1:
#   - Laguna-M.1-NVFP4 is ~139GB on disk — over the 96GB card before any KV
#     cache. Does NOT fit a single RTX PRO 6000. (Needs 2x GPU / tensor-parallel.)
#   - S-2.1-NVFP4 is ~72GB on disk (~76-80GB in VRAM) — FITS 96GB, and it's the
#     NEWER "2.1" generation: stronger agentic scores than the older M.1
#     (Terminal-Bench 2.1 70.2%, SWE-bench Pro 59.4%, SWE-bench Multilingual
#     78.5%). Only 8B active params/token, so decode stays fast.
#   - Its 3:1 sliding-window/global attention (only 12 global layers scale with
#     context) + first-party FP8 KV cache make a 200-256k context cheap in VRAM.
#
# GPU MEMORY — READ BEFORE bringing this up:
#   Time-slicing gives NO memory isolation; all GPU pods' --gpu-memory-utilization
#   share the one 96GB card and must sum to < 1.0. S-2.1 at ~0.85 needs ESSENTIALLY
#   THE WHOLE CARD, so it CANNOT coexist with Qwen (0.60) or gemma. Before scaling
#   this to 1: scale apps/vllm.yaml (Qwen) to replicas 0 (granite-stt at 0.10 can
#   stay if you drop this to ~0.80). This is the "make Qwen smaller / take it down"
#   tradeoff already discussed.
#
# NVFP4-MoE ON BLACKWELL (SM120) — canary first:
#   You've hit generic vLLM NVFP4-MoE kernel bugs on SM120 before (dense OK, MoE
#   buggy). poolside co-developed the vLLM path and gates NVFP4 behind vLLM >=
#   0.22.0 (cluster has v0.24.0, OK), and labels these checkpoints "Blackwell
#   only" — materially better odds than the generic Qwen case, but STILL a
#   MoE+NVFP4 combo on your problem arch. RECOMMENDED: first flip --model to the
#   tiny canary poolside/Laguna-XS-2.1-NVFP4 (33B-A3B, ~22GB) to validate the
#   NVFP4-MoE path + tool-call round-trip on this card, THEN switch to S-2.1.
#
# SPECULATIVE DECODING (DFlash) — later:
#   poolside ships a matched DFlash drafter (poolside/Laguna-S-2.1-DFlash, a
#   5-layer Llama-style draft model, ~7 tok/step, ~70% accept) — same recipe as
#   your speculators DSpark/DFlash drafters. But vLLM spec-decode for these needs
#   unreleased code (PR #46853), not in v0.24.0. Run WITHOUT spec-decode for now;
#   wire in DFlash (or a home-trained DSpark drafter) once that lands.
#
# vLLM: base needs >= 0.21.0; NVFP4/FP8/INT4 checkpoints need >= 0.22.0. Pinned
# to v0.24.0 (already proven on-cluster). Quant is auto-detected from the config.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laguna-models
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-hdd   # 3.7TB HDD (sdb), ~2.4TB free — NOT the SSD
  resources:
    requests:
      storage: 200Gi                 # room for S-2.1 (~72GB) + XS canary (~22GB) + hub metadata
---
# 2026-07-24: NVMe copy of the Laguna model for FAST loads (HDD load ~15min ->
# NVMe ~90s). A copy Job populates this from laguna-models, then the Deployment's
# claimName switches here. local-path (default class) = the P510 NVMe (/var).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laguna-models-nvme
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path      # default class = P510 NVMe (fast)
  resources:
    requests:
      storage: 120Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laguna
  namespace: default
spec:
  # replicas: 0 — PARKED. Bring up deliberately, and only after scaling Qwen down
  # (see GPU MEMORY note above). Bring up ONE big model at a time.
  replicas: 1   # 2026-07-25: RESUMED — model now COMPLETE (15/15 on NVMe). First real serve with the primed trio+marlin+kernel-config-warmups-off config.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: laguna
  template:
    metadata:
      labels:
        app: laguna
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false
      containers:
        - name: laguna
          image: vllm/vllm-openai:v0.25.1   # 2026-07-24: bumped from v0.24.0 — Laguna S-2.1 needs vLLM >=0.25 (poolside recipe); v0.25.1 stable + already pulled on-node
          # 2026-07-25 THE FIX (research: MiaAI-Lab/Laguna-S-2.1-DGX-Spark-RTX-6000-PRO
          # recipe; FlashInfer #2093/#3294, vLLM #41865/#44305). ROOT CAUSE of the
          # boot wedge: the stock image ships flashinfer-python 0.6.13 ALONE, with NO
          # matching sm_120 cubin/jit-cache — so on SM120 FlashInfer falls into
          # on-serve JIT that DEADLOCKS (no cublasLt.h in image + JIT file-lock stall,
          # GPU 0% / CPU idle / frozen log = our exact symptom). marlin did NOT help
          # because the wedge is in FlashInfer attention/sampler JIT, not MoE compute.
          # FIX: bootstrap-install the version-matched FlashInfer nightly TRIO
          # (flashinfer-python + -cubin + -jit-cache, all 0.6.15.dev20260712, jit-cache
          # from the cu130 sub-index) which SHIPS prebuilt sm_120 cubins -> no on-serve
          # JIT -> no wedge. pip download cache persists on NVMe (HOME=/data) so
          # reinstalls are fast. TODO: bake the trio into a custom image to skip this.
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              FIV="0.6.15.dev20260712"
              echo "[bootstrap] installing FlashInfer trio ${FIV} (prebuilt sm_120 cubins)..."
              pip install --upgrade --no-deps \
                "flashinfer-python==${FIV}" \
                "flashinfer-cubin==${FIV}" \
                "flashinfer-jit-cache==${FIV}+cu130" \
                --extra-index-url https://flashinfer.ai/whl/nightly/ \
                --extra-index-url https://flashinfer.ai/whl/nightly/cu130/
              pip install --upgrade "cuda-tile==1.5.0" "nccl4py==0.3.1"
              echo "[bootstrap] flashinfer-python now: $(pip show flashinfer-python 2>/dev/null | awk '/^Version/{print $2}')"
              # 2026-07-25: --moe-backend=marlin. With the trio installed, attention +
              # sampler JIT are fixed, so the ONLY remaining stall was the auto
              # FLASHINFER_CUTLASS path's cutedsl_warmup (enable_cutedsl_warmup=True,
              # NOT CLI-disableable in 0.25.1) — it wedged ~12min after FLASHINFER_CUTLASS
              # selection (busy autotune burst, then flat-idle, "Model loading took" never
              # printed). MARLIN is a vLLM-internal FP4 MoE kernel that uses NEITHER the
              # FlashInfer MoE JIT NOR cutedsl, so it skips that warmup entirely. (Its
              # earlier "stall" was pre-trio = the attention JIT wedge, now resolved.)
              # 2026-07-25: DFlash spec-decode ON. Sweeping num_speculative_tokens
              # K=3/5/7 (drafter poolside/Laguna-S-2.1-DFlash-NVFP4, ~2.1GB NVFP4,
              # downloaded on the PVC). --max-num-seqs stays small (4): DFlash crashes
              # at the default 256. Baseline (no spec-decode, cudagraphs) = 107.5 tok/s.
              exec vllm serve \
                --model=poolside/Laguna-S-2.1-NVFP4 \
                --served-model-name laguna main \
                --host=0.0.0.0 --port=8000 \
                --trust-remote-code \
                --gpu-memory-utilization=0.85 \
                --max-model-len=131072 \
                --moe-backend=marlin \
                --kernel-config '{"enable_cutedsl_warmup": false, "enable_flashinfer_autotune": false}' \
                --speculative-config '{"model":"poolside/Laguna-S-2.1-DFlash-NVFP4","num_speculative_tokens":15,"method":"dflash"}' \
                --max-num-seqs=4 \
                --max-num-batched-tokens=8192 \
                --enable-prefix-caching \
                --enable-chunked-prefill \
                --tool-call-parser=poolside_v1 \
                --reasoning-parser=poolside_v1 \
                --enable-auto-tool-choice \
                --default-chat-template-kwargs='{"enable_thinking": true}'
          ports:
            - containerPort: 8000
          env:
            - name: HF_HOME
              value: /data
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            # SM120-correct FlashInfer attention. With the cubin-backed trio (see the
            # command bootstrap above) the prebuilt sm_120 kernels satisfy attention+MoE,
            # so this no longer forces a doomed JIT.
            - {name: VLLM_ATTENTION_BACKEND, value: FLASHINFER}
            - {name: FLASHINFER_CUDA_ARCH_LIST, value: 12.0f}
            # 2026-07-25: kill the SECOND JIT wedge — the FlashInfer SAMPLER has its own
            # JIT path that also deadlocks on sm_120f (vLLM #44305 / flashinfer #3493).
            # Use vLLM's native sampler instead.
            - {name: VLLM_USE_FLASHINFER_SAMPLER, value: "0"}
            # Persist the FlashInfer RUNTIME cache on the NVMe PVC (HOME=/data already
            # redirects ~/.cache/flashinfer here; pin it explicitly too).
            - {name: FLASHINFER_CACHE_DIR, value: /data/.cache/flashinfer}
            # REMOVED FLASHINFER_FORCE_SM=120f — research flags it HARMFUL here: it
            # forces a JIT (which then wedges) instead of loading the prebuilt cubins.
            # The trio's sm_120 cubins + FLASHINFER_DISABLE_VERSION_CHECK cover us.
            # 2026-07-25: per the exact-match RTX 6000 PRO recipe (MiaAI-Lab) — pin
            # CuteDSL arch to sm_120 (sm_121a is DGX Spark) so nothing JITs wrong.
            - {name: CUTE_DSL_ARCH, value: sm_120}
            # 2026-07-25: THROTTLE first-boot JIT compilation (FlashInfer/cutedsl)
            # per the exact-match RTX 6000 PRO recipe (MiaAI-Lab). Without these the
            # kernel JIT spawns too many parallel nvcc jobs and DEADLOCKS right after
            # weight-load — our exact hang (weights on GPU, then wedged, GPU+CPU idle).
            # Likely the REAL fix: marlin AND flashinfer_cutlass both hung the same way.
            - {name: MAX_JOBS, value: "2"}
            - {name: NVCC_THREADS, value: "1"}
            - {name: FLASHINFER_NVCC_THREADS, value: "1"}
            - {name: FLASHINFER_DISABLE_VERSION_CHECK, value: "1"}
            # 2026-07-24: PERSIST JIT compile caches onto the NVMe model PVC (/data)
            # so the expensive first-boot kernel compile (FlashInfer/Triton/inductor)
            # happens ONCE and every boot after REUSES it — no recompile, no re-hang.
            # HOME=/data is the catch-all (redirects every ~/.cache/* tool to the
            # persistent volume even if we named a var wrong); explicit vars pin the
            # known ones. Model + caches both live on the 120Gi NVMe PVC. NOTE: the
            # FIRST boot must still complete the compile once to populate the cache.
            - {name: HOME, value: /data}
            - {name: VLLM_CACHE_ROOT, value: /data/.cache/vllm}
            - {name: TRITON_CACHE_DIR, value: /data/.cache/triton}
            - {name: TORCHINDUCTOR_CACHE_DIR, value: /data/.cache/torchinductor}
            - {name: FLASHINFER_WORKSPACE_BASE, value: /data/.cache/flashinfer}
          # 2026-07-25: SYS_PTRACE so `py-spy dump` can read the EngineCore Python
          # frame if the boot wedges again (to distinguish the load-time warmup from
          # the earlier weight-processing path). Harmless once serving.
          securityContext:
            capabilities:
              add: ["SYS_PTRACE"]
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "2"
              memory: 16Gi
          volumeMounts:
            - name: models
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            # 118B NVFP4 first pull is ~72GB over the network to the HDD, then a
            # long load — generous window so the pod isn't killed mid-download.
            failureThreshold: 240
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            # Still HDD for now — the NVMe copy job can't co-mount this RWO PVC while
            # the Laguna pod holds it; do the NVMe migration later with Laguna at 0.
            claimName: laguna-models-nvme
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: laguna
  namespace: default
spec:
  selector:
    app: laguna
  ports:
    - port: 80
      targetPort: 8000
