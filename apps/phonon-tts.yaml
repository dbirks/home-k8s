# Gradium Phonon TTS (phonon-31m-en, q8, CPU only) on dave-droid, issue #160. 2026-10-26.
#
# Official Rust server ghcr.io/gradium-ai/ptts-openai-server 0.4.2 (OpenAI POST /v1/audio/speech), CPU only:
# no GPU resource, no runtimeClassName. Lives on dave-droid (i7-6700K, AVX2, 64 GB) because the main node is
# short on host RAM. Contributed to the LLM Collective as `phonon-31m` (types: [speech]); Open WebUI's
# read-aloud / voice mode uses it through the Collective.
#
# LICENCE: only phonon-31m-en is Apache-2.0. The 40m and multilingual checkpoints are CC BY-NC 4.0 and must
# NOT be served to the Collective. The voice catalog (gradium/phonon-voices) is Apache-2.0.
#
# ZERO DATA RETENTION / OFFLINE: the server never logs request text, writes nothing per request (root fs is
# read-only, assets mounted read-only) and never calls Gradium: weights + the 37 English catalog voices are
# staged by the init container at pinned HF revisions and sha256-checked, PTTS_MODEL/PTTS_VOICE_CATALOG point
# at local paths (verified running with no network at all), HF_HUB_OFFLINE=1. Catalog voices only: there is
# no local voice-enrollment endpoint, and cloud cloning (Gradium API) is deliberately not wired up.
#
# No auth on the server: ClusterIP only, reached by the Collective contributor. Excess requests beyond
# PTTS_MAX_CONCURRENT_REQUESTS get an immediate 429 (no queue); keep the contributor's concurrency equal.
# Voices: GET /v1/audio/voices. OpenAI's names (alloy, echo, ...) are aliased to catalog voices below, because
# Open WebUI can't list the Collective's voices and falls back to offering OpenAI's names. speed must be 1.0.
#
# Measured on dave-droid 2026-10-26 (mp3, voice Harper): a 3.4 s sentence in 0.40-0.58 s, first audio after
# ~0.2 s; 33 s of speech in 3.4-3.9 s (RTF ~0.11, ~9x real time). 2/3/4 concurrent long requests: 6.3/9.8/15 s
# each (all still faster than real time); the 5th gets an instant 429. Skill: .agents/skills/phonon-tts.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phonon-tts-assets
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path        # binds on dave-droid (WaitForFirstConsumer)
  resources: { requests: { storage: 1Gi } }   # ~75 MB: q8 GGUF 64.5 MB + tokenizer + 38 voices x 256 KB
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phonon-tts
  namespace: default
  labels: { app: phonon-tts }
spec:
  replicas: 1
  strategy: { type: Recreate }        # RWO local PVC
  selector:
    matchLabels: { app: phonon-tts }
  template:
    metadata:
      labels: { app: phonon-tts }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector: { kubernetes.io/hostname: dave-droid }
      tolerations:
        - { key: dedicated, operator: Equal, value: pascal, effect: NoSchedule }
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        # Stage the checkpoint and English catalog voices once, at pinned revisions, sha256-checked.
        # phonon-31m-en @ 92741c5b: only the files the q8 server reads (model.safetensors/q4k are not needed).
        # phonon-voices @ da6c9ec0: the catalog revision ptts-openai-server 0.4.2 itself defaults to.
        - name: fetch-assets
          image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
          command:
            - sh
            - -ec
            - |
              MREV=92741c5b07d085ff840e26fea8ce43110b87852f
              VREV=da6c9ec0d47be8df5c87c730a3aa97187f3229c3
              MARK=/assets/.verified-$MREV-$VREV
              [ -f "$MARK" ] && { echo "assets already verified"; exit 0; }
              rm -rf /assets/dl && mkdir -p /assets/dl/phonon-31m-en /assets/dl/voices/voices
              M=https://huggingface.co/gradium/phonon-31m-en/resolve/$MREV
              V=https://huggingface.co/gradium/phonon-voices/resolve/$VREV
              cd /assets/dl/phonon-31m-en
              for f in config.json tokenizer.json tokenizer.model model.q8.gguf default-voice.safetensors; do
                wget -q -O "$f" "$M/$f"
              done
              sha256sum -c - <<'EOF'
              b5d0f88353638370d94035b7d73d7d6577c0554d78f8d7ecfd40490aae39ae85  config.json
              691a00068fa7b989f2f3e5ae5daa2d1a5bb319f2d5360deafcfb19a8bb6e7936  tokenizer.json
              82e4572006d64d483317074c22c368e87779640b6f3a9dcd07b7caae32b030ce  tokenizer.model
              a7d9aad2cd6dc66473f24a08bc6d2939030ef4d751ef82349361fbef3272dbae  model.q8.gguf
              dc537478eaadc1a5257fcda2e3501ab81e14c111a5d95a5838f350db2afd0f1a  default-voice.safetensors
              EOF
              cd /assets/dl/voices
              wget -q -O all.jsonl "$V/voices.jsonl"
              echo "874f34998ce581b94f2b8912aa015639f52b5fd62eba3ba11e1b64dcaed7d802  all.jsonl" | sha256sum -c -
              grep '"language": "en"' all.jsonl > voices.jsonl && rm all.jsonl
              echo "6156d80ef42d39e394ec02208a2663f292538d0301aa113310d374f828738522  voices.jsonl" | sha256sum -c -
              sed -n 's/.*"filename": "\([^"]*\)".*/\1/p' voices.jsonl | while read -r f; do wget -q -O "$f" "$V/$f"; done
              sha256sum -c - <<'EOF'
              97c7f8c253413574406ab80dd23f49c3ebb2517163b00a9bf86b9c4cf43e7e23  voices/NbpkqMVS3CJeq2j8.safetensors
              444378eb06b7c492b86e8fc7d13e4db1a3c0cf3e68891a960bf6f0a41a13ef35  voices/NIWIOv5vTi5eRMj8.safetensors
              958ea94da14f46dd48c7f64adac11ed2ad2aa45f7ccd165dfebab5272664402e  voices/vjFyp2BcCyTlUmYb.safetensors
              6b3da6e2d796a20c51af892c482bd6509fb88267a221aff83c870843dee2a123  voices/4SZHfMpw-p46Ywgs.safetensors
              a879938aa9a2df0a8220bdadef88137929f71e887bd91e7db205bd5fa11661d2  voices/bXwrkHhURL1VFJdG.safetensors
              a0c3dcb91b2247eca56536be9ae8e8becc1c807b1136c5fe101552d6a155b24a  voices/nGzMHMPAWGaJFHOo.safetensors
              45c582673cb20edb04ddcca2b5a8865ddfb0a82599efadb269021e87d20fbdd4  voices/LMDIYE0Oa377Qh6Z.safetensors
              0de1098d1051686a138d068e83ff09deb5053328bc74ec9541a1fdb90bfc24da  voices/40QrMVgAxFiUnP9f.safetensors
              dc1341c8937af5534e6bbcc5c0fc5e7c10312229b59061228074f93683fe2261  voices/0zLApsZfVLLNaEGl.safetensors
              beae9e4030efce0a935fcb0f807dc0784d598bcaa87ad4aacb047436b1eaa411  voices/_6Aslh2DxfmnRLmP.safetensors
              6e04b84d3ae8751b22bca0a4f63936f9cb648f4f2182b2d0788071ea1c0b68a1  voices/qIxlZ7Ei8KvWlyQH.safetensors
              eab20e4f159b48cfbc01b1885804e24f681f80e7a64f909182763a4e3361bee8  voices/d9XCyhjo4JhkHF1d.safetensors
              56494ee67d533ad227ff0dfd0b1c13ff5aa91f1ad6e596e66c2986ba3005e844  voices/6PWnV0Nq4wu7RVBT.safetensors
              eb3cd47418349e618408c16bea7153988b3ad04b41a6033039dd474a9a4dcd23  voices/GgfEkEJtxZR7gnpy.safetensors
              d41a8f01d6e33450f1ce062d332914da10beee99e585dab531750706f187c48a  voices/uem82D50GRv2Dwma.safetensors
              21eade9d83b2e66b9364e1b6cd999a3a6704c000a71f27f34e05ace5cdfd58bb  voices/y9bQqIDnyxwqK01t.safetensors
              1980ab3c35fa98a25b5f3b5e643fd852e14ca8a12a4a26b06aaf1abf2a8c68b1  voices/gDT1nz7Ie36ZhL-C.safetensors
              a906ebf17e43fded12b3d6bd077abb2df33bc86eff51c1beeb82e5d416527db3  voices/m9MxpY6IUGXtWp76.safetensors
              4de75497fff3030168e8aa6dca23ffeb332b1bc8c25d0bf3507ceadac953ae9c  voices/X6NceqF285Gr04gb.safetensors
              3169d74b47a54d1eb15e4c243f56393abe9fe90c7e1c308ecf96ee67618b152a  voices/YyKcxPG7iIgS3jsK.safetensors
              ff1d0735b8b45710462b1d1f846da040f970c6eb62c7c2f36dbfb8e5bde74f1e  voices/zUCxzrOrugTSis03.safetensors
              cc9ac1107b0ffce282374a19beb7bfa95847724e6b7afbac991b4ae4277d5e6d  voices/JOW0vchyswkQUMDS.safetensors
              09ab315c7f4b72b4d71e66cb756184cedfb1f14d222d096e115bf95bfe7b29dc  voices/dME3IWyZBvmh1n1q.safetensors
              baea0ea9506f3237a5ebfc61afb7c72dbd189c5603b199ef42fbb00dbda379e0  voices/Zn7g6NxLqXlJb7Qi.safetensors
              bcc207a73b7885e45b49ab633d3377a10158292e3a7cef9cd6764ad107f1cb9b  voices/gfP44RlHwr2kEwk7.safetensors
              a09f615b0084980ebc4076d71550bf73ccd8d4df076bbbee4a9beb523a1379d9  voices/xPDpsV3F592srkjA.safetensors
              2ff2db91e70648623df8d42c0dcd7c336b2f14cb4362d602a20f292a4d862154  voices/nOykTmcH9ydsGGIc.safetensors
              d3f9429205e5906dcd3c78edaf7c9d5148c7e389e34c82c86f72f154adb5d923  voices/lX3LavMNdlIbgEHH.safetensors
              83900e020c14946426614c6553c5a138ba6277e1aaa69832223bd0f0f8b73893  voices/dGyGDKo2osj7h3s7.safetensors
              a05944e4c69d61d10d66f689175ba0b081930df2d77b22f04d00ac40d3d69ecb  voices/cXoIXJ2llS8S0WOW.safetensors
              bfa37bac98aefbb9de80f792c47d01a0f9e3b94e73776169040c249c8b722759  voices/GXaSqMEmOg12OIYb.safetensors
              63ab4b15427844a804480a1603774262e8903dee33cb279e2749860dbfaedd10  voices/xO8xQo3BrB8FuI6J.safetensors
              b30fa847686ec1eb6be8c5bea4b6a5c5076ea66c3ff053cf98210a155d8aad1e  voices/cYtsRSxV5q9IMehn.safetensors
              a83430cc022b85c83753f859f9e44f406651646dab994fced8ef7a9a88005971  voices/gSgG5Tor0GPEnqzC.safetensors
              bc8a8fcb95bb4f32d2d4376aa69d81b186b3ba2f8e9b6cb6a403b2b194590e85  voices/NIWoEurJHMJjyUTe.safetensors
              b3cea6789aeb58822af16ba08c4e5105d7febb840dcb67b47f426c19d1a8f209  voices/y2eiKxtQo2B67deU.safetensors
              f390c09f5e279c0f2171995a534b92f5ca5c83443906879da68fc27445f89d89  voices/QXNr0SvkukLB4wPq.safetensors
              EOF
              rm -rf /assets/phonon-31m-en /assets/voices
              mv /assets/dl/phonon-31m-en /assets/dl/voices /assets/ && rmdir /assets/dl
              rm -f /assets/.verified-* && touch "$MARK" && du -sh /assets/*
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: assets, mountPath: /assets }
      containers:
        - name: phonon
          image: ghcr.io/gradium-ai/ptts-openai-server:0.4.2@sha256:3f83e0b575e891709f36282601c4751007b98fae7772d612afdcf691602747cd
          env:
            - { name: PTTS_MODEL, value: /assets/phonon-31m-en }
            - { name: PTTS_VOICE_CATALOG, value: /assets/voices/voices.jsonl }
            - { name: PTTS_LANG, value: en }
            - { name: PTTS_QUANT, value: q8 }
            - { name: PTTS_DEVICE, value: cpu }
            - { name: PTTS_MAX_CONCURRENT_REQUESTS, value: "4" }
            # OpenAI's voice names -> catalog voices (Open WebUI only offers these names). Others -> Harper.
            - { name: PTTS_VOICE_ALIAS, value: "alloy=Harper,echo=Easton,fable=Toby,onyx=Miles,nova=Juniper,shimmer=Everly" }
            - { name: PTTS_OPENAI_VOICES, value: Harper }
            # One shared 4-thread pool (the i7-6700K's physical cores). Default is 8 threads, which under the CPU
            # limit throttled: 2 concurrent long requests took 8.2 s each vs 6.3 s with 4 threads; single is equal.
            - { name: RAYON_NUM_THREADS, value: "4" }
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: HF_HOME, value: /nonexistent }
          ports:
            - { name: http, containerPort: 8880 }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health, port: http }   # stays up while generation is busy
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          # Measured 2026-10-26: RSS 139 MiB idle, ~490 MiB peak with 1 request, 769 MiB peak with 4 concurrent;
          # one generation keeps ~4-6 cores busy (15 CPU-s per 33 s of speech).
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "6", memory: 1536Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: assets, mountPath: /assets, readOnly: true }
      volumes:
        - name: assets
          persistentVolumeClaim: { claimName: phonon-tts-assets }
---
apiVersion: v1
kind: Service
metadata:
  name: phonon-tts
  namespace: default
spec:
  type: ClusterIP
  selector: { app: phonon-tts }
  ports:
    - { name: http, port: 8880, targetPort: http }
