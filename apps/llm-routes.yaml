# llm.birks.dev routing + API-key enforcement.
#
# /v1/* -> vLLM backend, guarded by kgateway apiKeyAuth (per-key Secrets).
# (/ -> portal is added once the portal Deployment/Service exist.)
#
# INTERIM BACKEND: the plain `vllm` Service (Qwen3.6-27B) in the `default` namespace,
# reachable cross-namespace via the ReferenceGrant below. When the vLLM Production
# Stack is stood up in llm-portal, repoint this backendRef there and drop the grant.
#
# API-KEY MODEL (verified live + matched to the portal repo's Secret contract):
#   - One Secret per credential (type extauth.solo.io/apikey), stringData holds
#     { client-<opaque-id>: "llm_<credential>" } — the RAW key value, NO "Bearer " prefix.
#   - Selected by label `llm-portal/api-key: "true"` (the portal's LabelDomain=llm-portal;
#     this selector MUST match it or every key silently fails to authenticate).
#   - keySources: [{header: Authorization}] — kgateway STRIPS the "Bearer " scheme and
#     matches the bare token, so OpenAI/Claude-Code clients sending
#     `Authorization: Bearer llm_...` match the raw stored value. (Verified: 200.)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-v1
  namespace: llm-portal
spec:
  parentRefs:
    - name: llm-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: vllm-stack-router-service   # vLLM Production Stack router (Qwen3.6-27B)
          namespace: default
          port: 80
---
# Allow the llm-portal HTTPRoute to reference the vllm Service in `default`.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: llm-portal-httproute-to-vllm
  namespace: default
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: llm-portal
  to:
    - group: ""
      kind: Service
      name: vllm-stack-router-service
---
# Enforce API keys on /v1 ONLY (portal paths stay unauthenticated for OIDC login).
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: vllm-apikey-auth
  namespace: llm-portal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-v1
  apiKeyAuth:
    keySources:
      - header: Authorization
    secretSelector:
      matchLabels:
        llm-portal/api-key: "true"
---
# Catch-all -> portal (sign-in, /account, key create/revoke). Same namespace as the
# Gateway, so no ReferenceGrant. NO apiKeyAuth here (OIDC login must be reachable);
# /v1 is a longer prefix so it still routes to vLLM.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
  namespace: llm-portal
spec:
  parentRefs:
    - name: llm-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: llm-portal
          port: 80
