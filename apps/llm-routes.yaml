# llm.birks.dev routing + API-key enforcement.
#
# ENTRY: Cloudflare Tunnel -> Envoy Gateway `llm-public-gw` (class "envoy", ns llm-portal,
# apps/llm-public-gateway.yaml). Per-route SecurityPolicy apiKeyAuth guards the model API;
# portal `/` and grafana `/grafana` stay unauthenticated (OIDC/oauth2-proxy own their own login).
#
# MODEL ROUTING (single URL): ALL models are served from ONE base URL
#   https://llm.birks.dev/v1
# The client picks the model with the request-body `model` field; there is no per-model path.
# The `/v1` route below forwards (no rewrite) to the dedicated AI gateway `llm-ai-gw`
# (apps/llm-ai-gateway.yaml, ns default), whose Envoy AI Gateway `AIGatewayRoute` extracts the
# body `model`, stamps `x-ai-eg-model`, and routes to that model's InferencePool -> EPP -> vLLM.
# (This replaced six per-model path-prefix HTTPRoutes: /v1, /muse/v1, /qwen36/v1, /qwen36-a3b/v1,
# /gemma/v1, /laguna/v1 — model-name routing makes them unnecessary.)
# The AI gateway's managed Service name `envoy-default-llm-ai-gw-1404bca3` is a deterministic hash
# of its namespace/name and is stable across reconciles.
#
# ANTHROPIC SURFACE (Claude Code) — EAG OpenAI<->Anthropic TRANSLATION, multi-model on ONE URL:
#   Envoy AI Gateway v1.0.0 exposes an Anthropic Messages client endpoint at PATH /anthropic/v1/messages
#   (+ /anthropic/v1/messages/count_tokens). EAG picks the INPUT schema purely from that path prefix
#   (there is no input-schema field on the v1beta1 AIGatewayRoute — verified against the CRD), parses
#   the body `model` into x-ai-eg-model exactly like the OpenAI surface, routes to that model's
#   InferencePool, and TRANSLATES the Anthropic request to the backend's OpenAI schema (and the OpenAI
#   response back to Anthropic). So a SINGLE Anthropic base URL body-model-routes to all six models.
#   The `/anthropic` match is added to the authenticated `vllm-openai` route below (same llm-ai-gw
#   backend, same apiKeyAuth) — it forwards UNREWRITTEN so EAG sees the /anthropic/v1/messages path.
#   Claude Code sets ANTHROPIC_BASE_URL=https://llm.birks.dev/anthropic and pins the model to one of
#   the six served-model-names (its default claude-* names won't match), e.g. ANTHROPIC_MODEL=qwen3.8-27b.
#   (This SUPERSEDED the old native single-model /v1/messages passthrough pinned to qwen38 on
#   kserve-llm-gw, which could not body-model-route.)
#
# API-KEY MODEL (Envoy Gateway SecurityPolicy.apiKeyAuth):
#   - ONE aggregate Opaque Secret `llm-apikeys` (apps/llm-apikeys.enc.yaml) in ns llm-portal. Each
#     data entry is `client-<opaqueid>: llm_<raw>` — the RAW key, NO "Bearer " prefix. The portal
#     issuer adds/removes entries at runtime.
#   - credentialRefs names that one Secret; extractFrom Authorization header. Envoy strips the
#     "Bearer " scheme and matches the bare token, so clients sending `Authorization: Bearer llm_...`
#     authenticate against the stored raw value.
#   - forwardClientIDHeader: the matched client id is forwarded to vLLM as X-Client-Id.
---
# Single authenticated model API. Two client surfaces, one backend (the model-name AI gateway):
#   /v1        -> OpenAI surface (POST /v1/chat/completions etc.)
#   /anthropic -> Anthropic surface (POST /anthropic/v1/messages), EAG-translated to OpenAI
# Both forward UNREWRITTEN to llm-ai-gw, whose AIGatewayRoute body-model-routes by x-ai-eg-model.
# Both prefixes are strictly more specific than the portal catch-all `/`, so portal/grafana are
# never shadowed. The single `vllm-apikey-auth` SecurityPolicy (below) covers both surfaces.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-openai
  namespace: llm-portal
spec:
  parentRefs:
    - name: llm-public-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /anthropic
      backendRefs:
        - name: envoy-default-llm-ai-gw-1404bca3   # llm-ai-gw Envoy (model-name routing, apps/llm-ai-gateway.yaml)
          namespace: envoy-gateway-system
          port: 80
---
# Allow the llm-portal HTTPRoute to reference the AI gateway's Envoy Service (cross-namespace).
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: llm-portal-httproute-to-ai-gw
  namespace: envoy-gateway-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: llm-portal
  to:
    - group: ""
      kind: Service
      name: envoy-default-llm-ai-gw-1404bca3
---
# Enforce API keys on the model API ONLY (portal `/` and grafana `/grafana` stay unauthenticated
# for OIDC / oauth2-proxy login). Attaches to the vllm-openai HTTPRoute, which carries BOTH the
# /v1 (OpenAI) and /anthropic (Anthropic, EAG-translated) surfaces.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: vllm-apikey-auth
  namespace: llm-portal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-openai
  apiKeyAuth:
    credentialRefs:
      - name: llm-apikeys
    extractFrom:
      - headers:
          - Authorization
    forwardClientIDHeader: X-Client-Id
---
# Catch-all -> portal (sign-in, /account, key create/revoke). Same namespace as the Gateway, so no
# ReferenceGrant. NO apiKeyAuth here (OIDC login must be reachable); the /v1 route's longer prefix
# matches first for the model API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
  namespace: llm-portal
spec:
  parentRefs:
    - name: llm-public-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: llm-portal
          port: 80
