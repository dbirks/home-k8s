# llm.birks.dev routing + API-key enforcement.
#
# ENTRY: Cloudflare Tunnel -> Envoy Gateway `llm-public-gw` (class "envoy", ns llm-portal,
# apps/llm-public-gateway.yaml). Per-route SecurityPolicy apiKeyAuth guards the model
# routes; portal `/` and grafana `/grafana` stay unauthenticated (OIDC/oauth2-proxy own
# their own login). (Previous impl was kgateway + TrafficPolicy apiKeyAuth — retired.)
#
# BACKEND: the KServe/llm-d Envoy gateway Service `envoy-default-kserve-llm-gw-8ab60ea9`
# in `envoy-gateway-system` (port 80). This is the Envoy-class Gateway `kserve-llm-gw`
# (10.0.0.204) that fronts the LLMInferenceServices. The service name is a deterministic
# hash of the Gateway's namespace/name and is stable across reconciles. That Gateway and
# its *-kserve-route HTTPRoutes are owned by the LLMISVC controller — we do NOT touch them;
# we backendRef into its Service from our own routes (ReferenceGrant below).
#
# MODEL ROUTING (important): this backend does NOT do OpenAI body-`model` routing on a
# bare /v1 path (no AIGatewayRoute/ext-proc; bare /v1 => 404). Routing is PATH-based: KServe
# publishes each model under /default/<isvc>/v1/... . So we expose one authenticated base
# path per catalog model and rewrite into the KServe path:
#   - https://llm.birks.dev/v1            -> qwen38-llm     (model "qwen3.8-nvfp4", default/coding)
#   - https://llm.birks.dev/muse/v1       -> muse-glimmer-llm (model "muse-glimmer-30b")
#   - https://llm.birks.dev/qwen36/v1     -> qwen36-llm     (model "qwen3.6-27b")
#   - https://llm.birks.dev/qwen36-a3b/v1 -> qwen36-a3b-llm (model "qwen3.6-35b-a3b" MoE)
#   - https://llm.birks.dev/gemma/v1      -> gemma4-llm     (model "gemma-4-31b")
#   - https://llm.birks.dev/laguna/v1     -> laguna-llm     (model "laguna-s-2.1")
# Clients set base_url to the matching path; the body `model` must match that path's model
# (vLLM validates it). /v1 stays the default so single-model coworker configs still work.
#
# API-KEY MODEL (Envoy Gateway SecurityPolicy.apiKeyAuth):
#   - ONE aggregate Opaque Secret `llm-apikeys` (apps/llm-apikeys.enc.yaml). Each data entry
#     is `client-<opaqueid>: llm_<raw>` — the RAW key, NO "Bearer " prefix. The portal
#     issuer adds/removes entries at runtime.
#   - credentialRefs names that one Secret; extractFrom Authorization header. Envoy strips
#     the "Bearer " scheme and matches the bare token, so OpenAI/Claude-Code clients sending
#     `Authorization: Bearer llm_...` authenticate against the stored raw value.
#   - forwardClientIDHeader: the matched client id is forwarded to vLLM as X-Client-Id.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-v1
  namespace: llm-portal
spec:
  parentRefs:
    - name: llm-public-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /default/qwen38-llm/v1
      backendRefs:
        - name: envoy-default-kserve-llm-gw-8ab60ea9   # KServe/llm-d Envoy gateway (qwen3.8-nvfp4)
          namespace: envoy-gateway-system
          port: 80
---
# Second catalog model: muse-glimmer-30b, exposed at /muse/v1 (same auth).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-v1-muse
  namespace: llm-portal
spec:
  parentRefs:
    - name: llm-public-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /muse/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /default/muse-glimmer-llm/v1
      backendRefs:
        - name: envoy-default-kserve-llm-gw-8ab60ea9   # KServe/llm-d Envoy gateway (muse-glimmer-30b)
          namespace: envoy-gateway-system
          port: 80
---
