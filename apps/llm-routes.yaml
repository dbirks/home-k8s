---
# Allow the llm-portal HTTPRoutes to reference the KServe Envoy gateway Service.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: llm-portal-httproute-to-kserve-gw
  namespace: envoy-gateway-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: llm-portal
  to:
    - group: ""
      kind: Service
      name: envoy-default-kserve-llm-gw-8ab60ea9
---
# Enforce API keys on the model routes ONLY (portal `/` and grafana `/grafana` stay
# unauthenticated for OIDC / oauth2-proxy login). Envoy Gateway SecurityPolicy attaches
# per-HTTPRoute via targetRefs.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: vllm-apikey-auth
  namespace: llm-portal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-v1
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-v1-muse
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-v1-qwen36
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-v1-qwen36-a3b
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-v1-gemma
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-v1-laguna
  apiKeyAuth:
    credentialRefs:
      - name: llm-apikeys
    extractFrom:
      - headers:
          - Authorization
    forwardClientIDHeader: X-Client-Id
---
# Catch-all -> portal (sign-in, /account, key create/revoke). Same namespace as the
# Gateway, so no ReferenceGrant. NO apiKeyAuth here (OIDC login must be reachable);
# the model routes use longer prefixes so they still match first.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
  namespace: llm-portal
spec:
  parentRefs:
    - name: llm-public-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: llm-portal
          port: 80
