# llm.birks.dev routing + API-key enforcement.
#
# /v1/* -> KServe/llm-d gateway, guarded by kgateway apiKeyAuth (per-key Secrets).
# (/ -> portal for OIDC login/key management, unauthenticated.)
#
# BACKEND: the KServe/llm-d Envoy gateway Service `envoy-default-kserve-llm-gw-8ab60ea9`
# in `envoy-gateway-system` (port 80). This is the Envoy-class Gateway `kserve-llm-gw`
# programmed at 10.0.0.204 that fronts the two LLMInferenceServices. The service name is
# a deterministic hash of the Gateway's namespace/name and is stable across reconciles.
#   (PREVIOUS backendRef, for one-line revert: Service `vllm-stack-router-service`
#    port 80 in ns `default` via a ReferenceGrant in `default` — that vLLM Production
#    Stack is now PARKED and the Service is gone, so /v1 was returning 500.)
#
# MODEL ROUTING (important): this gateway does NOT do OpenAI body-`model` routing on a
# bare /v1 path — the Envoy AI Gateway model-router ext-proc is not wired (no
# AIGatewayRoute, no ext-proc sidecar; bare /v1 => 404). Routing is PATH-based: KServe
# publishes each model under /default/<isvc>/v1/... . So we expose one authenticated
# base path per catalog model and rewrite into the KServe path:
#   - https://llm.birks.dev/v1        -> qwen38-llm      (model "qwen3.8-nvfp4", default/coding)
#   - https://llm.birks.dev/muse/v1   -> muse-glimmer-llm (model "muse-glimmer-30b", reasoning)
# Clients set base_url to the matching path; the body `model` must match that path's model
# (vLLM validates it). /v1 stays the default so existing single-model coworker configs work.
#
# API-KEY MODEL (verified live + matched to the portal repo's Secret contract):
#   - One Secret per credential (type extauth.solo.io/apikey), stringData holds
#     { client-<opaque-id>: "llm_<credential>" } — the RAW key value, NO "Bearer " prefix.
#   - Selected by label `llm-portal/api-key: "true"` (the portal's LabelDomain=llm-portal;
#     this selector MUST match it or every key silently fails to authenticate).
#   - keySources: [{header: Authorization}] — kgateway STRIPS the "Bearer " scheme and
#     matches the bare token, so OpenAI/Claude-Code clients sending
#     `Authorization: Bearer llm_...` match the raw stored value. (Verified: 200.)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-v1
  namespace: llm-portal
spec:
  parentRefs:
    - name: llm-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /default/qwen38-llm/v1
      backendRefs:
        - name: envoy-default-kserve-llm-gw-8ab60ea9   # KServe/llm-d Envoy gateway (qwen3.8-nvfp4)
          namespace: envoy-gateway-system
          port: 80
---
# Second catalog model: muse-glimmer-30b, exposed at /muse/v1 (same auth).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-v1-muse
  namespace: llm-portal
spec:
  parentRefs:
    - name: llm-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /muse/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /default/muse-glimmer-llm/v1
      backendRefs:
        - name: envoy-default-kserve-llm-gw-8ab60ea9   # KServe/llm-d Envoy gateway (muse-glimmer-30b)
          namespace: envoy-gateway-system
          port: 80
---
# Allow the llm-portal HTTPRoutes to reference the KServe Envoy gateway Service.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: llm-portal-httproute-to-kserve-gw
  namespace: envoy-gateway-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: llm-portal
  to:
    - group: ""
      kind: Service
      name: envoy-default-kserve-llm-gw-8ab60ea9
---
# Enforce API keys on the /v1 model routes ONLY (portal paths stay unauthenticated for OIDC login).
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: vllm-apikey-auth
  namespace: llm-portal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-v1
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vllm-v1-muse
  apiKeyAuth:
    keySources:
      - header: Authorization
    secretSelector:
      matchLabels:
        llm-portal/api-key: "true"
---
# Catch-all -> portal (sign-in, /account, key create/revoke). Same namespace as the
# Gateway, so no ReferenceGrant. NO apiKeyAuth here (OIDC login must be reachable);
# /v1 is a longer prefix so it still routes to vLLM.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
  namespace: llm-portal
spec:
  parentRefs:
    - name: llm-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: llm-portal
          port: 80
