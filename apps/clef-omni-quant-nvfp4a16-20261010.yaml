# Clef-Omni NVFP4A16 (issue #152): NVFP4 WEIGHTS, BF16 activations (ModelOpt W4A16_NVFP4), on the thinker's
# MoE experts only. Same proven pipeline as Stage 2a (apps/clef-omni-quant-experts-20261010.yaml.hold):
# in-cluster rehearsal on a tiny random Clef-Omni first, golden reproduction gate, BF16 eval reference,
# quantize, fake-quant parity, quantizer state, export, artifact scan.
#
# Differences from Stage 2a:
#  * Expert INPUT quantizers are disabled -> weight-only. ModelOpt's `max` then calibrates straight from
#    the weight tensors, so no calibration forward is run (forward_loop=None). Weight quantizers are the
#    same as Stage 2a's, so parity here = "how much of the 0.911 was FP4 activation rounding".
#  * Export writes quant_algo W4A16_NVFP4 (vLLM routes it to Marlin MoE on SM120). No input_scale tensors.
# Results: /work/nvfp4a16/{results,export}; logs /work/logs/quant-nvfp4a16*.log
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clef-omni-quant-nvfp4a16-20261010
  namespace: default
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600          # 6h: 10 min load + ~1-2h calibration/eval worst case + export
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: { app: clef-omni-quant-nvfp4a16 }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      runtimeClassName: nvidia
      containers:
        - name: quant
          image: python:3.12-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -uo pipefail
              VENV=/work/venv
              export PIP_CACHE_DIR=/work/.pip-cache TMPDIR=/work/.tmp HF_HOME=/work/.hf-home
              export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
              mkdir -p /work/.tmp /work/logs /work/nvfp4a16/results
              # ModelOpt's NVFP4 fake-quant forward JIT-compiles a Triton kernel, which needs a C compiler;
              # -slim has none (r3's rehearsal died there, right after calibration).
              command -v gcc >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev >/dev/null; } || exit 1
              gcc --version | head -1
              echo "[$(date -u +%FT%TZ)] === Clef-Omni NVFP4A16 (W4A16_NVFP4, experts-only) ==="
              nvidia-smi --query-gpu=name,memory.total,memory.free,power.limit --format=csv
              awk '/MemTotal|MemAvailable|SwapTotal/{printf "%-14s %8.1f GiB\n", $1, $2/1048576}' /proc/meminfo
              [ -x "$VENV/bin/python" ] || { echo "FATAL: Stage 1 venv missing on the PVC"; exit 1; }
              "$VENV/bin/pip" freeze | grep -E '^(torch|torchvision|transformers|accelerate|safetensors|huggingface.hub)==' > /work/.tmp/constraints.txt
              cat /work/.tmp/constraints.txt
              "$VENV/bin/python" -c 'import modelopt, pyarrow, requests' 2>/dev/null || \
                "$VENV/bin/pip" install --no-input -c /work/.tmp/constraints.txt 'nvidia-modelopt==0.47.0' pyarrow requests || exit 1
              # Preflight the EXACT imports the script makes, before the ~10 min weight load. ModelOpt
              # 0.47 imports `requests` unconditionally without declaring it (r2 died there after loading);
              # install whatever else turns up missing, a bounded number of times.
              PRE='import modelopt.torch.quantization, modelopt.torch.opt, modelopt.torch.export, safetensors, pyarrow.parquet, huggingface_hub'
              for i in 1 2 3 4 5; do
                err=$("$VENV/bin/python" -c "$PRE" 2>&1) && break
                mod=$(printf '%s\n' "$err" | sed -n "s/.*No module named '\([^'.]*\).*/\1/p" | tail -1)
                [ -n "$mod" ] || { printf '%s\n' "$err"; echo "FATAL: import preflight failed"; exit 1; }
                echo "preflight: installing missing module $mod"
                "$VENV/bin/pip" install --no-input -c /work/.tmp/constraints.txt "$mod" || exit 1
              done
              "$VENV/bin/python" -c "$PRE" || { echo "FATAL: import preflight still failing"; exit 1; }
              "$VENV/bin/pip" freeze > /work/logs/pip-freeze-quant.txt
              "$VENV/bin/python" -c 'import torch, transformers, modelopt; print("torch", torch.__version__, "transformers", transformers.__version__, "modelopt", modelopt.__version__)'

              cat > /work/quant_nvfp4a16.py <<'PY'
              """Clef-Omni NVFP4 experts-only PTQ with BF16-vs-fakequant parity, export and artifact scan."""
              import copy, glob, hashlib, json, math, os, random, shutil, sys, time, traceback
              from pathlib import Path
              import numpy as np, torch
              # CLEF_REHEARSAL=1: same code path end to end on a tiny RANDOM backbone + head built from the
              # real config (real tokenizer/processor/vocab), so quantize/export/scan bugs surface in about
              # a minute instead of after a ~10 min weight load. Runs on CPU too (local dry run).
              REHEARSAL = os.environ.get("CLEF_REHEARSAL") == "1"
              MODEL = Path(os.environ.get("CLEF_MODEL_DIR", "/work/clef-omni"))
              ROOT = Path(os.environ.get("CLEF_ROOT", "/work/nvfp4a16")); RES = ROOT / "results"; EXPORT = ROOT / "export"
              VARIANT = os.environ.get("QUANT_VARIANT", "nvfp4a16")      # nvfp4 (W4A4) | nvfp4a16 (W4A16)
              N_CALIB = int(os.environ.get("N_CALIB", 16 if REHEARSAL else 512))
              N_EVAL = int(os.environ.get("N_EVAL", 8 if REHEARSAL else 128))
              DEV = "cuda" if torch.cuda.is_available() else "cpu"
              RES.mkdir(parents=True, exist_ok=True)
              sys.path.insert(0, str(MODEL))
              from joint_schema_model import ClefModel, JointSchemaHead, encode_record, collate_records

              def log(*a):
                  print(f"[{time.strftime('%FT%T')}]", *a, flush=True)

              def avail_gib():
                  for line in open("/proc/meminfo"):
                      if line.startswith("MemAvailable"):
                          return round(int(line.split()[1]) / 2**20, 1)

              def gpu():
                  if DEV != "cuda":
                      return f"cpu, host avail {avail_gib()} GiB"
                  return f"gpu alloc {torch.cuda.memory_allocated()/2**30:.1f} GiB peak {torch.cuda.max_memory_allocated()/2**30:.1f} GiB, host avail {avail_gib()} GiB"

              # ---------- 1. load (mirrors load_release_model, keeps the backbone) ----------
              from safetensors.torch import load_file
              from transformers import AutoConfig, AutoProcessor, Qwen3OmniMoeForConditionalGeneration
              config = AutoConfig.from_pretrained(MODEL)
              config.enable_audio_output = False
              t0 = time.time()
              if REHEARSAL:
                  tc = config.thinker_config
                  t = tc.text_config
                  t.num_hidden_layers, t.hidden_size, t.intermediate_size, t.moe_intermediate_size = 2, 256, 128, 128
                  t.num_experts, t.num_experts_per_tok, t.num_attention_heads, t.num_key_value_heads = 8, 2, 4, 2
                  v = tc.vision_config
                  v.depth, v.hidden_size, v.num_heads, v.intermediate_size, v.out_hidden_size = 3, 64, 2, 128, 256
                  v.deepstack_visual_indexes = [0, 1, 2]
                  a = tc.audio_config
                  a.d_model, a.encoder_layers, a.encoder_attention_heads, a.encoder_ffn_dim, a.output_dim = 64, 1, 2, 128, 256
                  config._experts_implementation = "eager"
                  torch.manual_seed(0)
                  log("REHEARSAL: tiny random backbone from the real config")
                  backbone = Qwen3OmniMoeForConditionalGeneration._from_config(config, dtype=torch.bfloat16).to(DEV).eval()
                  head = JointSchemaHead(hidden_size=256, width=64, routing_layers=1, layers=1, heads=2, feedforward=128)
                  head_file = ROOT / "rehearsal_head.safetensors"
                  from safetensors.torch import save_file
                  save_file({k: v.contiguous() for k, v in head.state_dict().items()}, str(head_file))
              else:
                  log("loading BF16 backbone, experts_implementation=eager;", gpu())
                  backbone, info = Qwen3OmniMoeForConditionalGeneration.from_pretrained(
                      MODEL, config=config, dtype=torch.bfloat16, device_map={"": DEV},
                      output_loading_info=True, experts_implementation="eager")
                  bad = {k: [x for x in (info.get(k) or []) if not str(x).startswith(("talker.", "code2wav."))]
                         for k in ("missing_keys", "unexpected_keys", "mismatched_keys")}
                  assert not any(bad.values()), f"weights did not load cleanly: {bad}"
                  head = JointSchemaHead(**json.loads((MODEL / "joint_head_config.json").read_text()))
                  head_file = MODEL / "joint_head.safetensors"
                  head.load_state_dict(load_file(head_file), strict=True)
              head = head.to(device=DEV, dtype=torch.bfloat16)
              processor = AutoProcessor.from_pretrained(MODEL)
              clef = ClefModel(backbone.thinker, head).eval()
              log(f"loaded in {time.time()-t0:.0f}s;", gpu())
              impls = {type(m).__name__: getattr(getattr(m, "config", None), "_experts_implementation", "?")
                       for m in backbone.modules() if type(m).__name__.endswith("Experts")}
              log("experts modules / implementation:", impls)

              def score(record):
                  enc = encode_record(processor.tokenizer, record, processor=processor)
                  batch = collate_records([enc], processor.tokenizer.pad_token_id, torch.device(DEV))
                  with torch.no_grad():
                      logits = clef(batch)[0]
                  return {q.question_id: dict(zip(q.option_ids, lg.float().softmax(-1).tolist()))
                          for q, lg in zip(enc.questions, logits)}, len(enc.input_ids)

              # ---------- media + records ----------
              def synth_image(rng):
                  from PIL import Image, ImageDraw
                  w, h = int(rng.integers(224, 641)), int(rng.integers(224, 641))
                  im = Image.new("RGB", (w, h), tuple(int(x) for x in rng.integers(0, 255, 3)))
                  d = ImageDraw.Draw(im)
                  for _ in range(int(rng.integers(3, 12))):
                      x0, y0 = int(rng.integers(0, w - 20)), int(rng.integers(0, h - 20))
                      box = (x0, y0, x0 + int(rng.integers(10, w // 2)), y0 + int(rng.integers(10, h // 2)))
                      col = tuple(int(x) for x in rng.integers(0, 255, 3))
                      (d.ellipse if rng.random() < .5 else d.rectangle)(box, fill=col)
                  return im

              def synth_video(rng):
                  n, s = int(rng.choice([4, 6, 8])), int(rng.choice([128, 160, 224]))
                  x, y = np.meshgrid(np.linspace(0, 1, s), np.linspace(0, 1, s))
                  k = rng.uniform(2, 12, 3)
                  return np.stack([(np.stack([0.5 + 0.5 * np.sin(x * k[0] + i), y ** (1 + i / n),
                                              0.5 + 0.5 * np.cos(y * k[2] - i * k[1] / 6)], -1) * 255).astype("uint8")
                                   for i in range(n)])

              def synth_audio(rng, rate=16000):
                  t = np.arange(int(rng.uniform(1.0, 4.0) * rate), dtype="float32") / rate
                  sig = sum(rng.uniform(.05, .3) * np.sin(2 * math.pi * rng.uniform(80, 2000) * t) for _ in range(3))
                  sig = sig + rng.uniform(0, .05) * rng.standard_normal(len(t))
                  return (sig * np.hanning(len(t))).astype("float32")

              def load_texts():
                  try:
                      from huggingface_hub import hf_hub_download
                      import pyarrow.parquet as pq
                      p = hf_hub_download("HuggingFaceH4/ultrachat_200k", repo_type="dataset",
                                          filename="data/test_sft-00000-of-00001-f7dfac4afe5b93f4.parquet")
                      rows = pq.read_table(p, columns=["prompt", "messages"]).to_pylist()
                      out = []
                      for r in rows:
                          reply = next((m["content"] for m in r["messages"] if m["role"] == "assistant"), "")
                          out.append((r["prompt"][:1200], reply[:2400]))
                      log(f"ultrachat test_sft rows: {len(out)}")
                      return out
                  except Exception as e:
                      log("ultrachat unavailable, synthetic text only:", repr(e))
                      words = "agent player wall door enemy ladder coin map key light shadow path river bridge tower".split()
                      rng = random.Random(7)
                      return [(" ".join(rng.choices(words, k=30)), " ".join(rng.choices(words, k=120))) for _ in range(4000)]

              VERBS = ["move forward", "turn left", "turn right", "wait", "jump", "retreat", "interact", "stop"]
              def make_record(i, text, rng):
                  prompt, reply = text
                  state = {"task": prompt, "observation": reply}
                  if rng.random() < .3:
                      state["history"] = "\n".join(f"step {j}: {rng.choice(VERBS)}" for j in range(int(rng.integers(2, 40))))
                  qs = {}
                  for qi in range(int(rng.integers(1, 4))):
                      kind = rng.choice(["choice", "noul", "score"])
                      if kind == "choice":
                          opts = list(rng.choice(VERBS, size=int(rng.integers(2, 6)), replace=False))
                          qs[f"q{qi}"] = {"type": "choice", "instructions": "Which response best serves the task?",
                                          "criteria": {o.replace(" ", "_"): o for o in opts}}
                      elif kind == "noul":
                          qs[f"q{qi}"] = {"type": "noul", "instructions": "Does the observation answer the task correctly?"}
                      else:
                          qs[f"q{qi}"] = {"type": "score", "instructions": "Rate the observation's helpfulness",
                                          "criteria": ["useless", "weak", "adequate", "good", "excellent"][: int(rng.integers(3, 6))]}
                  rec = {"id": f"r{i}", "state": state, "questions": qs}
                  u = rng.random()
                  if u < .10:
                      rec["images"] = [synth_image(rng)]
                  elif u < .15:
                      rec["videos"] = [synth_video(rng)]
                  elif u < .20:
                      rec["audio"] = [synth_audio(rng)]
                  return rec

              texts = load_texts()
              order = list(range(len(texts))); random.Random(145).shuffle(order)
              calib_idx, eval_idx = order[:N_CALIB], order[N_CALIB:N_CALIB + N_EVAL]
              rng_c, rng_e = np.random.default_rng(1), np.random.default_rng(2)
              calib = [make_record(i, texts[i], rng_c) for i in calib_idx]
              evals = [make_record(i, texts[i], rng_e) for i in eval_idx]

              # ---------- gate: Stage 1 goldens reproduce with the eager experts path ----------
              goldens = [] if REHEARSAL else [json.loads(l) for l in open("/work/bf16-results/smoke_bf16.jsonl")]
              # rebuild the exact Stage-1 cases from the smoke script itself (single source of truth)
              ns, stage1 = {}, {}
              if goldens:
                  src = open("/work/smoke_bf16.py").read()
                  exec(src[src.index("def synth_image"):src.index("print(f\"[{time.strftime")], {"np": np, "math": math}, ns)
                  stage1 = dict(ns["CASES"])
              # Eager vs the grouped_mm path Stage 1 ran on are different BF16 reductions, and a near-tied
              # router can pick a different expert, so small drifts are expected (r1 measured 0.053).
              # A broken path shows up as a flipped answer or a large shift: that is the hard gate. Parity
              # below is graded against this same process's BF16 scores, not against these goldens.
              worst, golden_report = 0.0, {}
              for g in goldens:
                  rec = dict(stage1[g["case_id"]])
                  if g["case_id"] == "image": rec["images"] = [ns["synth_image"]()]
                  if g["case_id"] == "video": rec["videos"] = [ns["synth_video"]()]
                  if g["case_id"] == "audio": rec["audio"] = [ns["synth_audio"]()]
                  probs, _ = score(rec)
                  case_dp, flips = 0.0, []
                  for qid, d in g["probabilities"].items():
                      case_dp = max(case_dp, max(abs(probs[qid][o] - p) for o, p in d.items()))
                      if max(d, key=d.get) != max(probs[qid], key=probs[qid].get):
                          flips.append(qid)
                  golden_report[g["case_id"]] = {"max_dp": round(case_dp, 5), "top1_flips": flips}
                  worst = max(worst, case_dp)
              json.dump(golden_report, open(RES / "golden_reproduction.json", "w"), indent=1)
              log("Stage-1 golden reproduction (eager experts):", json.dumps(golden_report))
              assert worst < 0.25 and not any(v["top1_flips"] for v in golden_report.values()), \
                  "eager-experts BF16 path diverges from the Stage-1 goldens (flipped answer or |dp| >= 0.25)"

              # ---------- 3a. BF16 eval reference ----------
              t0 = time.time()
              ref, kept = [], []
              for r in evals:
                  try:
                      ref.append(score(r)[0]); kept.append(r)
                  except Exception as e:
                      log(f"  eval record {r['id']} dropped (BF16 failed): {type(e).__name__}: {e}")
              evals = kept
              log(f"BF16 eval scored ({len(evals)} records) in {time.time()-t0:.0f}s;", gpu())

              # ---------- quantize ----------
              import modelopt.torch.quantization as mtq
              import modelopt.torch.opt as mto
              cfg = copy.deepcopy(mtq.NVFP4_EXPERTS_ONLY_CFG)
              cfg["quant_cfg"] = list(cfg["quant_cfg"]) + [{"quantizer_name": p, "enable": False} for p in
                  ("*audio_tower*", "*visual*", "*talker*", "*code2wav*", "*lm_head*", "*mlp.gate.*", "*embed*")]
              if VARIANT == "nvfp4a16":
                  cfg["quant_cfg"] += [{"quantizer_name": "*.experts.*input_quantizer", "enable": False},
                                       {"quantizer_name": "*block_sparse_moe*input_quantizer", "enable": False}]
              json.dump(cfg, open(RES / "quant_cfg.json", "w"), indent=1, default=str)

              def forward_loop(_model):
                  t, ntok = time.time(), 0
                  for k, r in enumerate(calib):
                      try:
                          ntok += score(r)[1]
                      except Exception as e:
                          log(f"  calib record {k} skipped: {type(e).__name__}: {e}")
                      if k % 64 == 0:
                          log(f"  calib {k}/{len(calib)} tokens={ntok} {time.time()-t:.0f}s;", gpu())
                  log(f"calibration forward done: {ntok} tokens in {time.time()-t:.0f}s")

              log(f"mtq.quantize (experts-only, variant={VARIANT}, max)")
              # weight-only: max calibrates from the weights themselves, no calibration forward needed
              mtq.quantize(backbone, cfg, None if VARIANT == "nvfp4a16" else forward_loop)
              with open(RES / "quant_summary.txt", "w") as f:
                  import contextlib
                  with contextlib.redirect_stdout(f):
                      mtq.print_quant_summary(backbone)

              torch.save({"modelopt_state": mto.modelopt_state(backbone),
                          "quantizer_state_dict": {k: v.detach().cpu() for k, v in backbone.state_dict().items() if "quantizer" in k}},
                         RES / "quantizer_state.pt")
              log("saved quantizer state;", gpu())

              # gate: every expert got a calibrated weight amax; input quantizers saw data
              stats = {"expert_modules": 0, "weight_q": 0, "weight_q_uncalibrated": 0, "input_q_uncalibrated": 0}
              for name, m in backbone.named_modules():
                  if hasattr(m, "gate_up_proj_weight_quantizers"):
                      stats["expert_modules"] += 1
                      for attr in ("gate_up_proj_weight_quantizers", "down_proj_weight_quantizers"):
                          for q in getattr(m, attr):
                              stats["weight_q"] += 1
                              a = getattr(q, "amax", None)
                              if a is None or not torch.isfinite(a).all() or (a == 0).all():
                                  stats["weight_q_uncalibrated"] += 1
                      for attr in ("gate_up_proj_input_quantizer", "down_proj_input_quantizer"):
                          q = getattr(m, attr, None)
                          if q is not None and not getattr(q, "is_enabled", True):
                              stats["input_q_disabled"] = stats.get("input_q_disabled", 0) + 1
                              continue
                          if q is None or getattr(q, "amax", None) is None:
                              stats["input_q_uncalibrated"] += 1
              log("quantizer stats:", stats)
              assert stats["expert_modules"] > 0, "no fused-experts wrappers: experts were NOT quantized"
              json.dump(stats, open(RES / "quantizer_stats.json", "w"), indent=1)
              if stats["input_q_uncalibrated"] or stats["weight_q_uncalibrated"]:
                  log("WARNING: some expert quantizers carry no amax; judge by parity + artifact scan")


              # ---------- 3b. fake-quant parity ----------
              rows, agree, total, tvs, flips = [], 0, 0, [], []
              for r, base in zip(evals, ref):
                  q, _ = score(r)
                  for qid, bd in base.items():
                      qd = q[qid]
                      tv = 0.5 * sum(abs(bd[o] - qd[o]) for o in bd)
                      b_top, q_top = max(bd, key=bd.get), max(qd, key=qd.get)
                      srt = sorted(bd.values(), reverse=True)
                      margin = srt[0] - (srt[1] if len(srt) > 1 else 0)
                      total += 1; agree += b_top == q_top; tvs.append(tv)
                      if b_top != q_top:
                          flips.append({"record": r["id"], "question": qid, "bf16": b_top, "nvfp4": q_top, "bf16_margin": round(margin, 4)})
                      rows.append({"record": r["id"], "question": qid, "tv": round(tv, 6), "bf16": bd, "nvfp4": qd})
              parity = {"questions": total, "top1_agreement": round(agree / total, 4),
                        "mean_tv": round(float(np.mean(tvs)), 5), "p95_tv": round(float(np.percentile(tvs, 95)), 5),
                        "max_tv": round(float(np.max(tvs)), 5), "flips": flips,
                        "gate_top1_ge_0.98": agree / total >= .98, "gate_mean_tv_le_0.03": float(np.mean(tvs)) <= .03}
              json.dump(parity, open(RES / "parity_fakequant.json", "w"), indent=1)
              with open(RES / "parity_fakequant_rows.jsonl", "w") as f:
                  for row in rows: f.write(json.dumps(row) + "\n")
              log("FAKE-QUANT PARITY:", json.dumps({k: v for k, v in parity.items() if k != "flips"}), f"flips={len(flips)}")

              # ---------- 4. export ----------
              from modelopt.torch.export import export_hf_checkpoint
              backbone.thinker.lm_head = clef.output_embeddings      # ClefModel swapped it for Identity
              # Qwen3OmniMoeForConditionalGeneration defines no forward() (generate-only), but the
              # exporter's shared-input/fusion pass runs model(fake_input_ids). Route it to the thinker,
              # which owns every quantized module.
              import types
              def _thinker_forward(self, input_ids=None, *args, **kwargs):
                  kwargs.setdefault("use_cache", False)
                  return self.thinker(input_ids=input_ids, **kwargs)
              backbone.forward = types.MethodType(_thinker_forward, backbone)
              del clef, head
              if DEV == "cuda": torch.cuda.empty_cache()
              if EXPORT.exists(): shutil.rmtree(EXPORT)
              t0 = time.time()
              export_hf_checkpoint(backbone, export_dir=str(EXPORT), max_shard_size="5GB")
              log(f"exported in {time.time()-t0:.0f}s;", gpu())
              for p in MODEL.iterdir():
                  if p.is_file() and not p.name.startswith(".") and not p.name.startswith("model") \
                     and not (EXPORT / p.name).exists():
                      shutil.copy2(p, EXPORT / p.name)

              # ---------- artifact scan ----------
              from safetensors import safe_open
              scan = {"files": {}, "dtypes": {}, "nan_scale_bytes": 0, "fp4_packed_tensors": 0, "bf16_expert_weights": 0}
              for f in sorted(EXPORT.glob("*.safetensors")):
                  scan["files"][f.name] = f.stat().st_size
                  if f.name == "joint_head.safetensors":
                      continue
                  with safe_open(str(f), "pt") as st:
                      for k in st.keys():
                          t = st.get_tensor(k)
                          scan["dtypes"][str(t.dtype)] = scan["dtypes"].get(str(t.dtype), 0) + 1
                          if ".experts." in k and k.endswith(".weight"):
                              if t.dtype == torch.uint8: scan["fp4_packed_tensors"] += 1
                              elif t.dtype == torch.bfloat16: scan["bf16_expert_weights"] += 1
                          if t.dtype == torch.float8_e4m3fn:
                              b = t.view(torch.uint8)
                              scan["nan_scale_bytes"] += int(((b == 0x7F) | (b == 0xFF)).sum())
                          elif t.is_floating_point() and not torch.isfinite(t.float()).all():
                              scan.setdefault("nonfinite_tensors", []).append(k)
              def sha(p):
                  with open(p, "rb") as f:
                      return hashlib.file_digest(f, "sha256").hexdigest()
              if REHEARSAL:
                  shutil.copy2(head_file, EXPORT / "joint_head.safetensors")
              scan["head_sha256_matches"] = sha(EXPORT / "joint_head.safetensors") == sha(head_file)
              scan["export_bytes"] = sum(scan["files"].values())
              qc = EXPORT / "hf_quant_config.json"
              scan["hf_quant_config"] = json.loads(qc.read_text()).get("quantization", {}) if qc.exists() else None
              if scan["hf_quant_config"]:
                  scan["hf_quant_config"]["exclude_modules"] = len(scan["hf_quant_config"].get("exclude_modules", []))
              json.dump(scan, open(RES / "artifact_scan.json", "w"), indent=1, default=str)
              with open(EXPORT / "SHA256SUMS", "w") as f:
                  for p in sorted(EXPORT.iterdir()):
                      if p.is_file() and p.name != "SHA256SUMS": f.write(f"{sha(p)}  {p.name}\n")
              log("ARTIFACT SCAN:", json.dumps({k: v for k, v in scan.items() if k != "files"}, default=str))
              want_algo = {"nvfp4": "NVFP4", "nvfp4a16": "W4A16_NVFP4"}[VARIANT]
              scan["expected_quant_algo"] = want_algo
              ok = scan["nan_scale_bytes"] == 0 and scan["fp4_packed_tensors"] > 0 and scan["bf16_expert_weights"] == 0 \
                   and scan["head_sha256_matches"] and "nonfinite_tensors" not in scan \
                   and (scan["hf_quant_config"] or {}).get("quant_algo") == want_algo
              log(f"QUANT {VARIANT} ARTIFACT", "PASS" if ok else "FAIL (see artifact_scan.json)", "(parity gates reported separately)")
              sys.exit(0 if ok else 2)
              PY
              echo "[$(date -u +%FT%TZ)] --- rehearsal: tiny random Clef-Omni, full quantize/parity/export/scan path ---"
              rm -rf /work/nvfp4a16-rehearsal
              CLEF_REHEARSAL=1 CLEF_ROOT=/work/nvfp4a16-rehearsal "$VENV/bin/python" /work/quant_nvfp4a16.py 2>&1 | tee /work/logs/quant-nvfp4a16-rehearsal.log
              [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "FATAL: rehearsal failed; NOT loading the real checkpoint"; exit 1; }
              echo "[$(date -u +%FT%TZ)] --- rehearsal passed; real run ---"
              "$VENV/bin/python" /work/quant_nvfp4a16.py 2>&1 | tee /work/logs/quant-nvfp4a16.log
              rc=${PIPESTATUS[0]}
              echo "[$(date -u +%FT%TZ)] nvfp4a16 rc=$rc"; du -sh /work/nvfp4a16/* 2>/dev/null
              exit $rc
          resources:
            requests: { cpu: "2", memory: 12Gi }
            limits:   { cpu: "8", memory: 34Gi, nvidia.com/gpu: 1, nvidia.com/gpumem: 97000 }
          volumeMounts:
            - { name: model, mountPath: /work }
      volumes:
        - { name: model, persistentVolumeClaim: { claimName: clef-omni-hdd } }
