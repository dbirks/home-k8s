# inkling-2-mini on vLLM: Thinking Machines Inkling 2 Mini with DSpark speculative decoding, an NVFP4 (4-bit) KV
# cache and 384K context, on the laptop's Thunderbolt RTX 5090 (talos-8me-tcy, 32 GB, SM120). LIVE since 2026-11-21.
# ============================================================================================
# Image: ghcr.io/dbirks/vllm-openai:inkling-sm120-nvfp4-* = vllm/vllm-openai:inkling-2-mini (PR #69028 pre-release)
# + one ~500 kB layer of patched Python files from github.com/dbirks/vllm branch inkling2-mini-sm120
# (build/vllm-inkling/Dockerfile, .github/workflows/build-vllm-inkling.yaml):
#   - vllm-project/vllm#69096: the DSpark draft KV write without reshape_and_cache_flash (the day-0 image has no
#     SM120 kernel for it, issue #69081), so the drafter runs on the 5090.
#   - NVFP4 KV for Inkling2 on SM12x (ours): 72-byte rows per (head, token) = 64 B packed E2M1 + 8 E4M3 scales.
# Weights: apps/inkling2-mini-laptop-weights.yaml (native NVFP4 + MXFP8 checkpoint on the laptop NVMe).
# The tuned SGLang alternative (BF16 KV only, ~123K) is apps/inkling2-mini-sglang.yaml.hold.
#
# Measured 2026-11-21 in a lab pod (same image and flags, warm):
#   KV pool 466,416 tokens at --max-model-len 393216 (410,604 at 262144; 484,639 at 458752; FP8 was 313,818 at 262144).
#   Code ~264 tok/s, prose ~154 tok/s 1 stream (same as FP8). 20/20 arithmetic. Needles PASS at 250K (3 depths),
#   380K (2 depths) and 445K. Prefill ~15-25% slower than FP8 (250K: ~65 s, 380K: ~140 s).
#   Known cost: prefix-cache hits round down to 18,432-token multiples (NVFP4 blocks are 512 tokens so the pages divide
#   evenly with the BF16 drafter's; see the inkling2-mini skill). Being worked on.
#
# Flags and why:
#   --speculative-config dspark 7  the bundled drafter (mtp.safetensors); draft KV stays BF16 on SM12 (forced by vLLM).
#   --kv-cache-dtype nvfp4         ~1.5x the FP8 pool here (our fork; stock vLLM refuses nvfp4 for Inkling2).
#   --max-model-len 393216         one 384K session, or two ~230K sessions, in the ~466K pool.
#   --max-num-seqs 2               two parallel sessions share one pool.
#   --max-num-batched-tokens 1024  smaller prefill chunks shrink the activation + SWA reservation (with 2048 the drafter
#                                  did not fit at FP8 256K). Also under the SM12x shared-memory limit PR #69021 fixes.
#   NO --gpu-memory-utilization    vLLM's extensible KV cache is sized from what is free after warmup and CUDA graph
#                                  capture (~11.6 GiB). Startup takes ~1-4 min.
#   prefix caching                 vLLM default (on); --enable-prompt-tokens-details reports cached_tokens.
#   --default-chat-template-kwargs reasoning_effort medium (0.7) when a request sets none; the template's own default is
#                                  0.9 (high). A request's reasoning_effort (incl. "none") still wins.
#   CUDA_DISABLE_CONTROL=true      HAMi's in-container allocator cap otherwise refuses allocations near the top of the card.
#                                  Safe: this is the only GPU tenant on the laptop.
# Sampling per the model card: temperature 1.0, top_p 1.0, top_k 0, min_p 0.
#
# Rollback to FP8: kv-cache-dtype fp8, max-model-len 262144 (pool ~316K); same image.
# Collective: model inkling-2-mini in apps/llm-collective-contributor*.yaml, prod 2 (= max-num-seqs), dev 1.
# ============================================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inkling-2-mini-vllm
  namespace: default
  labels:
    app.kubernetes.io/name: inkling-2-mini
spec:
  replicas: 0                     # PAUSED 2026-11-21: NVFP4 prefix-cache alignment lab test; set back to 1
  strategy:
    type: Recreate                # one whole-card pod
  selector:
    matchLabels:
      app.kubernetes.io/name: inkling-2-mini
      app.kubernetes.io/component: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inkling-2-mini
        app.kubernetes.io/component: vllm
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false   # a Service named "vllm" would clash with vLLM's VLLM_PORT env
      nodeSelector: { home-k8s/egpu: rtx5090 }
      terminationGracePeriodSeconds: 60
      containers:
        - name: main
          image: ghcr.io/dbirks/vllm-openai:inkling-sm120-nvfp4-20261121b@sha256:a9de7f2e8724d7e44a18fd2996d5111e43b229f65f4c4eaed4b4719d15b006b0
          command: ["vllm", "serve"]
          args:
            - "/models/inkling-2-mini"
            - "--served-model-name"
            - "inkling-2-mini"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--tensor-parallel-size"
            - "1"
            - "--kv-cache-dtype"
            - "nvfp4"
            - "--max-model-len"
            - "393216"
            - "--max-num-seqs"
            - "2"
            - "--max-num-batched-tokens"
            - "1024"
            - "--speculative-config"
            - '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"probabilistic"}'
            - "--reasoning-parser"
            - "inkling"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "inkling"
            - "--enable-prompt-tokens-details"
            - "--default-chat-template-kwargs"
            - '{"reasoning_effort":"medium"}'
          env:
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: TRANSFORMERS_OFFLINE, value: "1" }
            - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
            - { name: CUDA_DISABLE_CONTROL, value: "true" }   # HAMi allocator passthrough (see header)
          ports:
            - containerPort: 8000
          startupProbe:                   # ~4 min to ready in the lab (extensible KV sizing); allow 20 min on a cold node
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            # whole 5090 through HAMi; percentage avoids guessing the MiB figure HAMi registers for the card
            limits: { nvidia.com/gpu: "1", nvidia.com/gpumem-percentage: "100", cpu: "6", memory: 20Gi }
            requests: { cpu: "2", memory: 6Gi }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: inkling2-mini-models-laptop
            readOnly: true
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 4Gi }
---
# Shared by both engines: routes to whichever inkling-2-mini Deployment is running.
apiVersion: v1
kind: Service
metadata:
  name: inkling-2-mini
  namespace: default
  labels:
    app.kubernetes.io/name: inkling-2-mini
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inkling-2-mini
  ports:
    - name: http
      port: 8000
      targetPort: 8000
