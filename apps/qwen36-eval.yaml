# Qwen3.6-27B NVFP4 eval matrix (home-k8s #87), round 3 — the DEFINITIVE clean comparison.
# KEY LESSON: for this reasoning model, DROP the chat template. Chat template + <think> tokens broke
# gsm8k/humaneval (~0). In standard few-shot COMPLETION mode everything works: probe showed
# humaneval raw-completion c1v2 pass@1 = 0.95. So: no --apply_chat_template anywhere.
#  - Coding: humaneval (raw completion, max_gen_toks 768) — the headline metric for this model.
#  - Math: gsm8k (5-shot completion, flexible-extract, max_gen_toks 512).
#  - Knowledge/reasoning: mmlu_pro + arc_challenge + hellaswag + winogrande (loglikelihood).
# Models: c1v2 (ours) vs BF16 (recovery baseline). kaitchup dropped — its public NVFP4 fails vLLM
# engine-init on this image (same vision-tower-quantized issue). Reuses qwen36-quant-workspace PVC.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen36-eval-scripts
  namespace: default
data:
  run.sh: |
    #!/bin/bash
    set -uo pipefail
    export HF_HOME=/workspace/hf VLLM_ATTENTION_BACKEND=FLASHINFER FLASHINFER_CUDA_ARCH_LIST=12.0f
    export TOKENIZERS_PARALLELISM=false PYTHONUNBUFFERED=1 HF_ALLOW_CODE_EVAL=1
    PY="$(command -v python3 || command -v python)"
    OUT=/workspace/eval/qwen36r3; mkdir -p "$OUT"
    echo "=== [$(date)] installing lm-eval ==="
    "$PY" -m pip install --no-cache-dir lm-eval 2>&1 | tail -2
    "$PY" -c "import lm_eval; print('lm-eval', lm_eval.__version__)"
    BASE="dtype=auto,max_model_len=8192,gpu_memory_utilization=0.9,enforce_eager=True,trust_remote_code=True"
    LL_LIMIT="${LL_LIMIT:-1000}"; MATH_LIMIT="${MATH_LIMIT:-500}"

    resolve () { local M="$1"; if [ -d "$M" ] && [ ! -f "$M/config.json" ]; then M=$(dirname "$(find "$M" -name config.json 2>/dev/null | head -1)"); fi; echo "$M"; }
    run () { # key model tasks limit extra
      local key="$1" M="$2" tasks="$3" lim="$4" extra="$5"
      local la=""; [ -n "$lim" ] && la="--limit $lim"
      echo "=== [$(date)] $key :: $tasks (limit=${lim:-full}) ==="
      timeout 18000 "$PY" -m lm_eval --model vllm --model_args "pretrained=$M,$BASE" \
        --tasks "$tasks" $la --batch_size auto $extra \
        --output_path "$OUT/$key" 2>&1 | tee -a "$OUT/$key.log" | tail -14
    }
    eval_model () { # key path cache_glob
      local key="$1"; local M; M=$(resolve "$2"); local cache="$3"
      echo "########## [$(date)] MODEL $key :: $M ##########"
      run "$key-ll"   "$M" "mmlu_pro,arc_challenge,hellaswag,winogrande" "$LL_LIMIT" ""
      run "$key-math" "$M" "gsm8k"     "$MATH_LIMIT" "--gen_kwargs max_gen_toks=512"
      run "$key-code" "$M" "humaneval" ""            "--confirm_run_unsafe_code --gen_kwargs max_gen_toks=768"
      [ -n "$cache" ] && { rm -rf $cache 2>/dev/null && echo "freed $cache"; }
      df -h /workspace | tail -1
    }
    printf '%s\n' "$MODELS" | while IFS='|' read -r key path cache; do
      [ -z "$key" ] && continue
      eval_model "$key" "$path" "$cache"
    done
    echo "=== [$(date)] ALL DONE — summary ==="
    "$PY" /scripts/summ.py
  summ.py: |
    #!/usr/bin/env python3
    import json, glob
    rows = {}
    for f in sorted(glob.glob("/workspace/eval/qwen36r3/**/results_*.json", recursive=True)):
        try:
            d = json.load(open(f)); r = d.get("results", {})
            key = f.split("/workspace/eval/qwen36r3/")[1].split("/")[0]
            for t, v in r.items():
                for k, x in v.items():
                    if isinstance(x, float) and any(s in k for s in ("acc", "exact_match", "pass")) and "stderr" not in k:
                        rows.setdefault(key, {})[f"{t}/{k.split(',')[0]}"] = round(x, 4)
        except Exception as e:
            print("err", f, e)
    for key in sorted(rows):
        print("==", key)
        for m, val in sorted(rows[key].items()):
            print(f"    {m:42s} {val}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen36-eval-r3-20260813
  namespace: default
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 72000
  template:
    metadata:
      labels: { app: qwen36-eval }
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      enableServiceLinks: false
      priorityClassName: system-node-critical
      containers:
        - name: eval
          image: vllm/vllm-openai:muse-glimmer-x86_64-cu130
          command: ["/bin/bash", "/scripts/run.sh"]
          env:
            - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } } }
            - name: MODELS
              value: |
                c1v2|/workspace/runs/Qwen3.6-27B-NVFP4-c1v2-screen|
                bf16|Qwen/Qwen3.6-27B|
          resources:
            limits: { nvidia.com/gpu: 1, cpu: "8", memory: 40Gi }
            requests: { cpu: "4", memory: 20Gi }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: scripts, mountPath: /scripts }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: qwen36-quant-workspace } }
        - { name: scripts, configMap: { name: qwen36-eval-scripts } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
