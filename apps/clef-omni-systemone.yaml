# Clef-Omni /v1/systemone server (issues #151 #153), driven by the Decision Index kit's `http` engine
# (decision-index-bench Job), one request at a time like the board measures entrants.
# Runs scripts/clef-omni/serve_clef.py (the same PEP 723 script published in each HF repo) from the
# clef-omni-scripts ConfigMap. CLEF_MODEL_PATH picks the checkpoint; the script detects its kind:
#   /work/clef-omni              BF16 original via Cloudflare's load_release_model (their table's setup;
#                                note their encode_record truncates state to 64K tokens, the board's rule
#                                is "no truncation")
#   /work/nvfp4-experts/export   ModelOpt NVFP4 W4A4: FP4 weights dequantized + FP4 activation rounding
#   /work/nvfp4a16/export        ModelOpt NVFP4A16: FP4 weights dequantized
#   /work/int4/export            AutoRound INT4: transformers int4 kernels
# #156: serves the AutoRound INT4 export (~19.4 GiB weights, verified by apps/clef-omni-int4-verify.yaml)
# in a 25000 MB HAMi slice beside NInfer (55000) and the two Qwen3-TTS servers. Bring it up LAST and alone:
# its HDD weight load is the biggest host-RAM transient (46 GB, no swap). The BF16 path still needs the
# whole card (gpumem 97000, Pennyroyal/NInfer at 0). /healthz turns 200 once loaded (~10 min off the HDD).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clef-omni-systemone
  namespace: default
  labels: { app: clef-omni-systemone }
spec:
  replicas: 0                       # DOWN 2026-10-24: Pennyroyal Flash-Next has the whole card. Was UP 2026-10-17 (#156), INT4 in 25000 MB.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: clef-omni-systemone }
  template:
    metadata:
      labels: { app: clef-omni-systemone }
      annotations:
        clef-omni/scripts-rev: "2026-10-17-health-route"   # bump to roll after a clef-omni-scripts change
    spec:
      enableServiceLinks: false
      runtimeClassName: nvidia
      containers:
        - name: server
          image: python:3.12-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              VENV=/work/venv
              export PIP_CACHE_DIR=/work/.pip-cache HF_HUB_OFFLINE=1
              command -v gcc >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev >/dev/null; }
              "$VENV/bin/pip" freeze | grep -E '^(torch|torchvision|transformers|accelerate|safetensors)==' > /tmp/constraints.txt
              "$VENV/bin/python" -c 'import fastapi, uvicorn' 2>/dev/null || \
                "$VENV/bin/pip" install -q --no-input -c /tmp/constraints.txt fastapi 'uvicorn[standard]'
              exec "$VENV/bin/python" /scripts/serve_clef.py --model "$CLEF_MODEL_PATH" --host 0.0.0.0 --port 8000
          env:
            - { name: CLEF_MODEL_PATH, value: /work/int4/export }   # BF16 original: /work/clef-omni (whole card)
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          ports:
            - { name: http, containerPort: 8000 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 120            # 40 min: installs + ~10 min HDD weight load
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: "2", memory: 12Gi }
            limits:   { cpu: "8", memory: 34Gi, nvidia.com/gpu: 1, nvidia.com/gpumem: 25000 }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - { name: work, persistentVolumeClaim: { claimName: clef-omni-hdd } }
        - { name: scripts, configMap: { name: clef-omni-scripts } }
---
apiVersion: v1
kind: Service
metadata:
  name: clef-omni-systemone
  namespace: default
spec:
  selector: { app: clef-omni-systemone }
  ports:
    - { name: http, port: 8000, targetPort: http }
