        t = cfg["thinker_config"]["text_config"]
        want = t["num_hidden_layers"] * t["num_experts"] * 3
        s = {"fp8_expert_weights": 0, "expected_fp8_expert_weights": want, "scales": 0, "bad_scales": 0,
