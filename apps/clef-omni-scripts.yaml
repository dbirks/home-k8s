                    outs = [(k, "F8_E4M3", [r, c]), (k[:-len("weight")] + "weight_scale_inv", "F32", [r // BLOCK[0], c // BLOCK[1]])]
                    items.append((shard, k, m, outs, r * c + 4 * (r // BLOCK[0]) * (c // BLOCK[1])))
