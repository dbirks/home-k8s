---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clef-omni-scripts
  namespace: default
data:
  clef_records.py: |
    """Clef-format calibration and held-out eval records for the Clef-Omni quants (issue #152).

    Byte-for-byte the generator used by the ModelOpt NVFP4 / NVFP4A16 jobs: text from ultrachat_200k
    test_sft wrapped in Clef's state/questions schema (choice / noul / score), ~20 % synthetic image /
    video / audio. Same seeds and split, so every quant is graded on the identical 128 held-out records.
    """
    import math
    import random
    import time

    import numpy as np


    def log(*a):
        print(f"[{time.strftime('%FT%T')}]", *a, flush=True)


    def synth_image(rng):
        from PIL import Image, ImageDraw
        w, h = int(rng.integers(224, 641)), int(rng.integers(224, 641))
        im = Image.new("RGB", (w, h), tuple(int(x) for x in rng.integers(0, 255, 3)))
        d = ImageDraw.Draw(im)
        for _ in range(int(rng.integers(3, 12))):
            x0, y0 = int(rng.integers(0, w - 20)), int(rng.integers(0, h - 20))
            box = (x0, y0, x0 + int(rng.integers(10, w // 2)), y0 + int(rng.integers(10, h // 2)))
            col = tuple(int(x) for x in rng.integers(0, 255, 3))
            (d.ellipse if rng.random() < .5 else d.rectangle)(box, fill=col)
        return im

    def synth_video(rng):
        n, s = int(rng.choice([4, 6, 8])), int(rng.choice([128, 160, 224]))
        x, y = np.meshgrid(np.linspace(0, 1, s), np.linspace(0, 1, s))
        k = rng.uniform(2, 12, 3)
        return np.stack([(np.stack([0.5 + 0.5 * np.sin(x * k[0] + i), y ** (1 + i / n),
                                    0.5 + 0.5 * np.cos(y * k[2] - i * k[1] / 6)], -1) * 255).astype("uint8")
                         for i in range(n)])

    def synth_audio(rng, rate=16000):
        t = np.arange(int(rng.uniform(1.0, 4.0) * rate), dtype="float32") / rate
        sig = sum(rng.uniform(.05, .3) * np.sin(2 * math.pi * rng.uniform(80, 2000) * t) for _ in range(3))
        sig = sig + rng.uniform(0, .05) * rng.standard_normal(len(t))
        return (sig * np.hanning(len(t))).astype("float32")

    def load_texts():
        try:
            from huggingface_hub import hf_hub_download
            import pyarrow.parquet as pq
            p = hf_hub_download("HuggingFaceH4/ultrachat_200k", repo_type="dataset",
                                filename="data/test_sft-00000-of-00001-f7dfac4afe5b93f4.parquet")
            rows = pq.read_table(p, columns=["prompt", "messages"]).to_pylist()
            out = []
            for r in rows:
                reply = next((m["content"] for m in r["messages"] if m["role"] == "assistant"), "")
                out.append((r["prompt"][:1200], reply[:2400]))
            log(f"ultrachat test_sft rows: {len(out)}")
            return out
        except Exception as e:
            log("ultrachat unavailable, synthetic text only:", repr(e))
            words = "agent player wall door enemy ladder coin map key light shadow path river bridge tower".split()
            rng = random.Random(7)
            return [(" ".join(rng.choices(words, k=30)), " ".join(rng.choices(words, k=120))) for _ in range(4000)]

    VERBS = ["move forward", "turn left", "turn right", "wait", "jump", "retreat", "interact", "stop"]
    def make_record(i, text, rng):
        prompt, reply = text
        state = {"task": prompt, "observation": reply}
        if rng.random() < .3:
            state["history"] = "\n".join(f"step {j}: {rng.choice(VERBS)}" for j in range(int(rng.integers(2, 40))))
        qs = {}
        for qi in range(int(rng.integers(1, 4))):
            kind = rng.choice(["choice", "noul", "score"])
            if kind == "choice":
                opts = list(rng.choice(VERBS, size=int(rng.integers(2, 6)), replace=False))
                qs[f"q{qi}"] = {"type": "choice", "instructions": "Which response best serves the task?",
                                "criteria": {o.replace(" ", "_"): o for o in opts}}
            elif kind == "noul":
                qs[f"q{qi}"] = {"type": "noul", "instructions": "Does the observation answer the task correctly?"}
            else:
                qs[f"q{qi}"] = {"type": "score", "instructions": "Rate the observation's helpfulness",
                                "criteria": ["useless", "weak", "adequate", "good", "excellent"][: int(rng.integers(3, 6))]}
        rec = {"id": f"r{i}", "state": state, "questions": qs}
        u = rng.random()
        if u < .10:
            rec["images"] = [synth_image(rng)]
        elif u < .15:
            rec["videos"] = [synth_video(rng)]
        elif u < .20:
            rec["audio"] = [synth_audio(rng)]
        return rec



    def build(n_calib=512, n_eval=128):
        texts = load_texts()
        order = list(range(len(texts))); random.Random(145).shuffle(order)
        calib_idx, eval_idx = order[:n_calib], order[n_calib:n_calib + n_eval]
        rng_c, rng_e = np.random.default_rng(1), np.random.default_rng(2)
        calib = [make_record(i, texts[i], rng_c) for i in calib_idx]
        evals = [make_record(i, texts[i], rng_e) for i in eval_idx]
        return calib, evals
  eval_export.py: |
    """Grade an EXPORTED Clef-Omni checkpoint against the BF16 reference (issue #152).

    Loads the export exactly as users will (serve_clef.load), scores the 128 held-out records from
    clef_records.build(), and compares with the BF16 probabilities saved by the Stage 2a ModelOpt job
    (parity_fakequant_rows.jsonl, "bf16" field). Same records, same seeds, same head.

        python eval_export.py --export /work/int4/export --out /work/int4/results [--simulate-fp4-activations]
    """
    import argparse
    import json
    import sys
    import time
    from pathlib import Path

    import numpy as np
    import torch

    HERE = Path(__file__).resolve().parent
    sys.path.insert(0, str(HERE))
    import clef_records  # noqa: E402
    import serve_clef  # noqa: E402


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--export", required=True)
        ap.add_argument("--out", required=True)
        ap.add_argument("--reference", default="/work/nvfp4-experts/results/parity_fakequant_rows.jsonl")
        ap.add_argument("--simulate-fp4-activations", action=argparse.BooleanOptionalAction, default=None,
                        help="NVFP4 W4A4: reproduce FP4 activation rounding (default off, see serve_clef.load)")
        ap.add_argument("--limit", type=int, default=None)
        ap.add_argument("--fast-moe", action=argparse.BooleanOptionalAction, default=True,
                        help="AutoRound INT4: grouped int4 MoE fast path (see serve_clef.fast_int4_moe)")
        ap.add_argument("--fakequant-rows", default=None,
                        help="a quant job's parity_fakequant_rows.jsonl: also report how closely the export reproduces it")
        args = ap.parse_args()
        out = Path(args.out); out.mkdir(parents=True, exist_ok=True)

        ref = {}
        for line in open(args.reference):
            r = json.loads(line)
            ref[(r["record"], r["question"])] = r["bf16"]
        _, evals = clef_records.build()
        evals = [r for r in evals if any((r["id"], q) in ref for q in r["questions"])][: args.limit]

        t0 = time.time()
        model, processor, jsm, kind = serve_clef.load(Path(args.export), "cuda",
                                                      simulate_fp4_activations=args.simulate_fp4_activations,
                                                      fast_moe=args.fast_moe)
        load_s = time.time() - t0
        clef_records.log(f"loaded {args.export} ({kind}) in {load_s:.0f}s; "
                         f"gpu {torch.cuda.memory_allocated() / 2**30:.1f} GiB")

        rows, agree, total, tvs, flips, lat = [], 0, 0, [], [], []
        torch.cuda.reset_peak_memory_stats()
        for rec in evals:
            enc = jsm.encode_record(processor.tokenizer, rec, processor=processor)
            batch = jsm.collate_records([enc], processor.tokenizer.pad_token_id, torch.device("cuda"))
            torch.cuda.synchronize(); ts = time.time()
            with torch.inference_mode():
                logits = model(batch)[0]
            torch.cuda.synchronize(); lat.append(time.time() - ts)
            for q, lg in zip(enc.questions, logits):
                key = (rec["id"], q.question_id)
                if key not in ref:
                    continue
                bd = ref[key]
                qd = dict(zip(q.option_ids, lg.float().softmax(-1).tolist()))
                tv = 0.5 * sum(abs(bd[o] - qd[o]) for o in bd)
                b_top, q_top = max(bd, key=bd.get), max(qd, key=qd.get)
                srt = sorted(bd.values(), reverse=True)
                total += 1; agree += b_top == q_top; tvs.append(tv)
                if b_top != q_top:
                    flips.append({"record": rec["id"], "question": q.question_id, "bf16": b_top, "quant": q_top,
                                  "bf16_margin": round(srt[0] - (srt[1] if len(srt) > 1 else 0), 4)})
                rows.append({"record": rec["id"], "question": q.question_id, "tv": round(tv, 6), "bf16": bd, "quant": qd})
        parity = {"export": args.export, "kind": kind, "fast_moe": args.fast_moe, "simulate_fp4_activations": args.simulate_fp4_activations,
                  "questions": total, "top1_agreement": round(agree / total, 4),
                  "mean_tv": round(float(np.mean(tvs)), 5), "p95_tv": round(float(np.percentile(tvs, 95)), 5),
                  "max_tv": round(float(np.max(tvs)), 5), "flips": flips,
                  "gate_top1_ge_0.98": agree / total >= .98, "gate_mean_tv_le_0.03": float(np.mean(tvs)) <= .03,
                  "load_s": round(load_s, 1), "forward_ms_median": round(1000 * float(np.median(lat)), 1),
                  "forward_ms_p95": round(1000 * float(np.percentile(lat, 95)), 1),
                  "weights_gib": round(torch.cuda.memory_allocated() / 2**30, 2),
                  "peak_gib": round(torch.cuda.max_memory_allocated() / 2**30, 2)}
        if args.fakequant_rows:
            fq = {(r["record"], r["question"]): r["nvfp4"] for r in map(json.loads, open(args.fakequant_rows))}
            diffs, same = [], 0
            for r in rows:
                f = fq.get((r["record"], r["question"]))
                if f is None:
                    continue
                diffs.append(max(abs(f[o] - r["quant"][o]) for o in f))
                same += max(f, key=f.get) == max(r["quant"], key=r["quant"].get)
            parity["vs_fakequant"] = {"questions": len(diffs), "top1_same": round(same / max(len(diffs), 1), 4),
                                      "max_abs_dp": round(max(diffs), 5) if diffs else None,
                                      "mean_abs_dp": round(float(np.mean(diffs)), 6) if diffs else None}
        json.dump(parity, open(out / "parity_export.json", "w"), indent=1)
        with open(out / "parity_export_rows.jsonl", "w") as f:
            for r in rows:
                f.write(json.dumps(r) + "\n")
        clef_records.log("EXPORT PARITY:", json.dumps({k: v for k, v in parity.items() if k != "flips"}), f"flips={len(flips)}")


    if __name__ == "__main__":
        main()
  hf_publish.py: |
    """Publish (or refresh) a Clef-Omni quant on the Hugging Face Hub (issue #150).

        python hf_publish.py --repo dbirks/clef-omni-int4 --export /work/int4/export --card cards/clef-omni-int4.md \
            --private --tag v0.1                       # new repo: whole export, private, tagged
        python hf_publish.py --repo dbirks/clef-omni-nvfp4 --export /work/nvfp4-experts/export \
            --card cards/clef-omni-nvfp4.md --only README.md serve_clef.py SHA256SUMS   # refresh docs only

    The card becomes README.md and serve_clef.py ships next to the weights. SHA256SUMS is rewritten so it
    stays true. The token must belong to the repo's namespace. New repos are created private unless --public.
    """
    import argparse
    import hashlib
    import shutil
    from pathlib import Path

    from huggingface_hub import HfApi

    HERE = Path(__file__).resolve().parent


    def sha256(p):
        with open(p, "rb") as f:
            return hashlib.file_digest(f, "sha256").hexdigest()


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--repo", required=True)
        ap.add_argument("--export", required=True)
        ap.add_argument("--card", required=True)
        vis = ap.add_mutually_exclusive_group()
        vis.add_argument("--private", action="store_true", default=True)
        vis.add_argument("--public", action="store_true")
        ap.add_argument("--tag", default=None)
        ap.add_argument("--tag-message", default=None)
        ap.add_argument("--only", nargs="*", default=None, help="upload just these files (docs refresh)")
        args = ap.parse_args()
        export = Path(args.export)
        card = Path(args.card) if Path(args.card).is_absolute() else HERE / args.card

        api = HfApi()
        who = api.whoami()["name"]
        assert args.repo.split("/")[0] == who, f"token belongs to {who}, not {args.repo.split('/')[0]}"

        shutil.copy2(card, export / "README.md")
        shutil.copy2(HERE / "serve_clef.py", export / "serve_clef.py")
        files = sorted(p for p in export.iterdir() if p.is_file() and not p.name.startswith(".") and p.name != "SHA256SUMS")
        (export / "SHA256SUMS").write_text("".join(f"{sha256(p)}  {p.name}\n" for p in files))
        print(f"staged README.md, serve_clef.py, SHA256SUMS ({len(files)} files) in {export}", flush=True)

        exists = api.repo_exists(args.repo)
        if not exists:
            api.create_repo(args.repo, private=not args.public, exist_ok=True)
            print(f"created {args.repo} ({'public' if args.public else 'private'})", flush=True)
        if args.only:
            for name in args.only:
                api.upload_file(path_or_fileobj=str(export / name), path_in_repo=name, repo_id=args.repo,
                                commit_message=f"Update {name}")
        else:
            api.upload_large_folder(repo_id=args.repo, repo_type="model", folder_path=str(export),
                                    ignore_patterns=[".cache/**"], num_workers=4)
        remote = set(api.list_repo_files(args.repo))
        wanted = set(args.only) if args.only else {p.name for p in export.iterdir() if p.is_file() and not p.name.startswith(".")}
        missing = sorted(wanted - remote)
        assert not missing, f"missing on the Hub: {missing}"
        info = api.model_info(args.repo)
        if args.tag and args.tag not in {t.name for t in api.list_repo_refs(args.repo).tags}:
            note = args.tag_message
            if note is None:   # default: the version note from quants.json, so tags and the card's history agree
                import json
                for q in json.loads((HERE / "quants.json").read_text())["quants"]:
                    if q["repo"] == args.repo:
                        note = next((v["note"] for v in q.get("versions", []) if v["tag"] == args.tag), None)
            api.create_tag(args.repo, tag=args.tag, revision=info.sha, tag_message=note or args.tag)
        print(f"PUBLISHED https://huggingface.co/{args.repo} @ {info.sha} private={info.private} "
              f"({len(remote)} files){' tag ' + args.tag if args.tag else ''}", flush=True)


    if __name__ == "__main__":
        main()
  quant_int4_autoround.py: |
    """Clef-Omni quants with Intel AutoRound 0.16.0 (issue #152): INT4 W4A16 g128, NVFP4 (W4A4) and NVFP4A16.

    AR_SCHEME selects the variant: W4A16 (int4, group 128, default), NVFP4 (FP4 weights + FP4 activations,
    blocks of 16) or NVFP4A16 (FP4 weights, 16-bit activations). Output root defaults per variant.

    Experts-only like the ModelOpt quants (router, attention, lm_head, embeddings, vision/audio towers and
    the Clef head stay BF16). AutoRound's Qwen3-Omni handler unfuses the transformers-5 fused experts into
    per-expert Linears, tunes each decoder block (SignRound, `iters` steps) on Clef's real forward path,
    and writes the auto_round (auto_gptq-packed) format that transformers loads with int4 kernels.

    Host RAM guard (46 GB, no swap): the BF16 model is loaded straight onto the GPU, and AutoRound's two
    "move the whole model to CPU" calls are intercepted (orchestrator: after input caching; calibration
    fallback: on a CUDA error). Tuned blocks still go to CPU one at a time and are freed by the shard writer.

        CLEF_REHEARSAL=1 python quant_int4_autoround.py   # tiny random model, same code path
        python quant_int4_autoround.py                    # real run -> /work/int4/export
    """
    import json
    import os
    import shutil
    import sys
    import time
    from pathlib import Path

    import torch

    HERE = Path(__file__).resolve().parent
    sys.path.insert(0, str(HERE))
    import clef_records  # noqa: E402
    from clef_records import log  # noqa: E402

    REHEARSAL = os.environ.get("CLEF_REHEARSAL") == "1"
    MODEL = Path(os.environ.get("CLEF_MODEL_DIR", "/work/clef-omni"))
    SCHEME = os.environ.get("AR_SCHEME", "W4A16")
    _ROOTS = {"W4A16": "int4", "NVFP4": "nvfp4-ar", "NVFP4A16": "nvfp4a16-ar"}
    ROOT = Path(os.environ.get("CLEF_ROOT", f"/work/{_ROOTS[SCHEME]}{'-rehearsal' if REHEARSAL else ''}"))
    SCHEME_ARG = {"bits": 4, "group_size": 16, "data_type": "nv_fp", "act_bits": 16} if SCHEME == "NVFP4A16" else SCHEME
    # The whole BF16 model stays on the GPU (host-RAM guard), so tuning headroom is ~35 GB. INT4 peaked at 85 GB;
    # NVFP4 W4A4 OOMed in block 0 at the defaults, so the NVFP4 variants keep cached inputs in host RAM and the
    # W4A4 one also caps the sequence length.
    LOW_GPU_MEM = os.environ.get("AR_LOW_GPU_MEM", "1" if SCHEME.startswith("NVFP4") else "0") == "1"
    SEQLEN = int(os.environ.get("AR_SEQLEN", 4096 if SCHEME == "NVFP4" else 8192))
    EXPORT, RES = ROOT / "export", ROOT / "results"
    ITERS = int(os.environ.get("AR_ITERS", 2 if REHEARSAL else 200))
    N_CALIB = int(os.environ.get("N_CALIB", 16 if REHEARSAL else 512))
    sys.path.insert(0, str(MODEL))
    import joint_schema_model as jsm  # noqa: E402


    def avail_gib():
        for line in open("/proc/meminfo"):
            if line.startswith("MemAvailable"):
                return round(int(line.split()[1]) / 2**20, 1)


    def rss_gib():
        for line in open("/proc/self/status"):
            if line.startswith("VmRSS"):
                return round(int(line.split()[1]) / 2**20, 2)


    def mem():
        return (f"gpu {torch.cuda.memory_allocated() / 2**30:.1f} GiB (peak {torch.cuda.max_memory_allocated() / 2**30:.1f}), "
                f"rss {rss_gib()} GiB, host avail {avail_gib()} GiB")


    def load_backbone():
        from transformers import AutoConfig, Qwen3OmniMoeForConditionalGeneration
        config = AutoConfig.from_pretrained(MODEL)
        config.enable_audio_output = False
        if REHEARSAL:
            tc = config.thinker_config
            t = tc.text_config
            t.num_hidden_layers, t.hidden_size, t.intermediate_size, t.moe_intermediate_size = 2, 256, 128, 128
            t.num_experts, t.num_experts_per_tok, t.num_attention_heads, t.num_key_value_heads = 8, 2, 4, 2
            v = tc.vision_config
            v.depth, v.hidden_size, v.num_heads, v.intermediate_size, v.out_hidden_size = 3, 64, 2, 128, 256
            v.deepstack_visual_indexes = [0, 1, 2]
            a = tc.audio_config
            a.d_model, a.encoder_layers, a.encoder_attention_heads, a.encoder_ffn_dim, a.output_dim = 64, 1, 2, 128, 256
            torch.manual_seed(0)
            with torch.device("cuda"):
                return Qwen3OmniMoeForConditionalGeneration._from_config(config, dtype=torch.bfloat16).eval()
        return Qwen3OmniMoeForConditionalGeneration.from_pretrained(
            MODEL, config=config, dtype=torch.bfloat16, device_map={"": "cuda"}).eval()


    def guard_host_ram(top):
        """Keep AutoRound from copying the whole (GPU-resident) model into host RAM."""
        import auto_round.calibration.llm as cal
        import auto_round.compressors.orchestrator as orch
        original = orch.mv_module_from_gpu

        def keep_top_on_gpu(module):
            if module is top:
                log("guard: AutoRound asked to move the whole model to CPU; keeping it on the GPU")
                return module
            return original(module)

        def refuse_cpu_fallback(module):
            if module is top:
                raise RuntimeError("AutoRound tried its CPU calibration fallback (whole model to host RAM); "
                                   "refusing: it would OOM the 46 GB node")
            return original(module)

        orch.mv_module_from_gpu = keep_top_on_gpu
        cal.mv_module_from_gpu = refuse_cpu_fallback


    def calib_dicts(processor, records):
        out = []
        for r in records:
            enc = jsm.encode_record(processor.tokenizer, r, processor=processor)
            b = jsm.collate_records([enc], processor.tokenizer.pad_token_id, torch.device("cpu"))
            media = dict(b["media"] or {})
            uav = bool(media.pop("use_audio_in_video", False))
            for k in ("pixel_values", "pixel_values_videos", "input_features"):
                if k in media:
                    media[k] = media[k].to(torch.bfloat16)
            d = {"input_ids": b["input_ids"], "attention_mask": b["attention_mask"], "use_cache": False, **media}
            if uav:
                d["use_audio_in_video"] = True
            out.append(d)
        return out


    def main():
        os.environ.setdefault("AR_DISABLE_COPY_MTP_WEIGHTS", "1")    # never copy talker weights into the export
        RES.mkdir(parents=True, exist_ok=True)
        if EXPORT.exists():
            shutil.rmtree(EXPORT)
        from transformers import AutoProcessor
        processor = AutoProcessor.from_pretrained(MODEL)
        calib, _ = clef_records.build(n_calib=512, n_eval=128)       # same split as every other quant
        calib = calib[:N_CALIB]
        data = calib_dicts(processor, calib)
        log(f"{len(data)} calibration records, {sum(int(d['input_ids'].shape[1]) for d in data)} tokens, "
            f"{sum(1 for d in data if 'pixel_values' in d or 'pixel_values_videos' in d or 'input_features' in d)} multimodal")

        t0 = time.time()
        backbone = load_backbone()
        log(f"backbone on GPU in {time.time() - t0:.0f}s;", mem())
        guard_host_ram(backbone)

        from auto_round import AutoRound
        ar = AutoRound(backbone, tokenizer=processor.tokenizer, processor=processor, scheme=SCHEME_ARG, dataset=data,
                       nsamples=len(data), seqlen=SEQLEN, iters=ITERS, batch_size=1, gradient_accumulate_steps=8,
                       device_map=0, low_gpu_mem_usage=LOW_GPU_MEM, ignore_layers="mlp.gate,lm_head,self_attn")
        log(f"AutoRound {type(ar).__name__}: scheme={SCHEME} iters={ITERS} nsamples={len(data)} "
            f"seqlen={SEQLEN} low_gpu_mem_usage={LOW_GPU_MEM}")
        t0 = time.time()
        _, out_dir = ar.quantize_and_save(output_dir=str(ROOT / "ar-out"), format="auto_round")
        log(f"quantize_and_save in {time.time() - t0:.0f}s -> {out_dir};", mem())

        shutil.move(str(out_dir), str(EXPORT))
        shutil.rmtree(ROOT / "ar-out", ignore_errors=True)
