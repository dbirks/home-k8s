# Forgejo — self-hosted Git forge (Gitea fork).
#
# Official chart is OCI-only (oci://code.forgejo.org/forgejo-helm/forgejo), so this
# uses an OCIRepository source + HelmRelease chartRef (helm-controller v1.6.2 supports
# it; cross-namespace refs are enabled on this cluster). API v1 per Flux v2.8+ rule.
#
# Lean single-node config: chart v17 has NO bundled HA Postgres/Redis — empty
# database config = built-in SQLite on the PVC, replicaCount 1, no cache cluster.
# Admin creds come from the SOPS-encrypted `forgejo-admin` Secret (apps/forgejo-admin.enc.yaml).
#
# TAILSCALE-ONLY: no hoam.lan / private ingress. Reachable only over the tailnet as
# forgejo.beluga-wyvern.ts.net (auto Let's Encrypt HTTPS, never public) via the
# tailscale Ingress below — same pattern as apps/vllm-tailscale-ingress.yaml. Git
# over HTTPS works through it; SSH stays ClusterIP for now (expose via MetalLB later).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: forgejo
  namespace: flux-system
spec:
  interval: 12h
  url: oci://code.forgejo.org/forgejo-helm/forgejo
  ref:
    # Chart version = OCI tag. Latest: https://code.forgejo.org/forgejo-helm/forgejo-helm
    tag: "17.1.5"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: default
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: flux-system
  # Default values:
  # https://code.forgejo.org/forgejo-helm/forgejo-helm/src/branch/main/values.yaml
  values:
    replicaCount: 1
    strategy:
      type: Recreate          # RWO PVC — never two pods at once

    persistence:
      enabled: true
      size: 20Gi
      storageClass: local-path   # NVMe

    service:
      ssh:
        type: ClusterIP          # HTTP(S) git via ingress; SSH in-cluster only for now

    ingress:
      enabled: false          # Tailscale-only — see the tailscale Ingress at the bottom

    gitea:
      admin:
        existingSecret: forgejo-admin   # keys: username, password (SOPS-encrypted)
        email: admin@hoam.lan
        passwordMode: keepUpdated
      config:
        server:
          DOMAIN: forgejo.beluga-wyvern.ts.net
          ROOT_URL: https://forgejo.beluga-wyvern.ts.net/
        service:
          DISABLE_REGISTRATION: true    # private instance — admin creates users

    # Skip the chart's connection-test pod
    test:
      enabled: false
---
# Tailscale Ingress — reachable only over the tailnet as forgejo.<tailnet>.ts.net
# (auto-renewing Let's Encrypt cert, never public). Backend is the chart's
# forgejo-http Service on port 3000.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo-ts
  namespace: default
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - forgejo
  rules:
    - host: forgejo
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo-http
                port:
                  number: 3000
