# flint — Recursive Flint NVFP4 GGUF on vLLM (stock layers on SM120). Issue #158.
# ============================================================================================
# Image: ghcr.io/dbirks/vllm-openai:flint-sm120-* = vllm/vllm-openai:flint (day-0, PR #62938) + three fixes
# from the PR thread (build/vllm-flint/Dockerfile): `_flint_kernels()` gated to SM100, so SM120 takes vLLM's
# stock layers (Marlin W4A16 NVFP4 linears + MoE, FlashInfer attention with sinks); `gguf>=0.19.0`; CUDA
# compat libs removed (clash with the 580 driver). Same path verified on an RTX PRO 6000 (LiveCodeBench v6
# 82.2%, SWE-bench Verified 80%) and on a 5090 (2,572 tok/s output at 32 concurrent, TPOT 11.3 ms).
#
# Why vLLM over llama.cpp here: llama.cpp batched MoE decode under real agent load gave ~30 tok/s per request
# at ~5 busy slots even with split KV (apps/flint-llamacpp.yaml.hold); vLLM batches continuously with paged KV.
#
# KV: only the 14 full-attention layers keep whole-sequence KV (vLLM's hybrid allocator gives the 35
# sliding-window layers window-sized pages). fp8 KV (e4m3) halves it vs bf16; it is NOT what the recipe uses
# (BF16). If startup fails on the attention backend or quality looks off, drop --kv-cache-dtype (= auto/bf16).
# HAMi shows vLLM a 55000 MiB GPU, so --gpu-memory-utilization is a fraction of the SLICE.
# Config + tokenizer + generation_config come from /models/flint-config (BF16 repo files only).
# ============================================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flint
  namespace: default
  labels:
    app.kubernetes.io/name: flint
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: flint
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flint
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false
      nodeSelector: { kubernetes.io/hostname: talos-210-73x }
      containers:
        - name: main
          image: ghcr.io/dbirks/vllm-openai:flint-sm120-20261021@sha256:73fb73ab5b7319ab5f4239cf7f7f366608ace38e5093c721b30138a3159f3e61
          command: ["vllm", "serve"]
          args:
            - "/models/flint-nvfp4-gguf"   # the directory holding flint-nvfp4.gguf (the recipe passes the dir)
            - "--hf-config-path"
            - "/models/flint-config"
            - "--tokenizer"
            - "/models/flint-config"
            - "--generation-config"
            - "/models/flint-config"      # temperature 1.0 / top-p 0.95 / top-k 20 defaults
            - "--served-model-name"
            - "flint"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--max-model-len"
            - "262144"
            - "--max-num-seqs"
            - "32"
            - "--max-num-batched-tokens"
            - "8192"
            - "--gpu-memory-utilization"
            - "0.90"                      # of the 55000 MiB HAMi slice
            - "--kv-cache-dtype"
            - "fp8"
            - "--enable-prefix-caching"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "glm47"
            - "--reasoning-parser"
            - "glm47"
            - "--exclude-tools-when-tool-choice-none"
          env:
            - { name: VLLM_USE_RUST_FRONTEND, value: "0" }   # recipe: Rust frontend rejects the flags above
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
          ports:
            - containerPort: 8080
          startupProbe:                   # GGUF load + NVFP4 repack + Marlin + CUDA graphs: allow 20 min
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 120
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits: { nvidia.com/gpu: "1", nvidia.com/gpumem: "55000", cpu: "8", memory: 28Gi }
            requests: { cpu: "4", memory: 8Gi }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: flint-models-hdd
            readOnly: true
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: flint
  namespace: default
  labels:
    app.kubernetes.io/name: flint
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flint
  ports:
    - name: http
      port: 8080
      targetPort: 8080
