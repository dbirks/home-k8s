# Communication — control plane (`communication serve`) + Postgres.
#
# Source: github.com/dbirks/communication (PRIVATE). Its CI `image (main)` job
# pushes ghcr.io/dbirks/communication:main (+ :sha-<short>) on every green push
# to main; communication-image-automation.yaml pins the :main digest below and
# bumps it via Flux image automation.
#
# Endpoint: https://communication.beluga-wyvern.ts.net (Tailscale Ingress,
# tailnet-only). Artifact previews get their own origin,
# https://communication-preview.beluga-wyvern.ts.net (ADR-0020 D6: previews
# must be a different HOSTNAME so the host-only session cookie never reaches
# them).
#
# Login: OIDC via tsidp (infra/tsidp.yaml). Client "communication" was
# registered in the tsidp admin UI (https://idp.beluga-wyvern.ts.net, from a
# tailnet-admin workstation); its id is below, its secret is in
# communication-secrets.enc.yaml. If tsidp's PVC is ever lost, recreate the
# client (redirect URI https://communication.beluga-wyvern.ts.net/auth/callback)
# and re-capture the secret into SOPS. tsidp's `sub` is the tailnet user id as
# `userid:<decimal id>` — derive yours with
#   echo "userid:$(tailscale status --json | jq .Self.UserID)"   (decimal, NOT hex)
# and list it in COMMUNICATION_BOOTSTRAP_ADMIN_SUBJECTS to get org admin.
#
# The execution worker lives at the bottom of this file (Deployment
# communication-worker, image ghcr.io/dbirks/communication-worker —
# worker/Dockerfile's build, Node + ACP adapters + nono + APM). serve's plain
# runtime image cannot run agent turns, so runs only execute once that worker is
# up; see its header for which node kinds are actually runnable today.
#
# Single replica: the app is stateless (all state in Postgres) so more replicas
# are fine later; one is plenty on this node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: communication-postgres-data
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: communication-postgres
  namespace: default
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: communication-postgres}
  template:
    metadata:
      labels: {app: communication-postgres}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          # Same major as the repo's compose.yml/CI (postgres:18.6).
          image: postgres:18.6
          ports:
            - {containerPort: 5432, name: postgres}
          env:
            - {name: POSTGRES_USER, value: communication}
            - {name: POSTGRES_DB, value: communication}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: communication-secrets, key: POSTGRES_PASSWORD}
          volumeMounts:
            # Postgres 18 images keep data under /var/lib/postgresql/18/docker,
            # so mount the parent (see the repo's compose.yml).
            - {name: data, mountPath: /var/lib/postgresql}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1Gi}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "communication", "-d", "communication"]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "communication", "-d", "communication"]}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: communication-postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: communication-postgres
  namespace: default
spec:
  selector: {app: communication-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
# Artifact bytes (ADR-0020 D2). serve only ever READS them (the worker writes);
# created now so the worker can share it once it exists (RWO is fine on one node).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: communication-artifacts
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: communication
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: communication}
  template:
    metadata:
      labels: {app: communication}
    spec:
      enableServiceLinks: false
      # Same read:packages PAT secret market-agent uses (apps/market-agent-ghcr-pull.enc.yaml);
      # the older shared ghcr-pull secret can't read this package.
      imagePullSecrets:
        - name: market-agent-ghcr-pull
      # tsidp is tailnet-only; map its FQDN to the idp-egress ClusterIP
      # (infra/tailscale-egress-idp.yaml), same as affine/videogen/openwebui.
      # Update the IP if that egress Service is ever recreated.
      hostAliases:
        - ip: "10.109.232.240"
          hostnames: [idp.beluga-wyvern.ts.net]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # One-shot schema migration (ADR-0013): serve never migrates itself, it
        # only refuses readiness until the schema is current.
        - name: migrate
          image: ghcr.io/dbirks/communication:main@sha256:407af5caec0f154652c18e7013c3341ddb776d6f391afb6c867e7e720f2414ab # {"$imagepolicy": "flux-system:communication"}
          args: ["migrate", "up"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          envFrom:
            - secretRef: {name: communication-secrets}
        # LoadKeyring refuses symlinks, stray files and any group/other mode
        # bit, so a Secret volume (..data symlinks, 0644) can't be pointed at
        # directly. Copy the key into a 0700 emptyDir as a 0600 regular file.
        - name: keyring
          image: ghcr.io/dbirks/communication:main@sha256:407af5caec0f154652c18e7013c3341ddb776d6f391afb6c867e7e720f2414ab # {"$imagepolicy": "flux-system:communication"}
          command: ["sh", "-ec"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          args:
            - |
              # The emptyDir root is root-owned (uid 10001 can't chmod it), so
              # the keyring is a subdirectory this uid creates and owns.
              umask 077
              mkdir -p /keyring/ring
              chmod 700 /keyring/ring
              cp /keyring-src/master-key-v1 /keyring/ring/master-key-v1
              chmod 600 /keyring/ring/master-key-v1
          volumeMounts:
            - {name: keyring-src, mountPath: /keyring-src, readOnly: true}
            - {name: keyring, mountPath: /keyring}
      containers:
        - name: serve
          image: ghcr.io/dbirks/communication:main@sha256:407af5caec0f154652c18e7013c3341ddb776d6f391afb6c867e7e720f2414ab # {"$imagepolicy": "flux-system:communication"}
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {containerPort: 8080, name: http}
          envFrom:
            # COMMUNICATION_DATABASE_URL, COMMUNICATION_OIDC_CLIENT_SECRET,
            # COMMUNICATION_PREVIEW_TOKEN_SECRET (+ POSTGRES_PASSWORD, unused here)
            - secretRef: {name: communication-secrets}
          env:
            - {name: COMMUNICATION_LISTEN_ADDR, value: ":8080"}
            - {name: COMMUNICATION_PUBLIC_URL, value: "https://communication.beluga-wyvern.ts.net"}
            - {name: COMMUNICATION_REPLICA_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: COMMUNICATION_OIDC_ISSUER, value: "https://idp.beluga-wyvern.ts.net"}
            - {name: COMMUNICATION_OIDC_CLIENT_ID, value: "556debffc484b7820c30093a21e1e199"}
            - {name: COMMUNICATION_COOKIE_SECURE, value: "true"}
            # dbirks@github (see header for how to derive a subject).
            - {name: COMMUNICATION_BOOTSTRAP_ADMIN_SUBJECTS, value: "userid:16684175954410223"}
            - {name: COMMUNICATION_ARTIFACT_BACKEND, value: local}
            - {name: COMMUNICATION_ARTIFACT_ROOT, value: /artifacts}
            - {name: COMMUNICATION_SECRET_KEYRING, value: /keyring/ring}
            - {name: COMMUNICATION_PREVIEW_HOST, value: "communication-preview.beluga-wyvern.ts.net"}
            - {name: COMMUNICATION_PREVIEW_BASE_URL, value: "https://communication-preview.beluga-wyvern.ts.net"}
          volumeMounts:
            - {name: artifacts, mountPath: /artifacts, readOnly: true}
            - {name: keyring, mountPath: /keyring, readOnly: true}
          readinessProbe:
            httpGet: {path: /api/v1/system/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /api/v1/system/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: communication-artifacts}
        - name: keyring-src
          secret:
            secretName: communication-keyring
            defaultMode: 0400
        - name: keyring
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: communication
  namespace: default
spec:
  selector: {app: communication}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: communication-ts
  namespace: default
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [communication]
  rules:
    - host: communication
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: communication
                port: {number: 80}
---
# Preview origin (ADR-0020 D6): same Service, separate tailnet hostname. serve
# answers only /preview/* on this host and refuses everything else.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: communication-preview-ts
  namespace: default
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [communication-preview]
  rules:
    - host: communication-preview
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: communication
                port: {number: 80}
---
# ── execution worker (`communication worker`) ───────────────────────────────
# What runs here: the worker image from worker/Dockerfile (the binary + Node
# ACP adapters + nono + APM — the plain :main image above has none of that).
# It claims run attempts from Postgres, mirrors repos under /repos, prepares
# per-run worktrees under /workspaces, executes nodes inside the nono
# (Landlock) sandbox and writes artifact bytes to /artifacts.
# strategy Recreate: two pods sharing these roots would fight over the same
# workspace/mirror state, and the PVCs are RWO anyway.
#
# Deliberately NOT mounted: the agent.acp harness credentials. compose.m4.yml's
# worker-a gives live ~/.claude / ~/.codex logins via CLAUDE_CONFIG_DIR and
# CODEX_HOME; nothing equivalent exists in this manifest, so ACP nodes fail with
# the worker's honest refusal and only process.exec and model.chat nodes run.
# model.chat gets its bearer token from communication-worker-secrets (created
# out of band — never commit a value); base URL + allowlist are plain env below.
#
# communication-artifacts is ReadWriteOnce, mounted READ-WRITE here while serve
# mounts it read-only. That is safe only because this cluster is a single node
# (one kubelet, one local-path volume). Multi-node needs pod affinity to serve,
# serve co-scheduled, or the S3 artifact backend.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: communication-workspaces
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: communication-repos
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: communication-worker
  namespace: default
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: communication-worker}
  template:
    metadata:
      labels: {app: communication-worker}
    spec:
      enableServiceLinks: false
      # Same read:packages PAT secret as serve (apps/market-agent-ghcr-pull.enc.yaml).
      imagePullSecrets:
        - name: market-agent-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # `communication worker` keeps attempts running; 25s compose grace + margin.
      terminationGracePeriodSeconds: 30
      initContainers:
        # LoadKeyring refuses symlinks, stray files and any group/other mode
        # bit, so a Secret volume (..data symlinks, 0644) can't be pointed at
        # directly. Copy the key into a 0700 emptyDir as a 0600 regular file.
        - name: keyring
          image: ghcr.io/dbirks/communication:main@sha256:407af5caec0f154652c18e7013c3341ddb776d6f391afb6c867e7e720f2414ab # {"$imagepolicy": "flux-system:communication"}
          command: ["sh", "-ec"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          args:
            - |
              # The emptyDir root is root-owned (uid 10001 can't chmod it), so
              # the keyring is a subdirectory this uid creates and owns.
              umask 077
              mkdir -p /keyring/ring
              chmod 700 /keyring/ring
              cp /keyring-src/master-key-v1 /keyring/ring/master-key-v1
              chmod 600 /keyring/ring/master-key-v1
          volumeMounts:
            - {name: keyring-src, mountPath: /keyring-src, readOnly: true}
            - {name: keyring, mountPath: /keyring}
      containers:
        - name: worker
          # No args: the image's ENTRYPOINT is /usr/local/bin/communication and
          # its CMD is already ["worker"].
          image: ghcr.io/dbirks/communication-worker:main@sha256:052d984b1a2253b3cbf6f657f753d0edb2ba28acc2d61738a728d1da4ec5b274 # {"$imagepolicy": "flux-system:communication-worker"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          envFrom:
            # COMMUNICATION_DATABASE_URL
            - secretRef: {name: communication-secrets}
            # COMMUNICATION_MODEL_CHAT_API_KEY (created out of band; sops file
            # is NOT part of this manifest)
            - secretRef: {name: communication-worker-secrets}
          env:
            - {name: COMMUNICATION_WORKER_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: COMMUNICATION_WORKER_HEARTBEAT, value: "10s"}
            - {name: COMMUNICATION_WORKER_CAPACITY, value: "2"}
            - {name: COMMUNICATION_WORKSPACE_ROOT, value: /workspaces}
            - {name: COMMUNICATION_REPOS_ROOT, value: /repos}
            - {name: COMMUNICATION_ARTIFACT_ROOT, value: /artifacts}
            - {name: COMMUNICATION_ARTIFACT_BACKEND, value: local}
            - {name: COMMUNICATION_SECRET_KEYRING, value: /keyring/ring}
            # required => the worker refuses to start unless nono is on PATH and
            # the Landlock self-test passes; it never launches an unisolated agent.
            - {name: COMMUNICATION_SANDBOX_ENFORCEMENT, value: required}
            - {name: COMMUNICATION_SANDBOX_HOME, value: /sandbox-home}
            - {name: COMMUNICATION_SANDBOX_POLICY_DIR, value: /sandbox-policy}
            - {name: COMMUNICATION_SANDBOX_SELFTEST_DIR, value: /sandbox-selftest}
            # The image's own HOME is not writable by uid 10001 at runtime; give
            # it a tmpfs HOME, and keep it out of the roots above.
            - {name: HOME, value: /home/worker}
            - {name: COMMUNICATION_AGENT_GIT_NAME, value: "Communication Worker"}
            - {name: COMMUNICATION_AGENT_GIT_EMAIL, value: worker@communication.invalid}
            - {name: COMMUNICATION_MODEL_CHAT_BASE_URL, value: "https://llm-collective.e-gineering.com/v1"}
            - {name: COMMUNICATION_MODEL_CHAT_MODELS, value: qwen3-8-flash-next}
          volumeMounts:
            - {name: workspaces, mountPath: /workspaces}
            - {name: repos, mountPath: /repos}
            - {name: artifacts, mountPath: /artifacts}
            - {name: sandbox-home, mountPath: /sandbox-home}
            - {name: sandbox-policy, mountPath: /sandbox-policy}
            - {name: sandbox-selftest, mountPath: /sandbox-selftest}
            - {name: home, mountPath: /home/worker}
            - {name: keyring, mountPath: /keyring, readOnly: true}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 4Gi}
      volumes:
        - name: workspaces
          persistentVolumeClaim: {claimName: communication-workspaces}
        - name: repos
          persistentVolumeClaim: {claimName: communication-repos}
        # READ-WRITE here (the worker writes artifacts); serve mounts the same claim read-only.
        - name: artifacts
          persistentVolumeClaim: {claimName: communication-artifacts}
        - name: sandbox-home
          emptyDir: {}
        - name: sandbox-policy
          emptyDir: {}
        - name: sandbox-selftest
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: keyring-src
          secret:
            secretName: communication-keyring
            defaultMode: 0400
        - name: keyring
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
