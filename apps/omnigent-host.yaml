# Omnigent persistent K8s host
#
# Runs `omnigent host` pointed at the in-cluster server. When you create
# a session in the Omnigent web UI and pick Pi harness, it spawns a Pi
# subprocess here that talks to the LLM Collective (qwen3-8-flash-next).
#
# Agent/runner distinction:
#   Pi   → models.json → https://llm-collective.e-gineering.com/v1 (Collective)
#   claude → subscription auth (no API key in this pod — use locally)
#   codex  → subscription auth (no API key in this pod — use locally)
#
# IS_SANDBOX=1 is already set in the image ENV.
# Pi config is written from the ConfigMap below at container start.
# A wrapper around the pi binary pre-selects collective/qwen3-8-flash-next so Pi
# doesn't fall back to its default google provider when spawned headlessly.
# Collective key: env COLLECTIVE_API_KEY from SOPS secret omnigent-collective
# (apps/omnigent-collective.enc.yaml); models.json names the env var, not the value.
# 2026-11-07: that secret holds a copy of Hermes' Collective key; mint a dedicated
# one in the Collective UI (/api-keys) and re-encrypt to separate usage.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pi-models-config
  namespace: omnigent
data:
  models.json: |
    {
      "providers": {
        "collective": {
          "baseUrl": "https://llm-collective.e-gineering.com/v1",
          "api": "openai-completions",
          "apiKey": "COLLECTIVE_API_KEY",
          "compat": { "supportsDeveloperRole": false },
          "models": [
            {
              "id": "qwen3-8-flash-next",
              "name": "Qwen3.8 Flash-Next (LLM Collective)",
              "reasoning": true,
              "input": ["text", "image"],
              "contextWindow": 524288,
              "maxTokens": 65536,
              "thinkingLevelMap": { "off": "none", "minimal": "low", "low": "low", "medium": "medium", "high": "xhigh", "xhigh": "xhigh", "max": "xhigh" },
              "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 }
            }
          ]
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigent-host
  namespace: omnigent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omnigent-host
  template:
    metadata:
      labels:
        app: omnigent-host
    spec:
      initContainers:
        # Write Pi config before the host process starts so Pi finds its
        # models.json immediately. The directory must exist first — Pi
        # doesn't create it until the first /model command.
        - name: pi-config-init
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - "mkdir -p /root/.pi/agent && cp /etc/pi-config/models.json /root/.pi/agent/models.json"
          volumeMounts:
            - name: pi-config
              mountPath: /etc/pi-config
            - name: home
              mountPath: /root
      containers:
        - name: host
          # v0.21.0
          image: ghcr.io/omnigent-ai/omnigent-host:v0.21.0
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              cp /usr/local/bin/pi /tmp/pi-real \
              && printf '#!/bin/sh\nexec /tmp/pi-real --model collective/qwen3-8-flash-next "$@"\n' \
                   > /usr/local/bin/pi \
              && chmod +x /usr/local/bin/pi \
              && omnigent host --server http://omnigent.omnigent.svc.cluster.local
          # No auth env vars — server runs in no-auth mode (single-user home lab)
          # No ANTHROPIC_API_KEY or OPENAI_API_KEY — Pi uses models.json (see
          # initContainer), Claude Code and Codex use subscription auth locally.
          env:
            - name: COLLECTIVE_API_KEY
              valueFrom: { secretKeyRef: { name: omnigent-collective, key: COLLECTIVE_API_KEY } }
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 8Gi
              cpu: 4000m
          volumeMounts:
            - name: home
              mountPath: /root
            - name: workspace
              mountPath: /root/workspace
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: pi-config
          configMap:
            name: pi-models-config
        # Shared home dir so initContainer's Pi config persists to main container
        - name: home
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
