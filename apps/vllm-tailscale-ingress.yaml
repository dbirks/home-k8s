# vLLM (vllm/llm MagicDNS names) — Tailscale Ingress
#
# NOTE (2026-07-26): backends repointed to the `laguna` Service — vllm.*.ts.net
# and llm.*.ts.net now serve Laguna-S-2.1 (Qwen `vllm` deploy is replicas 0
# during training). Change `name: laguna` back to `vllm` to serve Qwen again.
# Dedicated laguna.*.ts.net lives in apps/laguna-tailscale-ingress.yaml.
#
# Same pattern as apps/omnigent-tailscale-ingress.yaml: a second Ingress on
# the same Service, using the already-installed `tailscale` IngressClass
# (tailscale.com/ts-ingress). Tailscale provisions a dedicated tailnet node
# for this Ingress with a real, auto-renewing Let's Encrypt certificate for
# its MagicDNS name -- reachable only over the tailnet, never the public
# internet. Doesn't change the existing vllm.hoam.lan / llm.hoam.lan LAN
# access path.
#
# Requires "HTTPS Certificates" enabled in the Tailscale admin console
# (Settings -> DNS) -- already turned on for the omnigent-ts Ingress.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-ts
  namespace: default
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - vllm
  rules:
    - host: vllm
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qwen-regen
                port:
                  number: 80
---
# Second Tailscale Ingress on the same vllm Service, host `llm` -> gives an
# `llm.beluga-wyvern.ts.net` MagicDNS name alongside `vllm.beluga-wyvern.ts.net`
# (mirrors the vllm.hoam.lan / llm.hoam.lan dual-name convention on the LAN side).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-ts
  namespace: default
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - llm
  rules:
    - host: llm
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qwen-regen
                port:
                  number: 80
