# Durable, standalone PVC holding the additional scale-to-zero catalog models (Qwen3.6-27B,
# Qwen3.6-35B-A3B MoE, Gemma-4-31B) — all NVFP4 W4A4, served on demand via KServe LLMInference
# services with idleReplicaCount:0. Standalone (incident lesson): retiring the download job never
# touches this PVC. ~67GB of models; NVMe has ~520GB free (2026-08-20).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-models
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 160Gi
