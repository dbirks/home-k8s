# AFFiNE — self-hosted Notion replacement (issue #125). Two users (David + wife).
# Web UI + official iOS app, reachable ONLY over the tailnet as
# affine.beluga-wyvern.ts.net (Tailscale Ingress, auto Let's Encrypt TLS).
#
# Raw manifests (no Helm): upstream self-host is a small Compose stack (AFFiNE +
# migration + pgvector/Postgres + Redis) that maps directly to ordinary K8s resources,
# and this repo already owns Postgres apps this way (see apps/videogen.yaml).
# Mirrors upstream compose.yml @ v0.27.4:
#   https://github.com/toeverything/AFFiNE/blob/v0.27.4/.docker/selfhost/compose.yml
#
# Config model (server 0.27+): config.json is the source of truth (env-var config was
# largely removed). It lives in the SOPS Secret apps/affine-config.enc.yaml and is
# mounted read-only over the writable config PVC via subPath, so AFFiNE can still
# write its generated crypto private key into that PVC dir — identity survives pod
# replacement (acceptance criterion).
#
# Secrets (POSTGRES_PASSWORD, DATABASE_URL) are SOPS-encrypted in
# apps/affine-secrets.enc.yaml. Postgres is ClusterIP-only but still password-protected
# (defense in depth; upstream's trust-auth compose is not our model).
#
# AUTH: OIDC via the shared tsidp IdP (issue #123). A DCR-registered client (redirect
# https://affine.beluga-wyvern.ts.net/oauth/callback) lives in the config.json oauth
# block. A tsidp login auto-provisions the account (auth.allowSignupForOauth, default
# true) -> tailnet + tsidp is the account boundary. auth.allowSignup is false, so there
# is no email/password registration; the two flags are independent (verified in
# v0.27.4 core/auth/config.ts, and plugins/oauth/service.ts gates only on the OAuth
# one). Native iOS-app OIDC works as of the App Store build from 2026-07-31 (upstream
# #15343 / PR #15271 — a client-side fix; it was never a server-version issue).
#
# Adding a person: give them their own Tailscale USER (tsidp identifies by tailnet
# user, so a device on someone else's account authenticates as that account), have
# them sign in once via Continue with OIDC, then invite them from Settings -> Members.
# No mailer is configured, but invites arrive as in-app notifications. memberLimit: 10.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-postgres
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path            # NVMe — DB
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-storage
  namespace: default
spec:
  accessModes: [ReadWriteOnce]            # blobs/attachments -> /root/.affine/storage
  storageClassName: local-path-hdd        # bulky + cold; HDD like other media
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-config
  namespace: default
spec:
  accessModes: [ReadWriteOnce]            # config dir MUST persist: holds the
  storageClassName: local-path            # auto-generated crypto private key
  resources:
    requests:
      storage: 1Gi
---
# Application config (config.json) is the SOPS Secret apps/affine-config.enc.yaml
# (Secret name: affine-config) — it holds the OIDC clientSecret. Carries
# server.externalUrl/https/host, auth.allowSignup:false, indexer.enabled:false and the
# oauth.providers.oidc block. See the config/auth notes in the header.
# ---------------------------------------------------------------------------
# Postgres (pgvector/pgvector:pg16 — AFFiNE requires the pgvector extension)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-postgres
  namespace: default
spec:
  replicas: 1
  strategy: { type: Recreate }            # one writer, one RWO PVC
  selector: { matchLabels: { app: affine-postgres } }
  template:
    metadata: { labels: { app: affine-postgres } }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - { name: POSTGRES_USER, value: affine }
            - { name: POSTGRES_DB, value: affine }
            - { name: POSTGRES_INITDB_ARGS, value: "--data-checksums" }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: affine-secrets, key: POSTGRES_PASSWORD } }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U affine -d affine"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U affine -d affine"] }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: affine-postgres }
---
apiVersion: v1
kind: Service
metadata:
  name: affine-postgres
  namespace: default
spec:
  selector: { app: affine-postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
# ---------------------------------------------------------------------------
# Redis (ephemeral queue/cache — no PVC needed for this size, per issue)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-redis
  namespace: default
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: affine-redis } }
  template:
    metadata: { labels: { app: affine-redis } }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: 64Mi }
            limits: { cpu: "500m", memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: affine-redis
  namespace: default
spec:
  selector: { app: affine-redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
# ---------------------------------------------------------------------------
# AFFiNE server. The DB migration/predeploy (`self-host-predeploy.js`) runs as an
# init container on every rollout (idempotent) — cleaner under GitOps than a
# standalone Job, which Flux can't update in place on an image bump. Both the init
# and the main container use the SAME pinned image + digest.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: default
  annotations:
    # config.json is a subPath mount, so it NEVER updates in place — without this
    # the pod keeps serving the old config after Flux applies a changed secret.
    # Reloader (infra/reloader.yaml) rolls this Deployment when affine-config or
    # affine-secrets changes.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy: { type: Recreate }            # RWO storage/config PVCs, single writer
  selector: { matchLabels: { app: affine } }
  template:
    metadata: { labels: { app: affine } }
    spec:
      enableServiceLinks: false
      # Server-side OIDC calls (discovery/token/userinfo/jwks) go to the tsidp
      # tailnet name, which an in-cluster pod can't resolve/route. Map it to the
      # idp-egress ClusterIP (infra/tailscale-egress-idp.yaml) so the real FQDN is
      # used and the Let's Encrypt cert validates. Same mechanism as videogen.
      # Update this IP if that egress Service is deleted/recreated.
      hostAliases:
        - ip: "10.109.232.240"
          hostnames: [idp.beluga-wyvern.ts.net]
      initContainers:
        - name: migration
          # Pinned to 0.27.4 by digest (verified against GHCR 2026-09-14). Bump
          # deliberately: back up first, then change tag+digest in BOTH containers.
          image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
          command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
          env:
            - { name: REDIS_SERVER_HOST, value: affine-redis }
            - { name: AFFINE_INDEXER_ENABLED, value: "false" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: affine-secrets, key: DATABASE_URL } }
          volumeMounts:
            - { name: storage, mountPath: /root/.affine/storage }
            - { name: config, mountPath: /root/.affine/config }
            - { name: config-json, mountPath: /root/.affine/config/config.json, subPath: config.json }
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
          env:
            - { name: REDIS_SERVER_HOST, value: affine-redis }
            - { name: AFFINE_INDEXER_ENABLED, value: "false" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: affine-secrets, key: DATABASE_URL } }
          ports:
            - { name: http, containerPort: 3010 }
          readinessProbe:
            httpGet: { path: /info, port: 3010 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /info, port: 3010 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { name: storage, mountPath: /root/.affine/storage }
            - { name: config, mountPath: /root/.affine/config }
            # Bind the ConfigMap's config.json OVER the writable PVC dir. Longer
            # mountPath wins for that one file; the rest of the dir stays writable
            # so AFFiNE can persist its generated crypto private key to the PVC.
            - { name: config-json, mountPath: /root/.affine/config/config.json, subPath: config.json }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: affine-storage }
        - name: config
          persistentVolumeClaim: { claimName: affine-config }
        - name: config-json
          secret: { secretName: affine-config }
---
apiVersion: v1
kind: Service
metadata:
  name: affine
  namespace: default
spec:
  selector: { app: affine }
  ports:
    - { name: http, port: 3010, targetPort: 3010 }
---
# Tailscale Ingress — reachable only over the tailnet as
# affine.beluga-wyvern.ts.net (auto-renewing Let's Encrypt cert, never public).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: affine-ts
  namespace: default
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [affine]
  rules:
    - host: affine
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: affine
                port:
                  number: 3010
