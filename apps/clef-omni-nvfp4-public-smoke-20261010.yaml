# "Does the public model actually run?" (issue #151): run dbirks/clef-omni-nvfp4 EXACTLY as a stranger
# would from the model card: a bare python:3.12-slim container with only uv, the script fetched from the
# public HF URL, the model from the public repo, PyPI's default CUDA torch. Nothing from this cluster's
# venv, PVC checkpoints or scripts. The PVC only holds download caches.
#
# prefetch (CPU, runs immediately): fills the HF + uv caches (22 GB model, torch wheels) so the GPU Job
# does not hold the card while downloading. smoke (GPU): --demo, then the HTTP server + curl requests
# (text choice, multi-question with noul/score, image as a data URL), /healthz, VRAM and latency.
# Needs Pennyroyal at 0. Retire both to .yaml.hold once green.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clef-omni-nvfp4-public-prefetch
  namespace: default
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: { app: clef-omni-nvfp4-public-smoke }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: prefetch
          image: python:3.12-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              export HF_HOME=/work/.hf-public UV_CACHE_DIR=/work/.uv-cache-public HF_HUB_DISABLE_TELEMETRY=1
              pip install -q uv
              URL=https://huggingface.co/dbirks/clef-omni-nvfp4/resolve/main/serve_clef.py
              until python -c "import urllib.request,sys; urllib.request.urlopen('$URL')" 2>/dev/null; do
                echo "waiting for serve_clef.py to be published (v0.2)"; sleep 30; done
              # warm uv's environment for the script (same deps the GPU run will resolve), then the model
              uv run "$URL" --help | head -5
              uv run --with 'huggingface_hub<2' python -c 'from huggingface_hub import snapshot_download; print(snapshot_download("dbirks/clef-omni-nvfp4"))'
              du -sh /work/.hf-public /work/.uv-cache-public
              echo PREFETCH OK
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "4", memory: 6Gi }
          volumeMounts:
            - { name: work, mountPath: /work }
      volumes:
        - { name: work, persistentVolumeClaim: { claimName: clef-omni-hdd } }
