# Splat lab (2026-11-16): one-off GPU Jobs on dave-droid's GTX 1070 that generate Gaussian splats for the
# AISE Nov 2026 talk deck (github.com/dbirks/aise-nov-2026-local-llms, tools/splats/gpu/). The card is lent by
# parking lfm3-omni (replicas 0); qwen3-asr keeps running beside these Jobs.
#
# Pattern (splat-lab skill): each Job fetches its script from the deck repo on GitHub (public), writes results to
# the PVC under /data/out/<job>/, and is never deleted by TTL (Flux would re-create and re-run it). To re-run,
# add a new Job with a new name suffix and delete the old manifest. Pull results with:
#   kubectl cp default/$(kubectl get pod -l app=splat-lab-files -o name | cut -d/ -f2):/data/out/<job> ./out
# gpumem 5000 is ENFORCED for CUDA by HAMi, so a Job can't eat into qwen3-asr (Vulkan, ~2.3 GiB, accounted 3000).
# Pascal sm_61: CUDA 13 dropped it — use CUDA 12.x images (pytorch 2.7.1 cu126 still ships sm_61).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: splat-lab-data
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path        # binds on dave-droid (WaitForFirstConsumer)
  resources: { requests: { storage: 40Gi } }
---
# Tiny always-on pod that mounts the PVC so results can be copied out with kubectl cp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splat-lab-files
  namespace: default
  labels: { app: splat-lab-files }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: splat-lab-files } }
  template:
    metadata: { labels: { app: splat-lab-files } }
    spec:
      nodeSelector: { kubernetes.io/hostname: dave-droid }
      tolerations:
        - { key: dedicated, operator: Equal, value: pascal, effect: NoSchedule }
      containers:
        - name: files
          image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
          command: [sh, -c, "mkdir -p /data/out /data/cache && exec sleep infinity"]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: splat-lab-data } }
---
# Smoke test: torch sees the 1070 with sm_61 kernels, then method B's depth model on GPU vs the CPU timing.
apiVersion: batch/v1
kind: Job
metadata:
  name: splat-lab-smoke-1
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector: { kubernetes.io/hostname: dave-droid }
      tolerations:
        - { key: dedicated, operator: Equal, value: pascal, effect: NoSchedule }
      containers:
        - name: run
          image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime@sha256:2b59b1b91885677814f78be1f8df48a25d5dc952eb6580eaecfefca510f9afd3
          command:
            - bash
            - -ec
            - |
              mkdir -p /data/out/smoke-1 && cd /data/out/smoke-1
              python - <<'PY' 2>&1 | tee torch.txt
              import torch, time
              print("torch", torch.__version__, "cuda", torch.version.cuda, "arch", torch.cuda.get_arch_list())
              print("available", torch.cuda.is_available(), torch.cuda.get_device_name(0))
              free, total = torch.cuda.mem_get_info(); print(f"mem free {free/2**30:.2f} / {total/2**30:.2f} GiB")
              a = torch.randn(4096, 4096, device="cuda", dtype=torch.float16); torch.cuda.synchronize()
              t = time.time(); [a @ a for _ in range(50)]; torch.cuda.synchronize(); print(f"50 fp16 matmuls {time.time()-t:.2f}s")
              PY
          env:
            - { name: HF_HOME, value: /data/cache/hf }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { cpu: "6", memory: 16Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "5000" }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: splat-lab-data } }
