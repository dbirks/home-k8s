# AutoScheme feasibility SMOKE — does auto-round export a MIXED NVFP4 recipe to compressed-tensors?
#
# WHY: auto-round docs (step_by_step.md L382) say mixed-DATA-TYPE recipes tune but "cannot be
# exported to real models at this time." NVFP4 has no same-family 8-bit sibling, so promoting
# sensitive layers off NVFP4 (-> MXFP8/FP8) is cross-data-type and may hit that wall. Before
# spending GPU-hours on the 30B AutoScheme run, prove the export on a TINY model (~0.5B, ~2 min).
#
# PASS = config.json has >1 config_group with DIFFERENT schemes (truly mixed) AND export didn't error.
# FAIL/UNIFORM = AutoScheme-NVFP4 is export-blocked today -> report, don't run the 30B.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: muse-autoscheme-smoke-scripts
  namespace: default
data:
  run.sh: |
    #!/bin/bash
    set -uo pipefail
    PY="$(command -v python3 || command -v python)"
    export HF_HOME=/workspace/hf PYTHONUNBUFFERED=1 TOKENIZERS_PARALLELISM=false
    export VLLM_ATTENTION_BACKEND=FLASHINFER FLASHINFER_CUDA_ARCH_LIST=12.0f
    export VLLM_WORKER_MULTIPROC_METHOD=fork   # offline LLM() in a procedural script -> avoid spawn re-import
    mkdir -p /workspace/artifacts "$HF_HOME"
    command -v git >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq git) >/dev/null 2>&1 || true
    echo "=== [$(date)] installing auto-round (dbirks fork) + transformers-from-source ==="
    "$PY" -m pip install --no-cache-dir "auto-round @ git+https://github.com/dbirks/auto-round.git@main" datasets accelerate 2>&1 | tail -6
    "$PY" -m pip install --no-cache-dir --upgrade "git+https://github.com/huggingface/transformers.git" 2>&1 | tail -4
    "$PY" -c "import auto_round,transformers; print('auto_round',auto_round.__version__,'transformers',transformers.__version__)"
    "$PY" /scripts/smoke.py
  smoke.py: |
    #!/usr/bin/env python3
    """Tiny-model AutoScheme END-TO-END smoke (v2): export NVFP4+MXFP8 with shared_layers keeping
    fused q/k/v (and gate/up) on ONE scheme, then LOAD in vLLM on SM120 and generate.
    v1 proved export works but vLLM crashed on fused-QKV mixed shards -> shared_layers is the fix."""
    import json, os, traceback
    from pathlib import Path
    MODEL = os.environ.get("SMOKE_MODEL", "Qwen/Qwen2.5-0.5B-Instruct")
    ART = Path("/workspace/artifacts"); ART.mkdir(parents=True, exist_ok=True)
    import torch  # noqa
    from auto_round import AutoRound, AutoScheme

    def find_cfg(base):
        base = Path(base)
        if (base / "config.json").is_file(): return base
        for p in sorted(base.rglob("config.json")): return p.parent
        return None

    # Keep fused modules uniform so vLLM's QKVParallelLinear / MergedColumnParallelLinear see one scheme.
    SHARED = [["q_proj", "k_proj", "v_proj"], ["gate_proj", "up_proj"]]
    out = "/workspace/runs/autoscheme-smoke-shared-nvfp4mxfp8"
    result = {"model": MODEL, "shared_layers": SHARED}
    print(f"\n===== AutoScheme NVFP4+MXFP8 avg_bits=4.75 shared_layers={SHARED} =====", flush=True)
    d = None
    try:
        scheme = AutoScheme(avg_bits=4.75, options=("NVFP4", "MXFP8"), shared_layers=SHARED, nsamples=8)
        ar = AutoRound(model=MODEL, scheme=scheme, iters=0, nsamples=8, seqlen=512,
                       device_map=0, trust_remote_code=True, seed=42)
        _, saved = ar.quantize_and_save(output_dir=out, format="llm_compressor")
        cand = saved[0] if isinstance(saved, (list, tuple)) else saved
        d = find_cfg(cand) or find_cfg(out)
        c = json.loads((Path(d) / "config.json").read_text())
        qc = c.get("quantization_config") or {}
        result["export"] = "OK"; result["format"] = qc.get("format"); result["n_groups"] = len(qc.get("config_groups") or {})
        print("export OK ->", d, "format", result["format"], "n_groups", result["n_groups"], flush=True)
    except Exception as e:
        result["export"] = "ERROR"; result["export_error"] = repr(e)[:600]
        print("EXPORT ERROR:", repr(e)[:600], flush=True); traceback.print_exc()

    # END-TO-END: try to serve it on this SM120 card.
    if d is not None:
        print("\n===== vLLM load test on SM120 =====", flush=True)
        try:
            from vllm import LLM, SamplingParams
            llm = LLM(model=str(d), trust_remote_code=True, enforce_eager=True,
                      max_model_len=2048, gpu_memory_utilization=0.35, dtype="auto")
            txt = llm.generate(["The capital of France is"], SamplingParams(max_tokens=16, temperature=0))[0].outputs[0].text
            result["serve"] = "OK"; result["sample"] = txt
            print("SERVE OK ->", repr(txt), flush=True)
        except Exception as e:
            result["serve"] = "ERROR"; result["serve_error"] = repr(e)[:800]
            print("SERVE ERROR:", repr(e)[:800], flush=True); traceback.print_exc()

    (ART / "autoscheme-shared-smoke-result.json").write_text(json.dumps(result, indent=2, default=str))
    print("\n===== VERDICT =====", flush=True)
    print("shared_layers export:", result.get("export"), "| vLLM serve on SM120:", result.get("serve"), flush=True)
    print("END_TO_END_OK:", result.get("export") == "OK" and result.get("serve") == "OK", flush=True)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: muse-autoscheme-smoke-v4-20260812
  namespace: default
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: muse-autoscheme-smoke }
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      enableServiceLinks: false
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: smoke
          image: vllm/vllm-openai:v0.26.0
          command: ["/bin/bash", "/scripts/run.sh"]
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: scripts, mountPath: /scripts }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: muse-quant-workspace } }
        - { name: scripts, configMap: { name: muse-autoscheme-smoke-scripts } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 8Gi } }
