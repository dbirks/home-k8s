# On-policy coding-dataset regeneration through the ALREADY-SERVED Qwen3.8-27B (2026-08-22).
#
# VOLUME build for the eventual drafter: answers regenerated by qwen3.8-27b, on-policy for the
# quant people actually deploy. Unlike apps/qwen38-regen-20260815.yaml.hold, this job does NOT
# stand up its own vLLM — that would put a 3rd model on the node and risk a host-RAM overload that
# takes down serving (see MEMORY: always-on catalog real limit = 46GB host RAM). Instead it is a
# CPU-ONLY HTTP client that reuses the single served instance via the internal Envoy AI Gateway.
#
# Endpoint = internal serving gateway (no auth, model-name routed): EAG extracts the request-body
# `model` into x-ai-eg-model and routes qwen3.8-27b to the KServe LLMISVC. The served model is
# scale-to-zero (KEDA prometheus request-rate trigger, deploy qwen38-llm-kserve 0->1 on traffic),
# so the script first runs a WARMUP GATE: it POSTs tiny requests until it gets HTTP 200 (the traffic
# both triggers KEDA and probes readiness) before launching the 16 concurrent workers — otherwise
# the workers would all fail on cold-start 503/504.
#
# TRACE-LENGTH CAP: the served qwen3.8-27b runs --max-model-len=8192. vLLM strictly 400s when
# prompt_tokens + max_tokens > 8192 (verified), so --max-tokens is set to 6144 to leave ~2048 tokens
# of prompt headroom. That fits the vast majority of opc-python / typescript-instruct prompts;
# the rare longer-prompt rows 400 and are skipped. (The reference used max-model-len 12288 to keep
# max-tokens 8192; we cannot bump the live model's context without restarting serving.)
#
# Output -> dspark-dataset-hdd:/dataset/qwen38-onpolicy-v1 (resumable via --resume; restarts safe).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dspark-dataset-hdd
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path-hdd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen38-regen-onpolicy-20260822-script
  namespace: default
data:
  run.sh: |
    #!/bin/bash
    set -euo pipefail
    export HF_HOME=/data HF_HUB_ENABLE_HF_TRANSFER=1 TOKENIZERS_PARALLELISM=false
    (apt-get update -qq && apt-get install -y git --no-install-recommends -qq) 2>&1 | tail -1 || true
    pip install uv --quiet --root-user-action ignore
    export PATH="/root/.local/bin:$PATH"; hash -r
    git clone https://github.com/dbirks/speculators /tmp/spec
    git -C /tmp/spec checkout 188a7b37919211749404d420271f3fdbc14924a6
    SCRIPTS=/tmp/spec/scripts
    uv pip install /tmp/spec aiohttp datasets tqdm --system --quiet

    # Two endpoints. GW = the model-name AI gateway; used ONLY to wake the scale-to-zero model and
    # to keep KEDA from scaling it back to zero (a light keepalive ping below). ENG = the vLLM
    # engine's OWN OpenAI server, hit DIRECTLY for the real generation. Direct-to-engine avoids the
    # Envoy AI Gateway's per-request body buffering + OpenAI<->x translation + hardcoded 60s route
    # timeout, all of which 504'd/500'd large 6144-token batch responses and starved the 16 workers
    # down to ~9 in-flight. It also keeps regen OUT of the coworker-facing gateway path (serving is
    # priority). Single-replica model, so hitting the workload Service directly (no EPP) is correct.
    GW=http://envoy-default-llm-ai-gw-1404bca3.envoy-gateway-system.svc.cluster.local/v1/chat/completions
    # Repointed to the preserved vLLM engine: the default qwen3.8-27b is now NInfer, which the regen
    # must not use (its detokenize step needs vLLM-returned token_ids). See #100.
    ENG=http://qwen38-vllm-llm-kserve-workload-svc.default.svc.cluster.local:8000/v1/chat/completions
    MODEL=qwen3.8-27b-vllm
    DS=/dataset/qwen38-onpolicy-v1
    mkdir -p "$DS" /output/logs

    # The regen script uses --model for BOTH the request-body routing name AND a local
    # AutoTokenizer.from_pretrained() (review-only detokenize of returned token_ids). Route needs
    # `qwen3.8-27b`, but that's not an HF id. Fix: run from a workdir holding a symlink named
    # `qwen3.8-27b` -> the served model's own tokenizer files (read-only mount of its PVC). Then
    # from_pretrained("qwen3.8-27b") resolves the local dir, and the payload model still routes.
    WORK=/tmp/regen-work; mkdir -p "$WORK"
    ln -sfn /model-src/runs/Qwen3.6-27B-NVFP4-c1-screen/Qwen3.8-27B-nvfp-w4g16 "$WORK/$MODEL"
    cd "$WORK"

    # ---- cold-start warmup gate: wake the scale-to-zero qwen3.8 and wait for HTTP 200 ----
    # The traffic itself trips the KEDA request-rate trigger (deploy 0->1); warm compile cache ~2min.
    echo "=== [$(date)] warmup: waking $MODEL via gateway (deadline 1200s) ==="
    warm=0; start=$(date +%s)
    while [ $(( $(date +%s) - start )) -lt 1200 ]; do
        code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 -X POST "$GW" \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":4}" || echo 000)
        echo "[$(date)] warmup -> HTTP $code (elapsed $(( $(date +%s) - start ))s)"
        [ "$code" = "200" ] && { warm=1; echo "[$(date)] $MODEL warm"; break; }
        sleep 4
    done
    [ "$warm" = "1" ] || { echo "ERROR: warmup gate timed out; $MODEL never returned 200"; exit 1; }

    # ---- KEDA keepalive: hold the model at 1 replica while we hit the engine DIRECTLY ----
    # We bypass the gateway for real work, so the gateway's ext_proc request-rate metric (the KEDA
    # wake trigger) would fall to 0 and scale $MODEL to zero mid-batch, killing the engine endpoint.
    # A tiny 1-token ping every 15s keeps that metric well above the 0.001 activation threshold.
    ( while true; do
        curl -s -o /dev/null -m 15 -X POST "$GW" -H 'Content-Type: application/json' \
            -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}" || true
        sleep 15
      done ) &
    KEEPALIVE_PID=$!
    trap 'kill $KEEPALIVE_PID 2>/dev/null || true' EXIT
    echo "[$(date)] KEDA keepalive started (pid $KEEPALIVE_PID, pinging gateway every 15s)"

    # ---- on-policy regen (client-only, concurrency 16; hits the engine DIRECTLY) ----
    # max-tokens 6144 leaves ~2048 prompt headroom under the served model's 8192 context (see header).
    # --max-retries 3: retries now only cover rare genuine engine errors (a prompt+max_tokens>8192 row
    # deterministically 400s, so retrying it is wasted slots) instead of the old 60s-timeout 504 storm.
    echo "[$(date)] starting on-policy regen (concurrency 16, max-tokens 6144, direct-to-engine)"
    for spec in opc-python:25000 typescript-instruct:25000; do
        ds=${spec%%:*}; lim=${spec##*:}
        echo "=== [$(date)] regen $ds (limit $lim) ==="
        python3 "$SCRIPTS/response_regeneration/script.py" \
            --dataset "$ds" --limit "$lim" \
            --endpoint "$ENG" --model "$MODEL" \
            --max-tokens 6144 --concurrency 16 --max-retries 3 \
            --outfile "$DS/regen_${ds}.jsonl" --resume 2>&1 | tail -40
    done
    cat "$DS"/regen_*.jsonl > "$DS/all.jsonl" 2>/dev/null || true
    echo "[$(date)] qwen3.8 on-policy corpus rows: $(wc -l < "$DS/all.jsonl" 2>/dev/null || echo 0)"
    touch "$DS/regen.done"
    echo "=== [$(date)] Qwen3.8 on-policy regen complete ==="
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen38-regen-onpolicy-20260825
  namespace: default
spec:
  backoffLimit: 4
  # Was 172800 (48h), which killed the 2026-08-22 run mid-generation before the
  # ~50k-row target finished (early hours were slow pre-throughput-fix). 7 days
  # gives ample margin; --resume means the recreate continues from banked rows.
  activeDeadlineSeconds: 604800
  template:
    metadata:
      labels: { app: qwen38-regen-onpolicy }
    spec:
      restartPolicy: OnFailure
      # NO runtimeClassName: nvidia — this is a CPU-only HTTP client, it must not hold the GPU.
      enableServiceLinks: false
      containers:
        - name: regen
          # vLLM image only to satisfy the speculators package import chain (torch/transformers);
          # it is already cached on the node from serving. NO vllm serve is run here.
          image: vllm/vllm-openai:muse-glimmer-x86_64-cu130
          command: ["/bin/bash", "/scripts/run.sh"]
          env:
            - { name: HF_HOME, value: /data }
            - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } } }
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { cpu: "4", memory: 6Gi }
          volumeMounts:
            - { name: models, mountPath: /data }      # HF cache for `datasets` downloads
            - { name: dataset, mountPath: /dataset }   # regen output (resumable)
            - { name: output, mountPath: /output }     # logs
            - { name: scripts, mountPath: /scripts }
            - { name: model-src, mountPath: /model-src, readOnly: true }  # served model's tokenizer (RO)
      volumes:
        - { name: models, persistentVolumeClaim: { claimName: vllm-models } }
        - { name: dataset, persistentVolumeClaim: { claimName: dspark-dataset-hdd } }
        - { name: output, persistentVolumeClaim: { claimName: dspark-output-hdd-v2 } }
        - { name: scripts, configMap: { name: qwen38-regen-onpolicy-20260822-script, defaultMode: 0755 } }
        # Served model's PVC, read-only — only for its tokenizer files (detokenize). Same node (RWO ok).
        - { name: model-src, persistentVolumeClaim: { claimName: qwen38-quant-workspace, readOnly: true } }
