# GENERATED by office-map recon (recon.jobs.homek8s). recon Jobs (office-map issue #5): one Job per run. Jobs
# are immutable: a re-run gets a new name and the old block is dropped in the same commit (Flux prunes it). Never
# set ttlSecondsAfterFinished (Flux would recreate). GPU: RTX 5090 on talos-8me-tcy while inkling-2-mini-basalt
# is parked.
---
apiVersion: batch/v1
kind: Job
metadata: { name: recon-truck-t1-c, namespace: default, labels: { app: recon, recon/engine: t1 } }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 9000
  template:
    metadata: { labels: { app: recon, recon/engine: t1, recon/run: run_truck_t1_c } }
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector: { kubernetes.io/hostname: talos-8me-tcy }
      initContainers:
        - name: wait-prep
          image: python:3.13-slim@sha256:168d3a5d10f2152f8e8d77b6843ac82c22a846cfefeef7afdf9aa630404e82a7
          command: [sh, -c, "until [ -f /data/captures/cap_tnt_truck/view/.prep_version ]; do sleep 10; done"]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      containers:
        - name: run
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-devel@sha256:3d614dfd422b7e43647491cbf07d6acc516c032fc49c594a94afdebd52552fb9
          command: [bash, /scripts/run_engine.sh]
          env:
            - { name: RUN_ID, value: run_truck_t1_c }
            - { name: ENGINE, value: t1 }
            - { name: MODE, value: train }
            - { name: CAPTURE, value: cap_tnt_truck }
            - { name: STEPS, value: "7000" }
            - { name: TORCH_CUDA_ARCH_LIST, value: "12.0" }
            - { name: MAX_JOBS, value: "4" }
            - { name: IMAGE_REF, value: "pytorch/pytorch:2.7.1-cuda12.8-cudnn9-devel@sha256:3d614dfd422b7e43647491cbf07d6acc516c032fc49c594a94afdebd52552fb9" }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: "all" }
            - { name: VK_ICD_FILENAMES, value: /etc/vulkan/icd.d/nvidia_icd.json }
            - { name: WGPU_BACKEND, value: vulkan }
            - { name: HOME, value: /data/cache/recon/home }
          resources:
            requests: { cpu: "2", memory: 5Gi }
            limits: { memory: 12Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "10000" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: scripts, mountPath: /scripts }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: recon-data } }
        - { name: scripts, configMap: { name: recon-scripts } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }
