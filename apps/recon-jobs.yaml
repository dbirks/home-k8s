# CPU: fetch the public Tanks and Temples truck sample (CC BY 4.0, pre-posed COLMAP) and build the canonical
# capture (LLFF every-8th split; cameras rescaled to the real image size). Writes view/.prep_version = 2.
apiVersion: batch/v1
kind: Job
metadata: { name: recon-prep-truck-2, namespace: default, labels: { app: recon } }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata: { labels: { app: recon, recon/stage: prep } }
    spec:
      restartPolicy: Never
      nodeSelector: { kubernetes.io/hostname: talos-8me-tcy }
      containers:
        - name: prep
          image: python:3.13-slim@sha256:168d3a5d10f2152f8e8d77b6843ac82c22a846cfefeef7afdf9aa630404e82a7
          command: [bash, -ec, "python3 /scripts/fetch_hf.py nvs-bench/tanksandtemples truck /data/datasets/tnt/truck 8 && python3 /scripts/prep_capture.py /data/datasets/tnt/truck /data/captures/cap_tnt_truck cap_tnt_truck 8"]
          resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 2Gi } }
          volumeMounts: [{ name: data, mountPath: /data }, { name: scripts, mountPath: /scripts }]
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: recon-data } }
        - { name: scripts, configMap: { name: recon-scripts } }
