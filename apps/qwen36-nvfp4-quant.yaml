# Qwen/Qwen3.6-27B -> AutoRound NVFP4 (W4A4) -> compressed-tensors, for vLLM on SM120.
#
# GOAL (see home-k8s #87): a leaner-than-kaitchup NVFP4 quant. Hypothesis under test — the 48
# GatedDeltaNet linear-attn layers' large projections (in_proj_qkv/in_proj_z/out_proj, ~5.54B
# params) CAN tolerate NVFP4 W4A4 if the two tiny recurrence-control projections (in_proj_a,
# in_proj_b, ~24M params) stay BF16. kaitchup keeps ALL linear-attn BF16 (28.55GB); we target
# ~20.6GB by quantizing the big-3 and protecting only a/b + mtp. Vision tower stays BF16 via
# quant_nontext_module=False. lm_head NOT quantized (separate experiment). W4A4 = native Blackwell
# FP4 path. One variable at a time: layer-policy first (Pile calib, only delta vs kaitchup), then
# calibration composition (identical model, code/general mix).
#
# Proven pattern: apps/muse-quant.yaml completed a plain-NVFP4 default-mode 30B quant on this exact
# 48GB-host-RAM / 96GB-VRAM node within a 40Gi container limit. Swap is OFF, so a RAM overrun is a
# clean container OOM-kill (137), NOT a node hang.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen36-quant-workspace
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path   # NVMe (/var/lib/local-path-provisioner); thin — only used bytes count
  resources:
    requests:
      storage: 260Gi             # ~55GB BF16 base + HF cache + several ~20GB NVFP4 outputs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen36-quant-scripts
  namespace: default
data:
  prep.sh: |
    #!/bin/bash
    # Install the quant toolchain into the vLLM image, then run a stage. torch is left ALONE
    # (auto-round requires torch unpinned -> pip sees the image's SM120 build as satisfied).
    set -euo pipefail
    PY="$(command -v python3 || command -v python)"
    export HF_HOME=/workspace/hf
    export PYTHONUNBUFFERED=1
    export TOKENIZERS_PARALLELISM=false
    mkdir -p /workspace/artifacts /workspace/runs "$HF_HOME"
    echo "=== [$(date)] python=$PY torch BEFORE install ==="
    "$PY" -c "import torch;print('torch',torch.__version__,'cuda?',torch.cuda.is_available())" || true
    echo "=== [$(date)] ensuring git (auto-round build invokes it) ==="
    if ! command -v git >/dev/null 2>&1; then
      (apt-get update -qq && apt-get install -y -qq git) >/dev/null 2>&1 || true
    fi
    if command -v git >/dev/null 2>&1; then
      AR_SPEC="auto-round @ git+https://github.com/dbirks/auto-round.git@main"
    else
      echo "WARN: git unavailable; falling back to PyPI auto-round wheel"
      AR_SPEC="auto-round"
    fi
    echo "=== [$(date)] installing ${AR_SPEC} + deps ==="
    "$PY" -m pip install --no-cache-dir "$AR_SPEC" datasets accelerate 2>&1 | tail -15
    # Qwen3.6 (hybrid GatedDeltaNet) may be newer than the image's pinned transformers -> install
    # from source so the arch + linear-attn module names are known.
    echo "=== [$(date)] installing transformers from source ==="
    "$PY" -m pip install --no-cache-dir --upgrade "git+https://github.com/huggingface/transformers.git" 2>&1 | tail -8
    "$PY" -c "import transformers; print('transformers', transformers.__version__)"
    echo "=== [$(date)] torch AFTER install (must still import) ==="
    "$PY" -c "import torch;print('torch',torch.__version__,'cuda?',torch.cuda.is_available())" || true
    "$PY" -m pip freeze 2>/dev/null > /workspace/artifacts/pip-freeze-qwen36.txt || true
    STAGE="${1:-smoke}"
    echo "=== [$(date)] running stage: ${STAGE} ==="
    case "${STAGE}" in
      smoke)   export QUANT_MODE=smoke;  "$PY" /scripts/quantize.py ;;
      screen)  export QUANT_MODE=screen; "$PY" /scripts/quantize.py ;;
      best)    export QUANT_MODE=best;   "$PY" /scripts/quantize.py ;;
      inventory) "$PY" /scripts/inventory.py ;;
      *) echo "unknown stage ${STAGE}"; exit 2 ;;
    esac
    echo "=== [$(date)] stage ${STAGE} complete ==="
  inventory.py: |
    #!/usr/bin/env python3
    """Meta-device Linear inventory for Qwen3.6-27B — confirms exact module names so our
    ignore substrings (in_proj_a/in_proj_b/mtp) hit the right tensors. No weights/GPU/RAM."""
    import json, os
    from pathlib import Path
    MODEL = os.environ.get("QUANT_MODEL", "Qwen/Qwen3.6-27B")
    ART = Path("/workspace/artifacts"); ART.mkdir(parents=True, exist_ok=True)
    import torch, transformers as tf
    from accelerate import init_empty_weights
    from transformers import AutoConfig
    cfg = AutoConfig.from_pretrained(MODEL, trust_remote_code=True)
    tc = getattr(cfg, "text_config", cfg)
    print("model_type:", getattr(cfg, "model_type", None), "layers:", getattr(tc, "num_hidden_layers", None),
          "layer_types?", hasattr(tc, "layer_types"), flush=True)
    model = None
    for n in ["AutoModelForImageTextToText","AutoModelForVision2Seq","AutoModelForCausalLM"]:
        if hasattr(tf, n):
            try:
                with init_empty_weights():
                    model = getattr(tf, n).from_config(cfg, trust_remote_code=True)
                print("loaded via", n, flush=True); break
            except Exception as e:
                print(n, "failed:", repr(e)[:150], flush=True)
    rows = []; hit = {"in_proj_a":0,"in_proj_b":0,"mtp":0,"in_proj_qkv":0,"in_proj_z":0,"out_proj":0,"visual":0}
    for name, m in model.named_modules():
        if isinstance(m, torch.nn.Linear):
            rows.append(f"{name}\t{m.in_features}\t{m.out_features}")
            for k in hit:
                if k in name: hit[k] += 1
    (ART/"qwen36-linear-inventory.tsv").write_text("name\tin\tout\n"+"\n".join(rows)+"\n")
    print("linear count:", len(rows), flush=True)
    print("substring hits:", json.dumps(hit), flush=True)
  quantize.py: |
    #!/usr/bin/env python3
    """AutoRound NVFP4 (W4A4) quant of Qwen3.6-27B -> llm_compressor/compressed-tensors.
    Policy via env: IGNORE_LAYERS (fp_layers, kept BF16), CALIB_DATASET, ENABLE_ALG_EXT.
    QUANT_MODE in {smoke,screen,best}."""
    import importlib, inspect, json, os
    from pathlib import Path

    MODEL  = os.environ.get("QUANT_MODEL", "Qwen/Qwen3.6-27B")
    MODE   = os.environ.get("QUANT_MODE", "smoke")
    SCHEME = os.environ.get("QUANT_SCHEME", "NVFP4")
    RUN_TAG = os.environ.get("RUN_TAG", "")
    CALIB  = os.environ.get("CALIB_DATASET", "NeelNanda/pile-10k")
    IGNORE = os.environ.get("IGNORE_LAYERS", "").strip()
    ALGEXT = os.environ.get("ENABLE_ALG_EXT", "").strip() in ("1","true","True","yes")
    ART    = Path("/workspace/artifacts")
    OUT    = Path(os.environ.get("QUANT_OUT", f"/workspace/runs/Qwen3.6-27B-{SCHEME}{RUN_TAG}-{MODE}"))
    ART.mkdir(parents=True, exist_ok=True); OUT.mkdir(parents=True, exist_ok=True)

    # low_gpu_mem_usage=False everywhere: we have 96GB VRAM and only ~48GB host RAM, so keep weights
    # on the GPU and spare the host (also the reviewer's call — low_gpu trades VRAM for tuning time).
    MODES = {
        "smoke":  dict(nsamples=8,   seqlen=512,  batch_size=1, iters=0,    low_gpu_mem_usage=False),
        "screen": dict(nsamples=128, seqlen=2048, batch_size=4, iters=200,  low_gpu_mem_usage=False),
        "best":   dict(nsamples=512, seqlen=2048, batch_size=4, iters=1000, low_gpu_mem_usage=False),
    }
    if MODE not in MODES: raise SystemExit(f"bad QUANT_MODE={MODE}")
    P = MODES[MODE]
    print(f"=== quantize SCHEME={SCHEME} MODE={MODE} ignore={IGNORE!r} alg_ext={ALGEXT} "
          f"calib={CALIB!r} params={P} model={MODEL} -> {OUT} ===", flush=True)

    import torch  # noqa
    from auto_round import AutoRound
    from transformers import AutoConfig
    cfg = AutoConfig.from_pretrained(MODEL, trust_remote_code=True)
    print("model_type:", getattr(cfg, "model_type", None), "arch:", getattr(cfg, "architectures", None), flush=True)

    _sig = set(inspect.signature(AutoRound).parameters)
    print("AutoRound has fp_layers?", "fp_layers" in _sig, " layer_config?", "layer_config" in _sig,
          " enable_alg_ext?", "enable_alg_ext" in _sig, flush=True)

    # This fork's AutoRound (0.15.0) has NO fp_layers kwarg. Build a precise BF16 layer_config from
    # the ACTUAL meta-device module names (no weights/GPU/RAM). Substring layer_config keys risk
    # silently matching 0 modules -> would quantize in_proj_a/b (the exact failure we're guarding
    # against), so resolve to exact names and HARD-ABORT if any substring matches nothing.
    layer_config = {}
    if IGNORE:
        subs = [s.strip() for s in IGNORE.split(",") if s.strip()]
        import transformers as _tf, torch as _t
        from accelerate import init_empty_weights
        _mdl = None
        for _n in ["AutoModelForImageTextToText","AutoModelForVision2Seq","AutoModelForCausalLM"]:
            if hasattr(_tf, _n):
                try:
                    with init_empty_weights():
                        _mdl = getattr(_tf, _n).from_config(cfg, trust_remote_code=True)
                    print("meta model via", _n, flush=True); break
                except Exception as _e:
                    print(_n, "meta failed:", repr(_e)[:140], flush=True)
        if _mdl is None: raise SystemExit("cannot build meta model to resolve IGNORE names")
        _lin = [nm for nm, m in _mdl.named_modules() if isinstance(m, _t.nn.Linear)]
        print(f"total Linear modules: {len(_lin)}", flush=True)
        for nm in _lin:
            if any(s in nm for s in subs):
                layer_config[nm] = {"bits": 16, "act_bits": 16}
        hits = {s: sum(1 for nm in layer_config if s in nm) for s in subs}
        print(f"IGNORE subs={subs} -> {len(layer_config)} BF16 modules; per-sub hits={hits}", flush=True)
        (ART / f"ignore-map-{SCHEME}{RUN_TAG}-{MODE}.json").write_text(json.dumps(sorted(layer_config), indent=1))
        # a/b are the whole point (protect the GDN recurrence terms) -> REQUIRED. mtp may be absent
        # from this load path (not surfaced as Linear) -> warn, don't abort.
        _required = {"in_proj_a", "in_proj_b"}
        _missing_req = [s for s in subs if s in _required and hits.get(s, 0) == 0]
        if _missing_req:
            raise SystemExit(f"REQUIRED ignore sub matched 0 modules: {_missing_req} (hits={hits}) — aborting")
        _zero = [s for s in subs if hits.get(s, 0) == 0]
        if _zero:
            print(f"NOTE: ignore subs matched 0 modules (absent from load path, ok): {_zero}", flush=True)
        del _mdl

    def make(**extra):
        kw = dict(scheme=SCHEME, dataset=CALIB, device_map=0, trust_remote_code=True,
                  quant_nontext_module=False, seed=42, **P, **extra)
        if layer_config:
            kw["layer_config"] = layer_config
        return AutoRound(MODEL, **kw)

    try:
        ar = make()
    except SystemExit:
        raise
    except Exception as e:
        print("AutoRound init failed; trying MLLM template registration:", repr(e)[:400], flush=True)
        reg = procs = None
        for tmod, pmod in [("auto_round.mllm.template", "auto_round.mllm.processor"),
                           ("auto_round.compressors.mllm.template", "auto_round.compressors.mllm.processor")]:
            try:
                reg = importlib.import_module(tmod)._register_template
                procs = importlib.import_module(pmod).PROCESSORS
                break
            except Exception:
                continue
        if reg is None: raise
        reg(model_type=cfg.model_type, default_dataset=CALIB, processor=procs["hf"])
        print("registered MLLM template for", cfg.model_type, flush=True)
        ar = make()

    _, saved = ar.quantize_and_save(output_dir=str(OUT), format="llm_compressor")
    print("Saved:", saved, flush=True)

    def _find_cfg(base):
        base = Path(base)
        if (base / "config.json").is_file(): return base
        for p in sorted(base.rglob("config.json")): return p.parent
        return None
    cand = saved[0] if isinstance(saved, (list, tuple)) else saved
    SAVED = (_find_cfg(cand) if cand else None) or _find_cfg(OUT)
    if SAVED is None: raise SystemExit(f"FATAL: no config.json under {cand!r} or {OUT}")
    print("resolved artifact dir:", SAVED, flush=True)
    (ART / f"artifact-path-{SCHEME}{RUN_TAG}-{MODE}.txt").write_text(str(SAVED) + "\n")

    # size report
    import os as _os
    total = 0
    for p in SAVED.rglob("*.safetensors"):
        total += p.stat().st_size
    gb = total / 1e9
    print(f"OUTPUT SIZE: {gb:.2f} GB ({total} bytes) across safetensors", flush=True)
    (ART / f"size-{SCHEME}{RUN_TAG}-{MODE}.txt").write_text(f"{gb:.2f} GB\n")

    c = json.loads((SAVED / "config.json").read_text())
    qc = c.get("quantization_config") or c.get("text_config", {}).get("quantization_config")
    (ART / f"quant-config-{SCHEME}{RUN_TAG}-{MODE}.json").write_text(json.dumps(qc, indent=2, default=str))
    fmt = (qc or {}).get("format")
    wbits = (((qc or {}).get("config_groups", {}).get("group_0", {}) or {}).get("weights", {}) or {}).get("num_bits")
    print(f"format={fmt} weight_bits={wbits}", flush=True)
    _ign = (qc or {}).get("ignore") or []
    _ab = [x for x in _ign if ("in_proj_a" in x or "in_proj_b" in x)]
    _mtp = [x for x in _ign if "mtp" in x]
    print(f"exported ignore: {len(_ign)} entries; in_proj_a/b={len(_ab)} mtp={len(_mtp)}; sample_ab={_ab[:2]}", flush=True)
    if IGNORE and "in_proj_a" in IGNORE and len(_ab) == 0:
        print("WARN: expected in_proj_a/b in exported ignore but found none — verify layer_config took effect", flush=True)
    if not qc or wbits != 4:
        raise SystemExit(f"FATAL: expected 4-bit weights, got num_bits={wbits} (format {fmt})")
    print(f"OK [{SCHEME}{RUN_TAG}/{MODE}]: {fmt} verified at {SAVED} ({gb:.2f} GB)", flush=True)

    # HF config-parser wants config_groups.*.format to be a string
    try:
        _cp = SAVED / "config.json"; _cc = json.loads(_cp.read_text())
        _q = _cc.get("quantization_config") or (_cc.get("text_config") or {}).get("quantization_config") or {}
        _top = _q.get("format"); _patched = False
        for _g in (_q.get("config_groups") or {}).values():
            if _g.get("format") in (None, ""): _g["format"] = _top; _patched = True
        if _patched: _cp.write_text(json.dumps(_cc, indent=2)); print(f"post-fix format -> {_top}", flush=True)
    except Exception as _e:
        print("post-fix skipped:", repr(_e), flush=True)
---
# STAGE 1 — smoke + inventory: validate the NEW model loads, ignore-substrings hit the right
# modules, export is nvfp4-pack-quantized, and the size lands ~20.6GB. iters=0 (RTN) so it's fast.
# HF_HOME on the PVC so the ~55GB BF16 base downloads ONCE and best-mode reuses it.
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen36-nvfp4-c1-smoke-v3-20260813
  namespace: default
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600   # up to 6h (mostly the 55GB download)
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      enableServiceLinks: false
      priorityClassName: system-node-critical
      containers:
        - name: quantize
          image: vllm/vllm-openai:muse-glimmer-x86_64-cu130   # torch targets SM120; serves NVFP4 on this card
          command: ["/bin/bash", "/scripts/prep.sh", "smoke"]
          env:
            - { name: HF_HOME, value: /workspace/hf }
            - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } } }
            - { name: QUANT_MODEL, value: "Qwen/Qwen3.6-27B" }
            - { name: QUANT_SCHEME, value: "NVFP4" }
            - { name: RUN_TAG, value: "-c1" }
            - { name: IGNORE_LAYERS, value: "in_proj_a,in_proj_b,mtp" }
            - { name: CALIB_DATASET, value: "NeelNanda/pile-10k" }
          resources:
            limits: { nvidia.com/gpu: 1, cpu: "8", memory: 42Gi }
            requests: { cpu: "4", memory: 24Gi }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: scripts, mountPath: /scripts }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: qwen36-quant-workspace } }
        - { name: scripts, configMap: { name: qwen36-quant-scripts, defaultMode: 0755 } }
