# Basalt's Inkling 2 Mini pack (jesdga/Inkling-2-Mini-Basalt, Inkling-2-Mini-NVFP4-q8.basalt, 19.7 GB, Apache-2.0
# weights) on the eGPU laptop's NVMe (talos-8me-tcy), for apps/inkling2-mini-basalt.yaml. Own file so holding the
# engine never prunes the PVC. The Job pulls straight from Hugging Face (public, no token) with the hf CLI's parallel xet
# backend (one curl connection was ~2-6 MB/s), and checks the LFS sha256; a .verified marker makes re-runs a no-op.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inkling2-mini-basalt-pack
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 25Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inkling2-mini-basalt-pack-xet
  namespace: default
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      nodeSelector: { home-k8s/egpu: rtx5090 }
      containers:
        - name: download
          image: python:3.12-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              cd /models
              F=Inkling-2-Mini-NVFP4-q8.basalt
              SUM=f7b4e5f8e17681c4735a7dfc51ffd8e805c44184fad4e1778b13187d79dc3787
              if [ -f .verified ]; then echo "already verified"; exit 0; fi
              # a single HTTP connection to the HF CDN tops out ~2-6 MB/s; xet fetches chunks in parallel
              pip install --no-cache-dir -q "huggingface_hub[hf_xet]==0.35.3"
              rm -f "$F"
              HF_XET_HIGH_PERFORMANCE=1 hf download jesdga/Inkling-2-Mini-Basalt "$F" --local-dir /models
              echo "$SUM  $F" | sha256sum -c -
              rm -rf /models/.cache
              touch .verified && echo verified && ls -l
          env:
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: pack, mountPath: /models }
      volumes:
        - name: pack
          persistentVolumeClaim: { claimName: inkling2-mini-basalt-pack }
