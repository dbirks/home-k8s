    # Qwen3.8-27B-NVFP4-AutoRound

    > **NVFP4 (4-bit W4A4) quantization of [`Qwen/Qwen3.8-27B`](https://huggingface.co/Qwen/Qwen3.8-27B),
    > produced with [Intel AutoRound](https://github.com/intel/auto-round) and packaged in
    > [compressed-tensors](https://github.com/neuralmagic/compressed-tensors) for vLLM on NVIDIA Blackwell (FP4 tensor cores).**
    > Text-only quant: the language decoder's high-volume projections are NVFP4; the GatedDeltaNet
    > recurrence-control projections, the vision tower, the MTP head, and `lm_head` stay BF16.
    > **~20.6 GB on disk** (vs ~52 GB BF16).

    > ⚠️ **Reasoning caveat — read before choosing this variant.** W4A4 (quantized *activations*) noticeably
    > degrades multi-step generative reasoning on this hybrid architecture (math especially). If you want
    > **near-lossless accuracy**, use the weight-only sibling **[`Qwen3.8-27B-W4A16-AutoRound`](https://huggingface.co/dbirks/Qwen3.8-27B-W4A16-AutoRound)**
    > (int4 weights, BF16 activations). This NVFP4 variant is for **maximum throughput on Blackwell FP4 tensor cores**
    > where you accept some reasoning-accuracy cost. See the Evaluation section.

    ## Model overview
    - **Base model:** [`Qwen/Qwen3.8-27B`](https://huggingface.co/Qwen/Qwen3.8-27B) — a hybrid **GatedDeltaNet (linear-attention) + full-attention** multimodal decoder (64 layers: 48 linear-attn + 16 full-attn) with a vision tower; 262K context.
    - **Quantization:** NVFP4 (W4A4) on the language-decoder `Linear` layers, **except** the two tiny per-layer recurrence-control projections (`in_proj_a`, `in_proj_b`) which stay BF16.
    - **Kept BF16:** `linear_attn.in_proj_a` / `in_proj_b` (GDN decay/write-strength — quantizing these wrecks the recurrence), the entire `visual.*` vision tower, the `mtp` head, and `lm_head`.
    - **Format:** compressed-tensors (`nvfp4-pack-quantized`), auto-detected by vLLM.
    - **Quantizer:** Intel AutoRound (arXiv:2309.05516), SignRound block reconstruction.

    ## Quantization recipe
    - **Scheme:** `NVFP4` — 4-bit weights + input activations, NVFP4 microscale (group size 16, FP8 `e4m3` block scale + FP32 global), symmetric, `strategy: tensor_group`.
    - **Quantized:** the 48 GatedDeltaNet layers' `in_proj_qkv` / `in_proj_z` / `out_proj` + all MLP `gate/up/down` + the 16 full-attention layers' `q/k/v/o` projections.
    - **Kept BF16:** `in_proj_a`, `in_proj_b`, `visual.*`, `mtp`, `lm_head`.
    - **Calibration:** `NeelNanda/pile-10k`, 128 samples, seqlen 2048, 200 tuning iters (screen recipe).
    - **Hardware:** single NVIDIA RTX PRO 6000 Blackwell 96 GB (SM120); peak ~42 GB VRAM, ~13.6 GB host RAM.

    ## Deployment (vLLM)
    vLLM auto-detects the NVFP4 scheme from `config.json` — no quantization flag needed. Serves as
    `Qwen3_5ForConditionalGeneration`. On consumer Blackwell (SM120) use FP4 tensor-core kernels:
    ```bash
    VLLM_ATTENTION_BACKEND=FLASHINFER FLASHINFER_CUDA_ARCH_LIST=12.0f \
    vllm serve dbirks/Qwen3.8-27B-NVFP4-AutoRound --max-model-len 8192 --trust-remote-code
    ```

    ## Evaluation
    _Recovery numbers are being added — see the effort log at home-k8s #84. Preliminary read (from the
    architecturally-identical Qwen3.6-27B): W4A16 matches BF16 on coding and preserves reasoning; **W4A4
    (this variant) preserves simple-task accuracy but degrades generative math/coding** — prefer the W4A16
    sibling for reasoning-heavy use._

    ## Limitations
    - **W4A4 activation quantization degrades multi-step generative reasoning** (math worst). Use the W4A16 sibling if accuracy matters more than FP4 throughput.
    - NVFP4 requires **NVIDIA Blackwell (SM100/SM120)** FP4 tensor cores; no speedup on Ada/Hopper (falls back to Marlin, ~2× slower).
    - Only the language decoder is quantized — vision tower is BF16 (intentional; vLLM requires it).

    ## Reproducibility
    ```python
    from auto_round import AutoRound
    # keep in_proj_a/b + visual + mtp in BF16 via a bits=16 layer_config (built from module names)
    ar = AutoRound("Qwen/Qwen3.8-27B", scheme="NVFP4", dataset="NeelNanda/pile-10k",
                   nsamples=128, seqlen=2048, batch_size=4, iters=200,
                   device_map=0, trust_remote_code=True, quant_nontext_module=False, seed=42,
                   layer_config=BF16_FOR_IN_PROJ_AB_VISUAL_MTP)
    ar.quantize_and_save(output_dir="Qwen3.8-27B-NVFP4-AutoRound", format="llm_compressor")
    ```
    Toolchain: auto-round 0.15.0, transformers-from-source (qwen3_5 arch), compressed-tensors, torch 2.13+cu130.
    Full effort log: home-k8s #84 (+ #87 for the Qwen3.6 recipe this is based on).

    ## Citation
    ```bibtex
    @article{cheng2023optimize, title={Optimize Weight Rounding via Signed Gradient Descent for the Quantization of LLMs}, author={Cheng, Wenhua and others}, journal={arXiv:2309.05516}, year={2023}}
    ```
  upload.py: |
    #!/usr/bin/env python3
    """Create a PUBLIC HF repo and upload the AutoRound artifact + model card."""
    import os, shutil
    from huggingface_hub import HfApi
    TOKEN = os.environ["HF_TOKEN"]
    REPO = os.environ["HF_REPO"]
    MODEL_DIR = os.environ["MODEL_DIR"]
    PRIVATE = os.environ.get("PRIVATE", "false").lower() in ("1","true","yes")
    api = HfApi(token=TOKEN)
    print(f"account={api.whoami().get('name')} repo={REPO} private={PRIVATE}", flush=True)
    src = "/scripts/README.md"
    if os.path.isfile(src):
        shutil.copy(src, os.path.join(MODEL_DIR, "README.md")); print("staged README.md", flush=True)
    api.create_repo(REPO, repo_type="model", private=PRIVATE, exist_ok=True)
    print(f"repo ready private={PRIVATE}; uploading {MODEL_DIR} ...", flush=True)
    try:
        api.upload_large_folder(repo_id=REPO, folder_path=MODEL_DIR, repo_type="model")
    except (AttributeError, TypeError) as e:
        print("fallback upload_folder:", repr(e), flush=True)
        api.upload_folder(repo_id=REPO, folder_path=MODEL_DIR, repo_type="model", commit_message="AutoRound NVFP4 (W4A4) + model card")
    info = api.model_info(REPO)
    print(f"UPLOAD DONE: https://huggingface.co/{REPO}  private={info.private}  files={len(info.siblings)}", flush=True)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen38-nvfp4-upload-20260815
  namespace: default
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: upload
          image: python:3.12-slim
          command: ["/bin/sh","-c","pip install --no-cache-dir -q huggingface_hub hf_transfer && HF_HUB_ENABLE_HF_TRANSFER=1 python3 /scripts/upload.py"]
          env:
            - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-write-token, key: HF_TOKEN } } }
            - { name: HF_REPO, value: "dbirks/Qwen3.8-27B-NVFP4-AutoRound" }
            - { name: PRIVATE, value: "false" }
            - { name: MODEL_DIR, value: "/workspace/runs/Qwen3.6-27B-NVFP4-c1-screen/Qwen3.8-27B-nvfp-w4g16" }
            - { name: HF_HOME, value: "/workspace/hf" }
          resources:
            requests: { cpu: "2", memory: 3Gi }
            limits: { cpu: "4", memory: 8Gi }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: scripts, mountPath: /scripts }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: qwen38-quant-workspace } }
        - { name: scripts, configMap: { name: qwen38-upload-scripts, defaultMode: 0755 } }
