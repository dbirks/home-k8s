# Qwen3.8-Flash-Next NVFP4 single-GPU serving on the RTX PRO 6000 (SM120), via the primitive-ai
# INT4-PLE mmap overlay. WORKING config (issue #112 solved 2026-08-28). Debug scaffolding removed.
#
# The n-gram PLE table (128 INT4 shards, 30GB on this local-path NVMe PVC) is mmap'd OFF-GPU; only
# ~84GB of weights live in VRAM. Owns the whole card — the rest of the catalog must be at 0.
#
# Two fixes that made it serve (see #112): (1) the model index still referenced the 43 ple-bf16-*
# files we excluded at download -> the offload child's loader raised a swallowed FileNotFoundError;
# an idempotent startup step drops those refs (ngram data comes from the INT4 quant dir; PLE scales
# live in the present carry-model-bf16 files). (2) the GPU worker <-> PLE-offload worker registration
# exchanges a CUDA IPC handle, which HAMi's libvgpu won't proxy between two procs on one vGPU ->
# CUDA_DISABLE_CONTROL=true makes libvgpu pass through so CUDA IPC works.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashnext
  namespace: default
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: flashnext }
  template:
    metadata:
      labels: { app: flashnext }
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false
      containers:
        - name: vllm
          # APC candidate A (home-k8s #115): prod sm120 overlay + reviewed hybrid-align prefix-cache
          # patches vLLM #53798 + #54076 hunks 1-2 (dbirks/vllm branch flashnext-apc; see
          # docker/flashnext-apc/PATCHES.md). TRIAL SWITCH to validate prefix_cache_hits live.
          # Known-good rollback digest: sm120@sha256:f7186f70baf43061c042dfc8e9b296b75476f287b7c8d8394a7d2e287ed61e82
          image: ghcr.io/dbirks/vllm-flashnext:apc-a@sha256:af30a6daa5ffe6964a5ced5a1de0fdb2ad72587751a7a572cb242871f47ea356
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              # Overlay files are baked into the image now — only the data-side index-fix remains.
              # Drop the phantom ple-bf16 refs from the index (idempotent) — INT4 overlay provides the
              # ngram data; PLE scales live in the present carry-model-bf16 files. (#112 root cause #1)
              python3 - <<'PYIDX'
              import json
              p = "/data/mixed-nvfp4-fp8/model.safetensors.index.json"
              d = json.load(open(p)); wm = d["weight_map"]; n0 = len(wm)
              d["weight_map"] = {k: v for k, v in wm.items() if "ple-bf16" not in v}
              removed = n0 - len(d["weight_map"])
              if removed:
                  json.dump(d, open(p, "w")); print(f"[flashnext] index-fix: removed {removed} ple-bf16 refs")
              else:
                  print("[flashnext] index-fix: already clean")
              PYIDX
              echo "[flashnext] starting server"
              exec python3 -m vllm.entrypoints.openai.api_server \
                --model=/data/mixed-nvfp4-fp8 \
                --served-model-name=qwen3.8-flash-next \
                --host=0.0.0.0 --port=8000 \
                --distributed-executor-backend=mp \
                --gpu-memory-utilization=0.92 \
                --max-model-len=262144 \
                --no-enable-flashinfer-autotune \
                -cc.cudagraph_mode=PIECEWISE \
                --enable-auto-tool-choice \
                --tool-call-parser=qwen3_coder \
                --reasoning-parser=qwen3
          env:
            - { name: VLLM_PLE_QUANT_DIR, value: /data/ple-quant/ples_nvfp4 }  # NVFP4 g16 e2m1 mmap PLE (#112): ~27GB vs int4 30GB, less host-RAM/page-cache pressure. Rollback: /data/ple-quant/ples_int4
            - { name: VLLM_PLE_CPU_OFFLOAD, value: "1" }
            - { name: VLLM_PLE_OFFLOAD_READY_TIMEOUT, value: "900" }
            - { name: VLLM_WORKER_MULTIPROC_METHOD, value: spawn }         # #112: clean CUDA init in offload child
            - { name: VLLM_GDN_DECODE_KERNEL, value: triton }              # GDN FP8 layers require triton
            - { name: MAX_JOBS, value: "1" }                               # cap NVFP4 JIT nvcc RAM spike ~8GB
            - { name: CUDA_DISABLE_CONTROL, value: "true" }                # #112: HAMi passthrough so CUDA IPC works
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: VLLM_CACHE_ROOT, value: /data/.vllm_cache }
            - { name: HOME, value: /data/.home }
          ports:
            - { name: http, containerPort: 8000 }
          resources:
            requests: { cpu: "6", memory: 16Gi }
            limits: { nvidia.com/gpu: 1, nvidia.com/gpumem: 97800, memory: 44Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 150       # ~78GB weight load + INT4 PLE + PIECEWISE graph capture
            periodSeconds: 15
            failureThreshold: 60
          volumeMounts:
            - { name: models, mountPath: /data }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - { name: models, persistentVolumeClaim: { claimName: flashnext-models } }
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: flashnext
  namespace: default
spec:
  selector: { app: flashnext }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
# ============================================================================================
# GATEWAY WIRING (on-demand catalog member) — reachable at https://llm.birks.dev/v1 as model
# `qwen3.8-flash-next`, same NInfer/AIServiceBackend pattern (apps/ninfer-standalone.yaml, #105).
# Backend(FQDN) -> AIServiceBackend(OpenAI) -> a rule on the llm-model-router AIGatewayRoute
# (apps/llm-ai-gateway.yaml, appended AFTER the ninfer rule = rule index 7). Auth inherited from
# the /v1 vllm-apikey-auth SecurityPolicy. Scale-to-zero via KEDA on that rule's ext_proc metric.
#
# CO-RESIDENCE (one card): flashnext requests the WHOLE card (gpumem 97800), so HAMi will NOT
# schedule it while any other model holds VRAM (and vice versa) — safe PASSIVE mutual exclusion,
# no OOM. With the regen job stopped (parked .hold), nothing pins qwen3.8-27b, so all models idle
# to 0 when unused and whichever is requested cold-starts on the free card. A request to flashnext
# while another model is still resident stays Pending until that model idles (~2min cooldown), then
# schedules — "hit whatever, it brings up". flashnext cold start is ~5min (weight load + PLE + graph
# capture), so the first request after idle needs a patient client / retry.
# ============================================================================================
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: flashnext-backend
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: flashnext.default.svc.cluster.local
        port: 8000
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: flashnext-backend
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: flashnext-backend
---
# Scale-to-zero: wake on the llm-model-router per-rule ext_proc for the flashnext rule. flashnext is
# appended AFTER ninfer (rule 6) -> rule index 7. VERIFY the index after applying the route edit:
#   kubectl -n envoy-gateway-system exec <llm-ai-gw envoy pod> -c envoy -- \
#     curl -s localhost:19001/stats/prometheus | grep llm_model_router_rule_ | grep streams_started
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: flashnext
  namespace: default
spec:
  scaleTargetRef:
    name: flashnext
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 15
  cooldownPeriod: 600          # 10-min warm stopgap (home-k8s #104); flashnext cold start is slow anyway
  triggers:
    - type: prometheus
      name: flashnext-aigw-extproc-rate
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        query: 'sum(rate(envoy_cluster_cluster_httproute_default_llm_model_router_rule_7ext_proc_streams_started{job="envoy-gw"}[1m]))'
        threshold: "5"
        activationThreshold: "0.001"
