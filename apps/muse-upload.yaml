    # Muse-Glimmer-30B-NVFP4-AutoRound

    > **NVFP4 (4-bit) quantization of [`meta-models/Muse-Glimmer-30B`](https://huggingface.co/meta-models/Muse-Glimmer-30B),
    > produced with [Intel AutoRound](https://github.com/intel/auto-round) and packaged in
    > [compressed-tensors](https://github.com/neuralmagic/compressed-tensors) for vLLM on NVIDIA Blackwell (FP4 tensor cores).**
    > Text-only quant: the transformer decoder is NVFP4 W4A4; the vision tower and `lm_head` stay BF16.
    > ~21.8 GB on disk (vs ~60 GB BF16).

    ## Model overview
    - **Base model:** [`meta-models/Muse-Glimmer-30B`](https://huggingface.co/meta-models/Muse-Glimmer-30B) — a dense (Gemma2-derived) multimodal decoder + vision tower.
    - **Quantization:** NVFP4 (W4A4) on the text-decoder `Linear` layers; vision tower / adapter / projection / patch-embedder / `lm_head` kept BF16.
    - **Format:** compressed-tensors (`nvfp4-pack-quantized`), auto-detected by vLLM.
    - **Quantizer:** Intel AutoRound (arXiv:2309.05516).
    - **Intended use:** efficient inference on NVIDIA Blackwell (B200 / RTX PRO 6000 / DGX Spark) via vLLM.

    ## Quantization recipe
    - **Method:** AutoRound, scheme `NVFP4` — 4-bit **weights and input activations**, NVFP4 microscale (group size 16, FP8 `e4m3` block scale + FP32 global), symmetric, `strategy: tensor_group`.
    - **Quantized:** all `Linear` in the 52 `model.language_model.layers.*` decoder blocks (416 Linears).
    - **Kept BF16:** `model.vision_tower.*`, `model.vision_adapter.*`, `model.vision_projection`, `model.vision_tower.patch_embedder.patch_embedding`, `lm_head` (mirrors the RedHatAI/Muse-Glimmer-30B-NVFP4 scope).
    - **Calibration:** `NeelNanda/pile-10k`, 128 samples, seqlen 2048, 200 tuning iters (SignRound-style block reconstruction).
    - **Hardware:** single NVIDIA RTX PRO 6000 Blackwell 96 GB (SM120); ~94.5 min, peak 47.6 GB VRAM.

    ## Deployment (vLLM)
    vLLM auto-detects the NVFP4 scheme from `config.json` — **no quantization flag needed**. On Blackwell, use a build with FP4 tensor-core kernels (FlashInfer/CUTLASS) — **not** the Marlin fallback.

    ```bash
    vllm serve Muse-Glimmer-30B-NVFP4-AutoRound \
      --tensor-parallel-size 1 --max-model-len 8192 \
      --enable-auto-tool-choice --tool-call-parser muse_glimmer --reasoning-parser muse_glimmer
    # SM120 (consumer Blackwell): VLLM_ATTENTION_BACKEND=FLASHINFER, FLASHINFER_CUDA_ARCH_LIST=12.0f
    ```
    ```python
    from openai import OpenAI
    client = OpenAI(base_url="http://localhost:8000/v1", api_key="x")
    r = client.chat.completions.create(
        model="Muse-Glimmer-30B-NVFP4-AutoRound",
        messages=[{"role": "user", "content": [
            {"type": "text", "text": "Describe this image."},
            {"type": "image_url", "image_url": {"url": "https://…"}}]}],
    )
    print(r.choices[0].message.content)
    ```
    > **Note:** Muse-Glimmer is a *reasoning* model — with the reasoning parser enabled, the chain-of-thought is returned in the `reasoning` field and the final answer in `content`. Give it enough `max_tokens` to finish reasoning.

    ## Evaluation — accuracy recovery vs BF16
    Measured with EleutherAI `lm-evaluation-harness` (`--apply_chat_template --fewshot_as_multiturn`), identical settings across all three; **Recovery % = quant / BF16 × 100**.

    | Task | BF16 base | Red Hat GPTQ-NVFP4 | **This (AutoRound NVFP4)** | Recovery % |
    |---|---|---|---|---|
    | arc_challenge | 0.6254 | 0.6126 | 0.5998 | 95.9 |
    | hellaswag | 0.8275 | 0.8156 | 0.8030 | 97.0 |
    | winogrande | 0.7798 | 0.7719 | 0.7703 | 98.8 |
    | truthfulqa_mc2 | 0.6168 | 0.6036 | 0.5943 | 96.4 |
    | mmlu | 0.7977 | 0.7854 | 0.7767 | 97.4 |
    | **OpenLLM V1 Avg** | **0.7295** | **0.7178** (98.4%) | **0.7089** | **97.1%** |

    <sub>lm-eval-harness, `--model vllm`, no chat template (reasoning model → MCQ loglikelihood needs it off). Size: 22 GB (this) vs 29 GB (Red Hat) vs 56 GB (BF16).</sub>

    _(Vision path is BF16/untouched; a light `lmms-eval` MMMU/TextVQA sanity vs BF16 confirms the multimodal path is intact.)_

    ## Hardware & format notes
    - NVFP4 requires **NVIDIA Blackwell (SM100/SM120)** FP4 tensor cores; it won't accelerate on Ada/Hopper.
    - Two-level scaling: FP8 (`e4m3`) scale per 16-value block + FP32 tensor-level global scale.
    - On consumer SM120, prefer native/CUTLASS/FlashInfer FP4 kernels over Marlin (~2× slower). Validated here: FlashInfer `fp4_gemm` autotuning engaged on load.

    ## Limitations
    - Small accuracy loss vs BF16 (see table); varies by task.
    - Only the text decoder is quantized — no speedup on the vision tower (intentional, to preserve multimodal quality).
    - Sampling/parser support varies by inference framework; validated on vLLM (Muse build) on SM120.

    ## Reproducibility
    ```python
    from auto_round import AutoRound
    ar = AutoRound(
        "meta-models/Muse-Glimmer-30B",
        scheme="NVFP4", dataset="NeelNanda/pile-10k",
        nsamples=128, seqlen=2048, batch_size=4, iters=200,
        device_map=0, trust_remote_code=True, quant_nontext_module=False, seed=42,
    )
    ar.quantize_and_save(output_dir="Muse-Glimmer-30B-NVFP4-AutoRound", format="llm_compressor")
    ```
    Toolchain: auto-round 0.15.0, transformers 5.16.0.dev0 (source — required for the `muse_glimmer` arch), compressed-tensors 0.17.0, torch 2.11.0+cu130, on `vllm/vllm-openai:v0.26.0`. Full effort log: home-k8s issue #81.

    ## Citation
    ```bibtex
    @article{cheng2023optimize, title={Optimize Weight Rounding via Signed Gradient Descent for the Quantization of LLMs}, author={Cheng, Wenhua and others}, journal={arXiv:2309.05516}, year={2023}}
    ```
  upload.py: |
    #!/usr/bin/env python3
    """Create a PRIVATE HF repo and upload the AutoRound NVFP4 artifact + model card."""
    import os, shutil
    from huggingface_hub import HfApi

    TOKEN = os.environ["HF_TOKEN"]
    REPO = os.environ.get("HF_REPO", "dbirks/Muse-Glimmer-30B-NVFP4-AutoRound")
    MODEL_DIR = os.environ["MODEL_DIR"]
    api = HfApi(token=TOKEN)

    who = api.whoami()
    role = who.get("auth", {}).get("accessToken", {}).get("role")
    print(f"account={who.get('name')} token_role={role}", flush=True)

    # stage the model card as README.md at the repo root
    src = "/scripts/README.md"
    if os.path.isfile(src):
        shutil.copy(src, os.path.join(MODEL_DIR, "README.md"))
        print("staged README.md into artifact dir", flush=True)

    print(f"creating PRIVATE repo {REPO} ...", flush=True)
    api.create_repo(REPO, repo_type="model", private=True, exist_ok=True)
    print("repo ready (private=True)", flush=True)

    print(f"uploading {MODEL_DIR} -> {REPO} (the long part) ...", flush=True)
    try:
        api.upload_large_folder(repo_id=REPO, folder_path=MODEL_DIR, repo_type="model")
    except (AttributeError, TypeError) as e:
        print("upload_large_folder unavailable, falling back to upload_folder:", repr(e), flush=True)
        api.upload_folder(repo_id=REPO, folder_path=MODEL_DIR, repo_type="model",
                          commit_message="AutoRound NVFP4 (W4A4) + model card")

    info = api.model_info(REPO)
    print(f"UPLOAD DONE: https://huggingface.co/{REPO}  private={info.private}  files={len(info.siblings)}", flush=True)
kind: ConfigMap
metadata:
  name: muse-upload-scripts
  namespace: default
---
apiVersion: batch/v1
kind: Job
metadata:
  name: muse-upload-nvfp4-20260811
  namespace: default
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: upload
          image: python:3.12-slim
          command: ["/bin/sh","-c","pip install --no-cache-dir -q huggingface_hub && python3 /scripts/upload.py"]
          env:
            - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-write-token, key: HF_TOKEN } } }
            - { name: HF_REPO, value: "dbirks/Muse-Glimmer-30B-NVFP4-AutoRound" }
            - { name: MODEL_DIR, value: "/workspace/runs/Muse-Glimmer-30B-NVFP4-AutoRound-default/Muse-Glimmer-30B-nvfp-w4g16" }
            - { name: HF_HOME, value: "/workspace/hf" }
          resources:
            requests: { cpu: "2", memory: 3Gi }
            limits: { cpu: "4", memory: 8Gi }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: scripts, mountPath: /scripts }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: muse-quant-workspace } }
        - { name: scripts, configMap: { name: muse-upload-scripts, defaultMode: 0755 } }
