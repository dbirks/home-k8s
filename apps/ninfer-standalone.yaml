# qwen3.8-27b-ninfer — NInfer engine (raw Deployment + Service, default ns).
# ============================================================================================
# REVIVED 2026-10-16 (#156): v3 image + artifact, NVFP4 KV, 55000 MB slice, Pennyroyal at 0.
# (PARKED 2026-09-28 .. 2026-10-16 while the whole card went to the Pennyroyal Flash-Next canary, #135.)
#
# HISTORY: this engine used to be exposed on llm.birks.dev through the Envoy AI Gateway
# (Backend + AIServiceBackend + a KEDA scale-from-zero ScaledObject). That whole gateway
# stack was torn down 2026-10-10 (see the teardown issue); those objects were removed with it.
#
# REVIVAL PATH (when the card frees up again):
#   - LLM Collective: uncomment the `ninfer` backend block in apps/llm-collective-contributor.yaml
#     (url: http://ninfer.default.svc.cluster.local:8000) — the pattern Pennyroyal uses today.
#   - Direct/tailnet access: a tailscale Ingress on the ninfer Service, like the other apps.
#   - Scale-to-zero is gone (KEDA removed with the stack); ninfer starts always-on at replicas: 1.
#
# SIZING (unchanged): HAMi hard slice 50000 MB of the 97887 MB card; host tier zeroed
# (--host-kv-mib 0) because this box is RAM-poor/VRAM-rich — see the ninfer-serving-memory skill.
# Weights PVC: apps/qwen38-ninfer-weights.yaml (moved out of the deleted kserve/ dir).
# ============================================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ninfer
  namespace: default
  labels:
    app.kubernetes.io/name: ninfer
spec:
  replicas: 1                     # UP 2026-10-16 (#156): v3 image+artifact, NVFP4 KV, solo test then co-resident. Rollback pair: ninfer:20260908 + qwen38-ninfer-model (v2), --kv-dtype int8, --host-kv-mib 0 --host-state-slots 0.
  # NO SURGE: a surge pod would ask HAMi for a 2nd 50GB slice that can't fit beside Muse, so the
  # rollout would hang Pending. maxSurge 0 = stop old first (~15s gap: weights reload 4s + graphs).
  # (Not `type: Recreate`: Flux SSA keeps the live rollingUpdate block and the API rejects the combo.)
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: ninfer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ninfer
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false   # avoid injected NINFER_*/service-link env colliding with engine
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: main
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: true
          # dbirks/ninfer rebased onto Neroued/ninfer master 64d10fbf + liburing Dockerfile fix (505ee46a). Reads ONLY v3 artifacts:
          # always switch together with the qwen38-ninfer-model-v3 PVC below.
          image: ghcr.io/dbirks/ninfer:20261017@sha256:3529117087d0b697353b5c383cf2e4259176b5dd809105dae371db0c6cd9c442
          # ninfer-serve uses SPACE-separated args (--flag value), NOT --flag=value.
          command: ["ninfer-serve"]
          args:
            - "/mnt/models/qwen3_8_27b_nvfp4.ninfer"   # positional: PVC mounted at /mnt/models
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--model-id"
            - "qwen3.8-27b-ninfer"                      # public model name
            - "--device"
            - "0"
            - "--max-context"
            - "262144"                                  # model native max (plain RoPE); KV auto ~481k tok
            - "--kv-capacity"
            - "auto"
            # CONTEXT CACHE: keep it all in VRAM (2026-09-24). This box is RAM-poor (46GB, no swap) and
            # VRAM-rich, so the default pinned-host overflow tier (Host KV 8 GiB + 8 Host State slots
            # ~1.46 GiB = ~9.5GB of unreclaimable pinned host RAM) is the wrong trade. Zero it, and
            # instead buy more on-card room: bigger HAMi slice -> bigger `auto` KV pool, and 16 extra
            # Device checkpoint slots (~187MB VRAM each) so retained prefixes keep their DeltaNet state
            # on-card. Evicted-from-VRAM continuations now recompute instead of restoring from host.
            # 2026-10 upstream folded --host-kv-mib/--host-state-slots into one --host-context-mib budget
            # (StateImages + KV + pause snapshots); 0 disables Host backing, so preempted requests replay.
            - "--host-context-mib"
            - "0"
            - "--device-state-slots"
            - "16"
            - "--max-concurrency"
            # STOPGAP 2026-10-17: 1 lane. On the 20261017 build ANY two requests in flight together can kill the
            # engine (std::logic_error "KV write exceeds its page reservation", kv_history.cpp:615): faults at
            # 13:26 (2 reqs), 13:33 (3), 13:41 (3), 13:43 (two ~54-token prompts started 29 ms apart). One lane
            # removes the concurrency while keeping prefix reuse (agent TTFT ~120 ms on 100K-token turns);
            # extras wait in the pending FIFO below. Restore "8" once upstream fixes the reservation count.
            # (HARD engine cap is 8: ninfer-serve rejects >8. ~550 tok/s @8 was the ceiling.)
            - "1"
            - "--max-pending-requests"
            - "32"
            - "--pending-timeout-ms"
            - "600000"
            - "--prefill-chunk"
            - "1024"
            - "--kv-dtype"
            - "nvfp4"                       # #156: 18,432 B/token vs int8 33,792. Quality gate vs fp8/k8v4 before co-residence.
            - "--spec"
            - "dflash2"                     # dflash2 companion weights in the artifact (issue #121: old 20260829 image couldn't consume dflash2/feature_projection)
            - "--draft-tokens"
            - "7"                           # checkpoint-recommended draft count for dflash2 (accepts 1..15)
            - "--lm-head-draft"
            # Vision (image + video parts). Weights + Vision workspace come out of the same 55000 MB slice,
            # so the `auto` KV pool shrinks vs the 1,519,424-token text-only start; check the capacity line.
            - "--vision"
            - "--default-max-tokens"
            - "8192"
            # ZDR (#98): minimize the Responses store (0 rejected; 1 is the engine floor).
            - "--response-store-max-records"
            - "1"
          env:
            - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
          ports:
            - containerPort: 8000
          # GET /health is 200 while the engine serves and 503 {"status":"unavailable"} once it has faulted.
          # 2026-10-17 13:26 UTC: two concurrent single-image requests (req#2139/2140) both died "HTTP 500
          # internal error" and the engine stayed dead (every request 503) while the pod sat 1/1 Running for
          # want of probes. Liveness now restarts it (~1 min). Engine start is ~10 s; startup allows 10 min.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            # HAMi hard VRAM cap 55000 MB (#156 plan: + CLEF 25000 + 2x TTS 7000 = 94000 of 97887, ~3.9GB slack)
            # (webhook auto-injects schedulerName hami-scheduler). host memory request kept low so it fits the
            # 46GB host-RAM co-residence budget when awake.
            limits: { nvidia.com/gpu: "1", nvidia.com/gpumem: "55000", cpu: "8", memory: 24Gi }
            requests: { cpu: "4", memory: 8Gi }
          volumeMounts:
            - { name: model, mountPath: /mnt/models }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen38-ninfer-model-v3     # v3, SHA-verified (apps/qwen38-ninfer-weights-v3.yaml); v2 rollback: qwen38-ninfer-model
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
# ---- Service (ClusterIP; default ns). Revival consumers: LLM Collective contributor or a
# tailscale Ingress (see header).
apiVersion: v1
kind: Service
metadata:
  name: ninfer
  namespace: default
  labels:
    app.kubernetes.io/name: ninfer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ninfer
  ports:
    - name: http
      port: 8000
      targetPort: 8000
