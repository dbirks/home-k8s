# qwen3.8-27b-ninfer — NInfer engine on llm.birks.dev, routed through the AI GATEWAY (single /v1 URL)
# via an AIServiceBackend, BYPASSING the llm-d EPP/InferencePool. WITH working scale-from-zero.
# ============================================================================================
# DESIGN v2 (issue #105). This REPLACES the v1 plain-Service /ninfer path approach (in the live
# apps/ninfer-standalone.yaml). v1 served fine but scale-FROM-zero did NOT work: a plain Service
# backendRef at 0 endpoints on llm-public-gw emits no reliable Envoy wake metric (confirmed by test).
#
# WHY EPP-BYPASS IS STILL NEEDED: NInfer exposes no vLLM-format Prometheus /metrics, so the llm-d EPP
# (endpoint picker) saturation detector fail-closes and EVICTS every gateway request. Making NInfer an
# InferencePool-backed model therefore breaks the gateway. So we DON'T create an InferencePool/EPP.
#
# HOW v2 ROUTES + WAKES:
#   - NInfer is a raw Deployment + Service (default ns) — NO LLMInferenceService, NO InferencePool, NO EPP.
#   - We wrap the ninfer Service as an Envoy AI Gateway `AIServiceBackend` (OpenAI schema). EAG's
#     AIServiceBackend.backendRef is CEL-restricted to a `Backend` (gateway.envoyproxy.io) resource —
#     raw k8s Service refs are NOT yet supported (envoyproxy/ai-gateway#902) — so we also add a
#     `Backend` pointing at the ninfer Service FQDN.
#   - We add ONE rule to the existing `llm-model-router` AIGatewayRoute (apps/llm-ai-gateway.yaml)
#     matching x-ai-eg-model=qwen3.8-27b-ninfer -> this AIServiceBackend. Client uses the SAME
#     base_url https://llm.birks.dev/v1 with body model=qwen3.8-27b-ninfer (like every other model).
#   - WAKE METRIC: the AIGatewayRoute per-rule ext_proc runs on the llm-ai-gw Envoy for EVERY request
#     matching that rule, BEFORE the backend is contacted, so it increments even at 0 engine replicas.
#     That is the whole point — this is what the plain-Service cluster metric could not do.
#
# AUTH: INHERITED, no ninfer-specific SecurityPolicy. Traffic enters /v1 on llm-public-gw, which is
# already guarded by the `vllm-apikey-auth` SecurityPolicy (apps/llm-routes.yaml, targets the
# vllm-openai HTTPRoute covering /v1 + /anthropic). Same coworker keys; Authorization: Bearer llm_... .
# BONUS: because /anthropic on llm-public-gw also flows through this AIGatewayRoute, NInfer becomes
# reachable on the Anthropic surface too (EAG translates Anthropic<->OpenAI), for free.
#
# NAMESPACE CONSTRAINT (verified): the AIGatewayRoute forces its backendRefs into the route's OWN
# namespace (default). So the AIServiceBackend MUST be in `default` (it is, alongside the ninfer
# Service). We also keep the Backend in `default` so no ReferenceGrant is needed (FQDN endpoint, not
# a cross-ns Service ref).
#
# ---------------------------------------------------------------------------------------------
# OBJECTS TO DELETE when cutting over from the live apps/ninfer-standalone.yaml (v1):
#   - HTTPRoute       ninfer-route                 (ns llm-portal)   <- replaced by the AIGatewayRoute rule
#   - SecurityPolicy  ninfer-apikey-auth           (ns llm-portal)   <- auth now inherited from vllm-apikey-auth
#   - ReferenceGrant  ninfer-route-to-default-svc  (ns default)      <- no cross-ns Service ref anymore
# KEEP (unchanged): Deployment ninfer + Service ninfer (below).
# REPLACE: the KEDA ScaledObject (new wake query, below).
# ADD: Backend ninfer-backend + AIServiceBackend ninfer-backend (below).
# EDIT the LIVE apps/llm-ai-gateway.yaml: append the rule in the comment block at the very bottom of
#   this file. That single route edit is the ONLY change to an already-serving manifest.
# ============================================================================================
---
# ---- NInfer engine (raw Deployment). UNCHANGED from the live v1 manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ninfer
  namespace: default
  labels:
    app.kubernetes.io/name: ninfer
spec:
  replicas: 1                     # KEDA ScaledObject below owns this (idles to 0); 1 = initial
  selector:
    matchLabels:
      app.kubernetes.io/name: ninfer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ninfer
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false   # avoid injected NINFER_*/service-link env colliding with engine
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: main
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: true
          image: ghcr.io/dbirks/ninfer:latest
          # ninfer-serve uses SPACE-separated args (--flag value), NOT --flag=value.
          command: ["ninfer-serve"]
          args:
            - "/mnt/models/qwen3_8_27b_nvfp4.ninfer"   # positional: PVC mounted at /mnt/models
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--model-id"
            - "qwen3.8-27b-ninfer"                      # public model name (matches x-ai-eg-model + body model)
            - "--device"
            - "0"
            - "--max-context"
            - "262144"                                  # model native max (plain RoPE); KV auto ~481k tok
            - "--kv-capacity"
            - "auto"
            - "--max-concurrency"
            - "8"
            - "--max-pending-requests"
            - "32"
            - "--pending-timeout-ms"
            - "600000"
            - "--prefill-chunk"
            - "1024"
            - "--kv-dtype"
            - "int8"
            - "--spec"
            - "mtp"
            - "--draft-tokens"
            - "3"
            - "--lm-head-draft"
            - "--default-max-tokens"
            - "8192"
            # ZDR (#98): minimize the Responses store (0 rejected; 1 is the engine floor).
            - "--response-store-max-records"
            - "1"
          env:
            - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
          ports:
            - containerPort: 8000
          resources:
            # HAMi hard VRAM cap 40000 MB (webhook auto-injects schedulerName hami-scheduler). host
            # memory request kept low so it fits the 46GB host-RAM co-residence budget when awake.
            limits: { nvidia.com/gpu: "1", nvidia.com/gpumem: "40000", cpu: "8", memory: 24Gi }
            requests: { cpu: "4", memory: 8Gi }
          volumeMounts:
            - { name: model, mountPath: /mnt/models }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen38-ninfer-model        # existing, SHA-verified (kserve/qwen38-ninfer-weights.yaml)
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
# ---- Service (ClusterIP; default ns). UNCHANGED. The Backend below points at this via FQDN.
apiVersion: v1
kind: Service
metadata:
  name: ninfer
  namespace: default
  labels:
    app.kubernetes.io/name: ninfer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ninfer
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# ---- Envoy Gateway Backend wrapping the ninfer Service (required indirection).
# AIServiceBackend.backendRef is CEL-restricted to kind=Backend group=gateway.envoyproxy.io (raw
# Service refs unsupported yet — envoyproxy/ai-gateway#902), so we declare a Backend that resolves the
# ninfer Service by its cluster FQDN. `enableBackend: true` is already set on this cluster's Envoy
# Gateway config (verified), so Backend resources are honored. FQDN resolves to the stable ClusterIP
# even at 0 pod endpoints, so route/ext_proc processing (the wake path) never depends on engine health.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ninfer-backend
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: ninfer.default.svc.cluster.local
        port: 8000
---
# ---- AIServiceBackend: presents the ninfer engine to the AIGatewayRoute as an OpenAI-schema backend.
# Must live in `default` (same ns as the llm-model-router AIGatewayRoute, which forces backendRefs into
# its own namespace). schema.name=OpenAI => no request/response translation on the /v1 surface (and
# free Anthropic<->OpenAI translation on the /anthropic surface). No timeouts field exists on
# AIServiceBackend (spec keys: backendRef, schema, bodyMutation, headerMutation) — the per-request
# timeout is set on the AIGatewayRoute RULE instead (see the rule snippet at the bottom: 1800s).
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ninfer-backend
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: ninfer-backend
    # same namespace (default) -> no ReferenceGrant needed
---
# ---- Scale-to-zero for the NInfer Deployment. Wake trigger = the AIGatewayRoute per-rule ext_proc
# on the llm-ai-gw Envoy for THIS model's rule. That ext_proc runs on the gateway proxy for every
# matching request BEFORE the backend is contacted, so its counter increments even at 0 engine
# replicas — the reliable scale-FROM-zero signal the v1 plain-Service cluster metric lacked.
#
# METRIC (verified live in Prometheus): the model-router rule ext_proc cluster does NOT expose
# upstream_rq_total (unlike the EPP/endpointpicker clusters the other models key on); the usable
# per-request counter is `..._streams_started` (one ext_proc stream per request; rule_0/qwen3.8-27b
# read 15742 and climbs under traffic). The cluster name — and thus the metric name — bakes the RULE
# INDEX. Appending the ninfer rule AFTER laguna (currently the last model rule, index 6) makes ninfer
# rule index 7, so the metric is:
#   envoy_cluster_cluster_httproute_default_llm_model_router_rule_7ext_proc_streams_started
#   (label envoy_cluster_name="httproute/default/llm-model-router/rule/7", job="envoy-gw")
# job="envoy-gw" = the dedicated 15s Envoy scrape (infra/prometheus.yaml); the 60s annotation scrape
# (job="kubernetes-pods") is too slow for scale-from-zero — use envoy-gw, same as the other models.
#
# !! VERIFY THE RULE INDEX AFTER APPLYING THE ROUTE EDIT !!  The index depends on the ninfer rule's
# position in the generated HTTPRoute. Confirm which rule/N carries ninfer traffic, then fix the "7"
# below if it differs:
#   POD=$(kubectl -n envoy-gateway-system get po -l gateway.envoyproxy.io/owning-gateway-name=llm-ai-gw -o name | head -1)
#   kubectl -n envoy-gateway-system exec $POD -c envoy -- curl -s localhost:19001/stats/prometheus \
#     | grep llm_model_router_rule_ | grep streams_started
# (or in Prometheus: envoy_cluster_cluster_httproute_default_llm_model_router_rule_7ext_proc_streams_started)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ninfer
  namespace: default
spec:
  scaleTargetRef:
    name: ninfer
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
    - type: prometheus
      name: ninfer-aigw-extproc-rate
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        # rule index 7 = ninfer appended after laguna (index 6). VERIFY per the note above.
        query: 'sum(rate(envoy_cluster_cluster_httproute_default_llm_model_router_rule_7ext_proc_streams_started{job="envoy-gw"}[1m]))'
        threshold: "5"
        activationThreshold: "0.001"   # any rate > 0.001 (one request in [1m] ~= 0.017) wakes 0->1
# =============================================================================================
# DRAFT — RULE TO APPEND TO THE LIVE apps/llm-ai-gateway.yaml (do NOT apply from here; this is a
# copy-paste snippet). Add it as the LAST rule under `spec.rules` of the `llm-model-router`
# AIGatewayRoute, AFTER the laguna-s-2.1 rule, so it takes rule index 7:
#
#     - matches:
#         - headers: [{ type: Exact, name: x-ai-eg-model, value: qwen3.8-27b-ninfer }]
#       timeouts: { request: 1800s, backendRequest: 1800s }
#       backendRefs:
#         - { name: ninfer-backend }   # AIServiceBackend (defaults: group aigateway.envoyproxy.io, kind
#                                      # AIServiceBackend, namespace default). Do NOT set group/kind —
#                                      # the CRD only allows group/kind for InferencePool backends.
#
# Order matters ONLY for the baked metric index above; header matches are exact so rules don't shadow
# each other. Keeping ninfer last also keeps the other six models' metric indices (0-6) unchanged.
# =============================================================================================
