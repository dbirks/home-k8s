# REAL-vLLM eval of the online DSpark gate checkpoint (2026-07-27)
#
# The gate's per-epoch val accept_len (1.138->1.517) is a TRAINING-LOOP metric
# (teacher-forced, training rope) — it CANNOT detect a train/serve mismatch. This
# job measures the REAL spec-decode accept_len under actual vLLM serving at temp
# 1.0, block-size 7, via the /metrics spec_decode counters. This is the gating
# number before any 30-50k scaled run (rope agent's caveat):
#   real ~= sim (climbs >1.5) -> data-limited confirmed, green-light scale
#   real << sim (~1.0-1.5 flat) -> train/serve mismatch, debug rope/config
# Serves the FROZEN target unsloth/Qwen3.6-27B-NVFP4 + the trained drafter as a
# dspark speculative-config. Laguna is at replicas 0 so this Job owns the GPU.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dspark-eval-qwen-online-20260727-script
  namespace: default
data:
  run.sh: |
    #!/bin/bash
    set -euo pipefail
    export HF_HOME=/data
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    CKPT=/output/checkpoints-qwen-online-v1/checkpoint_best
    echo "=== [$(date)] eval drafter $CKPT ==="
    if [ ! -f "$CKPT/config.json" ]; then
        echo "FATAL: $CKPT/config.json missing"; ls -la "$CKPT" 2>/dev/null || true
        echo "--- available checkpoints ---"; ls -1 /output/checkpoints-qwen-online-v1/ 2>/dev/null; exit 1
    fi
    echo "--- shipped drafter config (rope/arch self-check) ---"
    python3 -c "import json;c=json.load(open('$CKPT/config.json'));print(json.dumps(c,indent=1)[:2000])" 2>/dev/null | grep -iE 'model_type|partial_rotary|rope|mrope|num_layers|block|speculator|method|target_layer|draft_vocab|head_dim' | head -30 || true

    echo "=== [$(date)] serve Qwen3.6-27B-NVFP4 + dspark drafter (k=7, block size) ==="
    vllm serve unsloth/Qwen3.6-27B-NVFP4 \
        --host 0.0.0.0 --port 8000 \
        --served-model-name main qwen27 \
        --max-model-len 16384 \
        --dtype bfloat16 \
        --gpu-memory-utilization 0.80 \
        --max-num-seqs 16 \
        --kv-cache-dtype fp8_e4m3 \
        --mamba-cache-dtype float16 \
        --mamba-ssm-cache-dtype float16 \
        --enable-prefix-caching \
        --trust-remote-code \
        --enforce-eager \
        --speculative-config "{\"method\":\"dspark\",\"model\":\"$CKPT\",\"num_speculative_tokens\":7}" \
        > /output/logs/eval_vllm_qwen_online.log 2>&1 &
    VLLM_PID=$!
    trap "kill $VLLM_PID 2>/dev/null; wait $VLLM_PID 2>/dev/null" EXIT

    echo "=== waiting for /health (up to 30 min) ==="
    for i in $(seq 1 180); do
        curl -sf http://localhost:8000/health >/dev/null 2>&1 && { echo "[$(date)] healthy after $((i*10))s"; break; }
        if ! kill -0 $VLLM_PID 2>/dev/null; then
            echo "ERROR: vLLM died. Tail of log:"; tail -60 /output/logs/eval_vllm_qwen_online.log; exit 1
        fi
        [ "$i" -eq 180 ] && { echo "ERROR: timeout"; tail -40 /output/logs/eval_vllm_qwen_online.log; exit 1; }
        sleep 10
    done

    cat > /tmp/bench.py << 'PYEOF'
    import concurrent.futures, json, re, time, urllib.request
    CODING = [
        "Write a Python function that merges two sorted linked lists.",
        "Implement a binary search tree with insert, delete, and in-order traversal in Python.",
        "Write a TypeScript function that debounces another function.",
        "Fix this Python code: def fib(n): return fib(n-1)+fib(n-2) -- it's missing a base case.",
        "Write a Rust function that reverses a string in place.",
        "Implement quicksort in Python with an explanation of its time complexity.",
        "Write a SQL query to find the second-highest salary in an employees table.",
        "Write a Python decorator that retries a function up to 3 times on exception.",
        "Implement an LRU cache in Python using OrderedDict.",
        "Write a bash script that finds all files larger than 100MB in a directory tree.",
        "Refactor a function with nested if-statements into a lookup table in Python.",
        "Write a Python context manager that times the code block inside it.",
        "Implement a simple in-memory key-value store class with get/set/delete in Python.",
        "Write a function to detect a cycle in a directed graph using DFS.",
        "Add type hints and a docstring to a Python function that parses a CSV line.",
    ]
    GENERAL = [
        "What are the main differences between TCP and UDP?",
        "Explain how a Kubernetes Deployment differs from a StatefulSet.",
        "What's the difference between supervised and unsupervised learning?",
        "Explain the CAP theorem in distributed systems.",
        "What are the tradeoffs between microservices and a monolith?",
        "Explain how DNS resolution works step by step.",
        "Summarize the plot of Romeo and Juliet in three sentences.",
        "What's the difference between a mutex and a semaphore?",
        "Explain how garbage collection works in a language like Python or Java.",
        "What is the difference between HTTP/1.1 and HTTP/2?",
    ]
    def send_one(prompt):
        # temp 1.0 = the paper's eval setting (real sampling, not greedy)
        body = json.dumps({"model":"main","messages":[{"role":"user","content":prompt}],
                           "max_tokens":300,"temperature":1.0}).encode()
        req = urllib.request.Request("http://localhost:8000/v1/chat/completions",
                                     data=body, headers={"Content-Type":"application/json"}, method="POST")
        try:
            with urllib.request.urlopen(req, timeout=180) as r: r.read(); return True
        except Exception as e:
            print("req failed:", e); return False
    def counters():
        with urllib.request.urlopen("http://localhost:8000/metrics", timeout=30) as r:
            lines=[l for l in r.read().decode().splitlines() if "spec_decode" in l and not l.startswith("#")]
        def mv(sub):
            tot=0.0; found=False
            for l in lines:
                if sub in l:
                    m=re.search(r"\s+([0-9.eE+-]+)\s*$", l)
                    if m: tot+=float(m.group(1)); found=True
            return tot if found else 0.0
        return mv("num_accepted_tokens_total"), mv("num_drafts_total")
    def run_set(name, prompts, ba, bd):
        print(f"=== {len(prompts)} {name} @ temp 1.0 (concurrency 8) ===")
        t0=time.time()
        with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            ok=sum(list(ex.map(send_one, prompts)))
        time.sleep(3); a,d=counters(); da,dd=a-ba,d-bd
        al=1+(da/dd) if dd>0 else float('nan')
        print(f"{name}: {ok}/{len(prompts)} ok {time.time()-t0:.1f}s | drafts={dd:.0f} accepted={da:.0f} | REAL accept_len={al:.4f}")
        return a,d,al
    a0,d0=counters()
    a1,d1,alc=run_set("CODING",CODING,a0,d0)
    a2,d2,alg=run_set("GENERAL",GENERAL,a1,d1)
    alall=1+((a2-a0)/(d2-d0)) if (d2-d0)>0 else float('nan')
    print("\n=== REAL-vLLM RESULT (checkpoint_best, temp 1.0, k=7) ===")
    print(f"CODING   real accept_len = {alc:.4f}")
    print(f"GENERAL  real accept_len = {alg:.4f}")
    print(f"COMBINED real accept_len = {alall:.4f}")
    print("sim (train-loop) peak val accept_len was 1.517 -> compare: real ~=sim = data-limited; real<<sim = train/serve mismatch")
    PYEOF
    python3 /tmp/bench.py 2>&1 | tee /output/logs/eval_results_qwen_online.txt
    echo "=== [$(date)] eval complete ==="
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dspark-eval-qwen-online-20260727
  namespace: default
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      enableServiceLinks: false
      containers:
        - name: eval
          image: vllm/vllm-openai:nightly-4080263bb2c5d10deac17aaeb88e0823bc35bca9  # on-node; has dspark draft-attn fix vllm#48167
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/run.sh"]
          env:
            - name: HF_HOME
              value: /data
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8
              value: "1"
            - name: VLLM_FLASHINFER_MOE_BACKEND
              value: latency
            - name: FLASHINFER_CUDA_ARCH_LIST
              value: 12.0f
            - name: FLASHINFER_FORCE_SM
              value: 120f
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "2"
              memory: 16Gi
          volumeMounts:
            - name: models
              mountPath: /data
            - name: output
              mountPath: /output
            - name: scripts
              mountPath: /scripts
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: output
          persistentVolumeClaim:
            claimName: dspark-output-hdd-v2
        - name: scripts
          configMap:
            name: dspark-eval-qwen-online-20260727-script
            defaultMode: 0755
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
