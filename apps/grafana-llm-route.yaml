# Grafana at llm.birks.dev/grafana — same single Cloudflare entry point as /v1 + portal.
#
# The dedicated LLM Grafana (namespace llm-grafana), reachable on the public host at
# a subpath and GATED BY ENTRA at this route via oauth2-proxy.
#
# /grafana/* is forwarded UNCHANGED (no URLRewrite) to the oauth2-proxy Service in
# llm-grafana. oauth2-proxy owns /grafana/oauth2/* (Entra sign-in + callback) and,
# once a session exists, proxies every other /grafana/* path to the dedicated Grafana
# (serve_from_sub_path=true, root_url=.../grafana/), which strips the prefix itself.
#
# Auth: Entra at the proxy (oauth2-proxy), NOT Grafana's own login (Grafana runs
# anonymous behind the gate). Do NOT attach the /v1 apiKeyAuth TrafficPolicy here.
# /grafana is a longer prefix than the portal's `/` catch-all, so Gateway-API
# precedence routes it here (same trick as /v1).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: llm-portal
spec:
  parentRefs:
    - name: llm-public-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      backendRefs:
        - name: oauth2-proxy
          namespace: llm-grafana
          port: 80
---
# Allow the llm-portal HTTPRoute to reference the oauth2-proxy Service in `llm-grafana`.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: llm-portal-httproute-to-llm-grafana
  namespace: llm-grafana
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: llm-portal
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy
