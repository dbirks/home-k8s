# Clef-Omni FP8 block (128x128) quant (issue #154): CPU-only, streaming, no model load, no calibration.
# scripts/clef-omni/quant_fp8_block.py converts the release's per-expert BF16 tensors with transformers'
# own block-FP8 math, copies everything else bit-for-bit, drops talker/code2wav, cross-checks a sample
# against transformers' Fp8Quantize, and scans the artifact (prints FP8 ARTIFACT PASS/FAIL).
# Output /work/fp8/{export,results}; grading + benchmark happen later on the GPU. Runs alongside GPU jobs.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clef-omni-quant-fp8-20261011
  namespace: default
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: { app: clef-omni-quant-fp8 }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: fp8
          image: python:3.12-slim
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -uo pipefail
              echo "[$(date -u +%FT%TZ)] === Clef-Omni FP8 block quant ==="
              /work/venv/bin/python /scripts/quant_fp8_block.py 2>&1 | tee /work/logs/quant-fp8.log
              rc=${PIPESTATUS[0]}; du -sh /work/fp8/export 2>/dev/null; echo "[$(date -u +%FT%TZ)] fp8 rc=$rc"; exit $rc
          env:
            - { name: CLEF_MODEL_DIR, value: /work/clef-omni }
            - { name: CLEF_ROOT, value: /work/fp8 }
          resources:
            requests: { cpu: "4", memory: 3Gi }
            limits:   { cpu: "8", memory: 8Gi }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - { name: work, persistentVolumeClaim: { claimName: clef-omni-hdd } }
        - { name: scripts, configMap: { name: clef-omni-scripts } }
