# Hermes Agent dashboard: tailnet-only HTTPS at https://hermes.beluga-wyvern.ts.net (issue #162).
# Hermes used to run on a workstation (10.0.0.125) behind a selector-less Service + hand-written
# EndpointSlice. It now runs in-cluster (apps/hermes-agent.yaml), so this Service selects the pod and
# the EndpointSlice is gone (Flux prunes it). The Ingress name/host are unchanged so the existing
# tailscale proxy keeps the `hermes` MagicDNS name.
apiVersion: v1
kind: Service
metadata:
  name: hermes-dashboard
  namespace: default
spec:
  selector: { app: hermes }
  ports:
    - name: http
      port: 9119
      targetPort: 9119
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-dashboard-ts
  namespace: default
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hermes
  rules:
    - host: hermes
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-dashboard
                port:
                  name: http
