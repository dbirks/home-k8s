# Node swap via a swap FILE (both disks are full XFS — no room for a Talos SwapVolumeConfig partition,
# and XFS can't shrink). Kubelet already patched with failSwapOn:false + memorySwap:LimitedSwap (via
# talosctl). This privileged DaemonSet creates an 80GB swap file on the HDD (u-hdd-storage, ~3.6TB free)
# and swapon's it — on the HDD (not NVMe) to avoid DiskPressure (an 80GB NVMe file would drop free space
# under the ~10% eviction threshold) and NVMe wear. Re-runs on reboot (persistence). Reversible: delete
# this DS + `swapoff`. Lets Burstable pods (AutoScheme pack, DeepSeek-V4 transform) spill instead of OOM.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-swapfile
  namespace: default
spec:
  selector:
    matchLabels: { app: node-swapfile }
  template:
    metadata:
      labels: { app: node-swapfile }
    spec:
      hostPID: true
      tolerations:
        - operator: Exists           # run on the control-plane / any taint
      containers:
        - name: swapfile
          image: debian:bookworm-slim
          securityContext:
            privileged: true
            seccompProfile: { type: Unconfined }   # swapon syscall isn't in the default seccomp allowlist
          env:
            - { name: SWAP_DIR, value: "/hosthdd/_swap" }   # on the HDD user volume (/var/mnt/hdd-storage)
            - { name: SIZE_GB, value: "80" }
          command: ["/bin/bash","-c"]
          args:
            - |
              set -uo pipefail
              SF="$SWAP_DIR/swapfile"
              SZ_MIB=$((SIZE_GB*1024))
              mkdir -p "$SWAP_DIR"
              cur_mib=$(( $(stat -c%s "$SF" 2>/dev/null || echo 0) / 1048576 ))
              if [ "$cur_mib" -lt "$SZ_MIB" ]; then
                echo "[$(date)] creating ${SIZE_GB}GiB swapfile at $SF (current ${cur_mib}MiB) — dd, no holes for XFS"
                swapoff "$SF" 2>/dev/null || true; rm -f "$SF"
                dd if=/dev/zero of="$SF" bs=1M count="$SZ_MIB" status=progress
                chmod 600 "$SF"; mkswap "$SF"
              else
                echo "[$(date)] swapfile already sized ${cur_mib}MiB >= ${SZ_MIB}MiB"
              fi
              swapon "$SF" 2>&1 || echo "(swapon note: likely already active)"
              echo "=== /proc/swaps ==="; cat /proc/swaps
              echo "=== SwapTotal ==="; grep -iE "SwapTotal|MemTotal" /proc/meminfo
              echo "[$(date)] swap active; holding (re-runs on reboot)"
              sleep infinity
          resources:
            requests: { cpu: "50m", memory: 64Mi }
            limits: { cpu: "500m", memory: 256Mi }
          volumeMounts:
            - { name: hdd, mountPath: /hosthdd }
      volumes:
        - name: hdd
          hostPath: { path: /var/mnt/hdd-storage, type: Directory }
