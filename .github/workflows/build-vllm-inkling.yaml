name: build-vllm-inkling

# vLLM day-0 Inkling 2 Mini image + SM120 patches (DSpark fix #69096, NVFP4 KV) from dbirks/vllm branch
# inkling2-mini-sm120 (build/vllm-inkling/Dockerfile). Pure-Python overlay, one small layer. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (ghcr.io/dbirks/vllm-openai:<tag>)"
        default: "inkling-sm120-nvfp4-20261121"
        required: true
      vllm_ref:
        description: "dbirks/vllm commit SHA (branch inkling2-mini-sm120)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (base image extracts to ~20GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build
        run: |
          docker build --build-arg VLLM_REF=${{ inputs.vllm_ref }} \
            -t ghcr.io/dbirks/vllm-openai:${{ inputs.tag }} build/vllm-inkling
          docker history --format '{{.Size}}\t{{.CreatedBy}}' ghcr.io/dbirks/vllm-openai:${{ inputs.tag }} | head -4

      - name: Push to GHCR
        run: |
          docker push ghcr.io/dbirks/vllm-openai:${{ inputs.tag }}
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/dbirks/vllm-openai:${{ inputs.tag }}
