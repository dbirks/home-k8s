name: build-basalt-src

# Basalt built from source (build/basalt-src/Dockerfile): upstream `main` at a pinned commit, for the unreleased fixes a
# release archive does not have yet. Manual trigger only; build/basalt + build-basalt.yaml remain the release path.
# Usage:
#   SHA=$(gh api repos/jesdga95/basalt/commits/main --jq .sha)
#   gh workflow run build-basalt-src.yaml -f ref=$SHA -f tag=main-${SHA:0:8}
# Then point apps/inkling2-mini-basalt.yaml at the tag plus the digest the run prints.
# The CUDA devel image plus the sm_120 build are large, so the job frees runner disk before building; inkling2-only
# (the default) is what keeps the build inside the timeout.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full 40-char upstream commit sha (github.com/jesdga95/basalt)"
        default: ""
        required: true
      tag:
        description: "Image tag (e.g. main-8667cc8a)"
        default: ""
        required: true
      models:
        description: "BASALT_MODELS: inkling2, or a ; list of model ids, or all"
        default: "inkling2"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      BASALT_REF: ${{ inputs.ref }}
      TAG: ${{ inputs.tag }}
      IMAGE: ghcr.io/dbirks/basalt:${{ inputs.tag }}
      BASALT_MODELS: ${{ inputs.models }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af
          df -h /

      - name: Validate ref
        run: |
          echo "$BASALT_REF" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::ref must be a full 40-char commit sha, not a branch or a short sha (gh api repos/jesdga95/basalt/commits/main --jq .sha)"
            exit 1
          }
          echo "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' || {
            echo "::error::tag must be a single non-empty OCI tag (e.g. main-${BASALT_REF:0:8})"
            exit 1
          }

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build
        run: |
          docker build --build-arg BASALT_REF="$BASALT_REF" --build-arg BASALT_MODELS="$BASALT_MODELS" \
            -t "$IMAGE" build/basalt-src
          docker history --format '{{.Size}}\t{{.CreatedBy}}' "$IMAGE" | head -6

      - name: Push to GHCR
        run: |
          docker push "$IMAGE"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE"
