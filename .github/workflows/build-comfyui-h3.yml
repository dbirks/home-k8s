name: build-comfyui-h3
on:
  push:
    branches: [main]
    paths:
      - docker/comfyui-h3/**
      - .github/workflows/build-comfyui-h3.yml
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/comfyui-h3
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/comfyui-h3:20260804
            ghcr.io/${{ github.repository_owner }}/comfyui-h3:latest
