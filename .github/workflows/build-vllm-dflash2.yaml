name: build-vllm-dflash2

# Builds a vLLM image with DFlash2 (PR #52816) as a pure-Python overlay on the Aug-18 nightly, and
# pushes it to GHCR. Runs on GitHub's runners because the dev box lacks disk for the ~20GB base image.
# Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        default: "dflash2-20260818"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (base image extracts to ~20GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Stage PR #52816 vLLM source into the build context
        run: |
          git clone --filter=blob:none https://github.com/vllm-project/vllm.git /tmp/vllm
          cd /tmp/vllm
          git fetch origin pull/52816/head
          git checkout FETCH_HEAD
          rm -rf "$GITHUB_WORKSPACE/build/vllm-dflash2/vllm-pr"
          cp -r /tmp/vllm/vllm "$GITHUB_WORKSPACE/build/vllm-dflash2/vllm-pr"
          echo "staged $(find "$GITHUB_WORKSPACE/build/vllm-dflash2/vllm-pr" -name '*.py' | wc -l) .py files"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build DFlash2 overlay image
        run: |
          docker build --pull \
            -f build/vllm-dflash2/Dockerfile \
            -t ghcr.io/dbirks/vllm-openai:${{ github.event.inputs.tag }} \
            build/vllm-dflash2

      - name: Push to GHCR
        run: docker push ghcr.io/dbirks/vllm-openai:${{ github.event.inputs.tag }}
