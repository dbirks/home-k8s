name: build-ripple-sglang

# Ripple-65B NVFP4 on stock SGLang 0.5.19 cu130 (build/ripple-sglang/Dockerfile), pushed to GHCR (#168).
# Pure-Python overlay, no CUDA compile. Runs on GitHub's runners: the base image extracts to ~30GB.
# Pushed into the existing PUBLIC ghcr.io/dbirks/vllm-openai package (tag ripple-sglang*): this repo's GITHUB_TOKEN
# is denied creating a new package, and a new package would be private (no pull secret needed this way).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        default: "ripple-sglang0519-20261104"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (base image extracts to ~30GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/microsoft /usr/share/swift \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ghcr.io/dbirks/vllm-openai:${{ inputs.tag }} build/ripple-sglang

      - name: Push to GHCR
        run: |
          docker push ghcr.io/dbirks/vllm-openai:${{ inputs.tag }}
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/dbirks/vllm-openai:${{ inputs.tag }}
