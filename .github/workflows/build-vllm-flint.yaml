name: build-vllm-flint

# vLLM day-0 Flint image + SM120 arch gate + gguf + fp8 KV patch (build/vllm-flint/Dockerfile), pushed to GHCR (#158).
# Pure-Python overlay, no CUDA compile. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        default: "flint-sm120-20261021"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (base image extracts to ~20GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build
        run: docker build -t ghcr.io/dbirks/vllm-openai:${{ inputs.tag }} build/vllm-flint

      - name: Push to GHCR
        run: |
          docker push ghcr.io/dbirks/vllm-openai:${{ inputs.tag }}
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/dbirks/vllm-openai:${{ inputs.tag }}
