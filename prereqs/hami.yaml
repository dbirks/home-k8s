# HAMi — hard, uneven single-GPU memory partitioning (ACTIVE as of 2026-08-18)
#
# Replaces the stock NVIDIA device plugin (prereqs/nvidia-device-plugin.yaml, removed in the same
# commit). WHY: the stock plugin's time-slicing gives NO memory isolation — every pod sees the full
# 96GB and one model can OOM the others. HAMi's libvgpu.so intercepts CUDA/NVML so each pod sees ONLY
# its `nvidia.com/gpumem` quota as "total" VRAM -> arbitrary HARD per-pod memory caps, no retrain.
# Proven on RTX PRO 6000 Blackwell + driver 580.167.08 + CUDA 13 (HAMi #2015 / #2641 ran on 580.x).
#
# TALOS-CRITICAL overrides (verified against talos-210-73x: Talos v1.13.6, k8s v1.36.2, driver
# 580.167.08 open modules, cert-manager present, node label pci-10de.present=true):
#   - /usr/local is READ-ONLY on Talos -> relocate the libvgpu hook dir under /var/lib/hami
#     (global.gpuHookPath, devicePlugin.libPath, devicePlugin.monitor.ctrPath).
#   - Bundled kube-scheduler image -> registry.k8s.io (Aliyun default lacks the tag); tag MUST equal
#     the control-plane minor (v1.36.2) — BUMP THIS ON EVERY K8S UPGRADE or version-skew breaks it.
#   - runtimeClassName nvidia (NVML reaches the driver via the nvidia runtime/CDI); createRuntimeClass
#     false (the "nvidia" RuntimeClass already exists).
#   - Webhook cert via cert-manager (present) — path is scheduler.certManager (NOT under admissionWebhook).
#   - prometheus.enabled false: no prometheus-operator/ServiceMonitor CRD here (only Alloy+Grafana+Loki).
#
# THE TRAP (HAMi defaultMemory:0): a GPU pod that requests nvidia.com/gpu WITHOUT nvidia.com/gpumem
# claims the ENTIRE 96GB in HAMi accounting -> nothing else co-schedules. EVERY model pod MUST set an
# explicit nvidia.com/gpumem. Compute (gpucores) capping is UNRELIABLE on Blackwell -> never set it.
# See memory project_gpu_sharing_hami_plan + HAMI-SWAP-RUNBOOK.md.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hami
  namespace: flux-system
spec:
  interval: 1h
  url: https://project-hami.github.io/HAMi/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hami
  namespace: kube-system
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # SINGLE-NODE ROLLOUT TRAP (learned the hard way 2026-10-10, #146/#147) — READ BEFORE CHANGING
  # ANY VALUE BELOW.
  # The chart hard-codes a *required* podAntiAffinity on kubernetes.io/hostname for hami-scheduler,
  # and the Deployment gets the API default strategy (RollingUpdate, maxSurge 25%). On a ONE-NODE
  # cluster the surged pod can never be placed — the old pod holds the only hostname. So any edit
  # that mutates the scheduler Deployment (a flag, an env, the scheduler-policy args, an image/tag
  # bump, a kube-scheduler tag on a k8s upgrade) sits Pending ~5 min, then:
  #   "Helm upgrade failed ... timeout waiting for: [Deployment/kube-system/hami-scheduler status: 'InProgress']"
  # and Flux ROLLS BACK, silently reverting your change. Worse: the `prereqs` Kustomization stays
  # unhealthy, and because infra->prereqs and apps->infra are dependsOn chains, **nothing else in the
  # repo reconciles** while it loops (each retry burns another 5 min).
  # FIX (already applied to the live object): strategy.type=Recreate — delete-then-create works on one
  # node. It is durable here because the chart manifest contains no `spec.strategy` at all, so Helm's
  # 3-way merge never rewrites it. It is NOT expressed in git, because this cluster's
  # helmreleases.helm.toolkit.fluxcd.io v2 CRD has no `spec.postRender` (despite helm-controller
  # v1.6.2) — the declarative fix is blocked on refreshing the Flux CRDs (issue #148).
  # Assert/repair it before and after any HAMi edit:
  #   .agents/skills/hami-gpu-accounting/scripts/hami-rollout-guard.sh --enforce
  # If a rollout is already wedged: same script with --diagnose prints the exact unstick.
  # Cost of Recreate: a few seconds with no GPU scheduler. Already-bound pods (Pennyroyal) keep
  # running; new GPU pods can't bind during that window — do it off-peak, never mid-quant.
  chart:
    spec:
      chart: hami
      version: "2.10.0"          # chart 2.9.0 == app 2.9.0 (verified against the repo index)
      sourceRef:
        kind: HelmRepository
        name: hami
        namespace: flux-system
      interval: 5m
  values:
    schedulerName: "hami-scheduler"

    global:
      # /usr/local is READ-ONLY on Talos -> move the libvgpu.so hook dir under /var.
      gpuHookPath: /var/lib/hami

    scheduler:
      # Placement policy across devices. With ONE GPU these are no-ops; they matter the
      # day a second, *different*-sized card joins (issue #146: an RTX 5090 next to the
      # 96GB PRO 6000). Chart defaults are node=binpack / gpu=spread — 'spread' would
      # balance pods over both cards, i.e. park a random small workload on the 32GB card
      # and fragment it. binpack keeps work consolidated on the big card and leaves the
      # small card whole. Anything size-sensitive must PIN itself (see below), never rely
      # on this tie-breaker.
      defaultSchedulerPolicy:
        nodeSchedulerPolicy: binpack
        gpuSchedulerPolicy: binpack
      # PINNING (verified against HAMi v2.9.0 pkg/device/nvidia/device.go): pod annotations
      #   nvidia.com/use-gputype:  "PRO 6000"      # allow-list, comma-separated
      #   nvidia.com/nouse-gputype: "RTX 5090"     # deny-list
      #   nvidia.com/use-gpuuuid:  "GPU-9d6cf286-..."
      #   nvidia.com/nouse-gpuuuid: "..."
      # Type matching is CASE-INSENSITIVE SUBSTRING on the registered card name, so "RTX"
      # matches BOTH 'NVIDIA RTX PRO 6000 Blackwell Workstation Edition' and 'NVIDIA GeForce
      # RTX 5090'. Use a substring unique to one card, or the UUID.
      # Every pinned pod STILL needs an explicit nvidia.com/gpumem (the defaultMemory:0 trap).
      kubeScheduler:
        enabled: true                    # bundled 2nd scheduler + extender
        image:
          registry: registry.k8s.io      # Aliyun default mirror lacks v1.36.2
          repository: kube-scheduler
          tag: "v1.37.1"                  # MUST equal the k8s control-plane minor
      certManager:
        enabled: true                     # cert-manager present; avoids the old certgen image

    devicePlugin:
      runtimeClassName: nvidia            # NVML init works under the nvidia runtime/CDI
      createRuntimeClass: false           # RuntimeClass "nvidia" already exists
      libPath: /var/lib/hami/vgpu         # must live under gpuHookPath (writable on Talos)
      monitor:
        ctrPath: /var/lib/hami/vgpu/containers
      nvidiaNodeSelector:                 # reuse the existing GPU node label (no new label needed)
        feature.node.kubernetes.io/pci-10de.present: "true"
      deviceSplitCount: 10                # up to 10 pods share EACH card (we need ~4)
      deviceMemoryScaling: 1              # NO oversubscription (46GB host RAM, no swap; pool = 96GB)
      # Multi-GPU arithmetic: capacity is per-device, so a second card doubles the
      # advertised units (nvidia.com/gpu 10 -> 20) and a 32GB card sliced 10 ways gives
      # 3.2GB units — a pod asking for gpumem 4096 can NEVER land on it. Don't raise
      # deviceSplitCount to compensate; pin instead. See .agents/skills/hami-gpu-accounting.

    prometheus:
      enabled: false                      # no ServiceMonitor CRD in this cluster
