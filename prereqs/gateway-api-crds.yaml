# Upstream Gateway API CRDs (gateway.networking.k8s.io) — GatewayClass/Gateway/HTTPRoute/etc.
#
# These are the standard Kubernetes SIG Gateway API CRDs, which kgateway REQUIRES but
# does NOT bundle (verified: the kgateway/kgateway-crds Helm charts ship only kgateway's
# own *.gateway.kgateway.dev CRDs). The SIG publishes them as release YAML, not a Helm
# chart — so rather than vendor ~20k lines into this repo, we REFERENCE the pinned
# upstream release via a Flux GitRepository source + Kustomization. Declarative, pinned,
# no copied content; bump the tag to upgrade. Standard channel = GA resources only.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.6.1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: ./config/crd/standard
  prune: true
  wait: true
